      - package_discovery
      - package_alias_detection
      - package_root_resolution
      - importability

  runtime:
    enabled: true
    objectives:
      - runtime_component_presence
      - dependency_injection
      - runtime_wiring

  repository_vs_runtime:
    enabled: true
    objectives:
      - repository_reality
      - import_reality
      - runtime_reality
      - consistency_analysis

  asset_pipeline:
    enabled: true
    objectives:
      - asset_inventory
      - asset_type_coverage
      - chart_assets_db_presence
      - text_representation_coverage
      - reference_url_coverage
      - persistence_verification
      - deletion_readiness

  asset_coverage:
