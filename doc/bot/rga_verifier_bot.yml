    position:
      - after_human_readable_sections

  governance_reporting:

    include_dependency_failures: true

    include_governance_failures: true

    include_root_failures: true

    include_derived_failures: true

    include_root_failure_count: true

    include_derived_failure_count: true

    separate_dependency_failures: true

    separate_root_and_derived_failures: true

