charter:

  principle_1:
    "Completed Phases are immutable."

  principle_2:
    "Verification may diagnose but may not mutate."

  principle_3:
    "Expected behavior is not authoritative behavior."

  principle_4:
    "Repository reality outranks assumptions."

  principle_5:
    "Discovery precedes diagnosis."

  principle_6:
    "Evidence precedes conclusions."

  principle_7:
    "Repository reality must be distinguished from import reality."

  principle_8:
    "Import reality must be distinguished from runtime reality."

  principle_9:
    "Asset verification must not modify asset state."

  principle_10:
    "Coverage verification precedes deletion readiness."

  principle_11:
    "Artifact backbone integrity precedes deletion eligibility."

  principle_12:
    "Completed Phase boundaries are governance contracts."

  principle_13:
    "Flow contracts must remain explicit and separable."

  principle_14:
    "MCP adapters must remain observable and verifiable."

  principle_15:
    "Governance verdicts must be evidence-based and read-only."

  principle_16:
    "Dependency failures are not governance failures."

  principle_17:
    "Root causes must be distinguished from derived effects."

  principle_18:
    "Root failures must be rendered before derived failures."

  principle_19:
    "Governance reports should prioritize actionable causes."

  principle_20:
    "Verification outputs may support advisory reasoning but remain read-only."

  principle_21:
    "Derived failures must never obscure independently actionable root contracts."

  principle_22:
    "Root cause isolation precedes remediation planning."

  principle_23:
    "Repository reality outranks hardcoded topology assumptions."

  principle_24:
    "Failure lineage should explain impact without duplicating evidence."


