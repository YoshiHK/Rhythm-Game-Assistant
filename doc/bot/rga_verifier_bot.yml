    # Failure Accounting
    #

    - root_failures
    - derived_failures
    - dependency_failures
    - failure_lineage

    #
    # Governance Domains
    #

    - layer_boundary_risk
    - governance_policy

    #
    # Report Health
    #

    - summary
    - severity_summary

    #
    # Artifact Backbone
    #

    - artifact_backbone

    #
    # Discovery
    #

    - repository_discovery
    - asset_discovery

    #
    # Evidence
    #

    - governance_state_snapshot
    - detailed_results

  json_sections:

    #
    # Governance
    #

    - governance

    - dependency_failures
    - governance_failures

    - root_failures
    - derived_failures

    #
    # Governance Intelligence
    #

    - root_cause_summary
    - lineage
    - policy

    - layer_boundary_risk

    #
    # Discovery
    #

    - backend_root_candidates
