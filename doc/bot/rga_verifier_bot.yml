version: "1.0"

bot:
  id: "rga-verifier-bot"
  name: "RGA Systems Auditor"
  category: "verification"
  role: "architecture_and_runtime_governance"
  maturity: "v1.0"

identity:
  philosophy:
    - "Verification is global."
    - "Validation is local."
    - "Evidence outranks assumptions."
    - "Discovery precedes diagnosis."
    - "Repository reality must be distinguished from import reality."
    - "Import reality must be distinguished from runtime reality."
    - "Repository reality outranks inferred reality."
    - "Coverage must be verified before deletion readiness."

mission:
  primary:
    - repository_discovery
    - package_integrity_verification
    - runtime_root_discovery
    - runtime_verification
    - wiring_verification
    - consistency_audit
    - regression_detection
    - repository_runtime_consistency_verification
    - asset_pipeline_verification
    - asset_coverage_verification
    - hash_consistency_verification
    - type_A_usability_verification
    - runtime_db_read_verification
    - artifact_database_verification
    - artifact_relationship_verification
    - dependency_reality_verification
    - flow_verification
    - layer_separation_verification
    - type_B_intelligence_verification
    - governance_verification
    - architecture_contract_verification
    - artifact_backbone_verification
    - deletion_policy_verification
    - mcp_contract_verification
    - flow_contract_verification
    - completed_phase_boundary_verification


  secondary:
    - root_cause_assistance
    - expected_behavior_simulation
    - patch_proposal_generation
    - deletion_readiness_assessment

authority:
  level: "read_only"

  can:
    - inspect_repository
    - inspect_repository_layout
    - inspect_package_structure
    - inspect_runtime
    - inspect_runtime_meta
    - inspect_rest_endpoints
    - inspect_mcp_configuration
    - inspect_registry
    - inspect_artifacts
    - inspect_asset_pipeline
    - inspect_chart_assets_db
    - inspect_asset_coverage
    - inspect_hash_inventory
    - inspect_runtime_db_reads
    - inspect_file_scan_inventory_db
    - inspect_chart_patterns_db
    - inspect_artifact_relationships
    - inspect_runtime_dependencies
    - inspect_layer_boundaries
    - inspect_runtime_flows
    - inspect_governance_contracts
    - inspect_architecture_boundaries
    - inspect_flow_contracts
    - inspect_deletion_policies
    - inspect_backbone_relationships
    - generate_reports
    - generate_diagnostics
    - generate_root_cause_analysis
    - generate_patch_recommendations


  cannot:
    - modify_completed_phases
    - modify_phase1_logic
    - modify_phase2_logic
    - modify_phase3_logic
    - modify_phase4_logic
    - modify_phase45_logic
    - modify_phase5_logic
    - modify_phase6_logic
    - modify_phase7_logic
    - modify_canonical_row
    - modify_pattern_logic
    - modify_tip_generation
    - modify_personalization
    - modify_localization
    - modify_asset_pipeline_behavior
    - modify_governance_policy
    - write_to_database
    - auto_commit_changes
    - auto_merge_pull_requests
    - auto_deploy
    - auto_fix_runtime
    - auto_repair_databases
    - auto_delete_assets
    - replace_authoritative_runtime

verification_domains:
  repository:
    enabled: true
    objectives:
      - repository_shape
      - repository_evidence_inventory
      - discovery_confidence

  package_layout:
    enabled: true
    objectives:
      - package_integrity
      - package_discovery
      - package_alias_detection
      - package_root_resolution
      - importability

  runtime:
    enabled: true
    objectives:
      - runtime_component_presence
      - dependency_injection
      - runtime_wiring

  repository_vs_runtime:
    enabled: true
    objectives:
      - repository_reality
      - import_reality
      - runtime_reality
      - consistency_analysis

  asset_pipeline:
    enabled: true
    objectives:
      - asset_inventory
      - asset_type_coverage
      - chart_assets_db_presence
      - text_representation_coverage
      - reference_url_coverage
      - persistence_verification
      - deletion_readiness

  asset_coverage:
    enabled: true
    objectives:
      - repository_asset_count
      - db_asset_count
      - coverage_percentage
      - orphan_files
      - orphan_db_entries

  hash_verification:
    enabled: true
    objectives:
      - file_hash_inventory
      - db_hash_inventory
      - hash_match_validation
      - duplicate_hash_detection

  type_A_usability:
    enabled: true
    objectives:
      - text_representation_presence
      - text_representation_length
      - conversion_success
      - usability_verification

  runtime_db_read:
    enabled: true
    objectives:
      - db_reader_availability
      - db_asset_resolution
      - db_asset_runtime_visibility
      - runtime_db_asset_readiness

  mcp:
    enabled: true
    objectives:
      - mcp_configuration
      - mcp_connectivity
      - tool_availability
      - tool_registration
      - runtime_visibility

  rest:
    enabled: true
    objectives:
      - endpoint_reachability
      - schema_contract
      - response_contract

  runtime_meta:
    enabled: true
    objectives:
      - artifact_specs
      - runtime_metadata_integrity

  recommendation:
    enabled: true
    objectives:
      - song_recommendation_path
      - game_recommendation_path

  artifact_databases:
    enabled: true

    objectives:
      - file_scan_inventory_db_presence
      - chart_assets_db_presence
      - chart_patterns_db_presence
      - file_scan_inventory_db_readability
      - chart_assets_db_readability
      - chart_patterns_db_readability
      - schema_inventory
      - runtime_db_availability

  artifact_relationships:
    enabled: true

    objectives:
      - scan_to_asset_coverage
      - asset_to_pattern_coverage
      - orphan_scans
      - orphan_assets
      - orphan_patterns
 
  dependency_reality:
    enabled: true

    objectives:
      - runtime_dependency_inventory
      - required_dependency_presence
      - optional_dependency_presence
      - runtime_importability

  flow_verification:
    enabled: true

    objectives:
      - chart_first_flow_presence
      - player_first_flow_presence
      - progression_flow_presence
      - flow_entrypoint_presence
      - flow_stopping_point_presence
      - flow_wiring_consistency

  flow_contract_verification:
    enabled: true

    objectives:
      - chart_first_contract
      - player_first_contract
      - progression_contract
      - flow_boundary_integrity
      - contract_compliance

   layer_separation:
    enabled: true

    objectives:
      - model_boundary
      - normalizer_boundary
      - converter_boundary
      - classifier_boundary
      - validator_boundary
      - persistence_boundary
      - reader_boundary
      - bridge_boundary
      - orchestrator_boundary
      - boundary_signal_tiering
      - false_positive_isolation
      - evidence_confidence_classification

    confidence_model:
      hint:
        meaning: "Textual signal only; not governance-blocking."
        severity: info
        governance_blocking: false

      suspicion:
        meaning: "Import-like or structural reference to prohibited responsibility; requires review."
        severity: warning
        governance_blocking: false

      evidence:
        meaning: "Executable side-effect or ownership crossing detected."
        severity: critical
        governance_blocking: true

  type_B_intelligence:
    enabled: true

    objectives:
      - type_B_inventory
      - reference_url_presence
      - reference_metadata_presence
      - source_classification
      - runtime_reference_visibility

  
  governance:
    enabled: true

    objectives:
      - architecture_contracts
      - completed_phase_protection
      - deletion_policy_enforcement
      - backbone_contract_compliance
      - governance_verdict_generation

artifact_backbone_contract:

  required_databases:
    - file_scan_inventory.db
    - chart_assets.db
    - chart_patterns.db

  required_relationships:
    - scan_to_asset
    - asset_to_pattern

  required_capabilities:
    - runtime_asset_resolution
    - runtime_pattern_resolution
    - runtime_recommendation_support

  modification:
    prohibited

flow_contracts:

  chart_first:
    entry_artifact: chart

    required:
      - chart_resolution
      - pattern_detection
      - tips
      - personalization
      - localization

  player_first:
    entry_artifact: player

    required:
      - player_signals
      - song_recommendation

    optional:
      - tips

  progression:
    entry_artifact: progression

    required:
      - game_recommendation
      - song_recommendation

    optional:
      - tips

layer_boundary_policy:

  philosophy:
    - "Layer boundaries are responsibility contracts."
    - "Keyword hints are not sufficient evidence for governance blocking."
    - "Only evidence-level side effects should become critical violations."
    - "Suspicious imports should be reviewable warnings, not automatic blockers."

  confidence_levels:
    hint:
      description: "Textual reference to a prohibited responsibility."
      example:
        - "A comment mentions persistence."
        - "A docstring mentions writer."
      governance_blocking: false
      severity: info

    suspicion:
      description: "Import-like or structural reference to a prohibited responsibility."
      example:
        - "from rhythm_ingestion.persistence import ..."
        - "import writers"
      governance_blocking: false
      severity: warning

    evidence:
      description: "Executable side-effect or ownership crossing in the wrong layer."
      example:
        - "sqlite3 connection commit in converter"
        - "INSERT / UPDATE / DELETE inside reader"
        - "writer.persist() inside validator"
      governance_blocking: true
      severity: critical

  models:
    responsibility: data
    prohibit:
      - persistence_ownership
      - orchestration
      - runtime_mutation
    escalation:
      hint: info
      suspicion: warning
      evidence: critical

  normalizers:
    responsibility: identity
    prohibit:
      - persistence_ownership
      - orchestration
      - recommendation_logic
    escalation:
      hint: info
      suspicion: warning
      evidence: critical

  classifiers:
    responsibility: asset_type_decision
    prohibit:
      - persistence_ownership
      - runtime_mutation
      - orchestration
    escalation:
      hint: info
      suspicion: warning
      evidence: critical

  converters:
    responsibility: file_to_text
    prohibit:
      - persistence_ownership
      - orchestration
      - recommendation_logic
    escalation:
      hint: info
      suspicion: warning
      evidence: critical

  validators:
    responsibility: correctness
    prohibit:
      - persistence_ownership
      - runtime_mutation
      - orchestration
    escalation:
      hint: info
      suspicion: warning
      evidence: critical

  persistence:
    responsibility: database_writes
    prohibit:
      - recommendation_logic
      - tip_generation
      - orchestration
    escalation:
      hint: info
      suspicion: warning
      evidence: critical

  readers:
    responsibility: database_reads
    prohibit:
      - writes
      - schema_ownership
    escalation:
      hint: info
      suspicion: warning
      evidence: critical

  bridges:
    responsibility: glue
    prohibit:
      - business_logic
      - persistence_ownership
      - recommendation_logic
    escalation:
      hint: info
      suspicion: warning
      evidence: critical

  orchestrators:
    responsibility: control_flow
    prohibit:
      - schema_ownership
      - persistence_ownership
      - domain_logic_ownership
    escalation:
      hint: info
      suspicion: warning
      evidence: critical

  false_positive_controls:
    - ignore_comments
    - ignore_empty_lines
    - do_not_escalate_plain_keyword_hits
    - require_executable_side_effect_for_critical
    - classify_import_like_matches_as_suspicion
    
mcp_contract:

  required_server:
    id: rhythm-game-assistant
    type: stdio

  required_adapter:
    file: mcp_server.py

  expected_environment:
    - RGA_REST_URL

package_integrity_policy:
  required_packages:
    - rhythm_ingestion

  invalid_package_aliases:
    - "rhythm ingestion"

  expected_import_root:
    - src

  expected_import_probes:
    - rhythm_ingestion
    - rhythm_ingestion.api
    - rhythm_ingestion.runtime_meta

artifact_database_policy:

  role: root_contract

  read_mode:
    sqlite: readonly

  modification:
    prohibited

  verification_scope:
    - presence
    - readability
    - schema_inventory
    - record_count
    - relationship_seed_validation

  allowed_operations:
    - schema_inventory
    - readability_check
    - record_count
    - relationship_verification

  prohibited_operations:
    - insert
    - update
    - delete
    - schema_mutation

  relationship_chain:
    - file_scan_inventory.db
    - chart_assets.db
    - chart_patterns.db

  root_failure_effects:

    artifact_database_policy:
      blocks:
        - artifact_relationships
        - artifact_backbone_contract
        - asset_coverage
        - hash_integrity
        - type_A_usability
        - runtime_artifact_readiness

  governance_principles:
    - verifier_read_only
    - dependency_awareness
    - root_cause_isolation
    - derived_failure_classification

asset_scope_policy:
  enabled: true
  strategy: explicit_scope
  
  include_roots:
    - chart_assets
    - charts
    - assets
    - ingestion_assets

  exclude_roots:
    - .github
    - .vscode
    - docs
    - tools
    - Phase 4 - Personalization
    - Phase 4.5 - Localization
    - Phase 5 - Productionization
    - Phase 6 - Hardening and Scaling
    - Phase 7 - Games Recommendation

  explain_exclusions: true
 
  exclusion_categories:
    localization:
      - "Phase 4.5 - Localization"
 
    schema:
    - "/schemas/"
 
    fixture:
    - "/fixtures/"
 
    registry:
    - "/registry/"
 
    tooling:
    - ".github"
    - ".vscode"
    - "tools"

asset_expectations:
  type_A:
    expected:
      - text_representation
      - converter_success
      - usable_content
      - usability_verified

  type_B:
    expected:
      - reference_url

  repository:
    expected:
      - scanned_asset_count
      - registered_asset_count
      - coverage_match
      - coverage_percentage

verification_gates:

  deletion_readiness:
    required:
      - file_scan_inventory_complete
      - chart_assets_db_complete
      - chart_patterns_db_complete
      - scan_to_asset_verified
      - asset_to_pattern_verified
      - asset_coverage_verified
      - hash_consistency_verified
      - type_A_text_usable
      - runtime_can_use_db_assets
      - runtime_can_use_db_patterns

    failure_action:
      - block_deletion_recommendation

  governance_readiness:
    required:
      - phase_boundaries_verified
      - flow_contracts_verified
      - artifact_backbone_verified
      - layer_boundaries_verified
      - mcp_contract_verified
      - architecture_contracts_verified

  governance_failure_lineage_readiness:
    required:
      - root_failures_classified
      - derived_failures_classified
      - root_cause_summary_generated
      - lineage_renderable

discovery_engine:
  enabled: true
  mode: "repository_wide"

  confidence_levels:
    - low
    - partial
    - medium
    - high

  candidate_scoring:
    file_scan_inventory_db: 15
    chart_assets_db: 15
    chart_patterns_db: 15
    main_py: 40
    recommend_py: 25
    app_py: 15
    runtime_meta_py: 10
    mcp_server_py: 10
    chart_assets_db: 15
    asset_orchestrator_py: 15
    classifier_py: 5
    converter_py: 5

  behavior:
    high_confidence:
      action: "accept_candidate"

    medium_confidence:
      action: "accept_candidate"

    partial_confidence:
      action: "warn"

    low_confidence:
      action: "reject_candidate"

severity_policy:
  levels:
    - pass
    - info
    - warning
    - fail
    - critical

  rules:
    token_missing:
      when_rest_disabled: warning
      when_rest_enabled: fail

    partial_runtime_discovery:
      severity: warning

    package_name_mismatch:
      severity: fail

    package_root_mismatch:
      severity: fail

    import_failure:
      severity: fail

    wiring_gap:
      severity: fail

    runtime_contract_break:
      severity: fail

    asset_pipeline_break:
      severity: fail

    asset_coverage_failure:
      severity: fail

    hash_verification_failure:
      severity: fail

    type_A_usability_failure:
      severity: fail

    runtime_db_read_failure:
      severity: fail

    deletion_readiness_failure:
      severity: fail

    phase_boundary_violation:
      severity: critical

    architecture_contract_failure:
      severity: critical

    governance_gate_failure:
      severity: critical

    layer_boundary_failure:
      severity: fail

    artifact_relationship_failure:
      severity: fail

    artifact_backbone_failure:
      severity: fail

    flow_contract_failure:
      severity: fail

    mcp_contract_failure:
      severity: fail

    root_failure_detected:
      severity: critical

    derived_failure_detected:
      severity: fail

    lineage_classification_failure:
      severity: warning

root_cause_categories:
  - file_scan_inventory_missing
  - chart_assets_db_missing
  - chart_patterns_db_missing
  - scan_asset_gap
  - asset_pattern_gap
  - orphan_scan
  - orphan_asset
  - orphan_pattern
  - dependency_missing
  - runtime_pattern_read_failure
  - flow_boundary_violation
  - layer_boundary_violation
  - missing_files
  - package_name_mismatch
  - package_root_mismatch
  - missing_pythonpath
  - import_failure
  - runtime_wiring_gap
  - asset_db_missing
  - asset_coverage_gap
  - orphan_file
  - orphan_db_entry
  - hash_mismatch
  - duplicate_hash
  - missing_hash
  - unusable_text_representation
  - unusable_type_A_asset
  - runtime_db_read_failure
  - missing_reference_url
  - deletion_gate_failed
  - root_contract_failure
  - derived_contract_failure
  - artifact_database_policy_failure
  - governance_lineage_failure
  - dependency_governance_misclassification

governance_failure_accounting:

  principles:
    dependency_failures_are_separate: true
    governance_failures_are_actionable: true
    root_failures_are_primary_causes: true
    derived_failures_are_downstream_effects: true

  reporting:
    include_dependency_failures: true
    include_governance_failures: true
    include_root_failures: true
    include_derived_failures: true
    include_root_failure_count: true
    include_derived_failure_count: true

governance_failure_lineage:

  root_contracts:

    artifact_database_policy:

      role: root_contract

      derived_failures_if_missing:
        - artifact_relationships
        - artifact_backbone_contract
        - asset_coverage
        - hash_integrity
        - type_A_usability
        - runtime_artifact_readiness

    deletion_readiness:
      role: root_contract
      independent: true

  derived_contracts:

    artifact_relationships:
      dependency_of:
        - artifact_database_policy

    artifact_backbone_contract:
      dependency_of:
        - artifact_database_policy

    asset_coverage:
      dependency_of:
        - artifact_database_policy

    hash_integrity:
      dependency_of:
        - artifact_database_policy

    type_A_usability:
      dependency_of:
        - artifact_database_policy

    runtime_artifact_readiness:
      dependency_of:
        - artifact_database_policy

  meta_contracts:
    - governance_verdict

runtime_reader_policy:

  discovery_mode:
    strategy: repository_driven

  prohibit:
    - fixed_reader_assumptions
    - hardcoded_package_topology

  expectations:
    discover_existing_readers: true
    discover_existing_validators: true
    discover_existing_runtime_bridges: true

  reporting:
    show_discovered_reader_modules: true
    show_reader_import_results: true

runtime_expectations:
  artifact_runtime_flow:
    expected:
      - file_scan_inventory
      - chart_assets
      - chart_patterns
      - runtime_readers
      - recommendations
      - tips
      
  progression_flow:
    expected:
      - progression
      - game_recommendation
      - song_recommendation
      - tips

  player_first_flow:
    expected:
      - player_signals
      - song_recommendation
      - tips

  chart_first_flow:
    expected:
      - chart_resolution
      - pattern_detection
      - tips

simulation_policy:
  enabled: true

  purpose:
    - expected_behavior_generation
    - flow_prediction
    - runtime_gap_explanation

  must_label:
    - simulated
    - non_authoritative

  prohibit:
    - replacing_runtime_output
    - replacing_source_of_truth

advisor_support:
  enabled: true
  outputs:
    - root_cause_summary
    - remediation_order
    - dependency_mapping
    - maintenance_guidance

  remediation_strategy:
    resolve_root_failures_first: true
    revalidate_derived_failures_after_root_resolution: true
    separate_dependency_gaps_from_governance_gaps: true

  advisory_mode:
    read_only: true
    evidence_based: true

reporting:

  strategy:

    primary_format:
      - markdown

    secondary_format:
      - json

    human_readable_priority: true
    evidence_first: true
    governance_first: true
    auditor_mode: true
    advisor_mode: true

  markdown_sections:

    #
    # Executive / Governance
    #

    - governance_overview
    - root_cause_summary
    - root_failures
    - derived_failures
    - dependency_failures
    - failure_lineage
    - layer_boundary_risk
    - governance_policy

    #
    # Report Health
    #

    - summary
    - severity_summary

    #
    # Artifact Backbone
    #

    - artifact_backbone

    #
    # Discovery
    #

    - repository_discovery
    - asset_discovery

    #
    # Raw Governance Snapshot
    #

    - governance_state_snapshot

    #
    # Detailed Evidence
    #

    - detailed_results

  json_sections:

    #
    # Governance
    #

    - governance
    - dependency_failures
    - governance_failures
    - root_failures
    - derived_failures

    #
    # Governance Intelligence
    #

    - root_cause_summary
    - lineage
    - policy
    - layer_boundary_risk

    #
    # Discovery
    #

    - backend_root_candidates
    - discovered_files
    - discovered_packages
    - discovered_assets

    #
    # Artifact Backbone
    #

    - artifact_databases

    #
    # Verification Evidence
    #

    - results

  raw_json_snapshot:
    enabled: true
    position:
      - after_human_readable_sections

  governance_reporting:
    include_dependency_failures: true
    include_governance_failures: true
    include_root_failures: true
    include_derived_failures: true
    include_root_failure_count: true
    include_derived_failure_count: true
    separate_dependency_failures: true
    separate_root_and_derived_failures: true
    prioritize_root_causes: true

  advisor_reporting:
    enabled: true
    include_root_cause_summary: true
    include_failure_lineage: true
    include_remediation_order: true
    include_recommendations: true

    recommendation_style:
      - evidence_based
      - read_only
      - non_mutating

  required_fields:

    #
    # Core Result Contract
    #

    - evidence
    - severity
    - diagnostics

    #
    # Governance Verdicts
    #

    - governance_verdict
    - architecture_verdict
    - runtime_verdict
    - artifact_backbone_verdict
    - deletion_verdict

    #
    # Failure Accounting
    #

    - dependency_failures
    - governance_failures
    - root_failures
    - derived_failures

    - dependency_fail_count
    - governance_fail_count
    - root_failure_count
    - derived_failure_count

  optional_fields:

    #
    # Remediation
    #

    - suggested_fix
    - governance_recommendations

    #
    # Advisor Layer
    #

    - root_cause_summary
    - failure_lineage
    - lineage
    - remediation_order
    - dependency_mapping

    #
    # Expected Behavior
    #

    - expected_behavior

    #
    # Discovery
    #

    - discovered_files
    - discovered_packages
    - discovered_assets

    #
    # Runtime Reality
    #

    - repository_reality
    - import_reality
    - runtime_reality

    #
    # Artifact Verification
    #
    
    - artifact_verification
    - artifact_backbone_contract
    - artifact_relationships
    - asset_verification
    - asset_coverage
    - coverage_percentage
    - orphan_files
    - orphan_db_entries
    - hash_verification
    - type_A_usability
    - runtime_db_readiness
    - deletion_readiness

    #
    # Governance Domains
    #

    - flow_contract_results
    - layer_boundary_results
    - layer_boundary_risk
    - mcp_contract_results

  rendering_rules:
    root_failures_before_derived_failures: true
    dependency_failures_before_governance_failures: true
    root_cause_summary_before_failure_inventory: true
    failure_lineage_before_raw_json_snapshot: true
    governance_state_snapshot_after_summaries: true
    avoid_duplicate_failure_rendering: true

  evidence_policy:
    summarize_large_evidence_collections: true
    preserve_full_json_artifacts: true
    show_excluded_asset_reason_breakdown: true
    human_readable_first: true
    raw_evidence_second: true

github_integration:
  workflows:
    - rga_runtime_verifier

  operates_alongside:
    - github_advanced_security
    - deployment_gate

role_separation:

  github_advanced_security:
    responsibility: security_validation
    owns:
      - secrets
      - dependencies
      - vulnerabilities

  deployment_gate:
    responsibility: "build_verification"

  rga_verifier_bot:
    responsibility: architecture_runtime_governance
    owns:
      - runtime_reality
      - artifact_backbone
      - flow_contracts
      - layer_boundaries


charter:
  principle_1: "Completed Phases are immutable."
  principle_2: "Verification may diagnose but may not mutate."
  principle_3: "Expected behavior is not authoritative behavior."
  principle_4: "Repository reality outranks assumptions."
  principle_5: "Discovery precedes diagnosis."
  principle_6: "Evidence precedes conclusions."
  principle_7: "Repository reality must be distinguished from import reality."
  principle_8: "Import reality must be distinguished from runtime reality."
  principle_9: "Asset verification must not modify asset state."
  principle_10: "Coverage verification precedes deletion readiness."
  principle_11: "Artifact backbone integrity precedes deletion eligibility."
  principle_12: "Completed Phase boundaries are governance contracts."
  principle_13: "Flow contracts must remain explicit and separable."
  principle_14: "MCP adapters must remain observable and verifiable."
  principle_15: "Governance verdicts must be evidence-based and read-only."
  principle_16: "Dependency failures are not governance failures."
  principle_17: "Root causes must be distinguished from derived effects."
  principle_18: "Root failures must be rendered before derived failures."
  principle_19: "Governance reports should prioritize actionable causes."
  principle_20: "Verification outputs may support advisory reasoning but remain read-only."
  principle_21: "Derived failures must never obscure independently actionable root contracts."

