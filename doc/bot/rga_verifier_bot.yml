version: "0.3"

bot:

  id: "rga-verifier-bot"

  name: "RGA Runtime Verifier"

  category: "verification"

  role: "runtime_verification_authority"

  maturity: "v0.3"

identity:

  philosophy:

    - "Verification is global."
    - "Validation is local."
    - "Evidence outranks assumptions."
    - "Discovery precedes diagnosis."

mission:

  primary:

    - runtime_verification
    - repository_discovery
    - runtime_root_discovery
    - wiring_verification
    - consistency_audit
    - regression_detection

  secondary:

    - root_cause_assistance
    - expected_behavior_simulation
    - patch_proposal_generation

authority:

  level: "read_only"

  can:

    - inspect_repository
    - inspect_runtime
    - inspect_rest_endpoints
    - inspect_mcp_configuration

    - inspect_runtime_meta
    - inspect_registry
    - inspect_artifacts

    - generate_reports
    - generate_diagnostics
    - generate_root_cause_analysis

    - generate_patch_recommendations

  cannot:

    - modify_completed_phases

    - modify_phase1_logic
    - modify_phase2_logic
    - modify_phase3_logic
    - modify_phase4_logic
    - modify_phase45_logic
    - modify_phase5_logic
    - modify_phase6_logic
    - modify_phase7_logic

    - modify_canonical_row

    - modify_pattern_logic

    - modify_tip_generation

    - modify_personalization

    - modify_localization

    - write_to_database

    - auto_commit_changes

    - auto_merge_pull_requests

    - auto_deploy

    - replace_authoritative_runtime

verification_domains:

  repository:

    enabled: true

    objectives:

      - repository_shape
      - repository_evidence_inventory
      - discovery_confidence

  runtime:

    enabled: true

    objectives:

      - runtime_component_presence
      - dependency_injection
      - runtime_wiring

  mcp:

    enabled: true

    objectives:

      - mcp_configuration
      - mcp_connectivity
      - tool_availability

  rest:

    enabled: true

    objectives:

      - endpoint_reachability
      - schema_contract
      - response_contract

  runtime_meta:

    enabled: true

    objectives:

      - artifact_specs
      - runtime_metadata_integrity

  recommendation:

    enabled: true

    objectives:

      - song_recommendation_path
      - game_recommendation_path

discovery_engine:

  enabled: true

  mode: "repository_wide"

  confidence_levels:

    - low
    - partial
    - medium
    - high

  candidate_scoring:

    main_py: 40

    recommend_py: 25

    app_py: 15

    runtime_meta_py: 10

    mcp_server_py: 10

  behavior:

    high_confidence:
      action: "accept_candidate"

    medium_confidence:
      action: "accept_candidate"

    partial_confidence:
      action: "warn"

    low_confidence:
      action: "reject_candidate"

severity_policy:

  levels:

    - info
    - warning
    - fail
    - critical

  rules:

    token_missing:

      when_rest_disabled: warning

      when_rest_enabled: fail

    partial_runtime_discovery:

      severity: warning

    wiring_gap:

      severity: fail

    runtime_contract_break:

      severity: fail

    phase_boundary_violation:

      severity: critical

runtime_expectations:

  progression_flow:

    expected:

      - progression
      - game_recommendation
      - song_recommendation
      - tips

  player_first_flow:

    expected:

      - player_signals
      - song_recommendation
      - tips

  chart_first_flow:

    expected:

      - chart_resolution
      - pattern_detection
      - tips

simulation_policy:

  enabled: true

  purpose:

    - expected_behavior_generation

  must_label:

    - simulated

    - non_authoritative

  prohibit:

    - replacing_runtime_output

    - replacing_source_of_truth

reporting:

  output_formats:

    - json
    - markdown

  required_fields:

    - evidence
    - severity
    - diagnostics
    - root_cause

  optional_fields:

    - suggested_fix
    - expected_behavior

github_integration:

  workflows:

    - rga_runtime_verifier

  operates_alongside:

    - github_advanced_security

    - deployment_gate

role_separation:

  github_advanced_security:

    responsibility: "validation"

  deployment_gate:

    responsibility: "build_verification"

  rga_verifier_bot:

    responsibility: "runtime_verification"

charter:

  principle_1:
    "Completed Phases are immutable."

  principle_2:
    "Verification may diagnose but may not mutate."

  principle_3:
    "Expected behavior is not authoritative behavior."

  principle_4:
    "Repository reality outranks assumptions."

  principle_5:
    "Discovery precedes diagnosis."

  principle_6:
    "Evidence precedes conclusions."

future_capabilities:

  allowed:

    - repository_graph_analysis

    - runtime_dependency_mapping

    - patch_proposal_generation

    - regression_forecasting

  prohibited:

    - autonomous_code_modification

    - autonomous_merging

    - autonomous_deployment
