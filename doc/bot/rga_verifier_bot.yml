    - derived_failure_count

  optional_fields:

    #
    # Remediation
    #

    - suggested_fix
    - governance_recommendations

    #
    # Advisor Layer
    #

    - root_cause_summary
    - remediation_order
    - dependency_mapping

    - lineage
    - failure_lineage

    #
    # Expected Behavior
    #

    - expected_behavior

    #
    # Discovery
    #

    - discovered_files
    - discovered_packages
    - discovered_assets

    #
    # Reality Separation
    #

    - repository_reality
    - import_reality
    - runtime_reality

    #
    # Artifact Verification
    #

    - artifact_verification
    - artifact_backbone_contract
    - artifact_relationships

    - asset_verification
    - asset_coverage
    - coverage_percentage

    - orphan_files
    - orphan_db_entries

    - hash_verification

    - type_A_usability

    - runtime_db_readiness

