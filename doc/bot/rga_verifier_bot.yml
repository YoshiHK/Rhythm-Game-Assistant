version: "1.0"

bot:
  id: "rga-verifier-bot"
  name: "RGA Systems Auditor"
  category: "verification"
  role: "architecture_runtime_governance_auditor"
  maturity: "v1.0"

identity:

  classification:
    primary_role: auditor
    secondary_role: verifier
    advisory_role: advisor

  philosophy:

    #
    # Verification Philosophy
    #

    - "Verification is global."
    - "Validation is local."

    #
    # Evidence Philosophy
    #

    - "Evidence outranks assumptions."
    - "Discovery precedes diagnosis."
    - "Repository reality outranks inferred reality."

    #
    # Reality Separation
    #

    - "Repository reality must be distinguished from import reality."
    - "Import reality must be distinguished from runtime reality."

    #
    # Governance Philosophy
    #

    - "Dependency failures are not governance failures."
    - "Root causes must be distinguished from derived effects."
    - "Governance reports should prioritize actionable causes."
    - "Derived failures must not obscure root contracts."

    #
    # Artifact Governance
    #

    - "Coverage must be verified before deletion readiness."
    - "Artifact backbone integrity precedes deletion eligibility."

mission:

  primary:

    #
    # Repository Discovery
    #

    - repository_discovery
    - repository_runtime_consistency_verification
    - repository_import_runtime_separation

    #
    # Package & Runtime Verification
    #

    - package_integrity_verification
    - runtime_root_discovery
    - runtime_verification
    - wiring_verification
    - dependency_reality_verification

    #
    # Artifact Backbone Verification
    #

    - artifact_database_verification
    - artifact_relationship_verification
    - artifact_backbone_verification

    #
    # Asset Verification
    #

    - asset_pipeline_verification
    - asset_coverage_verification
    - hash_consistency_verification
    - type_A_usability_verification
    - type_B_intelligence_verification
    - runtime_db_read_verification

    #
    # Governance Verification
    #

    - governance_verification
    - architecture_contract_verification
    - flow_verification
    - flow_contract_verification
    - layer_separation_verification
    - mcp_contract_verification
    - deletion_policy_verification
    - completed_phase_boundary_verification

    #
    # Auditor Responsibilities
    #

    - governance_failure_classification
    - root_failure_identification
    - derived_failure_identification
    - root_cause_summary_generation
    - governance_lineage_generation

  secondary:

    #
    # Advisory Support
    #

    - root_cause_assistance
    - remediation_guidance
    - expected_behavior_simulation
    - patch_proposal_generation
    - deletion_readiness_assessment

authority:

  level: "read_only"

  capability_classification:

    verifier: true
    auditor: true
    advisor: true

    maintainer: false
    governor: false

  can:

    #
    # Repository Intelligence
    #

    - inspect_repository
    - inspect_repository_layout
    - inspect_package_structure

    #
    # Runtime Intelligence
    #

    - inspect_runtime
    - inspect_runtime_meta
    - inspect_runtime_dependencies
    - inspect_runtime_flows

    #
    # Integration Intelligence
    #

    - inspect_rest_endpoints
    - inspect_mcp_configuration
    - inspect_registry

    #
    # Artifact Backbone
    #

    - inspect_artifacts
    - inspect_asset_pipeline

    - inspect_chart_assets_db
    - inspect_chart_patterns_db
    - inspect_file_scan_inventory_db

    - inspect_artifact_relationships
    - inspect_backbone_relationships

    #
    # Governance
    #

    - inspect_governance_contracts
    - inspect_architecture_boundaries
    - inspect_layer_boundaries
    - inspect_flow_contracts
    - inspect_deletion_policies

    #
    # Reporting
    #

    - generate_reports
    - generate_diagnostics

    #
    # Auditor Outputs
    #

    - generate_root_cause_analysis
    - classify_root_failures
    - classify_derived_failures
    - generate_failure_lineage

    #
    # Advisor Outputs
    #

    - generate_patch_recommendations
    - generate_remediation_guidance

  cannot:

    #
    # Phase Protection
    #

    - modify_completed_phases

    - modify_phase1_logic
    - modify_phase2_logic
    - modify_phase3_logic
    - modify_phase4_logic
    - modify_phase45_logic
    - modify_phase5_logic
    - modify_phase6_logic
    - modify_phase7_logic

    #
    # Canonical Runtime Protection
    #

    - modify_canonical_row
    - modify_pattern_logic
    - modify_tip_generation

    #
    # Personalization / Localization Protection
    #

    - modify_personalization
    - modify_localization

    #
    # Asset Backbone Protection
    #

    - modify_asset_pipeline_behavior

    #
    # Governance Protection
    #

    - modify_governance_policy

    #
    # Persistence Protection
    #

    - write_to_database

    #
    # Automation Protection
    #

    - auto_commit_changes
    - auto_merge_pull_requests
    - auto_deploy

    - auto_fix_runtime
    - auto_repair_databases

    - auto_delete_assets

    #
    # Authority Boundaries
    #

    - replace_authoritative_runtime
    - override_governance_verdict
    - override_runtime_verdict
    - override_architecture_verdict

layer_boundary_policy:

  purpose:
    - responsibility_separation
    - governance_contract_enforcement
    - false_positive_reduction
    - evidence_based_escalation

  philosophy:

    - "Layer boundaries are responsibility contracts."
    - "Keyword hints are not sufficient evidence for governance blocking."
    - "Only evidence-level side effects should become critical violations."
    - "Suspicious imports should be reviewable warnings, not automatic blockers."
    - "Repository structure must be evaluated separately from executable behavior."
    - "Evidence outranks suspicion."
    - "Suspicion outranks hints."
    - "Governance blocking requires executable evidence."

  governance_model:

    blocking_confidence:
      - evidence

    non_blocking_confidence:
      - hint
      - suspicion

    require_executable_side_effect_for_critical: true

    support_false_positive_isolation: true

  confidence_levels:

    hint:

      description:
        "Textual reference to a prohibited responsibility."

      example:
        - "comment mentions persistence"
        - "docstring references writer"
        - "string literal contains database"

      governance_blocking: false
      severity: info

    suspicion:

      description:
        "Import-like or structural reference to a prohibited responsibility."

      example:
        - "from persistence import ..."
        - "import writers"
        - "cross-layer module reference"

      governance_blocking: false
      severity: warning

    evidence:

      description:
        "Executable side-effect or ownership crossing."

      example:
        - "sqlite3 write operation in converter"
        - "INSERT statement in reader"
        - "writer.persist() inside validator"
        - "runtime mutation in normalizer"

      governance_blocking: true
      severity: critical

  layers:

    models:

      responsibility:
        - data_representation

      prohibit:
        - persistence_ownership
        - orchestration
        - runtime_mutation

    normalizers:

      responsibility:
        - identity_normalization

      prohibit:
        - persistence_ownership
        - orchestration
        - recommendation_logic

    classifiers:

      responsibility:
        - asset_type_decision

      prohibit:
        - persistence_ownership
        - runtime_mutation
        - orchestration

    converters:

      responsibility:
        - file_to_text_conversion

      prohibit:
        - persistence_ownership
        - orchestration
        - recommendation_logic

    validators:

      responsibility:
        - correctness_verification

      prohibit:
        - persistence_ownership
        - runtime_mutation
        - orchestration

    persistence:

      responsibility:
        - database_writes

      prohibit:
        - recommendation_logic
        - tip_generation
        - orchestration

    readers:

      responsibility:
        - database_reads

      prohibit:
        - writes
        - schema_ownership

    bridges:

      responsibility:
        - integration_glue

      prohibit:
        - business_logic
        - persistence_ownership
        - recommendation_logic

    orchestrators:

      responsibility:
        - control_flow

      prohibit:
        - schema_ownership
        - persistence_ownership
        - domain_logic_ownership

  escalation:

    hint: info
    suspicion: warning
    evidence: critical

  false_positive_controls:

    - ignore_comments
    - ignore_empty_lines
    - ignore_docstrings
    - ignore_plain_keyword_occurrences

    - classify_import_like_matches_as_suspicion

    - require_runtime_effect_before_evidence

    - require_executable_side_effect_for_critical

    - evidence_overrides_suspicion
    - suspicion_overrides_hint

  reporting:

    expose_hint_count: true
    expose_suspicion_count: true
    expose_evidence_count: true

    expose_governance_blocking_state: true

    generate_layer_boundary_risk: true
    
mcp_contract:

  required_server:

    id: rhythm-game-assistant
    type: stdio

  required_adapter:

    file: mcp_server.py

  expected_environment:

    - RGA_REST_URL

  verification_scope:

    - configuration
    - runtime_visibility
    - tool_surface
    - adapter_presence

  governance:

    read_only: true

    generate_runtime_visibility_audit: true

package_integrity_policy:
  required_packages:
    - rhythm_ingestion

  invalid_package_aliases:
    - "rhythm ingestion"

  expected_import_root:
    - src

  expected_import_probes:
    - rhythm_ingestion
    - rhythm_ingestion.api
    - rhythm_ingestion.runtime_meta

artifact_database_policy:

  role: root_contract

  classification:
    contract_type: artifact_backbone
    failure_class: root

  read_mode:

    sqlite: readonly

  modification:
    prohibited

  verification_scope:

    - presence
    - readability
    - schema_inventory
    - record_count
    - relationship_seed_validation

  allowed_operations:

    - schema_inventory
    - readability_check
    - record_count
    - relationship_verification

  prohibited_operations:

    - insert
    - update
    - delete
    - schema_mutation

  relationship_chain:

    - file_scan_inventory.db
    - chart_assets.db
    - chart_patterns.db

  root_failure_effects:

    artifact_database_policy:

      blocks:

        - artifact_relationships
        - artifact_backbone_contract
        - asset_coverage
        - hash_integrity
        - type_A_usability
        - runtime_artifact_readiness

  governance_principles:

    - verifier_read_only
    - dependency_awareness
    - root_cause_isolation
    - derived_failure_classification
    
asset_scope_policy:

  enabled: true

  strategy: explicit_scope

  include_roots:

    - chart_assets
    - charts
    - assets
    - ingestion_assets

  exclude_roots:

    - .github
    - .vscode
    - docs
    - tools

    - Phase 4 - Personalization
    - Phase 4.5 - Localization
    - Phase 5 - Productionization
    - Phase 6 - Hardening and Scaling
    - Phase 7 - Games Recommendation

  explain_exclusions: true

  summarize_large_exclusions: true

  exclusion_categories:

    localization:
      - "Phase 4.5 - Localization"

    schema:
      - "/schemas/"

    fixture:
      - "/fixtures/"

    registry:
      - "/registry/"

    tooling:
      - ".github"
      - ".vscode"
      - "tools"

  reporting:

    expose_excluded_candidate_count: true

    expose_exclusion_reason_summary: true

    expose_example_paths: true
    
asset_expectations:

  philosophy:

    - asset_verification_precedes_deletion_readiness
    - repository_reality_precedes_coverage_analysis
    - asset_backbone_integrity_precedes_runtime_readiness

  type_A:

    classification:
      deterministic

    expected:
      - text_representation
      - converter_success
      - usable_content
      - usability_verified

    verification:
      - text_presence
      - conversion_success
      - content_non_empty
      - usability_contract

  type_B:

    classification:
      reference_only

    expected:
      - reference_url

    verification:
      - reference_url_presence
      - reference_visibility

  repository:

    expected:
      - scanned_asset_count
      - registered_asset_count
      - coverage_match
      - coverage_percentage

    reporting:
      show_scanned_asset_count: true
      show_registered_asset_count: true
      show_coverage_percentage: true


verification_gates:

  deletion_readiness:

    purpose:
      - deletion_safety
      - asset_backbone_protection

    required:
      - file_scan_inventory_complete
      - chart_assets_db_complete
      - chart_patterns_db_complete

      - scan_to_asset_verified
      - asset_to_pattern_verified

      - asset_coverage_verified
      - hash_consistency_verified

      - type_A_text_usable

      - runtime_can_use_db_assets
      - runtime_can_use_db_patterns

    failure_action:
      - block_deletion_recommendation

    classification:
      governance_gate
      root_contract

  governance_readiness:

    purpose:
      - governance_verdict_generation

    required:
      - phase_boundaries_verified
      - flow_contracts_verified
      - artifact_backbone_verified
      - layer_boundaries_verified
      - mcp_contract_verified
      - architecture_contracts_verified

  governance_failure_lineage_readiness:

    purpose:
      - auditor_mode
      - advisor_mode

    required:
      - root_failures_classified
      - derived_failures_classified
      - root_cause_summary_generated
      - lineage_renderable


discovery_engine:

  enabled: true

  mode: repository_wide

  philosophy:

    - discovery_precedes_diagnosis
    - repository_reality_precedes_assumptions
    - evidence_precedes_verdicts

  confidence_levels:

    - low
    - partial
    - medium
    - high

  candidate_scoring:

    file_scan_inventory_db: 15
    chart_assets_db: 15
    chart_patterns_db: 15

    main_py: 40
    recommend_py: 25
    app_py: 15

    runtime_meta_py: 10
    mcp_server_py: 10

    asset_orchestrator_py: 15

    classifier_py: 5
    converter_py: 5

  behavior:

    high_confidence:
      action: accept_candidate

    medium_confidence:
      action: accept_candidate

    partial_confidence:
      action: warn

    low_confidence:
      action: reject_candidate

  runtime_reader_discovery:

    enabled: true

    strategy:
      - repository_driven
      - package_inventory
      - runtime_module_inventory

    prohibit:
      - hardcoded_reader_packages
      - hardcoded_runtime_topology
      - fixed_reader_assumptions

    reporting:
      show_discovered_reader_modules: true
      show_reader_import_results: true


severity_policy:

  levels:
    - pass
    - info
    - warning
    - fail
    - critical

  governance_blocking:
    - critical

  rules:

    token_missing:

      when_rest_disabled: warning
      when_rest_enabled: fail

    partial_runtime_discovery:
      severity: warning

    package_name_mismatch:
      severity: fail

    package_root_mismatch:
      severity: fail

    import_failure:
      severity: fail

    wiring_gap:
      severity: fail

    runtime_contract_break:
      severity: fail

    asset_pipeline_break:
      severity: fail

    asset_coverage_failure:
      severity: fail

    hash_verification_failure:
      severity: fail

    type_A_usability_failure:
      severity: fail

    runtime_db_read_failure:
      severity: fail

    deletion_readiness_failure:
      severity: fail

    phase_boundary_violation:
      severity: critical

    architecture_contract_failure:
      severity: critical

    governance_gate_failure:
      severity: critical

    layer_boundary_failure:
      severity: fail

    artifact_relationship_failure:
      severity: fail

    artifact_backbone_failure:
      severity: fail

    flow_contract_failure:
      severity: fail

    mcp_contract_failure:
      severity: fail

    #
    # Auditor Layer
    #

    root_failure_detected:
      severity: critical

    derived_failure_detected:
      severity: fail

    lineage_classification_failure:
      severity: warning

    dependency_governance_misclassification:
      severity: warning


root_cause_categories:

  #
  # Artifact Backbone
  #

  - file_scan_inventory_missing
  - chart_assets_db_missing
  - chart_patterns_db_missing

  - scan_asset_gap
  - asset_pattern_gap

  - orphan_scan
  - orphan_asset
  - orphan_pattern

  #
  # Dependency Reality
  #

  - dependency_missing

  #
  # Runtime Reality
  #

  - runtime_pattern_read_failure
  - runtime_db_read_failure
  - runtime_wiring_gap

  #
  # Architecture
  #

  - flow_boundary_violation
  - layer_boundary_violation

  #
  # Package Integrity
  #

  - missing_files
  - package_name_mismatch
  - package_root_mismatch
  - missing_pythonpath
  - import_failure

  #
  # Coverage
  #

  - asset_coverage_gap
  - orphan_file
  - orphan_db_entry

  #
  # Hash Verification
  #

  - hash_mismatch
  - duplicate_hash
  - missing_hash

  #
  # Type A
  #

  - unusable_text_representation
  - unusable_type_A_asset

  #
  # Type B
  #

  - missing_reference_url

  #
  # Governance
  #

  - deletion_gate_failed

  #
  # Auditor Layer
  #

  - root_contract_failure
  - derived_contract_failure

  - artifact_database_policy_failure
  - governance_lineage_failure

  - dependency_governance_misclassification


governance_failure_accounting:

  principles:

    dependency_failures_are_separate: true

    governance_failures_are_actionable: true

    root_failures_are_primary_causes: true

    derived_failures_are_downstream_effects: true

    root_failures_take_priority: true

  reporting:

    include_dependency_failures: true

    include_governance_failures: true

    include_root_failures: true

    include_derived_failures: true

    include_root_failure_count: true

    include_derived_failure_count: true

    separate_dependency_failures: true


governance_failure_lineage:

  objective:

    - root_cause_isolation
    - failure_deduplication
    - remediation_prioritization

  root_contracts:

    artifact_database_policy:

      role: root_contract

      category: artifact_backbone

      derived_failures_if_missing:

        - artifact_relationships
        - artifact_backbone_contract
        - asset_coverage
        - hash_integrity
        - type_A_usability
        - runtime_artifact_readiness

    deletion_readiness:

      role: root_contract

      category: governance_gate

      independent: true

  derived_contracts:

    artifact_relationships:
      dependency_of:
        - artifact_database_policy

    artifact_backbone_contract:
      dependency_of:
        - artifact_database_policy

    asset_coverage:
      dependency_of:
        - artifact_database_policy

    hash_integrity:
      dependency_of:
        - artifact_database_policy

    type_A_usability:
      dependency_of:
        - artifact_database_policy

    runtime_artifact_readiness:
      dependency_of:
        - artifact_database_policy

  meta_contracts:
    - governance_verdict

  reporting:

    render_root_failures: true
    render_derived_failures: true

    root_before_derived: true

    include_dependency_map: true


runtime_reader_policy:

  discovery_mode:

    strategy: repository_driven

  prohibit:

    - fixed_reader_assumptions
    - hardcoded_package_topology
    - assumed_runtime_structures

  expectations:

    discover_existing_readers: true

    discover_existing_validators: true

    discover_existing_runtime_bridges: true

    repository_reality_over_assumptions: true

  reporting:

    show_discovered_reader_modules: true
    show_reader_import_results: true


runtime_expectations:

  artifact_runtime_flow:

    expected:
      - file_scan_inventory
      - chart_assets
      - chart_patterns
      - runtime_readers
      - recommendations
      - tips

  progression_flow:

    expected:
      - progression
      - game_recommendation
      - song_recommendation
      - tips

  player_first_flow:

    expected:
      - player_signals
      - song_recommendation
      - tips

  chart_first_flow:

    expected:
      - chart_resolution
      - pattern_detection
      - tips


simulation_policy:

  enabled: true

  purpose:

    - expected_behavior_generation
    - flow_prediction
    - runtime_gap_explanation

  must_label:
    - simulated
    - non_authoritative

  prohibit:
    - replacing_runtime_output
    - replacing_source_of_truth

  governance:
    read_only: true


advisor_support:

  enabled: true

  outputs:

    - root_cause_summary
    - remediation_order
    - dependency_mapping
    - maintenance_guidance

  remediation_strategy:

    resolve_root_failures_first: true

    revalidate_derived_failures_after_root_resolution: true

    separate_dependency_gaps_from_governance_gaps: true

  advisory_mode:

    read_only: true

    evidence_based: true

    non_mutating: true

  reporting:

    include_root_cause_summary: true
    include_failure_lineage: true
    include_recommendations: true

reporting:

  strategy:

    primary_format:
      - markdown

    secondary_format:
      - json

    human_readable_priority: true
    evidence_first: true
    governance_first: true

    verifier_mode: true
    auditor_mode: true
    advisor_mode: true

