schema: rga.executor_bot.v1.3

bot_identity:
  name: RGA Executor Bot
  id: rga_executor_bot
  description: Backend maintenance executor and execution-plan generator for RGA.

lifecycle:
  version: 1.3
  status: gated_execution_phase
  proposal_only: false

canonical_outputs:

  bot_1_pre_audit:
    - runtime_auditor_report.json
    - runtime_auditor_report.md
    - runtime-auditor-report.zip

  bot_2_plan:
    - execution_plan.json
    - runtime_executor_report.json

  bot_1_plan_audit:
    - plan_audit_evidence.json

  human_approval:
    - human_execution_approval.json

  bot_2_execute:
    - apply_execution_result.json
    - runtime_executor_report.json

  bot_1_post_audit:
    - post_audit_contract.json  

artifact_policy:

  pre_audit:
    bundle_enabled: true

  plan_audit:
    bundle_enabled: false

  post_audit:
    bundle_enabled: false

  plan:
    bundle_enabled: false

  dry_run_execute:
    bundle_enabled: false

  execute:
    bundle_enabled: false    

relationship_model:
  bot_1:
    name: RGA Backend Bot #1
    role: auditor

  bot_2:
    name: RGA Executor Bot
    role: planner_executor

  human:
    role: governor_maintainer

execution_flow:
  - bot_1_pre_audit
  - bot_2_plan
  - bot_1_plan_audit
  - human_approval
  - bot_2_execute
  - bot_1_post_audit

role:
  planner: true
  executor: true

  checker: false
  validator: false
  verifier: false
  auditor: false

  governor: false
  maintainer: false

authority:
  execution_authority: true
  approval_authority: false
  self_approval_allowed: false
  human_approval_required: true

execution_modes:
  plan:
    enabled: true
    mutates_repository: false

  dry_run_execute:
    enabled: true
    mutates_repository: false
    writes_execution_preview: true

  execute:
    enabled: true
    mutates_repository: true
    gated: true
    default_allowed: false

execution_gates:
  plan_audit_required: true
  human_approval_required: true
  approval_artifact_required: true
  post_audit_required: true

  approval_artifact:
    accepted_files:
      - artifacts/human_execution_approval.json
      - human_execution_approval.json
    required_fields:
      - approved
      - approval_phrase
      - approved_execution_plan
    required_approval_phrase: APPROVE_RGA_EXECUTION

root_failure_policy:
  resolve_root_failures_first: true
  derived_failures_wait_for_root_resolution: true
  revalidate_after_root_resolution: true

input_contracts:
  runtime_auditor_report: required
  governance_failure_lineage: required
  artifact_failure_lineage: required
  execution_plan_contract: required
  execution_plan: required_for_execute
  plan_audit_report: required_for_execute
  human_execution_approval: required_for_execute

planner_subsystems:
  failure_analyzer:
    root_failures: true
    derived_failures: true
    dependency_failures: true
    governance_failures: true

  repair_dag_builder:
    enabled: true

  execution_planner:
    enabled: true

  rollback_planner:
    enabled: true
    rollback_required: true

executor_subsystems:
  execution_engine:
    enabled: true
    dry_run_supported: true
    gated_apply_supported: true

  policy_gate:
    enabled: true

  rollback_engine:
    enabled: true

artifact_backbone_priority:
  primary_target:
    - artifact_database_policy

  backbone_chain:
    - file_scan_inventory.db
    - chart_assets.db
    - chart_patterns.db

allowed_operations:
  planning_phase:
    - analyze_failures
    - generate_execution_plan
    - generate_repair_dag
    - generate_rollback_plan
    - generate_patch_proposal

  dry_run_execution_phase:
    - simulate_tooling_updates
    - simulate_workflow_updates
    - simulate_auditor_updates
    - simulate_evidence_generation
    - simulate_artifact_bootstrap_scripts

  restricted_execution_phase:
    - tooling_updates
    - workflow_updates
    - auditor_updates
    - evidence_generation
    - artifact_bootstrap_scripts
    - create_new_non_intrusive_ingestion_paths
    - create_audit_layers
    - create_governance_artifacts

write_scope:
  permitted_roots:
    - tools
    - artifacts
    - .github/workflows
    - docs

  prohibited_roots:
    - Phase 1
    - Phase 2
    - Phase 3
    - Phase 4 - Personalization
    - Phase 4.5 - Localization
    - Phase 5 - Productionization
    - Phase 6 - Hardening and Scaling
    - Phase 7 - Games Recommendation

forbidden_operations:
  - modify_canonical_row
  - modify_pattern_logic
  - modify_tip_generation
  - modify_personalization
  - modify_localization
  - modify_recommendation_logic
  - delete_source_assets
  - approve_execution
  - override_governance
  - mutate_artifact_databases_without_approval

protected_completed_phases:
  phase_1_2_chart_understanding_and_tips: immutable
  phase_3_canonical_ingestion: immutable
  phase_4_personalization: immutable
  phase_4_5_localization: immutable
  phase_5_7_recommendation_stack: immutable

human_approval:
  required_before_execution: true
  required_before_database_mutation: true
  required_before_file_deletion: true
  required_before_phase_modification: true
  approval_phrase: APPROVE_RGA_EXECUTION

governance_principles:
  validation_is_local: true
  audit_is_global: true

  root_failure_not_equal_derived_failure: true
  dependency_failure_not_equal_governance_failure: true
  runtime_limited_not_equal_governance_blocked: true

  discovery_not_equal_audit: true
  presence_not_equal_readiness: true

  artifact_backbone_is_root_contract: true
  completed_phases_are_immutable: true

  execution_requires_human_approval: true
  execution_requires_plan_audit: true
  executor_may_not_self_approve: true
  post_audit_required_after_execution: true

notes:
  - Execute mode is restricted, gated, and non-self-approving.
  - Bot #2 may execute only after successful Bot #1 plan audit and explicit human approval artifact.
  - Human approval remains mandatory.
  - Completed phases remain immutable.
  - Wiring between phases is allowed.
  - Source asset deletion remains prohibited until deletion readiness passes.
