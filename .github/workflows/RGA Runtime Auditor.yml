      ############################################################
      # Write Lifecycle Event Contract
      ############################################################

      - name: Write Lifecycle Event Contract
        shell: bash
        env:
          AUDIT_MODE: ${{ inputs.audit_mode || 'pre_audit' }}
          AUDIT_SESSION_ID: ${{ inputs.audit_session_id }}
        run: |
          set -euo pipefail

          mkdir -p artifacts

          EVENT_STAGE=""
          NEXT_STAGE=""
          DISPATCH_REQUIRED="true"

          case "$AUDIT_MODE" in
            pre_audit)
              EVENT_STAGE="pre_audit"
              NEXT_STAGE="plan"
              ;;
            plan_audit)
              EVENT_STAGE="plan_audit"
              NEXT_STAGE="human_approval"
              ;;
            post_audit)
              EVENT_STAGE="post_audit"
              NEXT_STAGE="governance_gate"
              DISPATCH_REQUIRED="true"
              ;;
            *)
              echo "Unsupported AUDIT_MODE: $AUDIT_MODE" >&2
              exit 1
              ;;
          esac

          cat > artifacts/lifecycle_event.json <<EOF
          {
            "schema": "rga.lifecycle_event.v1.0",
            "producer": "runtime_auditor",
            "audit_session_id": "${AUDIT_SESSION_ID}",
            "audit_mode": "${AUDIT_MODE}",
            "completed_stage": "${EVENT_STAGE}",
            "next_stage": "${NEXT_STAGE}",
            "dispatch_required": ${DISPATCH_REQUIRED},
            "event_contract": {
              "completed_stage_declared": true,
              "next_stage_declared": true,
              "artifact_guessing_required": false,
              "runner_must_infer_stage": false
            }
          }
          EOF

          echo "Lifecycle event contract written:"
          cat artifacts/lifecycle_event.json

      ############################################################
      # Upload Lifecycle Event
      #
      # Purpose:
      #
      #   Publishes lifecycle_event.json as the canonical
      #   stage-transition contract for the RGA Lifecycle Runner.
      #
      # Produced by:
      #
      #   Bot #2 Maintenance Executor
      #
      # Expected completed_stage values:
      #
      #   plan
      #   execute
      #
      # Optional testing mode:
      #
      #   dry_run_execute
      #
      # Canonical output:
      #
      #   artifacts/lifecycle_event.json
      ############################################################

      - name: Upload Lifecycle Event
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rga-lifecycle-event
          path: artifacts/lifecycle_event.json
          if-no-files-found: warn    

      ############################################################
      # Write Lifecycle Event Backhaul
      #
      # Bot #1 Runtime Auditor
      #
      # Purpose:
      #
      #   - Publishes lifecycle continuation evidence.
      #   - Does NOT dispatch the Lifecycle Runner.
      #   - Allows Lifecycle Runner to consume chronological state
      #     via workflow_run artifact download.
      #
      # Canonical output:
      #
      #   artifacts/lifecycle_backhaul.json
      ############################################################

      - name: Write Lifecycle Event Backhaul
        shell: bash
        env:
          AUDIT_MODE: ${{ inputs.audit_mode }}
          AUDIT_SESSION_ID: ${{ inputs.audit_session_id }}
        run: |
          set -euo pipefail

          mkdir -p artifacts

          EVENT_STAGE=""
          NEXT_STAGE=""
          DISPATCH_REQUIRED="true"
          LIFECYCLE_STATUS="running"

          case "${AUDIT_MODE}" in

            pre_audit)
              EVENT_STAGE="pre_audit"
              NEXT_STAGE="plan"
              ;;

            plan_audit)
              EVENT_STAGE="plan_audit"
              NEXT_STAGE="human_approval"
              ;;

            post_audit)
              EVENT_STAGE="post_audit"
              NEXT_STAGE="governance_gate"
              DISPATCH_REQUIRED="true"
              LIFECYCLE_STATUS="running"
              ;;

            *)
              echo "Unsupported AUDIT_MODE: ${AUDIT_MODE}" >&2
              exit 1
              ;;

          esac

          jq -n \
            --arg schema "rga.lifecycle_backhaul.v1.0" \
            --arg producer "runtime_auditor" \
            --arg audit_mode "${AUDIT_MODE}" \
            --arg session "${AUDIT_SESSION_ID}" \
            --arg completed "${EVENT_STAGE}" \
            --arg next "${NEXT_STAGE}" \
            --arg status "${LIFECYCLE_STATUS}" \
            --argjson dispatch "${DISPATCH_REQUIRED}" \
            '{
              schema: $schema,

              producer: $producer,

              audit_session_id: $session,

              audit_mode: $audit_mode,

              completed_stage: $completed,

              next_stage:
                (
                  if $next == ""
                  then null
                  else $next
                  end
                ),

              lifecycle_status: $status,

              dispatch_required: $dispatch,

              backhaul_contract: {
                bot_dispatches_runner: false,
                runner_must_resume_from_workflow_run: true,
                artifact_guessing_required: false,
                chronological_order_required: true
              },

              governance: {
                bot_role: "auditor",
                orchestrator_role: "lifecycle_runner",
                approval_authority: "human",
                completed_phases_remain_immutable: true
              }
            }' \
            > artifacts/lifecycle_backhaul.json

          echo "Lifecycle backhaul written:"
          cat artifacts/lifecycle_backhaul.json  

      ############################################################
      # Upload Lifecycle Event Backhaul
      ############################################################

      - name: Upload Lifecycle Event Backhaul
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rga-lifecycle-backhaul
          path: artifacts/lifecycle_backhaul.json
          if-no-files-found: warn
          retention-days: 30          

      ############################################################
      # Upload Runtime Auditor Bundle
      ############################################################

      - name: Upload Runtime Auditor Bundle
        if: ${{ always() && github.event.inputs.audit_mode == 'pre_audit' }}
        uses: actions/upload-artifact@v4
        with:
          name: runtime-auditor-report-zip
          path: runtime-auditor-report.zip
          if-no-files-found: warn
          
      ############################################################
      # Upload Runtime Verification Contract
      ############################################################

      - name: Upload Runtime Verification Contract
        if: ${{ always() }}
        uses: actions/upload-artifact@v4

        with:
          name: rga-runtime-verification

          path: |
            artifacts/runtime_verification_contract.json

          if-no-files-found: warn    

      ############################################################
      # Upload Runtime Verification Acceptance
      ############################################################

      - name: Upload Runtime Verification Acceptance
        if: ${{ always() }}
        uses: actions/upload-artifact@v4

        with:
          name: rga-runtime-verification-acceptance

          path: |
            artifacts/runtime_verification_acceptance.json

          if-no-files-found: warn      

      ############################################################
      # Upload Runtime Certification
      ############################################################

      - name: Upload Runtime Certification
        if: ${{ always() }}
        uses: actions/upload-artifact@v4

        with:
          name: rga-runtime-certification

          path: |
            artifacts/runtime_certification.json

          if-no-files-found: warn    

      ############################################################
      # Upload Path A Operational Contract
      ############################################################

      - name: Upload Path A Operational Contract
        if: ${{ always() }}
        uses: actions/upload-artifact@v4

        with:
          name: rga-path-a-operational

          path: |
            artifacts/path_a_operational.json

          if-no-files-found: warn    

      ############################################################
      # Upload Runtime Baseline
      #
      # Stage 1 Contract
      ############################################################

      - name: Upload Runtime Baseline
        if: always()
        uses: actions/upload-artifact@v4

        with:
          name: rga-runtime-baseline

          path: |
            artifacts/runtime_baseline.json

          if-no-files-found: warn          

      ############################################################
      # Upload Runtime Auditor Evidence
      ############################################################

      - name: Upload Runtime Auditor Evidence
        if: ${{ always() && github.event.inputs.audit_mode == 'pre_audit' }}
        uses: actions/upload-artifact@v4
        with:
          name: runtime-auditor-evidence
          path: artifacts/
          if-no-files-found: warn 

      ############################################################
      # Upload Plan Audit Evidence
      ############################################################

      - name: Upload Plan Audit Evidence
        if: ${{ always() && github.event.inputs.audit_mode == 'plan_audit' }}
        uses: actions/upload-artifact@v4
        with:
          name: plan-audit-evidence
          path: artifacts/plan_audit_evidence.json
          if-no-files-found: warn
          
      ############################################################
      # Bundle Governance Contracts for Deployment Gate
      ############################################################
      
      - name: Bundle Governance Contracts for Deployment Gate
        uses: actions/upload-artifact@v4
        with:
          name: rga-governance-contracts-bundle
          path: |
            artifacts/runtime_baseline.json
            artifacts/database_mutation_plan.json
            artifacts/persistence_contract.json
            artifacts/runtime_verification_contract.json
            artifacts/runtime_verification_acceptance.json
            artifacts/runtime_certification.json
            artifacts/path_a_operational_contract.json
            artifacts/lifecycle_event.json
          if-no-files-found: warn
          
      ############################################################
      # Upload Post Audit Contract
      ############################################################

      - name: Upload Post Audit Contract
        if: ${{ always() && github.event.inputs.audit_mode == 'post_audit' }}
        uses: actions/upload-artifact@v4
        with:
          name: post-audit-contract
          path: artifacts/post_audit_contract.json
          if-no-files-found: warn
