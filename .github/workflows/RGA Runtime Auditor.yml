      - name: Artifact Backbone Schema Evidence
        run: |
          python - <<'PY'
          import json
          import sqlite3
          from pathlib import Path

          db_names = [
              "file_scan_inventory.db",
              "chart_assets.db",
              "chart_patterns.db",
          ]

          report = {}

          for db_name in db_names:
              paths = sorted(Path(".").rglob(db_name))
              report[db_name] = []

              for path in paths:
                  item = {
                      "path": str(path),
                      "exists": path.exists(),
                      "read_mode": "sqlite_readonly",
                      "modification": "prohibited",
                      "readable": False,
                      "tables": [],
                      "table_columns": {},
                      "table_row_counts": {},
                  }

                  try:
                      uri = f"file:{path.resolve().as_posix()}?mode=ro"
                      with sqlite3.connect(uri, uri=True) as conn:
                          cur = conn.cursor()
                          tables = [
                              row[0]
                              for row in cur.execute(
                                  "SELECT name FROM sqlite_master WHERE type='table' ORDER BY name"
                              ).fetchall()
                          ]

                          item["readable"] = True
                          item["tables"] = tables

                          for table in tables:
                              quoted = '"' + table.replace('"', '""') + '"'

                              columns = [
                                  row[1]
                                  for row in cur.execute(f"PRAGMA table_info({quoted})").fetchall()
                              ]

                              item["table_columns"][table] = columns

                              try:
                                  count = cur.execute(f"SELECT COUNT(*) FROM {quoted}").fetchone()[0]
                                  item["table_row_counts"][table] = count
                              except Exception as exc:
                                  item["table_row_counts"][table] = {"error": str(exc)}

                  except Exception as exc:
                      item["error"] = str(exc)

                  report[db_name].append(item)

          payload = {
              "schema":
                  "rga.artifact_database_schema_probe.v1.1",

              "artifact_contract_root":
                  "artifact_database_policy",

              "audit_layer":
                  "artifact_backbone",

              "governance_role":
                  "root_contract",

              "read_mode":
                  "sqlite_readonly",

              "modification":
                  "prohibited",

              "policy": {
                  "read_only": True,

                  "allowed_operations": [
                      "schema_inventory",
                      "table_count",
                      "row_count",
                  ],

                  "prohibited_operations": [
                      "insert",
                      "update",
                      "delete",
                      "schema_mutation",
                  ],
              },

              "databases":
                  report,
          }

          with open("artifacts/artifact_database_schema_probe.json", "w", encoding="utf-8") as f:
              json.dump(payload, f, indent=2, ensure_ascii=False)
          PY

