      ############################################################
      # Run RGA Runtime Auditor
      ############################################################

      - name: Run RGA Runtime Auditor
        id: run_auditor
        continue-on-error: true
        run: |
          set +e

          mkdir -p artifacts

          audit_mode="${{ github.event.inputs.audit_mode || 'pre_audit' }}"
          execution_plan="${{ github.event.inputs.execution_plan || '' }}"
          pre_audit_report="${{ github.event.inputs.pre_audit_report || '' }}"

          if [ -z "${audit_mode}" ]; then
            audit_mode="pre_audit"
          fi

          auditor_args=(
            "tools/runtime_auditor.py"
            "--repo-root" "."
            "--mcp-config" ".vscode/mcp.json"
            "--audit-mode" "${audit_mode}"
            "--json-out" "artifacts/runtime_auditor_report.json"
            "--md-out" "artifacts/runtime_auditor_report.md"
          )

          if [ -n "${execution_plan}" ]; then
            auditor_args+=(
              "--execution-plan" "${execution_plan}"
            )
          fi

          if [ -n "${pre_audit_report}" ]; then
            auditor_args+=(
              "--pre-audit-report" "${pre_audit_report}"
            )
          fi

          python "${auditor_args[@]}" \
            > artifacts/runtime_auditor_stdout.txt \
            2> artifacts/runtime_auditor_stderr.txt

          auditor_exit_code=$?

          echo "${auditor_exit_code}" \
            > artifacts/runtime_auditor_exit_code.txt

          echo "auditor_exit_code=${auditor_exit_code}" \
            >> "$GITHUB_OUTPUT"

          echo "RGA Runtime Auditor exited with code: ${auditor_exit_code}"

          exit 0
          
      ############################################################
      # Pre-Audit Bundle
      #
      # Bot #1 pre_audit mode:
      #
      #   - Baseline discovery & governance state snapshot.
      #   - Evaluates system architecture and runtime wiring.
      #   - Generates pre-audit contracts and evidence bundles.
      #   - Does not mutate repository state.
      #
      # Canonical output:
      #
      #   artifacts/artifact_bundle_manifest.txt
      #   artifacts/artifact_bundle_manifest.json
      ############################################################

      - name: Artifact Bundle Manifest
        if: ${{ always() && (github.event.inputs.audit_mode == 'pre_audit' || inputs.audit_mode == 'pre_audit' || env.AUDIT_MODE == 'pre_audit') }}
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p artifacts

          {
            echo "RGA Runtime Auditor Artifact Bundle"
            echo ""

            echo "Generated at:"
            date -u +"%Y-%m-%dT%H:%M:%SZ"

            echo ""
            echo "Auditor Exit Code:"
            cat artifacts/runtime_auditor_exit_code.txt || true

            echo ""
            echo "Artifact Count:"
            find artifacts -type f | wc -l

            echo ""
            echo "Files:"
            find artifacts -type f | sort

          } > artifacts/artifact_bundle_manifest.txt

          cat > artifacts/artifact_bundle_manifest_generator.py <<'PY'
          import json
          from pathlib import Path

          report_path = Path("artifacts/runtime_auditor_report.json")
          report_available = report_path.exists() and report_path.is_file() and report_path.stat().st_size > 0

          report_data = {}
          if report_available:
              try:
                  report_data = json.loads(report_path.read_text(encoding="utf-8", errors="ignore"))
                  if not isinstance(report_data, dict):
                      report_data = {}
              except Exception:
                  report_data = {}

          governance_state = report_data.get("governance_state", {})
          root_failures = governance_state.get("root_failures", [])
          derived_failures = governance_state.get("derived_failures", [])
          lifecycle_data = governance_state.get("lifecycle", {})

          files = sorted(
              str(p)
              for p in Path("artifacts").rglob("*")
              if p.is_file() and p.name != "artifact_bundle_manifest_generator.py"
          )

          payload = {
              "schema":
                  "rga.artifact_bundle_manifest.v1.3",

              "canonical_output":
                  "artifacts/artifact_bundle_manifest.json",

              "bundle_role":
                  "audit_evidence",

              "audit_mode":
                  "pre_audit",

              "artifact_count":
                  len(files),

              "runtime_baseline_summary": {
                  "report_available": report_available,
                  "final_lifecycle_state": lifecycle_data.get("final_state", "UNKNOWN"),
                  "root_failure_count": len(root_failures) if isinstance(root_failures, list) else 0,
                  "derived_failure_count": len(derived_failures) if isinstance(derived_failures, list) else 0,
                  "architecture_verdict": governance_state.get("architecture_verdict"),
                  "governance_verdict": governance_state.get("governance_verdict"),
              },

              "bot_1_authority": {
                  "pre_audit_baseline": True,
                  "plan_audit": True,
                  "post_audit": True,
                  "approve_execution": False,
                  "apply_execution": False,
              },

              "pre_audit_principles": {
                  "pre_audit_establishes_baseline": True,
                  "pre_audit_does_not_mutate_state": True,
                  "completed_phases_remain_immutable": True,
              },

              "generated_files":
                  files,
          }

          Path(
              "artifacts/artifact_bundle_manifest.json"
          ).write_text(
              json.dumps(
                  payload,
                  indent=2,
                  ensure_ascii=False,
              ),
              encoding="utf-8",
          )
