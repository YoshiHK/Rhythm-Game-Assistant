      ############################################################
      # Accept Runtime Verification
      ############################################################

      - name: Accept Runtime Verification
        shell: python

        run: |
          import json
          from pathlib import Path

          contract_path = Path(
              "artifacts/runtime_verification_contract.json"
          )

          accepted = False
          reasons = []

          if not contract_path.exists():
              reasons.append(
                  "runtime_verification_contract_missing"
            )
          else:

              contract = json.loads(
                  contract_path.read_text(
                      encoding="utf-8"
                  )
              )

              if (
                  contract.get("schema")
                  !=
                  "rga.runtime_verification_contract.v1.0"
              ):
                  reasons.append(
                      "invalid_schema"
                  )

              if (
                  contract.get(
                      "verification_type"
                  )
                  !=
                  "global"
              ):
                  reasons.append(
                      "invalid_verification_type"
                  )

              scope = (
                  contract.get(
                      "verification_scope"
                  )
                  or {}
              )

              required_scope = [
                  "inventory_coverage",
                  "asset_coverage",
                  "pattern_coverage",
                  "hash_consistency",
                  "runtime_surface",
                  "artifact_integrity",
              ]

              missing_scope = [
                  s
                  for s in required_scope
                  if s not in scope
              ]

              if missing_scope:
                  reasons.append(
                      "missing_verification_scope"
                  )

          if not reasons:
              accepted = True

          result = {
              "schema":
                  "rga.runtime_verification_acceptance.v1.0",

              "source_contract":
                  str(contract_path),

              "accepted":
                  accepted,

              "reasons":
                  reasons,
          }

          Path(
              "artifacts/runtime_verification_acceptance.json"
          ).write_text(
              json.dumps(
                  result,
                  indent=2,
                  ensure_ascii=False,
              ),
              encoding="utf-8",
          )

          print(
              "[RGA] runtime_verification_acceptance.json generated"
          )
          
