name: RGA Runtime Auditor

on:
  workflow_dispatch:
    inputs:
      audit_stage:
        description: "Stage in 10-step lifecycle loop"
        required: false
        default: "pre_audit"
        type: choice
        options:
          - pre_audit
          - plan_audit
          - persistence_verification
          - post_audit

      audit_mode:
        description: "Alias for audit_stage dispatched by lifecycle runner"
        required: false
        default: "pre_audit"

      audit_session_id:
        description: "Lifecycle Session Correlation ID"
        required: false
        default: ""

      execution_plan:
        description: "Path to execution plan artifact"
        required: false
        default: "artifacts/execution_plan.json"

      pre_audit_report:
        description: "Path to pre-audit report artifact"
        required: false
        default: "artifacts/runtime_auditor_report.json"

      post_audit_report:
        description: "Path to post-audit report artifact"
        required: false
        default: "artifacts/post_audit_report.json"

jobs:
  audit-execution:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      ############################################################
      # Generate GitHub App Token
      #
      # Runtime Auditor lifecycle role:
      #
      #   - Downloads historical lifecycle artifacts.
      #   - Verifies evidence produced by Maintenance Executor.
      #
      # Token policy:
      #
      #   - Prefer GitHub App installation token.
      #   - Do not use PAT_TOKEN.
      #   - Do not fall back to github.token.
      #   - Do not print token values.
      ############################################################

      - name: Generate GitHub App Token
        id: github_app_token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.RGA_APP_ID }}
          private-key: ${{ secrets.RGA_APP_PRIVATE_KEY }}

      ############################################################
      # Prepare Artifact Directory
      ############################################################

      - name: Prepare Artifact Directory
        shell: bash
        run: |
          mkdir -p artifacts

      ############################################################
      # Resolve GitHub App Artifact Token
      ############################################################

      - name: Resolve GitHub App Artifact Token
        id: artifact_token
        shell: bash
        env:
          GENERATED_GITHUB_APP_TOKEN: ${{ steps.github_app_token.outputs.token }}
        run: |
          if [ -z "${GENERATED_GITHUB_APP_TOKEN}" ]; then
            echo "::error::Generated GitHub App token is empty."
            exit 1
          fi

          echo "token=${GENERATED_GITHUB_APP_TOKEN}" >> "$GITHUB_OUTPUT"

      ############################################################
      # Download Backhaul Stage 1-4 Contracts from History
      ############################################################
          
      - name: Backhaul Stage 1-4 Contracts from History
        uses: dawidd6/action-download-artifact@v6
        with:
          github_token: ${{ steps.artifact_token.outputs.token }}
          workflow: RGA Maintenance Executor.yml
          path: artifacts
          if_no_artifact_found: warn

      ############################################################
      # Import Local Runtime Baseline
      #
      # Stage 1 bridge:
      #
      #   Run_UpdateRuntimeDbs.ps1
      #     default output:
      #
      #       artifacts/runtime_db_build_*/runtime_baseline.json
      #
      #   Runtime Auditor canonical import:
      #
      #       artifacts/runtime_baseline.json
      #
      ############################################################

      - name: Import Local Runtime Baseline
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          New-Item `
            -ItemType Directory `
            -Force `
            -Path .\artifacts | Out-Null

          Write-Host ""
          Write-Host "[RUNTIME-AUDITOR] Searching for local runtime_baseline.json"
          Write-Host "------------------------------------------------------------"

          # ------------------------------------------------------
          # Candidate 1:
          # Canonical governance bridge path
          # ------------------------------------------------------

          $candidateCanonical = Get-Item `
            ".\artifacts\runtime_baseline.json" `
            -ErrorAction SilentlyContinue

          # ------------------------------------------------------
          # Candidate 2:
          # Run_UpdateRuntimeDbs.ps1 default report bundle path
          #
          #   artifacts/runtime_db_build_*/runtime_baseline.json
          # ------------------------------------------------------

          $candidateReportBundle = Get-ChildItem `
            ".\artifacts" `
            -Recurse `
            -Filter "runtime_baseline.json" `
            -File `
            -ErrorAction SilentlyContinue |
            Where-Object {
              $_.FullName -match "runtime_db_build_"
            } |
            Sort-Object LastWriteTime `
            -Descending |
            Select-Object -First 1

          # ------------------------------------------------------
          # Candidate 3:
          # Broad fallback within repo workspace
          #
          # Exclude common non-source / dependency / git folders.
          # ------------------------------------------------------

          $candidateFallback = Get-ChildItem `
            "." `
            -Recurse `
            -Filter "runtime_baseline.json" `
            -File `
            -ErrorAction SilentlyContinue |
            Where-Object {
              $_.FullName -notmatch "\\.git\\" `
              -and $_.FullName -notmatch "\\.venv\\" `
              -and $_.FullName -notmatch "\\node_modules\\" `
              -and $_.FullName -notmatch "\\artifacts\\runtime_baseline.json$"
            } |
            Sort-Object LastWriteTime `
            -Descending |
            Select-Object -First 1

          $baseline = $null

          if ($candidateCanonical) {

            $baseline = $candidateCanonical

            Write-Host "[RUNTIME-AUDITOR] Candidate selected: canonical bridge"
            Write-Host "Source: $($baseline.FullName)"

          }
          elseif ($candidateReportBundle) {

            $baseline = $candidateReportBundle

            Write-Host "[RUNTIME-AUDITOR] Candidate selected: runtime_db_build report bundle"
            Write-Host "Source: $($baseline.FullName)"

          }
          elseif ($candidateFallback) {

            $baseline = $candidateFallback

            Write-Host "[RUNTIME-AUDITOR] Candidate selected: fallback discovery"
            Write-Host "Source: $($baseline.FullName)"

          }

          $Destination =
              (Resolve-Path ".\artifacts\runtime_baseline.json").Path

          $Source =
              (Resolve-Path $baseline.FullName).Path

          if (
              $Source -ieq $Destination
          ) {

              Write-Host ""
              Write-Host "[RUNTIME-AUDITOR] Runtime baseline already in canonical bridge location."

          }
          else {

              Copy-Item `
                  $Source `
                  $Destination `
                  -Force

              Write-Host ""
              Write-Host "[RUNTIME-AUDITOR] Runtime baseline imported."

          }

      ############################################################
      # Install Runtime Dependencies
      ############################################################

      - name: Install Runtime Dependencies
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p artifacts

          ########################################################
          # Upgrade pip
          ########################################################

          python -m pip install --upgrade pip \
            > artifacts/pip_upgrade_stdout.txt \
            2> artifacts/pip_upgrade_stderr.txt

          ########################################################
          # Install runtime dependencies
          ########################################################

          python -m pip install \
            fastapi==0.115.0 \
            "uvicorn[standard]==0.30.6" \
            pydantic==2.8.2 \
            openpyxl==3.1.5 \
            > artifacts/runtime_dependency_install_stdout.txt \
            2> artifacts/runtime_dependency_install_stderr.txt

          ########################################################
          # Import validation
          ########################################################

          {
            echo "fastapi:"
            python -m pip show fastapi \
              | grep "^Version:" \
              || true

            echo ""

            echo "uvicorn:"
            python -m pip show uvicorn \
              | grep "^Version:" \
              || true

            echo ""

            echo "pydantic:"
            python -m pip show pydantic \
              | grep "^Version:" \
              || true

            echo ""

            echo "openpyxl:"
            python -m pip show openpyxl \
              | grep "^Version:" \
              || true

          } > artifacts/runtime_dependency_import_check.txt

          echo "Runtime dependencies OK"

      ############################################################
      # Evidence Taxonomy
      ############################################################

      - name: Evidence Taxonomy

        run: |
          cat > artifacts/evidence_taxonomy.json <<'JSON'
          {
            "schema": "rga.evidence.taxonomy.v1.2",

            "mode": "read_only",

            "bot_identity": {
              "name": "RGA Backend Bot #1",
              "role": "pre_audit_plan_audit_post_audit",
              "execution_authority": false,
              "approval_authority": false
            },

            "bot_role": {
              "checker": true,
              "validator": true,
              "verifier": true,
              "auditor": true,
              "advisor": true,
              "maintainer_support": true,

              "plan_auditor": true,
              "post_execution_auditor": true,

              "governor": false,
              "maintainer": false,
              "executor": false
            },

            "audit_modes": {
              "pre_audit": {
                "description": "Bot #1 inspects current repository, runtime, artifact, and governance state.",
                "may_execute": false,
                "may_approve": false
              },

              "plan_audit": {
                "description": "Bot #1 evaluates Bot #2's proposed execution plan before human approval.",
                "requires_execution_plan": true,
                "may_execute": false,
                "may_approve": false
              },

              "post_audit": {
                "description": "Bot #1 evaluates repository state after proposed or applied execution.",
                "requires_pre_audit_report": false,
                "requires_execution_plan": false,
                "may_execute": false,
                "may_approve": false
              }
            },

            "double_sideway_audit": {
              "enabled": true,

              "sequence": [
                "bot_1_pre_audit",
                "bot_2_propose_execution_plan",
                "bot_1_plan_audit",
                "human_approval",
                "bot_2_apply_execution",
                "bot_1_post_audit"
              ],

              "separation_of_duties": {
                "bot_1_verifies": true,
                "bot_1_executes": false,
                "bot_1_approves": false,

                "bot_2_proposes": true,
                "bot_2_executes_only_after_human_approval": true,
                "bot_2_self_approves": false,

                "human_approval_required": true
              }
            },

            "classification": {
              "repository_reality": {
                "description": "Files, folders, package roots, and discovered repository surfaces.",
                "governance_blocking": true
              },

              "dependency_reality": {
                "description": "Python/package dependency availability and import prerequisites.",
                "governance_blocking": false,
                "affects": [
                  "runtime_verdict",
                  "flow_audit"
                ]
              },

              "import_reality": {
                "description": "Whether Python modules import successfully in the current runtime context.",
                "governance_blocking": false,
                "affects": [
                  "runtime_verdict"
                ]
              },

              "runtime_reality": {
                "description": "Runtime availability and operational surface evidence.",
                "governance_blocking": false
              },

              "artifact_backbone": {
                "description": "file_scan_inventory.db -> chart_assets.db -> chart_patterns.db backbone.",
                "root_contract": "artifact_database_policy",
                "governance_blocking": true
              },

              "deletion_governance": {
                "description": "Deletion readiness and source asset retention gates.",
                "root_contract": "deletion_readiness",
                "governance_blocking": true
              },

              "layer_boundary": {
                "description": "Layer responsibility separation evidence.",
                "confidence_model": [
                  "hint",
                  "suspicion",
                  "evidence"
                ],
                "governance_blocking_confidence": [
                  "evidence"
                ]
              },

              "root_failure": {
                "description": "Independently actionable governance blocker.",
                "render_before": [
                  "derived_failure"
                ]
              },

              "derived_failure": {
                "description": "Downstream consequence of an upstream root contract failure.",
                "revalidate_after_root_resolution": true
              },

              "runtime_limited": {
                "description": "Evidence collection was restricted by dependency, import, or runtime constraints.",
                "governance_blocking": false,
                "requires_revalidation": true
              },

              "review_needed": {
                "description": "Human review recommended. No governance blocker confirmed.",
                "governance_blocking": false
              }
            },

            "artifact_backbone_chain": [
              "file_scan_inventory.db",
              "chart_assets.db",
              "chart_patterns.db"
            ],

            "root_contracts": [
              "artifact_database_policy",
              "deletion_readiness"
            ],

            "derived_contracts": {
              "artifact_relationships": "artifact_database_policy",
              "artifact_backbone_contract": "artifact_database_policy",
              "asset_coverage": "artifact_database_policy",
              "hash_integrity": "artifact_database_policy",
              "type_A_usability": "artifact_database_policy",
              "runtime_artifact_readiness": "artifact_database_policy"
            },

            "protected_completed_phases": {
              "phase_1_2_chart_understanding_and_tips": "immutable",
              "phase_3_canonical_ingestion": "immutable",
              "phase_4_personalization": "immutable",
              "phase_4_5_localization": "immutable",
              "phase_5_7_recommendation_stack": "immutable"
            },

            "forbidden_bot_1_actions": [
              "approve_execution",
              "apply_execution",
              "merge_changes",
              "delete_source_assets",
              "mutate_artifact_databases",
              "modify_canonical_row",
              "modify_tips_generation",
              "modify_personalization",
              "modify_localization",
              "modify_recommendation_logic"
            ],

            "governance_principles": {
              "completed_phases": "immutable",
              "auditor_mode": "read_only",
              "maintenance_mode": "advisor_only",

              "dependency_failures_are_not_governance_failures": true,
              "runtime_limited_is_not_governance_blocked": true,
              "runtime_blockers_are_not_governance_blockers": true,

              "repository_reality_is_not_runtime_reality": true,
              "repository_reality_is_not_import_reality": true,
              "import_reality_is_not_runtime_reality": true,

              "root_failures_take_priority": true,
              "root_failures_should_be_resolved_first": true,
              "derived_failures_should_be_revalidated_after_root_resolution": true,

              "impact_scope_is_advisory_only": true,
              "lineage_does_not_imply_remediation": true,
              "false_positive_isolation": true,

              "artifact_backbone_is_root_contract": true,
              "deletion_readiness_is_root_contract": true,

              "bot_1_plan_audit_does_not_equal_approval": true,
              "bot_1_post_audit_does_not_equal_approval": true,
              "human_approval_required_before_execution": true
            }
          }
          JSON

      ############################################################
      # Governance Lineage Taxonomy
      ############################################################

      - name: Governance Lineage Taxonomy

        run: |
          cat > artifacts/governance_lineage_taxonomy.json <<'JSON'
          {
            "schema": "rga.governance.lineage.v1.1",

            "purpose":
              "Root and derived governance failure rendering.",

            "rendering_order": [
              "root_failure",
              "derived_failure"
            ],

            "failure_classes": {

              "root_failure": {
                "description":
                  "Independently actionable governance blocker.",

                "resolution_priority":
                  1
              },

              "derived_failure": {
                "description":
                  "Downstream failure caused by a root contract failure.",

                "resolution_priority":
                  2,

                "requires_root_reference":
                  true,

                "revalidate_after_root_resolution":
                  true
              }
            },

            "artifact_backbone_cascade": {

              "root_contract":
                "artifact_database_policy",

              "derived_contracts": [
                "artifact_relationships",
                "artifact_backbone_contract",
                "asset_coverage",
                "hash_integrity",
                "type_A_usability",
                "runtime_artifact_readiness"
              ]
            },

            "governance_notes": [
              "Resolve root failures before derived failures.",
              "Derived failures should be revalidated after root resolution.",
              "Lineage classification does not imply remediation."
            ]
          }
          JSON

      ############################################################
      # Flow Contract Taxonomy
      ############################################################

      - name: Flow Contract Taxonomy
        run: |
          cat > artifacts/flow_contract_taxonomy.json <<'JSON'
          {
            "schema": "rga.flow_contract_taxonomy.v1.1",

            "contracts": {

              "chart_first": {

                "description":
                  "Chart-selected flow leading to chart understanding and tips generation.",

                "entry_artifact":
                  "chart",

                "primary_sequence": [
                  "chart",
                  "pattern",
                  "tips",
                  "personalization",
                  "localization",
                  "presentation"
                ]
              },

              "player_first": {

                "description":
                  "Player/profile-driven flow leading to song recommendation.",

                "entry_artifact":
                  "player",

                "primary_sequence": [
                  "player",
                  "recommendation",
                  "song",
                  "tips",
                  "personalization",
                  "localization",
                  "presentation"
                ]
              },

              "progression": {

                "description":
                  "Progression-driven flow leading to game and song recommendations.",

                "entry_artifact":
                  "progression",

                "primary_sequence": [
                  "progression",
                  "game",
                  "song",
                  "tips",
                  "personalization",
                  "localization",
                  "presentation"
                ]
              }
            },

            "phase_boundary_policy": {

              "phase_1_2_chart_understanding_immutable":
                true,

              "phase_3_canonical_ingestion_immutable":
                true,

              "phase_4_personalization_immutable":
                true,

              "phase_4_5_localization_immutable":
                true,

              "phase_5_7_recommendation_stack_immutable":
                true
            },

            "governance_principles": {

              "flows_are_distinct":
                true,

              "flows_share_backbone":
                true,

              "entry_points_are_different":
                true,

              "recommendation_logic_not_modified":
                true,

              "tips_generation_not_modified":
                true,

              "personalization_not_modified":
                true,

              "localization_not_modified":
                true,

              "flow_audit_is_repository_driven":
                true
            },

            "ui_entry_surface_mapping": {

              "song_pages":
                "chart_first",

              "recommendation_pages":
                "chart_first",

              "history_pages":
                "chart_first",

              "profile_pages":
                "player_first",

              "ingestion_pages":
                "player_first",

              "feedback_pages":
                "player_first",

              "progression_pages":
                "progression",

              "gamification_pages":
                "progression"
            },

            "audit_note":
              "Flow taxonomy defines expected flow contracts only. Flow taxonomy does not modify runtime behavior, recommendation logic, personalization, localization, or completed phases."
          }
          JSON

          {
            echo "Flow Contract Taxonomy"
            echo ""

            echo "Contracts:"
            echo "- chart_first"
            echo "- player_first"
            echo "- progression"

            echo ""
            echo "Phase Boundary Policy:"
            echo "- Phase 1-2 immutable"
            echo "- Phase 3 immutable"
            echo "- Phase 4 immutable"
            echo "- Phase 4.5 immutable"
            echo "- Phase 5-7 immutable"

            echo ""
            echo "Generated Files:"
            echo "- flow_contract_taxonomy.json"

          } > artifacts/flow_contract_taxonomy_summary.txt

      ############################################################
      # Repository Discovery Evidence
      ############################################################

      - name: Repository Discovery Evidence
        run: |
          pwd \
            > artifacts/repository_root.txt

          find . -type f \
            | sort \
            > artifacts/repository_inventory.txt

          find . -type d \
            | sort \
            > artifacts/repository_directories.txt

          git status --short \
            > artifacts/git_status_short.txt || true

          git rev-parse HEAD \
            > artifacts/git_head.txt || true

          git branch --show-current \
            > artifacts/git_branch.txt || true

          {
            echo "Repository Discovery Evidence"
            echo ""

            echo "Repository root:"
            cat artifacts/repository_root.txt || true

            echo ""
            echo "Git HEAD:"
            cat artifacts/git_head.txt || true

            echo ""
            echo "Git branch:"
            cat artifacts/git_branch.txt || true

            echo ""
            echo "Inventory files:"
            echo "- repository_inventory.txt"
            echo "- repository_directories.txt"
            echo "- git_status_short.txt"
          } > artifacts/repository_discovery_summary.txt

          python - <<'PY'
          import json
          from pathlib import Path

          def count(path_text):
              p = Path(path_text)

              if not p.exists():
                  return 0

              return len(
                  [
                      line
                      for line in p.read_text(
                          encoding="utf-8",
                          errors="ignore",
                      ).splitlines()
                      if line.strip()
                  ]
              )

          payload = {
              "schema":
                  "rga.repository_discovery_evidence.v1.1",

              "repository_file_count":
                  count(
                      "artifacts/repository_inventory.txt"
                  ),

              "repository_directory_count":
                  count(
                      "artifacts/repository_directories.txt"
                  ),

              "repository_driven":
                  True,

              "evidence_role":
                  "repository_reality",

              "audit_note":
                  (
                      "Repository discovery establishes "
                      "repository reality only. Runtime "
                      "readiness must be verified separately."
                  ),
          }

          with open(
              "artifacts/repository_discovery_summary.json",
              "w",
              encoding="utf-8",
          ) as f:
              json.dump(
                  payload,
                  f,
                  indent=2,
                  ensure_ascii=False,
              )
          PY

      ############################################################
      # Runtime Discovery Evidence
      ############################################################

      - name: Runtime Discovery Evidence
        run: |
          find . -type f -name "main.py" \
            | sort > artifacts/main_candidates.txt || true

          find . -type f -name "recommend.py" \
            | sort > artifacts/recommend_candidates.txt || true

          find . -type f -name "app.py" \
            | sort > artifacts/app_candidates.txt || true

          find . -type f -name "runtime_meta.py" \
            | sort > artifacts/runtime_meta_candidates.txt || true

          find . -type f -name "mcp_server.py" \
            | sort > artifacts/mcp_server_candidates.txt || true

          find . -type f -name "runtime_auditor.py" \
            | sort > artifacts/runtime_auditor_candidates.txt || true

          find . -type f \
            \( \
              -name "recommend.py" -o \
              -name "recommendation*.py" -o \
              -name "*recommender*.py" \
            \) \
            | sort > artifacts/recommendation_entrypoints.txt || true

          find . -type f \
            \( \
              -iname "*reader*.py" -o \
              -iname "*readers*.py" \
            \) \
            | sort > artifacts/reader_entrypoints.txt || true

          find . -type f \
            \( \
              -iname "*validator*.py" -o \
              -iname "*validators*.py" \
            \) \
            | sort > artifacts/validator_entrypoints.txt || true

          find . -type f \
            \( \
              -iname "*bridge*.py" -o \
              -iname "*bridges*.py" \
            \) \
            | sort > artifacts/bridge_entrypoints.txt || true

          find . -type f \
            \( \
              -name "*orchestrator*.py" -o \
              -name "*workflow*.py" -o \
              -name "*runtime*.py" \
            \) \
            | sort > artifacts/orchestration_entrypoints.txt || true

          find . -type d \
            | grep "rhythm" \
            > artifacts/rhythm_directories.txt || true

          {
            echo "Runtime Discovery Evidence"
            echo ""
            echo "main.py candidates:"
            cat artifacts/main_candidates.txt || true
            echo ""
            echo "recommend.py candidates:"
            cat artifacts/recommend_candidates.txt || true
            echo ""
            echo "app.py candidates:"
            cat artifacts/app_candidates.txt || true
            echo ""
            echo "runtime_meta.py candidates:"
            cat artifacts/runtime_meta_candidates.txt || true
            echo ""
            echo "mcp_server.py candidates:"
            cat artifacts/mcp_server_candidates.txt || true
          } > artifacts/runtime_discovery_summary.txt

          python - <<'PY'
          import json
          from pathlib import Path

          payload = {
              "schema": "rga.runtime_discovery_evidence.v1.1",
              "repository_driven": True,
              "runtime_surfaces": {
                  "main": "main_candidates.txt",
                  "recommend": "recommend_candidates.txt",
                  "runtime_meta": "runtime_meta_candidates.txt",
                  "mcp": "mcp_server_candidates.txt",
              },
              "discovery_strategy": "repository_driven",
              "audit_note": (
                  "Runtime discovery identifies candidate "
                  "runtime surfaces but does not imply "
                  "runtime readiness."
              ),
          }

          with open("artifacts/runtime_discovery_summary.json", "w", encoding="utf-8") as f:
              json.dump(payload, f, indent=2, ensure_ascii=False)
          PY

      ############################################################
      # Package Reality Evidence
      ############################################################

      - name: Package Reality Evidence
        run: |
          find . -type d -name "rhythm_ingestion" \
            | sort > artifacts/rhythm_ingestion_package_dirs.txt || true

          find . -type d -name "rhythm ingestion" \
            | sort > artifacts/rhythm_invalid_alias_dirs.txt || true

          find . -type f -name "__init__.py" \
            | sort > artifacts/python_init_files.txt || true

          {
            echo "Package Reality Evidence"
            echo ""

            echo "Canonical package dirs:"
            cat artifacts/rhythm_ingestion_package_dirs.txt || true

            echo ""
            echo "Invalid alias dirs:"
            cat artifacts/rhythm_invalid_alias_dirs.txt || true

            echo ""
            echo "__init__.py files:"
