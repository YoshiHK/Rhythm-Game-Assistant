
name: RGA Runtime Verifier

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  runtime-verification:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Repository Discovery Evidence
        run: |
          mkdir -p artifacts

          echo "PWD:"
          pwd > artifacts/repository_root.txt

          find . -type f | sort > artifacts/repository_inventory.txt

      - name: Runtime Discovery Evidence
        run: |
          find . -type f -name "main.py" | sort > artifacts/main_candidates.txt
          find . -type f -name "recommend.py" | sort > artifacts/recommend_candidates.txt
          find . -type f -name "app.py" | sort > artifacts/app_candidates.txt
          find . -type f -name "runtime_meta.py" | sort > artifacts/runtime_meta_candidates.txt
          find . -type f -name "mcp_server.py" | sort > artifacts/mcp_server_candidates.txt
          find . -type f -name "runtime_verifier.py" | sort > artifacts/runtime_verifier_candidates.txt
          find . -type d | grep "rhythm" > artifacts/rhythm_directories.txt || true

      - name: Asset Pipeline Evidence
        run: |
          find . -type f \( \
            -name "*.aff" -o \
            -name "*.sus" -o \
            -name "*.json" -o \
            -name "*.html" -o \
            -name "*.mht" \
          \) > artifacts/type_a_assets.txt || true

          find . -type f -name "chart_assets.db" > artifacts/chart_assets_db.txt || true

      - name: Run RGA Runtime Verifier
        run: |
          python tools/runtime_verifier.py \
            --repo-root . \
            --json-out artifacts/runtime_verifier_report.json \
            --md-out artifacts/runtime_verifier_report.md

      - name: Upload Runtime Verifier Report
        uses: actions/upload-artifact@v4
        with:
          name: runtime-verifier-report
          path: artifacts/
