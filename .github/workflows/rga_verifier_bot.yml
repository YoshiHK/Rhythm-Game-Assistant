name: RGA Runtime Verifier

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  runtime-verification:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Debug repository layout
        run: |
          echo "PWD:"
          pwd

          echo ""
          echo "Top-level files:"
          find . -maxdepth 2 -type f | sort

          echo ""
          echo "Candidate main.py files:"
          find . -type f -name "main.py" | sort

          echo ""
          echo "Candidate recommend.py files:"
          find . -type f -name "recommend.py" | sort

          echo ""
          echo "Candidate app.py files:"
          find . -type f -name "app.py" | sort

          echo ""
          echo "Candidate runtime_meta.py files:"
          find . -type f -name "runtime_meta.py" | sort

          echo ""
          echo "Candidate mcp_server.py files:"
          find . -type f -name "mcp_server.py" | sort

          echo ""
          echo "Candidate rhythm package directories:"
          find . -type d | grep "rhythm" || true

          echo ""
          echo "Candidate runtime_verifier.py files:"
          find . -type f -name "runtime_verifier.py" | sort

      - name: Run RGA Runtime Verifier
        run: |
          mkdir -p artifacts

          python tools/runtime_verifier.py \
            --repo-root . \
            --json-out artifacts/runtime_verifier_report.json \
            --md-out artifacts/runtime_verifier_report.md

      - name: Upload runtime verifier report
        uses: actions/upload-artifact@v4
        with:
          name: runtime-verifier-report
          path: artifacts/
