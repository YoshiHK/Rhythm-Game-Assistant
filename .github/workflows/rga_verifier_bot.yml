name: RGA Runtime Verifier

on:
  push:
    branches:
      - main

  pull_request:

  workflow_dispatch:

jobs:

  runtime-verification:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run Runtime Auditor
        run: |
          python tools/runtime_verifier.py
