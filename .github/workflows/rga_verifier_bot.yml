name: RGA Runtime Verifier

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  runtime-verification:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run RGA Runtime Verifier
        run: |
          python tools/runtime_verifier.py \
            --repo-root "engine/Unified Ingestion Manager/Unified Ingestion Manager" \
            --json-out artifacts/runtime_verifier_report.json \
            --md-out artifacts/runtime_verifier_report.md

      - name: Upload verifier report
        uses: actions/upload-artifact@v4
        with:
          name: runtime-verifier-report
          path: artifacts/
