name: RGA Runtime Verifier

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  runtime-verification:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      security-events: read
      actions: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      ############################################################
      # Artifact Directory
      ############################################################

      - name: Prepare Artifact Directory
        run: |
          mkdir -p artifacts

      ############################################################
      # Evidence Taxonomy
      ############################################################

      - name: Evidence Taxonomy
        run: |
          cat > artifacts/evidence_taxonomy.json <<'JSON'
          {
            "schema": "rga.evidence.taxonomy.v1.0",
            "mode": "read_only",
            "bot_role": {
              "checker": true,
              "validator": true,
              "verifier": true,
              "auditor": true,
              "advisor": true,
              "governor": false,
              "maintainer": false
            },
            "classification": {
              "repository_reality": {
                "description": "Files, folders, package roots, and discovered repository surfaces.",
                "governance_blocking": true
              },
              "dependency_reality": {
                "description": "Python/package dependency availability and import prerequisites.",
                "governance_blocking": false,
                "affects": [
                  "runtime_verdict",
                  "flow_verification"
                ]
              },
              "import_reality": {
                "description": "Whether Python modules import successfully in the current runtime context.",
                "governance_blocking": false,
                "affects": [
                  "runtime_verdict"
                ]
              },
              "runtime_reality": {
                "description": "Runtime availability and operational surface evidence.",
                "governance_blocking": false
              },
              "artifact_backbone": {
                "description": "file_scan_inventory.db -> chart_assets.db -> chart_patterns.db backbone.",
                "governance_blocking": true
              },
              "deletion_governance": {
                "description": "Deletion readiness and source asset retention gates.",
                "governance_blocking": true
              },
              "layer_boundary": {
                "description": "Layer responsibility separation evidence.",
                "confidence_model": [
                  "hint",
                  "suspicion",
                  "evidence"
                ],
                "governance_blocking_confidence": [
                  "evidence"
                ]
              },
              "root_failure": {
                "description": "Independently actionable governance blocker.",
                "render_before": [
                  "derived_failure"
                ]
              },
              "derived_failure": {
                "description": "Downstream consequence of an upstream root contract failure.",
                "revalidate_after_root_resolution": true
              }
            },
            "governance_principles": {
              "completed_phases": "immutable",
              "verifier_mode": "read_only",
              "dependency_failures_are_not_governance_failures": true,
              "root_failures_should_be_resolved_first": true,
              "derived_failures_should_be_revalidated_after_root_resolution": true,
              "false_positive_isolation": true,
              "maintenance_mode": "advisor_only"
            }
          }
          JSON

      ############################################################
      # Repository Discovery Evidence
      ############################################################

      - name: Repository Discovery Evidence
        run: |
          pwd > artifacts/repository_root.txt

          find . -type f | sort \
            > artifacts/repository_inventory.txt

          find . -type d | sort \
            > artifacts/repository_directories.txt

          git status --short \
            > artifacts/git_status_short.txt || true

          git rev-parse HEAD \
            > artifacts/git_head.txt || true

          git branch --show-current \
            > artifacts/git_branch.txt || true

          {
            echo "Repository Discovery Evidence"
            echo ""
            echo "Repository root:"
            cat artifacts/repository_root.txt || true
            echo ""
            echo "Git HEAD:"
            cat artifacts/git_head.txt || true
            echo ""
            echo "Git branch:"
            cat artifacts/git_branch.txt || true
            echo ""
            echo "Inventory files:"
            echo "- repository_inventory.txt"
            echo "- repository_directories.txt"
            echo "- git_status_short.txt"
          } > artifacts/repository_discovery_summary.txt

      ############################################################
      # Runtime Discovery Evidence
      ############################################################

      - name: Runtime Discovery Evidence
        run: |
          find . -type f -name "main.py" \
            | sort > artifacts/main_candidates.txt || true

          find . -type f -name "recommend.py" \
            | sort > artifacts/recommend_candidates.txt || true

          find . -type f -name "app.py" \
            | sort > artifacts/app_candidates.txt || true

          find . -type f -name "runtime_meta.py" \
            | sort > artifacts/runtime_meta_candidates.txt || true

          find . -type f -name "mcp_server.py" \
            | sort > artifacts/mcp_server_candidates.txt || true

          find . -type f -name "runtime_verifier.py" \
            | sort > artifacts/runtime_verifier_candidates.txt || true

          find . -type f \
            \( \
              -name "recommend.py" -o \
              -name "recommendation*.py" -o \
              -name "*recommender*.py" \
            \) \
            | sort > artifacts/recommendation_entrypoints.txt || true

          find . -type f \
            \( \
              -name "*orchestrator*.py" -o \
              -name "*workflow*.py" -o \
              -name "*runtime*.py" \
            \) \
            | sort > artifacts/orchestration_entrypoints.txt || true

          find . -type d \
            | grep "rhythm" \
            > artifacts/rhythm_directories.txt || true

          {
            echo "Runtime Discovery Evidence"
            echo ""
            echo "main.py candidates:"
            cat artifacts/main_candidates.txt || true
            echo ""
            echo "recommend.py candidates:"
            cat artifacts/recommend_candidates.txt || true
            echo ""
            echo "app.py candidates:"
            cat artifacts/app_candidates.txt || true
            echo ""
            echo "runtime_meta.py candidates:"
            cat artifacts/runtime_meta_candidates.txt || true
            echo ""
            echo "mcp_server.py candidates:"
            cat artifacts/mcp_server_candidates.txt || true
          } > artifacts/runtime_discovery_summary.txt

      ############################################################
      # Package / Import Reality Evidence
      ############################################################

      - name: Package Reality Evidence
        run: |
          find . -type d -name "rhythm_ingestion" \
            | sort > artifacts/rhythm_ingestion_package_dirs.txt || true

          find . -type d -name "rhythm ingestion" \
            | sort > artifacts/rhythm_invalid_alias_dirs.txt || true

          find . -type f -name "__init__.py" \
            | sort > artifacts/python_init_files.txt || true

          {
            echo "Package Reality Evidence"
            echo ""
            echo "Canonical package dirs:"
            cat artifacts/rhythm_ingestion_package_dirs.txt || true
            echo ""
            echo "Invalid alias dirs:"
            cat artifacts/rhythm_invalid_alias_dirs.txt || true
            echo ""
            echo "__init__.py files:"
            wc -l artifacts/python_init_files.txt || true
          } > artifacts/package_reality_summary.txt

      ############################################################
      # Dependency Reality Evidence
      ############################################################

      - name: Dependency Reality Evidence
        run: |
          python --version \
            > artifacts/python_version.txt

          python -m pip --version \
            > artifacts/pip_version.txt

          python -m pip freeze \
            > artifacts/pip_freeze.txt

          python - <<'PY'
          import importlib
          import json
          import sys

          required_modules = [
              "sqlite3",
          ]

          optional_modules = [
              "fastapi",
              "uvicorn",
              "pydantic",
          ]

          api_runtime_modules = [
              "fastapi",
              "pydantic",
          ]

          def probe(module_name):
              try:
                  module = importlib.import_module(module_name)
                  return {
                      "status": "pass",
                      "file": getattr(module, "__file__", None),
                  }
              except Exception as exc:
                  return {
                      "status": "fail",
                      "error": str(exc),
                  }

          payload = {
              "schema": "rga.runtime_dependency_probe.v1.0",
              "python_executable": sys.executable,
              "python_version": sys.version,
              "required_modules": {
                  name: probe(name)
                  for name in required_modules
              },
              "optional_modules": {
                  name: probe(name)
                  for name in optional_modules
              },
              "api_runtime_modules": {
                  name: probe(name)
                  for name in api_runtime_modules
              },
              "classification": {
                  "required_missing": "runtime_blocker",
                  "api_runtime_missing": "capability_reduction",
                  "optional_missing": "non_blocking"
              },
              "governance_note": (
                  "Dependency failures affect runtime readiness but should not "
                  "automatically become governance failures."
              )
          }

          with open("artifacts/runtime_dependency_probe.json", "w", encoding="utf-8") as f:
              json.dump(payload, f, indent=2, ensure_ascii=False)

          with open("artifacts/runtime_dependency_probe.txt", "w", encoding="utf-8") as f:
              for section in [
                  "required_modules",
                  "optional_modules",
                  "api_runtime_modules",
              ]:
                  f.write(f"[{section}]\n")
                  for name, result in payload[section].items():
                      f.write(f"{name}: {result['status']}")
                      if result.get("error"):
                          f.write(f": {result['error']}")
                      f.write("\n")
                  f.write("\n")
          PY

      ############################################################
      # Import Reality Evidence
      ############################################################

      - name: Import Reality Evidence
        run: |
          python - <<'PY'
          import importlib
          import json
          import sys

          modules = [
              "rhythm_ingestion",
              "rhythm_ingestion.api",
              "rhythm_ingestion.api.recommend",
              "rhythm_ingestion.runtime_meta",
          ]

          results = {}

          for module_name in modules:
              try:
                  module = importlib.import_module(module_name)

                  results[module_name] = {
                      "status": "pass",
                      "file": getattr(
                          module,
                          "__file__",
                          None,
                      ),
                  }

              except Exception as exc:
                  results[module_name] = {
                      "status": "fail",
                      "error": str(exc),
                  }

          payload = {
              "schema": "rga.import_reality_probe.v1.0",
              "python_executable": sys.executable,
              "modules": results,
              "governance_note": (
                  "Import failures should be interpreted against dependency "
                  "reality before being treated as wiring or package layout defects."
              )
          }

          with open(
              "artifacts/import_reality_probe.json",
              "w",
              encoding="utf-8",
          ) as f:
              json.dump(
                  payload,
                  f,
                  indent=2,
                  ensure_ascii=False,
              )
          PY

      ############################################################
      # Artifact Database Discovery
      ############################################################

      - name: Artifact Database Discovery
        run: |
          find . -type f -name "file_scan_inventory.db" \
            | sort > artifacts/file_scan_inventory_db.txt || true

          find . -type f -name "chart_assets.db" \
            | sort > artifacts/chart_assets_db.txt || true

          find . -type f -name "chart_patterns.db" \
            | sort > artifacts/chart_patterns_db.txt || true

          {
            echo "Artifact Database Discovery"
            echo ""
            echo "Relationship chain:"
            echo "file_scan_inventory.db -> chart_assets.db -> chart_patterns.db"
            echo ""
            echo "file_scan_inventory.db candidates:"
            cat artifacts/file_scan_inventory_db.txt || true
            echo ""
            echo "chart_assets.db candidates:"
            cat artifacts/chart_assets_db.txt || true
            echo ""
            echo "chart_patterns.db candidates:"
            cat artifacts/chart_patterns_db.txt || true
          } > artifacts/artifact_database_discovery_summary.txt

      ############################################################
      # Artifact Database Schema Evidence
      ############################################################

      - name: Artifact Database Schema Evidence
        run: |
          python - <<'PY'
          import json
          import sqlite3
          from pathlib import Path

          db_names = [
              "file_scan_inventory.db",
              "chart_assets.db",
              "chart_patterns.db",
          ]

          report = {}

          for db_name in db_names:
              paths = sorted(Path(".").rglob(db_name))
              report[db_name] = []

              for path in paths:
                  item = {
                      "path": str(path),
                      "exists": path.exists(),
                      "read_mode": "sqlite_readonly",
                      "modification": "prohibited",
                      "readable": False,
                      "tables": [],
                      "table_columns": {},
                      "table_row_counts": {},
                  }

                  try:
                      uri = f"file:{path.resolve().as_posix()}?mode=ro"
                      with sqlite3.connect(uri, uri=True) as conn:
                          cur = conn.cursor()
                          tables = [
                              row[0]
                              for row in cur.execute(
                                  "SELECT name FROM sqlite_master WHERE type='table' ORDER BY name"
                              ).fetchall()
                          ]

                          item["readable"] = True
                          item["tables"] = tables

                          for table in tables:
                              quoted = '"' + table.replace('"', '""') + '"'

                              columns = [
                                  row[1]
                                  for row in cur.execute(f"PRAGMA table_info({quoted})").fetchall()
                              ]

                              item["table_columns"][table] = columns

                              try:
                                  count = cur.execute(f"SELECT COUNT(*) FROM {quoted}").fetchone()[0]
                                  item["table_row_counts"][table] = count
                              except Exception as exc:
                                  item["table_row_counts"][table] = {"error": str(exc)}

                  except Exception as exc:
                      item["error"] = str(exc)

                  report[db_name].append(item)

          payload = {
              "schema": "rga.artifact_database_schema_probe.v1.0",
              "read_mode": "sqlite_readonly",
              "modification": "prohibited",
              "databases": report,
          }

          with open("artifacts/artifact_database_schema_probe.json", "w", encoding="utf-8") as f:
              json.dump(payload, f, indent=2, ensure_ascii=False)
          PY

      ############################################################
      # Artifact Inventory Evidence
      ############################################################

      - name: Artifact Inventory Evidence
        run: |
          find . -type f \
            > artifacts/repository_files.txt

          find . -type f \
            \( \
              -name "*.aff" -o \
              -name "*.sus" -o \
              -name "*.html" -o \
              -name "*.mht" \
            \) \
            | sort > artifacts/type_a_candidates_without_json.txt || true

          find . -type f \
            -name "*.json" \
            | sort > artifacts/json_inventory.txt || true

          find . -type f \
            \( \
              -name "*.mp4" -o \
              -name "*.mov" -o \
              -name "*.mkv" -o \
              -name "*.webm" -o \
              -name "*.url" -o \
              -name "*.webloc" \
            \) \
            | sort > artifacts/type_b_candidates.txt || true

          {
            echo "Artifact Inventory Evidence"
            echo ""
            echo "Repository files:"
            wc -l artifacts/repository_files.txt || true
            echo ""
            echo "Type A candidates excluding JSON:"
            wc -l artifacts/type_a_candidates_without_json.txt || true
            echo ""
            echo "JSON inventory:"
            wc -l artifacts/json_inventory.txt || true
            echo ""
            echo "Type B candidates:"
            wc -l artifacts/type_b_candidates.txt || true
          } > artifacts/artifact_inventory_summary.txt

      ############################################################
      # Asset Classification Evidence
      ############################################################

      - name: Asset Classification Evidence
        run: |
          grep "/translations/" \
            artifacts/json_inventory.txt \
            > artifacts/localization_json.txt || true

          grep "/schemas/" \
            artifacts/json_inventory.txt \
            > artifacts/schema_json.txt || true

          grep "/fixtures/" \
            artifacts/json_inventory.txt \
            > artifacts/fixture_json.txt || true

          grep "/registry/" \
            artifacts/json_inventory.txt \
            > artifacts/registry_json.txt || true

          grep "/artifacts/" \
            artifacts/json_inventory.txt \
            > artifacts/generated_artifact_json.txt || true

          grep "/.github/\|/.vscode/\|/tools/" \
            artifacts/json_inventory.txt \
            > artifacts/tooling_json.txt || true

          python - <<'PY'
          import json
          from pathlib import Path

          categories = {
              "localization": Path("artifacts/localization_json.txt"),
              "schema": Path("artifacts/schema_json.txt"),
              "fixture": Path("artifacts/fixture_json.txt"),
              "registry": Path("artifacts/registry_json.txt"),
              "generated_artifact": Path("artifacts/generated_artifact_json.txt"),
              "tooling": Path("artifacts/tooling_json.txt"),
          }

          payload = {
              "schema": "rga.asset_classification_evidence.v1.0",
              "categories": {},
          }

          for name, path in categories.items():
              if path.exists():
                  lines = [
                      line.strip()
                      for line in path.read_text(encoding="utf-8").splitlines()
                      if line.strip()
                  ]
              else:
                  lines = []

              payload["categories"][name] = {
                  "count": len(lines),
                  "examples": lines[:10],
              }

          with open("artifacts/asset_classification_summary.json", "w", encoding="utf-8") as f:
              json.dump(payload, f, indent=2, ensure_ascii=False)
          PY

      ############################################################
      # Asset Scope Evidence
      ############################################################

      - name: Asset Scope Evidence
        run: |
          find . -type f \
            \( \
              -path "*/chart_assets/*" -o \
              -path "*/charts/*" -o \
              -path "*/assets/*" -o \
              -path "*/ingestion_assets/*" \
            \) \
            | sort > artifacts/scoped_asset_candidates.txt || true

          find . -type f \
            \( \
              -path "*/.github/*" -o \
              -path "*/.vscode/*" -o \
              -path "*/docs/*" -o \
              -path "*/tools/*" -o \
              -path "*/artifacts/*" -o \
              -path "*/Phase 4 - Personalization/*" -o \
              -path "*/Phase 4.5 - Localization/*" -o \
              -path "*/Phase 5 - Productionization/*" -o \
              -path "*/Phase 6 - Hardening and Scaling/*" -o \
              -path "*/Phase 7 - Games Recommendation/*" \
            \) \
            | sort > artifacts/excluded_scope_candidates.txt || true

          {
            echo "Asset Scope Evidence"
            echo ""
            echo "Scoped asset candidates:"
            wc -l artifacts/scoped_asset_candidates.txt || true
            echo ""
            echo "Excluded scope candidates:"
            wc -l artifacts/excluded_scope_candidates.txt || true
          } > artifacts/asset_scope_summary.txt

      ############################################################
      # Artifact Relationship Evidence
      ############################################################

      - name: Artifact Relationship Evidence
        run: |
          {
            echo "Artifact relationship chain:"
            echo "file_scan_inventory.db -> chart_assets.db -> chart_patterns.db"
            echo ""
            echo "file_scan_inventory.db candidates:"
            cat artifacts/file_scan_inventory_db.txt || true
            echo ""
            echo "chart_assets.db candidates:"
            cat artifacts/chart_assets_db.txt || true
            echo ""
            echo "chart_patterns.db candidates:"
            cat artifacts/chart_patterns_db.txt || true
            echo ""
            echo "Root failure policy:"
            echo "artifact_database_policy is a root contract."
            echo ""
            echo "Derived failures when missing:"
            echo "- artifact_relationships"
            echo "- artifact_backbone_contract"
            echo "- asset_coverage"
            echo "- hash_integrity"
            echo "- type_A_usability"
            echo "- runtime_artifact_readiness"
          } > artifacts/artifact_chain_discovery.txt

      ############################################################
      # Hash Evidence
      ############################################################

      - name: Hash Inventory Evidence
        run: |
          find . -type f \
            ! -path "./.git/*" \
            ! -path "./artifacts/*" \
            -print0 \
            | sort -z \
            | xargs -0 sha256sum \
            > artifacts/repository_hashes.txt || true

          {
            echo "Hash Inventory Evidence"
            echo ""
            echo "Repository hash entries:"
            wc -l artifacts/repository_hashes.txt || true
          } > artifacts/hash_inventory_summary.txt

      ############################################################
      # Flow Verification Evidence
      ############################################################

      - name: Flow Verification Evidence
        run: |
          find . -type f \
            \( \
              -name "*recommend*.py" -o \
              -name "*tips*.py" -o \
              -name "*orchestrator*.py" -o \
              -name "*runtime*.py" -o \
              -name "*progression*.py" -o \
              -name "*chart*.py" -o \
              -name "*player*.py" \
            \) \
            | sort > artifacts/flow_candidates.txt || true

          grep -RIn \
            -e "chart" \
            -e "pattern" \
            -e "tips" \
            -e "player" \
            -e "progression" \
            -e "game" \
            -e "recommend" \
            engine \
            > artifacts/flow_keyword_hits.txt || true

      ############################################################
      # Layer Separation Evidence
      ############################################################

      - name: Layer Separation Evidence
        run: |
          ########################################################
          # Python inventory
          ########################################################

          find . -type f -name "*.py" \
            | sort \
            > artifacts/python_inventory.txt

          ########################################################
          # Layer directory inventory
          ########################################################

          find . -type d \
            \( \
              -iname "*model*" -o \
              -iname "*normalizer*" -o \
              -iname "*converter*" -o \
              -iname "*classifier*" -o \
              -iname "*validator*" -o \
              -iname "*reader*" -o \
              -iname "*writer*" -o \
              -iname "*bridge*" -o \
              -iname "*orchestrator*" \
            \) \
            | sort \
            > artifacts/layer_directories.txt || true

          ########################################################
          # Tier 1
          # Hint-level evidence
          #
          # Plain textual references.
          # NOT governance-blocking.
          ########################################################

          grep -RIn \
            -e "sqlite3" \
            -e ".writers" \
            -e ".writer" \
            -e ".persistence" \
            -e ".orchestrator" \
            -e ".orchestrators" \
            -e "recommendation_logic" \
            -e "runtime_mutation" \
            engine \
            > artifacts/layer_boundary_hints.txt || true

          ########################################################
          # Tier 2
          # Suspicion-level evidence
          #
          # Import-like references crossing layer boundaries.
          # Requires review but is not automatically a violation.
          ########################################################

          grep -RInE \
            '^[[:space:]]*import .*writer|^[[:space:]]*from .*writer' \
            engine \
            > artifacts/layer_boundary_writer_imports.txt || true

          grep -RInE \
            '^[[:space:]]*import .*persistence|^[[:space:]]*from .*persistence' \
            engine \
            > artifacts/layer_boundary_persistence_imports.txt || true

          grep -RInE \
            '^[[:space:]]*import .*orchestrator|^[[:space:]]*from .*orchestrator' \
            engine \
            > artifacts/layer_boundary_orchestrator_imports.txt || true

          cat \
            artifacts/layer_boundary_writer_imports.txt \
            artifacts/layer_boundary_persistence_imports.txt \
            artifacts/layer_boundary_orchestrator_imports.txt \
            > artifacts/layer_boundary_suspicions.txt || true

          ########################################################
          # Tier 3
          # Evidence-level signals
          #
          # Executable side effects.
          # Candidate governance blockers.
          ########################################################

          grep -RIn \
            -e ".commit(" \
            -e ".execute(" \
            -e ".executemany(" \
            engine \
            > artifacts/layer_boundary_db_operations.txt || true

          grep -RIn \
            -e "INSERT INTO" \
            -e "UPDATE " \
            -e "DELETE FROM" \
            -e "CREATE TABLE" \
            -e "DROP TABLE" \
            -e "ALTER TABLE" \
            engine \
            > artifacts/layer_boundary_sql_statements.txt || true

          grep -RIn \
            -e ".persist(" \
            -e ".save(" \
            -e ".write(" \
            engine \
            > artifacts/layer_boundary_write_operations.txt || true

          cat \
            artifacts/layer_boundary_db_operations.txt \
            artifacts/layer_boundary_sql_statements.txt \
            artifacts/layer_boundary_write_operations.txt \
            > artifacts/layer_boundary_evidence.txt || true

          ########################################################
          # Tier summary
          ########################################################

          {
            echo "Layer Boundary Evidence Summary"
            echo ""
            echo "Confidence Model"
            echo "---------------"
            echo "hint"
            echo "suspicion"
            echo "evidence"
            echo ""
            echo "Generated Files"
            echo "---------------"
            echo "layer_boundary_hints.txt"
            echo "layer_boundary_suspicions.txt"
            echo "layer_boundary_evidence.txt"
            echo ""
            echo "Governance Policy"
            echo "-----------------"
            echo "Hints do not block governance."
            echo "Suspicions require review."
            echo "Only evidence-level findings may block governance."
          } > artifacts/layer_boundary_summary.txt

      ############################################################
      # MCP Evidence
      ############################################################

      - name: MCP Evidence
        run: |
          find . -type f -name "mcp.json" \
            | sort > artifacts/mcp_configs.txt || true

          find . -type f -name "mcp_server.py" \
            | sort > artifacts/mcp_server_candidates_v1.txt || true

          if [ -f ".vscode/mcp.json" ]; then
            cp .vscode/mcp.json artifacts/mcp_config_effective.json
          fi

      ############################################################
      # REST / Runtime Surface Evidence
      ############################################################

      - name: Runtime Surface Evidence
        run: |
          find . -type f \
            \( \
              -name "app.py" -o \
              -name "recommend.py" -o \
              -name "main.py" \
            \) \
            | sort > artifacts/runtime_surface_candidates.txt || true

          grep -RIn \
            -e "@app" \
            -e "APIRouter" \
            -e "FastAPI" \
            -e "recommend" \
            engine \
            > artifacts/runtime_surface_keyword_hits.txt || true

      ############################################################
      # Runtime DB Read Evidence
      ############################################################

      - name: Runtime DB Read Evidence
        run: |
          find . -type f \
            \( \
              -name "file_scan_inventory.db" -o \
              -name "chart_assets.db" -o \
              -name "chart_patterns.db" \
            \) \
            | sort > artifacts/runtime_db_candidates.txt || true

          find . -type f \
            \( \
              -iname "*reader*.py" -o \
              -iname "*readers*.py" \
            \) \
            | sort > artifacts/runtime_reader_candidates.txt || true

      ############################################################
      # Governance Evidence
      ############################################################

      - name: Governance Evidence
        run: |
          {
            echo "RGA Governance Context"
            echo ""

            echo "Verifier Mode: read-only"
            echo "Completed Phases: immutable"
            echo "Default Deletion Policy: blocked"
            echo ""

            echo "Governance Principles"
            echo "---------------------"
            echo "Validation != Verification"
            echo "Dependency Reality != Governance"
            echo "Runtime Reality != Governance"
            echo "Hint != Suspicion != Evidence"
            echo ""

            echo "Dependency failures should not automatically become governance blockers."
            echo ""

            echo "Artifact Backbone Contracts"
            echo "---------------------------"
            echo "file_scan_inventory.db"
            echo "chart_assets.db"
            echo "chart_patterns.db"
            echo ""

            echo "Relationship Chain"
            echo "file_scan_inventory.db -> chart_assets.db -> chart_patterns.db"
            echo ""

            echo "Deletion Policy"
            echo "---------------"
            echo "No deletion permitted until:"
            echo "artifact coverage passes"
            echo "hash verification passes"
            echo "type_A usability passes"
            echo "runtime DB readiness passes"
          } > artifacts/governance_context.txt

      ############################################################
      # Run Verifier
      ############################################################

      - name: Run RGA Runtime Verifier
        id: run_verifier
        continue-on-error: true
        run: |
          set +e

          python tools/runtime_verifier.py \
            --repo-root . \
            --mcp-config .vscode/mcp.json \
            --json-out artifacts/runtime_verifier_report.json \
            --md-out artifacts/runtime_verifier_report.md \
            > artifacts/runtime_verifier_stdout.txt \
            2> artifacts/runtime_verifier_stderr.txt

          verifier_exit_code=$?

          echo "${verifier_exit_code}" > artifacts/runtime_verifier_exit_code.txt
          echo "verifier_exit_code=${verifier_exit_code}" >> "$GITHUB_OUTPUT"

          echo "RGA Runtime Verifier exited with code: ${verifier_exit_code}"

          if [ -f artifacts/runtime_verifier_stderr.txt ]; then
            echo ""
            echo "---- verifier stderr preview ----"
            head -n 80 artifacts/runtime_verifier_stderr.txt || true
          fi

          if [ -f artifacts/runtime_verifier_stdout.txt ]; then
            echo ""
            echo "---- verifier stdout preview ----"
            head -n 80 artifacts/runtime_verifier_stdout.txt || true
          fi

          exit 0

      ############################################################
      # Optional Summary
      ############################################################

      - name: Runtime Verifier Job Summary
        if: always()
        run: |
          {
            echo "## RGA Runtime Verifier"
            echo ""
            echo "- Report: \`artifacts/runtime_verifier_report.md\`"
            echo "- JSON: \`artifacts/runtime_verifier_report.json\`"
            echo "- Evidence bundle: \`artifacts/\`"
            echo ""
            if [ -f artifacts/runtime_verifier_report.md ]; then
              echo "### Report Preview"
              echo ""
              head -n 80 artifacts/runtime_verifier_report.md
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      ############################################################
      # Upload Artifact Bundle
      ############################################################

      - name: Upload Runtime Verifier Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: runtime-verifier-report
          path: artifacts/
          if-no-files-found: warn
