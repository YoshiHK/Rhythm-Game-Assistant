name: Deployment Governance Gate

on:
  workflow_dispatch:
    inputs:

      audit_session_id:
        description: Lifecycle session identifier.
        required: true
        default: ""

      lifecycle_stage:
        description: Expected lifecycle stage.
        required: true
        default: governance_gate

      triggering_run_id:
        description: Lifecycle Runner run ID.
        required: true
        default: ""

      ref:
        description: Git ref, branch, or SHA.
        required: false
        default: main

permissions:
  contents: read
  actions: read

concurrency:
  group: deployment-governance-gate-${{ github.event.inputs.audit_session_id || github.ref }}
  cancel-in-progress: true

jobs:
  deployment-governance-gate:

    if: >
      github.event_name == 'workflow_dispatch' &&
      github.event.inputs.lifecycle_stage == 'governance_gate'

    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Create venv
        shell: pwsh
        run: |
          python -m venv .venv
          .\.venv\Scripts\python.exe -m pip install --upgrade pip
          .\.venv\Scripts\python.exe -m pip install pyyaml
          
      - name: Verify GitHub CLI
        shell: pwsh
        run: |
          gh --version     

      ############################################################
      # Generate GitHub App Token
      ############################################################

      - name: Generate GitHub App Token
        id: generate-app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.RGA_APP_ID }}
          private-key: ${{ secrets.RGA_APP_PRIVATE_KEY }}          

      ############################################################
      # Download Lifecycle Runner Artifacts
      ############################################################

      - name: Download Lifecycle Runner Artifacts
        shell: pwsh
        env:
          GH_TOKEN: ${{ steps.generate-app-token.outputs.token }}
          RUN_ID: ${{ github.event.inputs.triggering_run_id }}
          GH_OWNER_REPO: ${{ github.repository }}
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host ""
          Write-Host "[GOVERNANCE-GATE] Diagnostics"
          Write-Host "  RUN_ID=$env:RUN_ID"
          Write-Host "  GH_OWNER_REPO=$env:GH_OWNER_REPO"

          if ($null -eq $env:RUN_ID -or $env:RUN_ID.Trim() -eq "") {
            throw "triggering_run_id input is required."
          }

          if ($null -eq $env:GH_OWNER_REPO -or $env:GH_OWNER_REPO.Trim() -eq "") {
            throw "GH_OWNER_REPO is required."
          }

          New-Item -ItemType Directory -Force -Path ".\artifacts" | Out-Null

          gh run download $env:RUN_ID `
            -R $env:GH_OWNER_REPO `
            -n rga-lifecycle-event `
            -D ".\artifacts\rga-lifecycle-event"

          gh run download $env:RUN_ID `
            -R $env:GH_OWNER_REPO `
            -n rga-lifecycle-state `
            -D ".\artifacts\rga-lifecycle-state" `
            2>$null

          gh run download $env:RUN_ID `
            -R $env:GH_OWNER_REPO `
            -n rga-stage-trace `
            -D ".\artifacts\rga-stage-trace" `
            2>$null

          gh run download $env:RUN_ID `
            -R $env:GH_OWNER_REPO `
            -n rga-contract-trace `
            -D ".\artifacts\rga-contract-trace" `
            2>$null

          gh run download $env:RUN_ID `
            -R $env:GH_OWNER_REPO `
            -n rga-lifecycle-dispatch-result `
            -D ".\artifacts\rga-lifecycle-dispatch-result" `
            2>$null

          Write-Host ""
          Write-Host "[GOVERNANCE-GATE] Download complete."

      ############################################################
      # Verify Downloaded Artifacts
      ############################################################

      - name: Verify Downloaded Artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path .\artifacts | Out-Null
          
          Write-Host "[GOVERNANCE-GATE] Downloaded artifacts in .\artifacts :"
          $files = Get-ChildItem .\artifacts -Recurse -File
          if ($files) {
              $files | Select-Object FullName
          } else {
              Write-Host "[GOVERNANCE-GATE][WARN] No artifacts found in .\artifacts"
          }

      # --------------------------------------------------
      # Governance Artifact Inventory
      #
      # Discovery only.
      # --------------------------------------------------
      - name: Governance Artifact Inventory
        shell: pwsh
        run: |
          $InventoryPath = ".\artifacts\governance_artifact_inventory.txt"

          Write-Host ""
          Write-Host "[GOVERNANCE-GATE] Artifact Inventory"
          Write-Host "----------------------------------------"

          $files = Get-ChildItem .\artifacts -Recurse -File -ErrorAction SilentlyContinue | Sort-Object FullName

          if (-not $files) {
            Write-Host "[GOVERNANCE-GATE][WARN] No artifacts found."
            "No governance artifacts discovered." | Set-Content $InventoryPath -Encoding UTF8
            exit 0
          }

          $lines = @()
          foreach ($file in $files) {
            $line = $file.FullName
            Write-Host $line
            $lines += $line
          }

          $lines | Set-Content $InventoryPath -Encoding UTF8
          Write-Host "----------------------------------------"
          Write-Host ""
          Write-Host "[GOVERNANCE-GATE] Inventory written: $InventoryPath"

      ############################################################
      # Lifecycle Event Validation
      ############################################################

      - name: Lifecycle Event Validation
        shell: pwsh
        run: |

          $preferred = ".\artifacts\rga-lifecycle-event\lifecycle_event.json"

          if (Test-Path $preferred) {
            $event = Get-Item $preferred
          }
          else {
            $event = Get-ChildItem ".\artifacts" `
              -Recurse `
              -Filter "lifecycle_event.json" `
              -ErrorAction SilentlyContinue |
                Where-Object { $_.FullName -notmatch "historic_" } |
                Sort-Object LastWriteTime |
                Select-Object -Last 1
          }

          if (-not $event) {
            throw "lifecycle_event.json not found in downloaded Lifecycle Runner artifacts."
          }

          Write-Host ""
          Write-Host "[GOVERNANCE-GATE] Validating:"
          Write-Host "  $($event.FullName)"

          $json = Get-Content $event.FullName -Raw | ConvertFrom-Json

          ########################################################
          # Schema Validation
          ########################################################

          $allowedSchemas = @(
            "rga.lifecycle_event.v1.0",
            "rga.lifecycle_event.v1.1",
            "rga.lifecycle_event.v1.2"
          )

          if ($allowedSchemas -notcontains $json.schema) {
            throw "Unsupported lifecycle event schema: '$($json.schema)'"
          }

          ########################################################
          # Field Extraction & Normalization
          ########################################################

          # Extract completed_stage with fallbacks for alternative schema keys
          $completed = if ($json.PSObject.Properties.Name.Contains("completed_stage")) {
            [string]$json.completed_stage
          } elseif ($json.PSObject.Properties.Name.Contains("stage_completed")) {
            [string]$json.stage_completed
          } elseif ($json.PSObject.Properties.Name.Contains("stage")) {
            [string]$json.stage
          } elseif ($json.PSObject.Properties.Name.Contains("current_stage")) {
            [string]$json.current_stage
          } else {
            "unknown"
          }

          # Extract next_stage with fallbacks
          $next = if ($json.PSObject.Properties.Name.Contains("next_stage")) {
            [string]$json.next_stage
          } elseif ($json.PSObject.Properties.Name.Contains("target_stage")) {
            [string]$json.target_stage
          } else {
            $null
          }

          # Extract dispatch_required flag safely
          $dispatchRequired = if ($json.PSObject.Properties.Name.Contains("dispatch_required")) {
            $json.dispatch_required
          } elseif ($json.PSObject.Properties.Name.Contains("dispatch_performed")) {
            $json.dispatch_performed
          } else {
            $false
          }

          # Ensure essential stage fields were successfully resolved
          if ($completed -eq "unknown") {
            throw "Missing required lifecycle stage information in payload. Raw payload: $(Get-Content $event.FullName -Raw)"
          }

          ########################################################
          # Governance Flow Validation
          ########################################################

          # Transition Acceptance Check
          if (
            ($completed -eq "post_audit" -and $next -eq "governance_gate") -or
            ($completed -eq "governance_gate" -and ($next -eq "complete" -or $null -eq $next -or $next -eq "")) -or
            ($completed -eq "governance_gate" -and $json.source -eq "lifecycle_runner") -or
            ($completed -eq "post_audit" -and $json.source -eq "lifecycle_runner") -or
            ($completed -ne "unknown")
          ) {
            Write-Host ""
            Write-Host "[GOVERNANCE-GATE] Transition accepted."
          }
          else {
            throw "Unexpected lifecycle transition. completed_stage='$completed' next_stage='$next' (schema: '$($json.schema)', source: '$($json.source)')"
          }

          Write-Host ""
          Write-Host "[GOVERNANCE-GATE] [OK]"
          Write-Host "  schema            : $($json.schema)"
          Write-Host "  completed_stage   : $completed"
          Write-Host "  next_stage        : $next"
          Write-Host "  dispatch_required : $dispatchRequired"
          
      ############################################################
      # Check Post-Audit Trigger
      ############################################################
          
      - name: Check Post-Audit Trigger
        id: post_audit
        shell: pwsh
        run: |
          $event = Get-ChildItem .\artifacts -Recurse -Filter "lifecycle_event.json" -ErrorAction SilentlyContinue |
            Where-Object { $_.FullName -notmatch "historic_" } |
            Sort-Object LastWriteTime |
            Select-Object -Last 1

          if (-not $event) {
            Write-Host "[GOVERNANCE-GATE] lifecycle_event.json not found."
            "should_run=false" >> $env:GITHUB_OUTPUT
            exit 0
          }

          $json = Get-Content $event.FullName -Raw | ConvertFrom-Json

          Write-Host "[GOVERNANCE-GATE] completed_stage=$($json.completed_stage)"
          Write-Host "[GOVERNANCE-GATE] next_stage=$($json.next_stage)"

          if ($json.completed_stage -eq "post_audit" -or $json.next_stage -eq "complete") {
            "should_run=true" >> $env:GITHUB_OUTPUT
          }
          else {
            "should_run=false" >> $env:GITHUB_OUTPUT
          }

      # --------------------------------------------------
      # Governance Preconditions
      # --------------------------------------------------
      - name: Governance Preconditions
        id: governance_preconditions
        shell: pwsh
        run: |
          $ShouldRun = "${{ steps.post_audit.outputs.should_run }}"

          Write-Host ""
          Write-Host "[GOVERNANCE-GATE] should_run=$ShouldRun"

          if ($ShouldRun -eq "true") {
            Write-Host ""
            Write-Host "[GOVERNANCE-GATE] Preconditions satisfied."
            Write-Host "[GOVERNANCE-GATE] Governance aggregation enabled."
            "governance_enabled=true" >> $env:GITHUB_OUTPUT
          }
          else {
            Write-Host ""
            Write-Host "[GOVERNANCE-GATE] Preconditions not satisfied."
            Write-Host "[GOVERNANCE-GATE] Current lifecycle has not reached post_audit."
            Write-Host "[GOVERNANCE-GATE] Governance aggregation skipped."
            "governance_enabled=false" >> $env:GITHUB_OUTPUT
          }   

      - name: Run Deployment Governance Gate
        if: ${{ steps.governance_preconditions.outputs.governance_enabled == 'true' }}
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $args = @(
            ".\deployment_gate.py",
            "--output",
            ".\deployment_gate_report.json",
            "--governance-mode"
          )

          # Policy
          if (Test-Path ".\config\policy.yml") {
            $args += "--policy-config"
            $args += ".\config\policy.yml"
          }
          elseif (Test-Path ".\config\policy.yaml") {
            $args += "--policy-config"
            $args += ".\config\policy.yaml"
          }

          # Operational Reports
          $RepoSmoke = Get-ChildItem .\artifacts -Recurse -Filter "repo_smoke_summary.json" -ErrorAction SilentlyContinue | Select-Object -Last 1
          if ($RepoSmoke) {
            $args += "--repo-smoke-summary"
            $args += $RepoSmoke.FullName
          }

          $Phase5 = Get-ChildItem .\artifacts -Recurse -Filter "test_case_summary.json" -ErrorAction SilentlyContinue | Select-Object -Last 1
          if ($Phase5) {
            $args += "--phase5-summary"
            $args += $Phase5.FullName
          }

          $OfflineVal = Get-ChildItem .\artifacts -Recurse -Filter "offline_validation_report.json" -ErrorAction SilentlyContinue | Select-Object -Last 1
          if ($OfflineVal) {
            $args += "--offline-validation-report"
            $args += $OfflineVal.FullName
          }

          # Governance Contracts
          $contracts = [ordered]@{
            "--runtime-baseline"                = "runtime_baseline.json"
            "--database-mutation-plan"          = "database_mutation_plan.json"
            "--persistence-contract"            = "persistence_contract.json"
            "--runtime-verification-contract"   = "runtime_verification_contract.json"
            "--runtime-verification-acceptance" = "runtime_verification_acceptance.json"
            "--runtime-certification"           = "runtime_certification.json"
            "--path-a-operational"              = "path_a_operational.json"
          }

          foreach ($arg in $contracts.Keys) {
            $targetPattern = $contracts[$arg]
            $file = Get-ChildItem .\artifacts -Recurse -Filter $targetPattern -ErrorAction SilentlyContinue | Sort-Object LastWriteTime | Select-Object -Last 1

            if (-not $file) {
              $file = Get-ChildItem . -Filter $targetPattern -ErrorAction SilentlyContinue | Sort-Object LastWriteTime | Select-Object -Last 1
            }

            if ($file) {
              $args += $arg
              $args += $file.FullName
              Write-Host "[GOVERNANCE-GATE][INFO] Attached artifact for $arg : $($file.FullName)"
            }
            else {
              Write-Host "[GOVERNANCE-GATE][WARN] Missing artifact for $arg ($($contracts[$arg]))"
            }
          }

          # Optional runtime_index
          $RuntimeIndex = Get-ChildItem .\artifacts -Recurse -Filter "runtime_index.json" -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($RuntimeIndex) {
            $args += "--runtime-index"
            $args += $RuntimeIndex.FullName
            $args += "--require-runtime-index"
          }

          # Diagnostics & Execution
          Write-Host ""
          Write-Host "[GOVERNANCE-GATE] Arguments"
          Write-Host "----------------------------------------"
          $args | ForEach-Object { Write-Host "  $_" }
          Write-Host "----------------------------------------"

          & .\.venv\Scripts\python.exe @args

      # --------------------------------------------------
      # Upload Deployment Governance Gate Report
      # --------------------------------------------------
      - name: Upload Deployment Governance Gate Report
        if: >
          always() &&
          steps.governance_preconditions.outputs.governance_enabled == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: deployment-governance-gate-report
          path: |
            deployment_gate_report.json
            artifacts/governance_artifact_inventory.txt
            artifacts/**/runtime_baseline.json
            artifacts/**/database_mutation_plan.json
            artifacts/**/persistence_contract.json
            artifacts/**/runtime_verification_contract.json
            artifacts/**/runtime_verification_acceptance.json
            artifacts/**/runtime_certification.json
            artifacts/**/path_a_operational.json
            artifacts/**/runtime_index.json
            artifacts/**/lifecycle_event.json
          if-no-files-found: warn
