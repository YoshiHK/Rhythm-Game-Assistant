name: Deployment Governance Gate

on:
  workflow_run:
    workflows:
      - RGA Runtime Auditor
    types:
      - completed

permissions:
  contents: read
  actions: read

jobs:
  deployment-governance-gate:
  
    if: >
      github.event.workflow_run.conclusion == 'success'
    
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Create venv
        shell: pwsh
        run: |
          python -m venv .venv
          .\.venv\Scripts\python.exe -m pip install --upgrade pip
          .\.venv\Scripts\python.exe -m pip install pyyaml
          
      - name: Verify GitHub CLI
        shell: pwsh
        run: |
          gh --version         

      - name: Download Triggering Runtime Auditor Artifacts
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          New-Item -ItemType Directory -Force -Path .\artifacts | Out-Null

          # Download all artifacts attached to the triggering workflow run
          gh run download $env:RUN_ID --dir .\artifacts

          # Optional: If offline_validation_report or repo_smoke_summary are uploaded
          # under separate jobs or runs, download them into .\artifacts as well
          Write-Host "[GOVERNANCE-GATE] downloaded artifacts:"
          Get-ChildItem .\artifacts -Recurse -File | Select-Object FullName


      # --------------------------------------------------
      # Governance Artifact Inventory
      #
      # Discovery only.
      #
      # Presence
      # !=
      # Validation
      #
      # Generates:
      #   governance_artifact_inventory.txt
      # --------------------------------------------------
      - name: Governance Artifact Inventory
        shell: pwsh
        run: |
          $InventoryPath =
            ".\artifacts\governance_artifact_inventory.txt"

          Write-Host ""
          Write-Host "[GOVERNANCE-GATE] Artifact Inventory"
          Write-Host "----------------------------------------"

          $files = Get-ChildItem `
            .\artifacts `
            -Recurse `
            -File `
            -ErrorAction SilentlyContinue |
            Sort-Object FullName

          if (-not $files) {

            Write-Host `
              "[GOVERNANCE-GATE][WARN] No artifacts found."

            "No governance artifacts discovered." |
              Set-Content `
                $InventoryPath `
                -Encoding UTF8

            exit 0
          }

          $lines = @()

          foreach ($file in $files) {

            $line = $file.FullName

            Write-Host $line

            $lines += $line
          }

          $lines |
            Set-Content `
              $InventoryPath `
              -Encoding UTF8

          Write-Host "----------------------------------------"
          Write-Host ""
          Write-Host `
            "[GOVERNANCE-GATE] Inventory written: $InventoryPath"

      - name: Lifecycle Event Validation
        shell: pwsh
        run: |
          $event = Get-ChildItem `
            .\artifacts `
            -Recurse `
            -Filter "lifecycle_event.json" `
            -ErrorAction SilentlyContinue |
            Sort-Object LastWriteTime |
            Select-Object -Last 1

          if (-not $event) {
            throw "lifecycle_event.json not found."
          }

          $json = Get-Content `
            $event.FullName `
            -Raw |
            ConvertFrom-Json

          # ----------------------------------------------
          # Schema validation
          # ----------------------------------------------

          if (
            $json.schema -ne
            "rga.lifecycle_event.v1.0"
          ) {
            throw (
              "Unsupported lifecycle event schema: " +
              [string]$json.schema
            )
          }

          # ----------------------------------------------
          # Required fields
          # ----------------------------------------------

          $required = @(
            "audit_mode",
            "completed_stage",
            "next_stage",
            "dispatch_required"
          )

          foreach ($field in $required) {

            if (
              -not $json.PSObject.Properties.Name.Contains(
                $field
              )
            ) {
              throw (
                "Missing lifecycle event field: " +
                $field
              )
            }
          }

          Write-Host ""
          Write-Host "[GOVERNANCE-GATE] lifecycle event validated"
          Write-Host "schema=$($json.schema)"
          Write-Host "audit_mode=$($json.audit_mode)"
          Write-Host "completed_stage=$($json.completed_stage)"
          Write-Host "next_stage=$($json.next_stage)"            
          
      - name: Check Post-Audit Trigger
        id: post_audit
        shell: pwsh
        run: |
          $event = Get-ChildItem .\artifacts `
            -Recurse `
            -Filter "lifecycle_event.json" `
            -ErrorAction SilentlyContinue |
            Sort-Object LastWriteTime |
            Select-Object -Last 1

          if (-not $event) {
            Write-Host "[GOVERNANCE-GATE] lifecycle_event.json not found."
            "should_run=false" >> $env:GITHUB_OUTPUT
            exit 0
          }

          $json = Get-Content $event.FullName -Raw | ConvertFrom-Json

          Write-Host "[GOVERNANCE-GATE] completed_stage=$($json.completed_stage)"
          Write-Host "[GOVERNANCE-GATE] next_stage=$($json.next_stage)"

          if ($json.completed_stage -eq "post_audit" -or $json.next_stage -eq "complete") {
            "should_run=true" >> $env:GITHUB_OUTPUT
          }
          else {
            "should_run=false" >> $env:GITHUB_OUTPUT
          }          
          
      # --------------------------------------------------
      # Governance Preconditions
      #
      # Deployment Governance Gate should only run
      # after post_audit has completed.
      # --------------------------------------------------
      - name: Governance Preconditions
        id: governance_preconditions
        shell: pwsh
        run: |
          $ShouldRun =
            "${{ steps.post_audit.outputs.should_run }}"

          Write-Host ""
          Write-Host "[GOVERNANCE-GATE] should_run=$ShouldRun"

          if ($ShouldRun -eq "true") {

            Write-Host ""
            Write-Host "[GOVERNANCE-GATE] Preconditions satisfied."
            Write-Host "[GOVERNANCE-GATE] Governance aggregation enabled."

            "governance_enabled=true" `
              >> $env:GITHUB_OUTPUT

          }
          else {

            Write-Host ""
            Write-Host "[GOVERNANCE-GATE] Preconditions not satisfied."
            Write-Host "[GOVERNANCE-GATE] Current lifecycle has not reached post_audit."
            Write-Host "[GOVERNANCE-GATE] Governance aggregation skipped."

            "governance_enabled=false" `
              >> $env:GITHUB_OUTPUT

          }   

      - name: Run Deployment Governance Gate
        if: ${{ steps.governance_preconditions.outputs.governance_enabled == 'true' }}
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $args = @(
            ".\deployment_gate.py",
            "--output",
            ".\deployment_gate_report.json"
          )

          # --------------------------------------------------
          # Policy
          # --------------------------------------------------
          if (Test-Path ".\config\policy.yml") {
            $args += "--policy-config"
            $args += ".\config\policy.yml"
          }
          elseif (Test-Path ".\config\policy.yaml") {
            $args += "--policy-config"
            $args += ".\config\policy.yaml"
          }

          # --------------------------------------------------
          # Operational Reports (Search in artifacts directory)
          # --------------------------------------------------
          $RepoSmoke = Get-ChildItem .\artifacts -Recurse -Filter "repo_smoke_summary.json" -ErrorAction SilentlyContinue | Select-Object -Last 1
          if ($RepoSmoke) {
            $args += "--repo-smoke-summary"
            $args += $RepoSmoke.FullName
          }

          $Phase5 = Get-ChildItem .\artifacts -Recurse -Filter "test_case_summary.json" -ErrorAction SilentlyContinue | Select-Object -Last 1
          if ($Phase5) {
            $args += "--phase5-summary"
            $args += $Phase5.FullName
          }

          $OfflineVal = Get-ChildItem .\artifacts -Recurse -Filter "offline_validation_report.json" -ErrorAction SilentlyContinue | Select-Object -Last 1
          if ($OfflineVal) {
            $args += "--offline-validation-report"
            $args += $OfflineVal.FullName
          }

          # --------------------------------------------------
          # Governance Contracts (Stages 1-8)
          # --------------------------------------------------
          $contracts = [ordered]@{
            # Stage 1-4 Contracts
            "--runtime-baseline"                = "runtime_baseline.json"
            "--database-mutation-plan"          = "database_mutation_plan.json"
            "--persistence-contract"            = "persistence_contract.json"
            
            # Stage 5-8 Contracts
            "--runtime-verification-contract"   = "runtime_verification_contract.json"
            "--runtime-verification-acceptance" = "runtime_verification_acceptance.json"
            "--runtime-certification"           = "runtime_certification.json"
            "--path-a-operational"              = "path_a_operational.json"
          }

          foreach ($arg in $contracts.Keys) {
            $file = Get-ChildItem .\artifacts -Recurse -Filter $contracts[$arg] -ErrorAction SilentlyContinue | Sort-Object LastWriteTime | Select-Object -Last 1
            if ($file) {
              $args += $arg
              $args += $file.FullName
              Write-Host "[GOVERNANCE-GATE][INFO] Attached artifact for $arg : $($file.FullName)"
            }
            else {
              Write-Host "[GOVERNANCE-GATE][WARN] Missing artifact for $arg ($($contracts[$arg]))"
            }
          }

          # --------------------------------------------------
          # Optional runtime_index
          # --------------------------------------------------
          $RuntimeIndex = Get-ChildItem .\artifacts -Recurse -Filter "runtime_index.json" -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($RuntimeIndex) {
            $args += "--runtime-index"
            $args += $RuntimeIndex.FullName
            $args += "--require-runtime-index"
          }

          # Diagnostics & Execution
          Write-Host ""
          Write-Host "[GOVERNANCE-GATE] Arguments"
          Write-Host "----------------------------------------"
          $args | ForEach-Object { Write-Host "  $_" }
          Write-Host "----------------------------------------"

          & .\.venv\Scripts\python.exe @args

      # --------------------------------------------------
      # Upload Deployment Governance Gate Report
      # --------------------------------------------------
      - name: Upload Deployment Governance Gate Report
        if: >
          always() &&
          steps.governance_preconditions.outputs.governance_enabled == 'true'
        uses: actions/upload-artifact@v4

        with:
          name: deployment-governance-gate-report

          path: |
            deployment_gate_report.json
            artifacts/governance_artifact_inventory.txt
            artifacts/runtime_baseline.json
            artifacts/database_mutation_plan.json
            artifacts/persistence_contract.json
            artifacts/runtime_verification_contract.json
            artifacts/runtime_verification_acceptance.json
            artifacts/runtime_certification.json
            artifacts/path_a_operational.json
            artifacts/runtime_index.json
            artifacts/lifecycle_event.json

          if-no-files-found: warn    
