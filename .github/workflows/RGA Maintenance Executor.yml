                  "policy_violations":
                      [],

                  "post_audit_required":
                      True,

                  "note":
                      "No apply_execution_result was emitted by runtime_executor.py."
              }

          apply_path.write_text(
              json.dumps(
                  result,
                  indent=2,
                  ensure_ascii=False,
              ),
              encoding="utf-8",
          )
          PY
          
