              "audit_mode":
                  "post_audit",

              "required":
                  post_audit_required,

              "execution_performed":
                  execution_performed,

              "trigger_source":
                  "Bot #2 execution",

              "recommended_workflow":
                  "RGA Runtime Auditor",

              "governance_note": (
                  "Post-audit should be run by Bot #1 after any "
