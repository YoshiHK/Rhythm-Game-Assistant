      ############################################################
      # Create Execution Branch and Commit
      ############################################################

      - name: Create Execution Branch and Commit
        if: ${{ always() && inputs.executor_mode == 'execute' }}
        run: |
          set +e

          python - <<'PY'
          import json
          from pathlib import Path

          manifest_file = Path(
              "artifacts/execution_commit_manifest.json"
          )

          result = {
              "schema":
                  "rga.execution_git_commit_result.v1.0",

              "commit_attempted":
                  False,

              "commit_created":
                  False,

              "branch_name":
                  "maintenance/executor-generated",

              "commit_message":
                  "[RGA Executor] Apply approved maintenance execution",

              "reason":
                  None,
          }

          if manifest_file.exists():
              data = json.loads(
                  manifest_file.read_text(
                      encoding="utf-8"
                  )
              )

              result["commit_attempted"] = bool(
                  data.get(
                      "commit_required",
                      False
                  )
              )

              result["branch_name"] = data.get(
                  "branch_name",
                  result["branch_name"]
              )

              result["commit_message"] = data.get(
                  "commit_message",
                  result["commit_message"]
              )

              if not data.get("commit_required", False):
                  result["reason"] = "Commit not required."

              if data.get("policy_violations"):
                  result["reason"] = "Commit blocked by policy violations."

          else:
              result["reason"] = "execution_commit_manifest.json not found."

          Path(
              "artifacts/execution_git_commit_result.json"
          ).write_text(
              json.dumps(
                  result,
                  indent=2,
                  ensure_ascii=False,
              ),
              encoding="utf-8",
          )
          PY

          commit_required=$(python - <<'PY'
          import json
          from pathlib import Path

          p = Path("artifacts/execution_commit_manifest.json")

          if not p.exists():
              print("false")
          else:
              data = json.loads(p.read_text(encoding="utf-8"))
              if data.get("commit_required") and not data.get("policy_violations"):
                  print("true")
              else:
                  print("false")
          PY
          )

          if [ "$commit_required" != "true" ]; then
            echo "No commit required or commit blocked by policy."
            exit 0
          fi

          branch_name=$(python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path("artifacts/execution_commit_manifest.json").read_text(encoding="utf-8"))
          print(data.get("branch_name", "maintenance/executor-generated"))
          PY
          )

          commit_message=$(python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path("artifacts/execution_commit_manifest.json").read_text(encoding="utf-8"))
          print(data.get("commit_message", "[RGA Executor] Apply approved maintenance execution"))
          PY
          )

          git config user.name "rga-executor-bot"
          git config user.email "rga-executor-bot@users.noreply.github.com"

          git checkout -B "$branch_name"

          git add tools artifacts .github/workflows docs 2>/dev/null || true

          if git diff --cached --quiet; then
            echo "No staged changes."
            exit 0
          fi

          git commit -m "$commit_message"

          git push --set-upstream origin "$branch_name"

          python - <<'PY'
          import json
          from pathlib import Path

          p = Path("artifacts/execution_git_commit_result.json")
          data = json.loads(p.read_text(encoding="utf-8"))

          data["commit_created"] = True
          data["reason"] = "Commit created and branch pushed."

          p.write_text(
              json.dumps(data, indent=2, ensure_ascii=False),
              encoding="utf-8",
          )
          PY

      ############################################################
      # Create Pull Request Candidate
      #
      # Bot #2 execute mode:
      #
      #   - Creates a PR only when execution_pull_request_candidate.json
      #     says pull_request_required=true.
      #
      #   - Records the result in:
      #
      #       artifacts/execution_pull_request_result.json
      #
      #   - Does not approve or merge the PR.
      #
      #   - Human review remains required.
      ############################################################

      - name: Create Pull Request Candidate
        if: ${{ always() && inputs.executor_mode == 'execute' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set +e

          mkdir -p artifacts

          cat > artifacts/create_pull_request_candidate.py <<'PY'
          import json
          import os
          import subprocess
          from datetime import datetime, timezone
          from pathlib import Path

          candidate_file = Path(
              "artifacts/execution_pull_request_candidate.json"
          )

          url_file = Path(
              "artifacts/execution_pull_request_url.txt"
          )

          stderr_file = Path(
              "artifacts/execution_pull_request_stderr.txt"
          )

          result_file = Path(
              "artifacts/execution_pull_request_result.json"
          )

          payload = {
              "schema":
                  "rga.execution_pull_request_result.v1.1",

              "generated_at":
                  datetime.now(
                      timezone.utc
                  ).replace(
                      microsecond=0
                  ).isoformat(),

              "pull_request_attempted":
                  False,

              "pull_request_created":
                  False,

               "reason": 
                  "Draft PR candidate prepared."   

              "pull_request_url":
                  None,

              "branch_name":
                  None,

              "base_branch":
                  os.environ.get(
                      "BASE_BRANCH",
                      "main",
                  ),

              "return_code":
                  None,

              "stderr":
                  None,

              "reason":
                  None,

              "post_audit_required":
                  True,

              "human_review_required":
                  True,

              "bot_2_may_approve":
                  False,

              "bot_2_may_merge":
                  False,
          }

          try:
              if not candidate_file.exists():
                  payload[
                      "reason"
                  ] = (
                      "execution_pull_request_candidate.json not found."
                  )

                  result_file.write_text(
                      json.dumps(
                          payload,
                          indent=2,
                          ensure_ascii=False,
                      ),
                      encoding="utf-8",
                  )

                  raise SystemExit(0)

              candidate = json.loads(
                  candidate_file.read_text(
                      encoding="utf-8",
                      errors="ignore",
                  )
              )

              if not isinstance(
                  candidate,
                  dict,
              ):
                  payload[
                      "reason"
                  ] = (
                      "execution_pull_request_candidate.json is not a JSON object."
                  )

                  result_file.write_text(
                      json.dumps(
                          payload,
                          indent=2,
                          ensure_ascii=False,
                      ),
                      encoding="utf-8",
                  )

                  raise SystemExit(0)

              pull_request_required = bool(
                  candidate.get(
                      "pull_request_required",
                      False,
                  )
              )

              branch_name = candidate.get(
                  "branch_name",
                  "maintenance/executor-generated",
              )

              pr_title = candidate.get(
                  "title",
                  "[RGA Executor] Approved maintenance updates",
              )

              pr_body = candidate.get(
                  "body",
                  (
                      "Generated by RGA Executor. "
                      "Bot #1 post-audit remains required."
                  ),
              )

              payload[
                  "branch_name"
              ] = branch_name

              if not pull_request_required:
                  payload[
                      "reason"
                  ] = (
                      "Pull request not required."
                  )

                  result_file.write_text(
                      json.dumps(
                          payload,
                          indent=2,
                          ensure_ascii=False,
                      ),
                      encoding="utf-8",
                  )

                  raise SystemExit(0)

              payload[
                  "pull_request_attempted"
              ] = True

              cmd = [
                  "gh",
                  "pr",
                  "create",
                  "--head",
                  branch_name,
                  "--base",
                  os.environ.get(
                      "BASE_BRANCH",
                      "main",
                  ),
                  "--title",
                  pr_title,
                  "--body",
                  pr_body,
              ]

              proc = subprocess.run(
                  cmd,
                  capture_output=True,
                  text=True,
                  check=False,
              )

              stdout_text = (
                  proc.stdout
                  or ""
              ).strip()

              stderr_text = (
                  proc.stderr
                  or ""
              ).strip()

              url_file.write_text(
                  stdout_text,
                  encoding="utf-8",
              )

              stderr_file.write_text(
                  stderr_text,
                  encoding="utf-8",
              )

              payload[
                  "return_code"
              ] = proc.returncode

              payload[
                  "stderr"
              ] = stderr_text

              if (
                  proc.returncode == 0
                  and stdout_text
              ):
                  payload[
                      "pull_request_created"
                  ] = True

                  payload[
                      "pull_request_url"
                  ] = stdout_text

                  payload[
                      "reason"
                  ] = (
                      "Pull request created."
                  )

              else:
                  payload[
                      "pull_request_created"
                  ] = False

                  payload[
                      "pull_request_url"
                  ] = (
                      stdout_text
                      if stdout_text
                      else None
                  )

                  payload[
                      "reason"
                  ] = (
                      "gh pr create did not create a pull request."
                  )

          except Exception as exc:
              payload[
                  "reason"
              ] = (
                  f"Create pull request candidate failed: {exc}"
              )

          finally:
              result_file.write_text(
                  json.dumps(
                      payload,
                      indent=2,
                      ensure_ascii=False,
                  ),
                  encoding="utf-8",
              )
          PY

          python artifacts/create_pull_request_candidate.py

          echo "Create Pull Request Candidate completed."
          echo "Result artifact: artifacts/execution_pull_request_result.json"

          exit 0
      ############################################################
