name: RGA Maintenance Executor

on:
  workflow_dispatch:
    inputs:
      executor_mode:
        description: >
          Bot #2 executor mode.

          plan:
            Generate an implementation plan from Bot #1 pre-audit evidence.

          dry_run_execute:
            Simulate execution and generate execution evidence without
            mutating repository state.

          execute:
            Apply gated execution after Bot #1 plan-audit and human approval.
        required: true
        default: "dry_run_execute"
        type: choice
        options:
          - plan
          - dry_run_execute
          - execute

      audit_session_id:
        description: >
          Optional lifecycle correlation id linking:
          Bot #1 pre-audit,
          Bot #2 implementation plan,
          Bot #1 plan-audit,
          human approval,
          Bot #2 execution,
          and Bot #1 post-audit.
        required: false
        default: ""

      pre_audit_report:
        description: >
          Bot #1 pre-audit report path.

          This is the source material for Bot #2 implementation planning.
          Used when executor_mode=plan.
        required: false
        default: "artifacts/runtime_verifier_report.json"

      execution_plan:
        description: >
          Bot #2 implementation / execution plan path.

          Used by dry_run_execute and execute stages.
        required: false
        default: "artifacts/execution_plan.json"

      approval_artifact:
        description: >
          Human approval artifact path.

          Required before execute mode may apply gated execution.
        required: false
        default: "artifacts/human_execution_approval.json"

      execution_approval:
        description: >
          Optional approval phrase for execute mode.

          Expected value:
            APPROVE_RGA_EXECUTION

          This does not replace the approval artifact; it is an additional
          safety signal for gated execution.
        required: false
        default: ""

jobs:
  maintenance-execution:
    runs-on: ubuntu-latest

    permissions:
      contents: write
      actions: read
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Prepare Artifact Directory
        run: |
          mkdir -p artifacts

          cat > artifacts/maintenance_lifecycle_context.json <<'JSON'
          {
            "schema": "rga.maintenance_lifecycle_context.v1.0",
            "workflow": "RGA Maintenance Executor",
            "bot": "rga_executor_bot",
            "bot_role": "planner_executor",
            "lifecycle_model": [
              "bot_1_pre_audit",
              "bot_2_implementation_plan",
              "bot_1_plan_audit",
              "human_approval",
              "bot_2_execute",
              "bot_1_post_audit"
            ],
            "authority": {
              "bot_2_may_plan": true,
              "bot_2_may_execute": true,
              "bot_2_may_approve": false,
              "bot_2_may_self_approve": false,
              "human_approval_required": true
            },
            "phase_boundary_policy": {
              "completed_phases_immutable": true,
              "canonical_row_modification_allowed": false,
              "pattern_logic_modification_allowed": false,
              "tips_generation_modification_allowed": false,
              "personalization_modification_allowed": false,
              "localization_modification_allowed": false,
              "recommendation_logic_modification_allowed": false
            }
          }
          JSON

      ############################################################
      # Execution Gate
      ############################################################

      - name: Execution Gate
        id: execution_gate
        run: |
          MODE="${{ github.event.inputs.executor_mode }}"
          APPROVAL="${{ github.event.inputs.approval_artifact }}"

          STATUS="allowed"
          REASON="Mode accepted"

          if [ "$MODE" = "execute" ] && [ ! -f "$APPROVAL" ]; then
            STATUS="blocked"
            REASON="Approval artifact missing"
          fi

          cat > artifacts/execution_gate.json <<JSON
          {
            "schema": "rga.execution_gate.v1.0",
            "requested_mode": "$MODE",
            "status": "$STATUS",
            "reason": "$REASON"
          }
          JSON

      ############################################################
      # Human Approval Artifact Verification
      ############################################################

      - name: Human Approval Artifact Verification
        if: always()
        run: |
          python <<'PY'
          import json
          from pathlib import Path

          p = Path('artifacts/human_execution_approval.json')

          payload = {
              'schema':'rga.approval_verification.v1.0',
              'artifact_present': p.exists()
          }

          Path('artifacts/approval_verification.json').write_text(
              json.dumps(payload, indent=2),
              encoding='utf-8'
          )
          PY
          
      ############################################################
      # Run Runtime Executor
      #
      # Bot #2 lifecycle role:
      #
      #   plan:
      #     Generate implementation plan from Bot #1 pre-audit evidence.
      #
      #   dry_run_execute:
      #     Simulate execution and produce execution evidence without
      #     mutating repository state.
      #
      #   execute:
      #     Apply gated execution only after Bot #1 plan-audit and
      #     human approval.
      #
      # This step intentionally preserves:
      #
      #   runtime_executor_report.json
      #   runtime_executor_report.md
      #   execution_plan.json
      #   runtime_executor_stdout.txt
      #   runtime_executor_stderr.txt
      #   runtime_executor_stderr_summary.json
      #   runtime_executor_exit_code.txt
      #
      # Empty stderr is not treated as a failure. It is summarized as
      # explicit zero-error evidence.
      ############################################################

      - name: Run Runtime Executor
        continue-on-error: true
        shell: bash
        run: |
          set -uo pipefail

          mkdir -p artifacts

          EXECUTOR_MODE="${{ github.event.inputs.executor_mode }}"
          PRE_AUDIT_REPORT="${{ github.event.inputs.pre_audit_report }}"
          EXECUTION_PLAN="${{ github.event.inputs.execution_plan }}"

          if [ -z "$PRE_AUDIT_REPORT" ]; then
            PRE_AUDIT_REPORT="artifacts/runtime_verifier_report.json"
          fi

          if [ -z "$EXECUTION_PLAN" ]; then
            EXECUTION_PLAN="artifacts/execution_plan.json"
          fi

          echo "RGA Runtime Executor"
          echo "Mode: ${EXECUTOR_MODE}"
          echo "Pre-audit report: ${PRE_AUDIT_REPORT}"
          echo "Execution plan output: ${EXECUTION_PLAN}"

          set +e

          python -u tools/runtime_executor.py \
            --mode "${EXECUTOR_MODE}" \
            --pre-audit-report "${PRE_AUDIT_REPORT}" \
            --json-out "${EXECUTION_PLAN}" \
            --report-json-out "artifacts/runtime_executor_report.json" \
            --md-out "artifacts/runtime_executor_report.md" \
            > "artifacts/runtime_executor_stdout.txt" \
            2> "artifacts/runtime_executor_stderr.txt"

          EXECUTOR_EXIT_CODE="$?"

          set -e

          echo "${EXECUTOR_EXIT_CODE}" > artifacts/runtime_executor_exit_code.txt

          ########################################################
          # Ensure stdout / stderr artifacts exist
          ########################################################

          if [ ! -f artifacts/runtime_executor_stdout.txt ]; then
            touch artifacts/runtime_executor_stdout.txt
          fi

          if [ ! -f artifacts/runtime_executor_stderr.txt ]; then
            touch artifacts/runtime_executor_stderr.txt
          fi

          ########################################################
          # Structured stderr summary
          ########################################################

          python <<'PY'
          import json
          from pathlib import Path

          stderr_path = Path(
              "artifacts/runtime_executor_stderr.txt"
          )

          stdout_path = Path(
              "artifacts/runtime_executor_stdout.txt"
          )

          exit_code_path = Path(
              "artifacts/runtime_executor_exit_code.txt"
          )

          stderr_text = (
              stderr_path.read_text(
                  encoding="utf-8",
                  errors="ignore",
              )
              if stderr_path.exists()
              else ""
          )

          stdout_text = (
              stdout_path.read_text(
                  encoding="utf-8",
                  errors="ignore",
              )
              if stdout_path.exists()
              else ""
          )

          try:
              exit_code = int(
                  exit_code_path.read_text(
                      encoding="utf-8",
                      errors="ignore",
                  ).strip()
                  or "0"
              )
          except Exception:
              exit_code = None

          error_markers = [
              "Traceback",
              "Error",
              "Exception",
              "ModuleNotFoundError",
              "RuntimeError",
              "ValueError",
          ]

          warning_markers = [
              "warning",
              "Warning",
              "WARN",
          ]

          error_hits = [
              marker
              for marker in error_markers
              if marker in stderr_text
          ]

          warning_hits = [
              marker
              for marker in warning_markers
              if marker in stderr_text
          ]

          payload = {
              "schema":
                  "rga.runtime_executor.stderr_summary.v1.0",

              "stderr_present":
                  stderr_path.exists(),

              "stderr_empty":
                  len(
                      stderr_text.strip()
                  )
                  == 0,

              "stdout_present":
                  stdout_path.exists(),

              "stdout_empty":
                  len(
                      stdout_text.strip()
                  )
                  == 0,

              "executor_exit_code":
                  exit_code,

              "execution_failed":
                  (
                      exit_code is not None
                      and exit_code != 0
                  ),

              "error_marker_count":
                  len(
                      error_hits
                  ),

              "warning_marker_count":
                  len(
                      warning_hits
                  ),

              "error_markers":
                  error_hits,

              "warning_markers":
                  warning_hits,

              "interpretation":
                  (
                      "stderr_empty_no_error_output"
                      if len(stderr_text.strip()) == 0
                      else "stderr_contains_output"
                  ),
          }

          Path(
              "artifacts/runtime_executor_stderr_summary.json"
          ).write_text(
              json.dumps(
                  payload,
                  indent=2,
                  ensure_ascii=False,
              ),
              encoding="utf-8",
          )
          PY

          ########################################################
          # Fallback runtime_executor_report.json
          #
          # This should normally be produced by runtime_executor.py.
          # If absent, preserve a structured fallback so the bundle
          # still has Bot #2 canonical evidence.
          ########################################################

          if [ ! -s artifacts/runtime_executor_report.json ]; then
            python <<'PY'
            import json
            from datetime import datetime, timezone
            from pathlib import Path

            exit_code_path = Path(
                "artifacts/runtime_executor_exit_code.txt"
            )

            stderr_path = Path(
                "artifacts/runtime_executor_stderr.txt"
            )

            stdout_path = Path(
                "artifacts/runtime_executor_stdout.txt"
            )

            try:
                exit_code = int(
                    exit_code_path.read_text(
                        encoding="utf-8",
                        errors="ignore",
                    ).strip()
                    or "0"
                )
            except Exception:
                exit_code = None

            stderr_text = (
                stderr_path.read_text(
                    encoding="utf-8",
                    errors="ignore",
                )
                if stderr_path.exists()
                else ""
            )

            stdout_text = (
                stdout_path.read_text(
                    encoding="utf-8",
                    errors="ignore",
                )
                if stdout_path.exists()
                else ""
            )

            payload = {
                "schema":
                    "rga.runtime_executor.report.fallback.v1.0",

                "generated_at":
                    datetime.now(
                        timezone.utc
                    )
                    .replace(
                        microsecond=0
                    )
                    .isoformat(),

                "mode":
                    None,

                "proposal_only":
                    None,

                "dry_run":
                    None,

                "execution_authority":
                    False,

                "approval_authority":
                    False,

                "plan":
                    {},

                "dry_run_result":
                    {},

                "apply_execution_result":
                    {},

                "diagnostics": {
                    "fallback_report_generated":
                        True,

                    "executor_exit_code":
                        exit_code,

                    "stdout_present":
                        stdout_path.exists(),

                    "stderr_present":
                        stderr_path.exists(),

                    "stdout_empty":
                        len(
                            stdout_text.strip()
                        )
                        == 0,

                    "stderr_empty":
                        len(
                            stderr_text.strip()
                        )
                        == 0,

                    "policy_result": {
                        "policy_passed":
                            False,

                        "violations": [
                            (
                                "runtime_executor.py did not emit "
                                "runtime_executor_report.json."
                            )
                        ],
                    },
                },
            }

            Path(
                "artifacts/runtime_executor_report.json"
            ).write_text(
                json.dumps(
                    payload,
                    indent=2,
                    ensure_ascii=False,
                ),
                encoding="utf-8",
            )
            PY
          fi

          ########################################################
          # Fallback runtime_executor_report.md
          ########################################################

          if [ ! -s artifacts/runtime_executor_report.md ]; then
            cat > artifacts/runtime_executor_report.md <<'MD'
            # RGA Runtime Executor Report

            ## Fallback Report

            `runtime_executor.py` did not emit a non-empty Markdown report.

            See:

            - `runtime_executor_report.json`
            - `runtime_executor_stdout.txt`
            - `runtime_executor_stderr.txt`
            - `runtime_executor_stderr_summary.json`
            - `runtime_executor_exit_code.txt`
            MD
          fi

          ########################################################
          # Step outcome
          #
          # Keep workflow alive for evidence upload. Policy outcome
          # is represented in runtime_executor_report.json.
          ########################################################

          echo "Runtime executor exit code: ${EXECUTOR_EXIT_CODE}"
          echo "Runtime executor evidence artifacts generated."       
          
      ############################################################
      # Execution Plan Fingerprint
      ############################################################

      - name: Execution Plan Fingerprint
        if: always()
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p artifacts

          python <<'PY'
          import hashlib
          import json
          from pathlib import Path

          plan_path = Path(
              "artifacts/execution_plan.json"
          )

          fingerprint = None

          if plan_path.exists() and plan_path.is_file():
              fingerprint = hashlib.sha256(
                  plan_path.read_bytes()
              ).hexdigest()

          payload = {
              "schema":
                  "rga.execution_plan_fingerprint.v1.0",

              "execution_plan_present":
                  plan_path.exists()
                  and plan_path.is_file(),

             "sha256":
                  fingerprint,
          }

          Path(
              "artifacts/execution_plan_fingerprint.json"
          ).write_text(
              json.dumps(
                  payload,
                  indent=2,
                  ensure_ascii=False,
              ),
              encoding="utf-8",
          )
          PY
          
      ############################################################
      # Approval Artifact Matching
      ############################################################

      - name: Approval Artifact Matching
        if: always()
        run: |
          python <<'PY'
          import json
          from pathlib import Path

          match = False

          plan_file = Path(
              "artifacts/execution_plan.json"
          )

          approval_file = Path(
              "artifacts/human_execution_approval.json"
          )

          if (
              plan_file.exists()
              and approval_file.exists()
          ):
              plan = json.loads(
                  plan_file.read_text(
                      encoding="utf-8"
                  )
              )

              approval = json.loads(
                  approval_file.read_text(
                      encoding="utf-8"
                  )
              )

              approved_plan = (
                  approval.get(
                      "approved_execution_plan",
                      {},
                  )
              )

              match = (
                  approved_plan.get("schema")
                  == plan.get("plan", {}).get("schema")
              )

          payload = {
              "schema":
                  "rga.approval_artifact_matching.v1.0",

              "approval_matches_plan":
                  match,
          }

          Path(
              "artifacts/approval_artifact_matching.json"
          ).write_text(
              json.dumps(
                  payload,
                  indent=2,
              ),
              encoding="utf-8",
          )
          PY
          
      ############################################################
      # Execution Scope Verification
      ############################################################

      - name: Execution Scope Verification
        if: always()
        run: |
          cat > artifacts/execution_scope_verification.json <<'JSON'
          {
            "schema":
              "rga.execution_scope_verification.v1.0",

            "protected_scopes": [

              "canonical_row",

              "pattern_logic",

              "tips_generation",

              "personalization",

              "localization",

              "recommendation_logic"
            ],

            "completed_phases_immutable":
              true
          }
          JSON

      ############################################################
      # Execution Policy Verification
      ############################################################

      - name: Execution Policy Verification
        if: always()
        run: |
          cat > artifacts/execution_policy_verification.json <<'JSON'
          {
            "schema":
              "rga.execution_policy_verification.v1.0",

            "execution_authority":
              true,

            "approval_authority":
              false,

            "self_approval":
              false,

            "human_approval_required":
              true,

            "plan_audit_required":
              true,

            "post_audit_required":
              true
          }
          JSON
          

      ############################################################
      # Apply Execution Result
      ############################################################

      - name: Apply Execution Result
        if: always()
        run: |
          mkdir -p artifacts

          python <<'PY'
          import json
          from pathlib import Path

          executor_report_file = Path(
              "artifacts/execution_plan.json"
          )

          result = {}

          if executor_report_file.exists():
              try:
                  executor_report = json.loads(
                      executor_report_file.read_text(
                          encoding="utf-8",
                      )
                  )

                  result = executor_report.get(
                      "apply_execution_result",
                      {},
                  )

              except Exception as exc:
                  result = {
                      "schema":
                          "rga.apply_execution_result.v1.0",

                      "execution_attempted":
                          False,

                      "execution_performed":
                          False,

                      "written_files":
                          [],

                      "policy_violations": [
                          f"Could not parse executor report: {exc}"
                      ],

                      "post_audit_required":
                          True,
                  }

          if not result:
              result = {
                  "schema":
                      "rga.apply_execution_result.v1.0",

                  "execution_attempted":
                      False,

                  "execution_performed":
                      False,

                  "written_files":
                      [],

                  "policy_violations":
                      [],

                  "post_audit_required":
                      True,

                  "note":
                      "No apply_execution_result was emitted by runtime_executor.py."
              }

          Path(
              "artifacts/apply_execution_result.json"
          ).write_text(
              json.dumps(
                  result,
                  indent=2,
                  ensure_ascii=False,
              ),
              encoding="utf-8",
          )
          PY
          
      ############################################################
      # Apply Repository Changes
      ############################################################

      - name: Apply Repository Changes
        if: always()
        run: |
          set +e

          python <<'PY'
          import json
          from pathlib import Path
          import subprocess

          mode = "${{ github.event.inputs.executor_mode }}"

          apply_result_file = Path(
              "artifacts/apply_execution_result.json"
          )

          repository_changes_applied = False
          changed_files = []
          written_files = []
          notes = []
          policy_violations = []

          if apply_result_file.exists():

              try:
                  result = json.loads(
                      apply_result_file.read_text(
                          encoding="utf-8"
                      )
                  )

                  written_files = result.get(
                      "written_files",
                      [],
                  )

                  policy_violations = result.get(
                      "policy_violations",
                      [],
                  )

              except Exception as exc:
                  notes.append(
                      f"Could not parse apply_execution_result.json: {exc}"
                  )

          else:
              notes.append(
                  "apply_execution_result.json not found."
              )

          protected_tokens = [
              "canonical_row",
              "pattern_logic",
              "tips_generation",
              "personalization",
              "localization",
              "recommendation_logic",
              "Phase 1",
              "Phase 2",
              "Phase 3",
              "Phase 4 - Personalization",
              "Phase 4.5 - Localization",
              "Phase 5 - Productionization",
              "Phase 6 - Hardening and Scaling",
              "Phase 7 - Games Recommendation",
          ]

          allowed_roots = [
              "tools/",
              "artifacts/",
              ".github/workflows/",
              "docs/",
          ]

          for item in written_files:
              normalized = str(item).replace("\\", "/")

              if any(
                  token.lower() in normalized.lower()
                  for token in protected_tokens
              ):
                  policy_violations.append(
                      f"Protected scope change rejected: {normalized}"
                  )
                  continue

              if not any(
                  normalized.startswith(prefix)
                  for prefix in allowed_roots
              ):
                  policy_violations.append(
                      f"Change outside allowed roots rejected: {normalized}"
                  )
                  continue

              changed_files.append(
                  normalized
              )

          #
          # Capture actual git working tree changes.
          #

          try:
              proc = subprocess.run(
                  [
                      "git",
                      "status",
                      "--short",
                  ],
                  check=False,
                  capture_output=True,
                  text=True,
              )

              git_status_short = proc.stdout.splitlines()

          except Exception as exc:
              git_status_short = []
              notes.append(
                  f"Could not inspect git status: {exc}"
              )

          repository_changes_applied = bool(
              changed_files
              or git_status_short
          )

          payload = {
              "schema":
                  "rga.repository_changes.v1.1",

              "executor_mode":
                  mode,
