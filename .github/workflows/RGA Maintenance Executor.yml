                  "executor_write_manifest":
                      "artifacts/executor_write_manifest.json",
                  "repository_changes":
                      "artifacts/repository_changes.json",
                  "execution_commit_manifest":
                      "artifacts/execution_commit_manifest.json",
                  "execution_git_commit_result":
                      "artifacts/execution_git_commit_result.json",
                  "execution_pull_request_candidate":
                      "artifacts/execution_pull_request_candidate.json",
                  "execution_pull_request_result":
                      "artifacts/execution_pull_request_result.json",
              },

              "executor_provenance": {
                  "execution_attempted":
                      apply_result.get(
                          "execution_attempted",
                          False,
                      ),
                  "execution_performed":
                      apply_result.get(
                          "execution_performed",
                          False,
                      ),
                  "executor_written_files":
                      executor_written_files,
                  "changed_files_from_executor":
                      changed_files_from_executor,
                  "patch_probe_performed":
                      executor_manifest.get(
                          "patch_probe_performed",
                          False,
                      ),
                  "patch_certifiable":
                      executor_manifest.get(
                          "patch_certifiable",
                          False,
                      ),
                  "execution_verdict":
                      executor_manifest.get(
                          "execution_verdict",
                      ),
              },

              "repository_state": {
                  "git_status_short":
                      repository_changes.get(
                          "git_status_short",
                          [],
                      ),
              },

              "commit_provenance": {
                  "commit_required":
                      execution_commit_manifest.get(
                          "commit_required",
                          False,
                      ),
                  "commit_attempted":
                      execution_git_commit_result.get(
                          "commit_attempted",
                          False,
