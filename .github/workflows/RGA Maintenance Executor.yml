      #
      #   Publishes lifecycle_event.json as the canonical
      #   stage-transition contract for the RGA Lifecycle Runner.
      #
      # Produced by:
      #
      #   Bot #2 Maintenance Executor
      #
      # Expected completed_stage values:
      #
      #   plan
      #   execute
      #
      # Optional testing mode:
      #
      #   dry_run_execute
      #
      # Canonical output:
      #
      #   artifacts/lifecycle_event.json
      ############################################################

      - name: Upload Lifecycle Event
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rga-lifecycle-event
          path: artifacts/lifecycle_event.json
          if-no-files-found: warn 

      ############################################################
      # Write Lifecycle Event Backhaul
      #
      # Bot #2 Maintenance Executor
      #
      # Purpose:
      #
      #   - Publishes lifecycle continuation evidence.
      #   - Does NOT dispatch the Lifecycle Runner.
      #   - Allows Lifecycle Runner to consume chronological state
      #     via workflow_run artifact download.
      #
      # Canonical output:
      #
      #   artifacts/lifecycle_backhaul.json
      ############################################################

      - name: Write Lifecycle Event Backhaul
        shell: bash
        env:
          EXECUTOR_MODE: ${{ inputs.executor_mode }}
          AUDIT_SESSION_ID: ${{ inputs.audit_session_id }}
        run: |
          set -euo pipefail

          mkdir -p artifacts

          EVENT_STAGE=""
          NEXT_STAGE=""
          DISPATCH_REQUIRED="true"
          LIFECYCLE_STATUS="running"

          case "${EXECUTOR_MODE}" in

            plan)
              EVENT_STAGE="plan"
              NEXT_STAGE="plan_audit"
              ;;

            execute)
              EVENT_STAGE="execute"
              NEXT_STAGE="post_audit"
              ;;

            dry_run_execute)
              EVENT_STAGE="execute"
              NEXT_STAGE="post_audit"
              ;;

            *)
              echo "Unsupported EXECUTOR_MODE: ${EXECUTOR_MODE}" >&2
              exit 1
              ;;

          esac

          jq -n \
            --arg schema "rga.lifecycle_backhaul.v1.0" \
            --arg producer "maintenance_executor" \
            --arg executor_mode "${EXECUTOR_MODE}" \
            --arg session "${AUDIT_SESSION_ID}" \
            --arg completed "${EVENT_STAGE}" \
            --arg next "${NEXT_STAGE}" \
            --arg status "${LIFECYCLE_STATUS}" \
            --argjson dispatch "${DISPATCH_REQUIRED}" \
            '{
              schema: $schema,

              producer: $producer,

              audit_session_id: $session,

              executor_mode: $executor_mode,

              completed_stage: $completed,

              next_stage:
                (
                  if $next == ""
                  then null
                  else $next
                  end
                ),

              lifecycle_status: $status,

              dispatch_required: $dispatch,

              backhaul_contract: {
                bot_dispatches_runner: false,
                runner_must_resume_from_workflow_run: true,
                artifact_guessing_required: false,
                chronological_order_required: true
              },

              governance: {
                bot_role: "planner_executor",
                orchestrator_role: "lifecycle_runner",
                approval_authority: "human",
                completed_phases_remain_immutable: true
              }
            }' \
            > artifacts/lifecycle_backhaul.json

          echo "Lifecycle backhaul written:"
          cat artifacts/lifecycle_backhaul.json  

      ############################################################
      # Upload Lifecycle Event Backhaul
      ############################################################

      - name: Upload Lifecycle Event Backhaul
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rga-lifecycle-backhaul
          path: artifacts/lifecycle_backhaul.json
          if-no-files-found: warn
          retention-days: 30          

      ############################################################
      # Upload Execution Plan Bundle
      #
      # Plan-stage proposal bundle consumed by:
      #
      #   Runtime Auditor (plan_audit)
      #
      # Execute stage must preserve these artifacts.
      ############################################################

      - name: Upload Execution Plan Bundle
        if: ${{ always() && inputs.executor_mode == 'plan' }}
        uses: actions/upload-artifact@v4
        with:
          name: rga-execution-plan
          path: |
            artifacts/execution_plan.json
            artifacts/execution_plan_fingerprint.json
            artifacts/runtime_executor_report.json
            artifacts/runtime_executor_report.md
            artifacts/runtime_executor_stdout.txt
            artifacts/runtime_executor_stderr.txt
            artifacts/runtime_executor_stderr_summary.json
            artifacts/runtime_executor_exit_code.txt
          if-no-files-found: warn

      ############################################################
      # Stage 2
      # Upload Database Mutation Plan
      #
      # Plan-stage proposal artifact.
      #
      # Consumed by:
      #
      #   Runtime Auditor (plan_audit)
      ############################################################

      - name: Upload Database Mutation Plan
        if: ${{ always() && inputs.executor_mode == 'plan' }}
        uses: actions/upload-artifact@v4
        with:
          name: rga-database-mutation-plan
          path: |
            artifacts/database_mutation_plan.json
          if-no-files-found: warn

      ############################################################
      # Stage 4
      # Upload Persistence Contract
      #
      # Governance contract derived from:
      #
      #   database_mutation_plan.json
      #
      # Consumed by:
      #
      #   Runtime Auditor (plan_audit)
      #   Deployment Governance Gate
      ############################################################

      - name: Upload Persistence Contract
        if: ${{ always() && inputs.executor_mode == 'plan' }}
        uses: actions/upload-artifact@v4
        with:
          name: rga-persistence-contract
          path: |
            artifacts/persistence_contract.json
          if-no-files-found: warn
          
      ############################################################
      # Upload Plan Audit Input Bundle
      ############################################################

      - name: Upload Plan Audit Input Bundle
        if: ${{ always() && inputs.executor_mode == 'plan' }}
        uses: actions/upload-artifact@v4
        with:
          name: rga-plan-audit-inputs
          path: |
            artifacts/execution_plan.json
            artifacts/execution_plan_fingerprint.json
            artifacts/database_mutation_plan.json
            artifacts/persistence_contract.json
          if-no-files-found: warn          
          
      ############################################################
      # Upload Dry Run Evidence
      ############################################################

      - name: Upload Dry Run Evidence
        if: ${{ always() && inputs.executor_mode == 'dry_run_execute' }}
        uses: actions/upload-artifact@v4
        with:
          name: rga-dry-run-evidence
          path: |
            artifacts/execution_plan.json
            artifacts/runtime_executor_report.json
            artifacts/runtime_executor_report.md
            artifacts/runtime_executor_stdout.txt
            artifacts/runtime_executor_stderr.txt
            artifacts/runtime_executor_stderr_summary.json
            artifacts/runtime_executor_exit_code.txt
          if-no-files-found: warn
          
      ############################################################
      # Upload Execute Evidence
      ############################################################

      - name: Upload Execute Evidence
        if: ${{ always() && inputs.executor_mode == 'execute' }}
        uses: actions/upload-artifact@v4
        with:
          name: rga-execute-evidence
          path: |
            artifacts/apply_execution_result.json
            artifacts/executor_write_manifest.json
            artifacts/execution_provenance.json
            artifacts/runtime_executor_report.json
            artifacts/runtime_executor_report.md
            artifacts/runtime_executor_stdout.txt
            artifacts/runtime_executor_stderr.txt
            artifacts/runtime_executor_stderr_summary.json
            artifacts/runtime_executor_exit_code.txt
            artifacts/repository_changes.json
            artifacts/execution_commit_manifest.json
            artifacts/execution_git_commit_result.json
            artifacts/execution_pull_request_candidate.json
            artifacts/execution_pull_request_result.json
            artifacts/execution_pull_request_url.txt
            artifacts/execution_pull_request_stderr.txt
            artifacts/execution_manifest.txt
            artifacts/execution_lineage.json
          if-no-files-found: warn    
          
      ############################################################
      # Upload Execution Provenance Bundle
      ############################################################

      - name: Upload Execution Provenance Bundle
        if: ${{ always() && inputs.executor_mode == 'execute' }}
        uses: actions/upload-artifact@v4
        with:
          name: execution-provenance-bundle
          path: |
            artifacts/apply_execution_result.json
            artifacts/executor_write_manifest.json
            artifacts/execution_provenance.json
            artifacts/execution_manifest.txt
            artifacts/execution_lineage.json
          if-no-files-found: warn          
