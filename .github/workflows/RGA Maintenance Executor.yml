name: RGA Maintenance Executor

on:
  workflow_dispatch:
    inputs:
      executor_mode:
        description: >-
          Bot #2 executor mode.

          plan:
          Generate an implementation plan from Bot #1 pre-audit evidence.

          dry_run_execute:
          Simulate execution and generate execution evidence without
          mutating repository state.

          execute:
          Apply gated execution after Bot #1 plan-audit and human approval.
        required: false
        default: "plan"
        type: choice
        options:
          - plan
          - dry_run_execute
          - execute

      audit_session_id:
        description: >-
          Optional lifecycle correlation id linking:
          Bot #1 pre-audit,
          Bot #2 implementation plan,
          Bot #1 plan-audit,
          human approval,
          Bot #2 execution,
          and Bot #1 post-audit.
        required: false
        default: ""

      pre_audit_report:
        description: >-
          Bot #1 pre-audit report path.

          This is the source material for Bot #2 implementation planning.
          Used when executor_mode=plan.
        required: false
        default: "artifacts/runtime_auditor_report.json"

      execution_plan:
        description: >-
          Bot #2 implementation / execution plan path.

          Used by dry_run_execute and execute stages.
        required: false
        default: "artifacts/execution_plan.json"

      approval_artifact:
        description: >-
          Human approval artifact path.

          Required before execute mode may apply gated execution.
        required: false
        default: "artifacts/human_execution_approval.json"

      execution_approval:
        description: >-
          Optional approval phrase for execute mode.

          Expected value:
          APPROVE_RGA_EXECUTION

          This does not replace the approval artifact; it is an additional
          safety signal for gated execution.
        required: false
        default: ""

jobs:
  maintenance-execution:
    runs-on: ubuntu-latest

    permissions:
      contents: write
      actions: write
      pull-requests: write

    steps:
      ############################################################
      # Checkout Repository
      #
      # Token policy:
      #
      #   - Do not persist github.token credentials into git config.
      #
      #   - GitHub write operations in this workflow should use the
      #     generated GitHub App installation token.
      ############################################################

      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      ############################################################
      # Generate GitHub App Token
      #
      # Maintenance Executor lifecycle role:
      #
      #   - Bot #2 owns implementation planning and gated execution.
      #
      #   - Bot #2 may create approved tooling, workflow,
      #     governance, and execution evidence artifacts.
      #
      #   - Bot #2 must not approve, self-approve, merge, override
      #     governance, mutate runtime databases, delete source
      #     assets, or modify Completed Phases 1-7.
      #
      # Token policy:
      #
      #   - Prefer GitHub App installation token.
      #
      #   - Do not use PAT_TOKEN.
      #
      #   - Do not fall back to github.token.
      #
      #   - Do not print token values.
      ############################################################

      - name: Generate GitHub App Token
        id: github_app_token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.RGA_APP_ID }}
          private-key: ${{ secrets.RGA_APP_PRIVATE_KEY }}

      ############################################################
      # Resolve GitHub App Artifact Token
      #
      # This exposes the generated GitHub App installation token
      # through one stable step output:
      #
      #   steps.artifact_token.outputs.token
      #
      # Downstream GitHub operations should use this output.
      ############################################################

      - name: Resolve GitHub App Artifact Token
        id: artifact_token
        shell: bash
        env:
          GENERATED_GITHUB_APP_TOKEN: ${{ steps.github_app_token.outputs.token }}
        run: |
          if [ -z "${GENERATED_GITHUB_APP_TOKEN}" ]; then
            echo "::error::Generated GitHub App token is empty."
            exit 1
          fi

          echo "token=${GENERATED_GITHUB_APP_TOKEN}" >> "$GITHUB_OUTPUT"    

      ############################################################
      # Prepare Artifact Directory
      ############################################################

      - name: Prepare Artifact Directory
        shell: bash
        run: |
          mkdir -p artifacts

          python3 - <<'PY'
          import json
          from pathlib import Path

          payload = {
              "schema": "rga.maintenance_lifecycle_context.v1.0",
              "workflow": "RGA Maintenance Executor",
              "bot": "rga_executor_bot",
              "bot_role": "planner_executor",
              "lifecycle_model": [
                  "bot_1_pre_audit",
                  "bot_2_implementation_plan",
                  "bot_1_plan_audit",
                  "human_approval",
                  "bot_2_execute",
                  "bot_1_post_audit",
              ],
              "authority": {
                  "bot_2_may_plan": True,
                  "bot_2_may_execute": True,
                  "bot_2_may_approve": False,
                  "bot_2_may_self_approve": False,
                  "human_approval_required": True,
              },
              "phase_boundary_policy": {
                  "completed_phases_immutable": True,
                  "canonical_row_modification_allowed": False,
                  "pattern_logic_modification_allowed": False,
                  "tips_generation_modification_allowed": False,
                  "personalization_modification_allowed": False,
                  "localization_modification_allowed": False,
                  "recommendation_logic_modification_allowed": False,
              },
          }

          Path("artifacts/maintenance_lifecycle_context.json").write_text(
              json.dumps(
                  payload,
                  indent=2,
                  ensure_ascii=False,
              ),
              encoding="utf-8",
          )
          PY

      - name: Ingest Pre-Audit Artifacts
        uses: dawidd6/action-download-artifact@v6
        with:
          workflow: RGA Runtime Auditor.yml
          name: runtime-auditor-evidence
          path: artifacts/
          check_artifacts: true
          search_artifacts: true
        continue-on-error: true


      - name: Flatten Artifact Directory
        run: |
          # Move files inside subfolders up to artifacts/
          find artifacts/ -mindepth 2 -type f -exec mv {} artifacts/ \;
          echo "[RGA] Files in artifacts folder:"
          ls -la artifacts/
          
          
      ############################################################
      # Write Database Mutation Contract
      #
      # Plan-stage artifact.
      #
      # Runtime Auditor consumes this artifact during:
      #
      #   plan_audit
      #
      # This artifact is a proposal contract only.
      #
      # Execute stage must not modify this artifact.
      ############################################################

      - name: Write Database Mutation Contract
        if: ${{ always() && inputs.executor_mode == 'plan' }}
        shell: bash
        env:
          AUDIT_SESSION_ID: ${{ inputs.audit_session_id }}
          EXECUTOR_MODE: ${{ inputs.executor_mode }}
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          from datetime import datetime, timezone

          runtime_baseline = Path(
              "artifacts/runtime_baseline.json"
          )

          pre_audit_report = Path(
              "artifacts/runtime_auditor_report.json"
          )

          audit_session_id = os.environ.get(
              "AUDIT_SESSION_ID",
              "",
          )

          payload = {
              "schema":
                  "rga.database_mutation_plan.v1.1",

              "workflow":
                  "RGA Maintenance Executor",

              "bot":
                  "rga_executor_bot",

              "lifecycle_stage":
                  "bot_2_plan",

              "artifact_role":
                  "proposal_contract",

              "plan_stage_artifact":
                  True,

              "runtime_auditor_plan_audit_required":
                  True,

              "execution_stage_may_mutate_plan":
                  False,

              "approval_required":
                  True,

              "audit_session_id":
                  audit_session_id,

              "generated_at":
                  datetime.now(
                      timezone.utc
                  ).replace(
                      microsecond=0
                  ).isoformat(),

              "runtime_baseline": {
                  "path": str(runtime_baseline),
                  "present": runtime_baseline.exists(),
              },

              "pre_audit_report": {
                  "path": str(pre_audit_report),
                  "present": pre_audit_report.exists(),
              },

              "approval": {
                  "required": True,
                  "approved": False,
                  "approval_artifact":
                      "artifacts/human_execution_approval.json",
              },

              "policy": {
                  "validation_required": True,
                  "validated": False,
                  "phase_boundary_immutable": True,
              },

              "proposed_mutations": [],
          }

          Path(
              "artifacts/database_mutation_plan.json"
          ).write_text(
              json.dumps(
                  payload,
                  indent=2,
                  ensure_ascii=False,
              ),
              encoding="utf-8",
          )

          print(
              "[RGA] database_mutation_plan.json generated successfully."
          )
          PY

      ############################################################
      # Write Persistence Contract
      #
      # Plan-stage governance contract.
      #
      # Consumed by:
      #
      #   Runtime Auditor plan-audit
      #   Deployment Governance Gate
      #
      # This contract does not authorize execution.
      ############################################################

      - name: Write Persistence Contract
        if: ${{ always() && inputs.executor_mode == 'plan' }}
        shell: bash
        env:
          AUDIT_SESSION_ID: ${{ inputs.audit_session_id }}
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          from datetime import datetime, timezone

          mutation_plan = Path(
              "artifacts/database_mutation_plan.json"
          )

          audit_session_id = os.environ.get(
              "AUDIT_SESSION_ID",
              "",
          )

          payload = {
              "schema":
                  "rga.persistence_contract.v1.1",

              "workflow":
                  "RGA Maintenance Executor",

              "bot":
                  "rga_executor_bot",

              "lifecycle_stage":
                  "stage_4_persistence_contract",

              "artifact_role":
                  "governance_contract",

              "plan_stage_artifact":
                  True,

              "runtime_auditor_plan_audit_required":
                  True,

              "deployment_gate_validation_required":
                  True,

              "execution_authority":
                  False,

              "audit_session_id":
                  audit_session_id,

              "generated_at":
                  datetime.now(
                      timezone.utc
                  ).replace(
                      microsecond=0
                  ).isoformat(),

              "source_contract":
                  str(mutation_plan),

              "source_contract_present":
                  mutation_plan.exists(),

              "ownership": {
                  "planner": "bot_2",
                  "executor": "persistence_layer",
                  "approver": "human",
                  "policy_validator": "deployment_gate",
              },

              "permissions": {
                  "executor_may_write_db": False,
                  "persistence_layer_owns_db_writes": True,
                  "human_approval_required": True,
                  "deployment_gate_required": True,
              },

              "runtime_requirements": {
                  "runtime_baseline_required": True,
                  "mutation_validation_required": True,
              },

              "status": {
                  "approved": False,
                  "validated": False,
                  "executed": False,
              },
          }

          Path(
              "artifacts/persistence_contract.json"
          ).write_text(
              json.dumps(
                  payload,
                  indent=2,
                  ensure_ascii=False,
              ),
              encoding="utf-8",
          )

          print(
              "[RGA] persistence_contract.json generated successfully."
          )
          PY
          
      ############################################################
      # Execution Gate
      ############################################################

      - name: Execution Gate
        id: execution_gate
        env:
          EXECUTOR_MODE: ${{ inputs.executor_mode }}
          APPROVAL_ARTIFACT: ${{ inputs.approval_artifact }}
        run: |
          set -euo pipefail

          MODE="${EXECUTOR_MODE:-plan}"
          if [ -z "$MODE" ]; then
            MODE="plan"
          fi

          APPROVAL="${APPROVAL_ARTIFACT:-artifacts/human_execution_approval.json}"
          if [ -z "$APPROVAL" ]; then
            APPROVAL="artifacts/human_execution_approval.json"
          fi

          STATUS="allowed"
          REASON="Mode accepted"

          if [ "$MODE" = "execute" ] && [ ! -f "$APPROVAL" ]; then
            STATUS="blocked"
            REASON="Approval artifact missing"
          fi

          export MODE STATUS REASON

          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          payload = {
              "schema": "rga.execution_gate.v1.0",
              "requested_mode": os.environ.get("MODE", ""),
              "status": os.environ.get("STATUS", ""),
              "reason": os.environ.get("REASON", ""),
          }
          Path("artifacts/execution_gate.json").write_text(
              json.dumps(payload, indent=2),
              encoding="utf-8",
          )
          PY

      ############################################################
      # Human Approval Artifact audit
      ############################################################

      - name: Human Approval Artifact audit
        if: always()
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
     
          p = Path('artifacts/human_execution_approval.json')

          payload = {
              'schema':'rga.approval_audit.v1.0',
              'artifact_present': p.exists()
          }
          Path('artifacts/approval_audit.json').write_text(
              json.dumps(payload, indent=2),
              encoding='utf-8'
          )
          PY

      ############################################################
      # Execution Scope audit
      ############################################################

      - name: Execution Scope audit
        if: always()
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          payload = {
              "schema": "rga.execution_scope_audit.v1.0",
              "protected_scopes": [
                  "canonical_row",
                  "pattern_logic",
                  "tips_generation",
                  "personalization",
                  "localization",
                  "recommendation_logic",
              ],
              "completed_phases_immutable": True,
          }
          Path("artifacts/execution_scope_audit.json").write_text(
              json.dumps(payload, indent=2),
              encoding="utf-8",
          )
          PY

      ############################################################
      # Execution Policy audit
      ############################################################

      - name: Execution Policy audit
        if: always()
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          payload = {
              "schema": "rga.execution_policy_audit.v1.0",
              "execution_authority": True,
              "approval_authority": False,
              "self_approval": False,
              "human_approval_required": True,
              "plan_audit_required": True,
              "post_audit_required": True,
          }
          Path("artifacts/execution_policy_audit.json").write_text(
              json.dumps(payload, indent=2),
              encoding="utf-8",
          )
          PY
          
      ############################################################
      # Run Runtime Executor
      #
      # Bot #2 lifecycle role:
      #
      #   plan:
      #     Generate implementation plan from Bot #1 pre-audit evidence.
      #
      #   dry_run_execute:
      #     Simulate execution and produce execution evidence without
      #     mutating repository state.
      #
      #   execute:
      #     Apply gated execution only after Bot #1 plan-audit,
      #     approval artifact matching, execution gate, and human approval.
      #
      # Execution plan handling:
      #
      #   - artifacts/execution_plan.json is a plan-stage proposal artifact.
      #
      #   - It is preserved as an input contract for dry_run_execute
      #     and execute stages.
      #
      #   - Runtime Auditor plan-audit is the verifier of:
      #
      #       artifacts/execution_plan.json
      #       artifacts/database_mutation_plan.json
      #
      #   - Execute mode must not overwrite artifacts/execution_plan.json.
      #
      #   - The true execution signal is:
      #
      #       executor_mode=execute
      #       artifacts/human_execution_approval.json
      #       artifacts/approval_artifact_matching.json
      #       artifacts/execution_gate.json
      #
      #   - Do not pass --execution-plan unless runtime_executor.py
      #     explicitly supports that CLI argument.
      #
      # This step intentionally preserves:
      #
      #   execution_plan.json
      #   execution_plan_input_contract.json
      #   runtime_executor_output.json
      #   runtime_executor_report.json
      #   runtime_executor_report.md
      #   apply_execution_result.json
      #   executor_write_manifest.json
      #   execution_provenance.json
      #   runtime_executor_stdout.txt
      #   runtime_executor_stderr.txt
      #   runtime_executor_stderr_summary.json
      #   runtime_executor_exit_code.txt
      #
      # Empty stderr is not treated as a failure. It is summarized as
      # explicit zero-error evidence.
      ############################################################

      - name: Run Runtime Executor
        id: run_runtime_executor
        continue-on-error: true
        shell: bash
        env:
          EXECUTOR_MODE: ${{ inputs.executor_mode }}
          EXECUTION_PLAN_IN: ${{ inputs.execution_plan }}
          PRE_AUDIT_REPORT_IN: ${{ inputs.pre_audit_report }}
        run: |
          set -uo pipefail

          mkdir -p artifacts

          MODE="${EXECUTOR_MODE:-dry_run_execute}"
          EXECUTION_PLAN="${EXECUTION_PLAN_IN:-artifacts/execution_plan.json}"
          PRE_AUDIT_REPORT="${PRE_AUDIT_REPORT_IN:-artifacts/runtime_auditor_report.json}"

          ########################################################
          # Preserve and validate execution_plan.json as input
          #
          # Important:
          #   - In plan mode, runtime_executor.py may write
          #     artifacts/execution_plan.json.
          #
          #   - In dry_run_execute / execute mode, execution_plan.json
          #     is treated as an input artifact and must not be
          #     overwritten by this step.
          ########################################################

          cat > artifacts/prepare_execution_plan_input_contract.py <<'PY'
          import hashlib
          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path

          mode = os.environ.get(
              "MODE",
              "dry_run_execute",
          )

          execution_plan_path = Path(
              os.environ.get(
                  "EXECUTION_PLAN",
                  "artifacts/execution_plan.json",
              )
          )

          out_path = Path(
              "artifacts/execution_plan_input_contract.json"
          )

          payload = {
              "schema":
                  "rga.execution_plan_input_contract.v1.0",

              "generated_at":
                  datetime.now(
                      timezone.utc
                  ).replace(
                      microsecond=0
                  ).isoformat(),

              "mode":
                  mode,

              "execution_plan_path":
                  str(execution_plan_path),

              "execution_plan_present":
                  execution_plan_path.exists(),

              "execution_plan_parseable":
                  False,

              "execution_plan_sha256":
                  None,

              "execution_plan_schema":
                  None,

              "execution_plan_mode":
                  None,

              "plan_stage_artifact":
                  True,

              "execute_stage_may_overwrite_execution_plan":
                  False,

              "runtime_executor_cli_argument_supported":
                  False,

              "runtime_executor_cli_argument":
                  "--execution-plan",

              "required_for_modes": [
                  "dry_run_execute",
                  "execute"
              ],

              "policy_violations":
                  [],
          }

          if execution_plan_path.exists():
              raw = execution_plan_path.read_bytes()

              payload[
                  "execution_plan_sha256"
              ] = hashlib.sha256(
                  raw
              ).hexdigest()

              try:
                  data = json.loads(
                      raw.decode(
                          "utf-8",
                      )
                  )

                  payload[
                      "execution_plan_parseable"
                  ] = True

                  payload[
                      "execution_plan_schema"
                  ] = data.get(
                      "schema",
                  )

                  payload[
                      "execution_plan_mode"
                  ] = data.get(
                      "mode",
                  )

              except Exception as exc:
                  payload[
                      "policy_violations"
                  ].append(
                      f"execution_plan.json is not parseable JSON: {exc}"
                  )

          else:
              if mode in {
                  "dry_run_execute",
                  "execute",
              }:
                  payload[
                      "policy_violations"
                  ].append(
                      "execution_plan.json is required as an input contract for this mode."
                  )

          out_path.write_text(
              json.dumps(
                  payload,
                  indent=2,
                  ensure_ascii=False,
              ),
              encoding="utf-8",
          )
          PY

          MODE="${MODE}" \
          EXECUTION_PLAN="${EXECUTION_PLAN}" \
          python artifacts/prepare_execution_plan_input_contract.py

          ########################################################
          # Select json-out path by mode
          #
          # plan:
          #   runtime_executor.py writes artifacts/execution_plan.json
          #
          # dry_run_execute / execute:
          #   preserve artifacts/execution_plan.json and write executor
          #   runtime output elsewhere.
          ########################################################

          if [ "${MODE}" = "plan" ]; then
            JSON_OUT="artifacts/execution_plan.json"
          else
            JSON_OUT="artifacts/runtime_executor_output.json"
          fi

          set +e

          ########################################################
          # Do NOT pass --execution-plan here.
          #
          # Current runtime_executor.py does not support that CLI
          # argument. execution_plan.json is preserved and described
          # by artifacts/execution_plan_input_contract.json instead.
          ########################################################

          python tools/runtime_executor.py \
            --mode "${MODE}" \
            --pre-audit-report "${PRE_AUDIT_REPORT}" \
            --json-out "${JSON_OUT}" \
            --report-json-out "artifacts/runtime_executor_report.json" \
            --md-out "artifacts/runtime_executor_report.md" \
            > "artifacts/runtime_executor_stdout.txt" \
            2> "artifacts/runtime_executor_stderr.txt"

          EXECUTOR_EXIT_CODE="$?"

          set -e

          echo "${EXECUTOR_EXIT_CODE}" > artifacts/runtime_executor_exit_code.txt

          ########################################################
          # Ensure stdout / stderr artifacts exist
          ########################################################

          if [ ! -f artifacts/runtime_executor_stdout.txt ]; then
            touch artifacts/runtime_executor_stdout.txt
          fi

          if [ ! -f artifacts/runtime_executor_stderr.txt ]; then
            touch artifacts/runtime_executor_stderr.txt
          fi

          ########################################################
          # Structured stderr summary
          ########################################################

          STDERR_PRESENT="false"
          STDERR_EMPTY="true"

          STDOUT_PRESENT="false"
          STDOUT_EMPTY="true"

          ERROR_MARKER_COUNT="0"
          WARNING_MARKER_COUNT="0"

          if [ -f artifacts/runtime_executor_stderr.txt ]; then
            STDERR_PRESENT="true"

            if [ -s artifacts/runtime_executor_stderr.txt ]; then
              STDERR_EMPTY="false"
            fi
          fi

          if [ -f artifacts/runtime_executor_stdout.txt ]; then
            STDOUT_PRESENT="true"

            if [ -s artifacts/runtime_executor_stdout.txt ]; then
              STDOUT_EMPTY="false"
            fi
          fi

          ERROR_MARKER_COUNT="$(
            {
              grep -E \
                'Traceback|Error|Exception|ModuleNotFoundError|RuntimeError|ValueError|NameError|TypeError|SyntaxError|unrecognized arguments' \
                artifacts/runtime_executor_stderr.txt \
                2>/dev/null \
                || true
            } \
              | wc -l \
              | tr -d ' '
          )"

          WARNING_MARKER_COUNT="$(
            {
              grep -E \
                'warning|Warning|WARN' \
                artifacts/runtime_executor_stderr.txt \
                2>/dev/null \
                || true
            } \
              | wc -l \
              | tr -d ' '
          )"

          EXEC_FAILED="false"
          if [ "${EXECUTOR_EXIT_CODE}" != "0" ]; then
            EXEC_FAILED="true"
          fi

          jq -n \
            --argjson stderr_present ${STDERR_PRESENT} \
            --argjson stderr_empty ${STDERR_EMPTY} \
            --argjson stdout_present ${STDOUT_PRESENT} \
            --argjson stdout_empty ${STDOUT_EMPTY} \
            --argjson exit_code ${EXECUTOR_EXIT_CODE} \
            --argjson failed ${EXEC_FAILED} \
            --argjson err_count ${ERROR_MARKER_COUNT} \
            --argjson warn_count ${WARNING_MARKER_COUNT} \
            '{
              schema: "rga.runtime_executor.stderr_summary.v1.0",
              stderr_present: $stderr_present,
              stderr_empty: $stderr_empty,
              stdout_present: $stdout_present,
              stdout_empty: $stdout_empty,
              executor_exit_code: $exit_code,
              execution_failed: $failed,
              error_marker_count: $err_count,
              warning_marker_count: $warn_count
            }' > artifacts/runtime_executor_stderr_summary.json

          ########################################################
          # Fallback runtime_executor_report.json
          ########################################################

          if [ ! -s artifacts/runtime_executor_report.json ]; then

            jq -n \
              --arg mode "${MODE}" \
              --arg json_out "${JSON_OUT}" \
              --arg execution_plan "${EXECUTION_PLAN}" \
              --argjson exit_code ${EXECUTOR_EXIT_CODE} \
              --argjson stdout_present ${STDOUT_PRESENT} \
              --argjson stderr_present ${STDERR_PRESENT} \
              --argjson stdout_empty ${STDOUT_EMPTY} \
              --argjson stderr_empty ${STDERR_EMPTY} \
              '{
                schema: "rga.runtime_executor.report.fallback.v1.0",
                mode: $mode,
                proposal_only: ($mode == "plan"),
                dry_run: ($mode == "dry_run_execute"),
                execution_authority: ($mode == "execute"),
                approval_authority: false,
                plan: {},
                dry_run_result: {},
                apply_execution_result: {},
                executor_write_manifest: {},
                execution_provenance: {},
                execution_plan_input: {
                  path: $execution_plan,
                  contract: "artifacts/execution_plan_input_contract.json",
                  plan_stage_artifact: true,
                  execute_stage_may_overwrite_execution_plan: false
                },
                runtime_output: {
                  json_out: $json_out
                },
                diagnostics: {
                  fallback_report_generated: true,
                  executor_exit_code: $exit_code,
                  stdout_present: $stdout_present,
                  stderr_present: $stderr_present,
                  stdout_empty: $stdout_empty,
                  stderr_empty: $stderr_empty,
                  policy_result: {
                    policy_passed: false,
                    violations: [
                      "runtime_executor.py did not emit runtime_executor_report.json."
                    ]
                  }
                }
              }' > artifacts/runtime_executor_report.json

          fi

          ########################################################
          # Fallback runtime_executor_report.md
          ########################################################

          if [ ! -s artifacts/runtime_executor_report.md ]; then
            cat > artifacts/runtime_executor_report.md <<'MD'
          # RGA Runtime Executor Report

          ## Fallback Report

          `runtime_executor.py` did not emit a non-empty Markdown report.

          See:

          - `runtime_executor_report.json`
          - `runtime_executor_stdout.txt`
          - `runtime_executor_stderr.txt`
          - `runtime_executor_stderr_summary.json`
          - `runtime_executor_exit_code.txt`
          - `execution_plan_input_contract.json`
