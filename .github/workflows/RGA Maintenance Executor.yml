      ############################################################
      # Write Lifecycle Event Contract
      ############################################################

      - name: Write Lifecycle Event Contract
        shell: bash
        env:
          EXECUTOR_MODE: ${{ inputs.executor_mode }}
          AUDIT_SESSION_ID: ${{ inputs.audit_session_id }}
        run: |
          set -euo pipefail

          mkdir -p artifacts

          EVENT_STAGE=""
          NEXT_STAGE=""
          MODE="${EXECUTOR_MODE:-dry_run_execute}"

          case "$MODE" in

            plan)
              EVENT_STAGE="plan"
              NEXT_STAGE="plan_audit"
              ;;

            execute)
              EVENT_STAGE="execute"
              NEXT_STAGE="post_audit"
              ;;

            dry_run_execute)
              EVENT_STAGE="execute"
              NEXT_STAGE="post_audit"
              ;;

            *)
              echo "Unsupported EXECUTOR_MODE: $MODE" >&2
              exit 1
              ;;
          esac

          jq -n \
            --arg session "${AUDIT_SESSION_ID}" \
            --arg mode "${MODE}" \
            --arg completed "${EVENT_STAGE}" \
            --arg next "${NEXT_STAGE}" \
            '{
              schema: "rga.lifecycle_event.v1.0",
              producer: "maintenance_executor",
              audit_session_id: $session,
              executor_mode: $mode,
              completed_stage: $completed,
              next_stage: $next,
              dispatch_required: true,
              event_contract: {
                completed_stage_declared: true,
                next_stage_declared: true,
                artifact_guessing_required: false,
                runner_must_infer_stage: false
              }
            }' > artifacts/lifecycle_event.json

          echo "Lifecycle event contract written:"
          cat artifacts/lifecycle_event.json

          
