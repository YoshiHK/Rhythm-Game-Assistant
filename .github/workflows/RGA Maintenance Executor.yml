      - name: Apply Repository Changes
        if: always()
        env:
          EXECUTOR_MODE: ${{ inputs.executor_mode }}
        run: |
          set +e

          python - <<'PY'
          import json
          import os
          from pathlib import Path
          import subprocess

          mode = os.environ.get("EXECUTOR_MODE", "")

          apply_result_file = Path(
              "artifacts/apply_execution_result.json"
          )

          repository_changes_applied = False
          changed_files = []
          written_files = []
          notes = []
          policy_violations = []

          if apply_result_file.exists():

              try:
                  result = json.loads(
                      apply_result_file.read_text(
                          encoding="utf-8"
                      )
                  )

                  written_files = result.get(
                      "written_files",
                      [],
                  )

                  policy_violations = result.get(
                      "policy_violations",
                      [],
                  )

              except Exception as exc:
                  notes.append(
                      f"Could not parse apply_execution_result.json: {exc}"
                  )

          else:
              notes.append(
                  "apply_execution_result.json not found."
              )

          protected_tokens = [
              "canonical_row",
              "pattern_logic",
              "tips_generation",
              "personalization",
              "localization",
              "recommendation_logic",
              "Phase 1",
              "Phase 2",
              "Phase 3",
              "Phase 4 - Personalization",
              "Phase 4.5 - Localization",
              "Phase 5 - Productionization",
              "Phase 6 - Hardening and Scaling",
              "Phase 7 - Games Recommendation",
          ]

          allowed_roots = [
              "tools/",
              "artifacts/",
              ".github/workflows/",
              "docs/",
          ]

          for item in written_files:
              normalized = str(item).replace("\\", "/")

              if any(
                  token.lower() in normalized.lower()
                  for token in protected_tokens
              ):
                  policy_violations.append(
                      f"Protected scope change rejected: {normalized}"
                  )
                  continue

              if not any(
                  normalized.startswith(prefix)
                  for prefix in allowed_roots
              ):
                  policy_violations.append(
                      f"Change outside allowed roots rejected: {normalized}"
                  )
                  continue

              changed_files.append(
                  normalized
              )

          #
          # Capture actual git working tree changes.
          #

          try:
              proc = subprocess.run(
                  [
                      "git",
                      "status",
                      "--short",
                  ],
                  check=False,
                  capture_output=True,
                  text=True,
              )

              git_status_short = proc.stdout.splitlines()

          except Exception as exc:
              git_status_short = []
              notes.append(
                  f"Could not inspect git status: {exc}"
              )

          repository_changes_applied = bool(
              changed_files
              or git_status_short
          )

          payload = {
              "schema":
                  "rga.repository_changes.v1.1",

              "executor_mode":
                  mode,

              "repository_changes_applied":
                  repository_changes_applied,

              "changed_files_from_executor":
                  changed_files,

              "git_status_short":
                  git_status_short,

              "policy_violations":
                  policy_violations,

              "notes":
                  notes,

              "allowed_scope":
                  allowed_roots,

              "protected_scopes":
                  protected_tokens,

              "completed_phases_immutable":
                  True,

              "governance_note": (
                  "Repository change evidence is derived from runtime_executor "
                  "outputs and git status. This step does not approve changes."
              )
          }

          Path(
              "artifacts/repository_changes.json"
          ).write_text(
              json.dumps(
                  payload,
                  indent=2,
                  ensure_ascii=False,
              ),
              encoding="utf-8",
          )
          PY


