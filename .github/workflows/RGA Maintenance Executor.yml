          cat > artifacts/build_execution_provenance.py <<'PY'
          import json
          from datetime import datetime, timezone
          from pathlib import Path

          provenance_path = Path(
              "artifacts/execution_provenance.json"
          )

          #
          # Prefer runtime_executor.py emitted artifact.
          #

          if provenance_path.exists() and provenance_path.stat().st_size > 0:
              raise SystemExit(0)

          def read_json(path: Path):
              if not path.exists() or path.stat().st_size == 0:
                  return {}

              try:
                  return json.loads(
                      path.read_text(
                          encoding="utf-8",
                      )
                  )
              except Exception:
                  return {}

          apply_result = read_json(
              Path("artifacts/apply_execution_result.json")
          )

          executor_manifest = read_json(
              Path("artifacts/executor_write_manifest.json")
          )

          repository_changes = read_json(
              Path("artifacts/repository_changes.json")
          )

          execution_commit_manifest = read_json(
              Path("artifacts/execution_commit_manifest.json")
          )

          execution_git_commit_result = read_json(
              Path("artifacts/execution_git_commit_result.json")
          )

          execution_pull_request_candidate = read_json(
              Path("artifacts/execution_pull_request_candidate.json")
          )

          execution_pull_request_result = read_json(
              Path("artifacts/execution_pull_request_result.json")
          )

          executor_written_files = list(
              executor_manifest.get(
                  "executor_written_files",
                  [],
              )
          )

          changed_files_from_executor = list(
              repository_changes.get(
                  "changed_files_from_executor",
                  [],
              )
          )

          commit_candidate_files = list(
              execution_commit_manifest.get(
                  "commit_candidate_files",
                  [],
              )
          )

          policy_violations = []

          policy_violations.extend(
              executor_manifest.get(
                  "policy_violations",
                  [],
              )
          )

          policy_violations.extend(
              repository_changes.get(
                  "policy_violations",
                  [],
              )
          )

          policy_violations.extend(
              execution_commit_manifest.get(
                  "policy_violations",
                  [],
              )
          )

          policy_violations.extend(
              execution_pull_request_candidate.get(
                  "policy_violations",
                  [],
              )
          )

          protected_scope_touched = bool(
              executor_manifest.get(
                  "protected_scope_touched",
                  False,
              )
          )

          completed_phases_modified = bool(
              executor_manifest.get(
                  "completed_phases_modified",
                  False,
              )
          )

          database_mutation_performed = bool(
              executor_manifest.get(
                  "database_mutation_performed",
                  False,
              )
          )

          source_asset_deletion_performed = bool(
              executor_manifest.get(
                  "source_asset_deletion_performed",
                  False,
              )
          )

          if policy_violations:
              verdict = "patch_provenance_blocked"

          elif (
              protected_scope_touched
              or completed_phases_modified
              or database_mutation_performed
              or source_asset_deletion_performed
          ):
              verdict = "patch_provenance_blocked"

          elif (
              executor_written_files
              and set(executor_written_files) == set(commit_candidate_files)
          ):
              verdict = "patch_provenance_ready"

          elif executor_written_files:
              verdict = "patch_provenance_incomplete"

          else:
              verdict = "traceable_no_patch"

          payload = {
              "schema":
                  "rga.execution_provenance.v1.0",

              "generated_at":
                  datetime.now(
                      timezone.utc
                  ).replace(
                      microsecond=0
                  ).isoformat(),

              "producer":
                  "workflow_fallback",

              "lifecycle_stage":
                  "execute",

              "source_artifacts": {
