          exit 0

      ############################################################
      # Execution Plan Fingerprint
      #
      # execution_plan.json is a plan-stage proposal artifact.
      #
      # Runtime Auditor plan-audit reviews:
      #
      #   - execution_plan.json
      #   - database_mutation_plan.json
      #
      # Human approval is expected to approve the reviewed plan.
      #
      # Execute stage must preserve the approved plan and should
      # verify that the approved artifact has not changed.
      ############################################################

      - name: Execution Plan Fingerprint
        if: always()
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p artifacts

          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path
          from datetime import datetime, timezone

          plan_path = Path(
              "artifacts/execution_plan.json"
          )

          mutation_plan_path = Path(
              "artifacts/database_mutation_plan.json"
          )

          fingerprint = None
          plan_schema = None
          plan_mode = None
          plan_parseable = False

          if plan_path.exists() and plan_path.is_file():

              raw = plan_path.read_bytes()

              fingerprint = hashlib.sha256(
                  raw
              ).hexdigest()

              try:
                  plan_data = json.loads(
                      raw.decode(
                          "utf-8"
                      )
                  )

                  plan_parseable = True

                  plan_schema = plan_data.get(
                      "schema"
                  )

                  plan_mode = plan_data.get(
                      "mode"
                  )

              except Exception:
                  pass

          mutation_fingerprint = None

          if (
              mutation_plan_path.exists()
              and mutation_plan_path.is_file()
          ):
              mutation_fingerprint = hashlib.sha256(
                  mutation_plan_path.read_bytes()
              ).hexdigest()

          payload = {
              "schema":
                  "rga.execution_plan_fingerprint.v1.1",

              "generated_at":
                  datetime.now(
                      timezone.utc
                  ).replace(
                      microsecond=0
                  ).isoformat(),

              "artifact_role":
                  "plan_fingerprint",

              "plan_stage_artifact":
                  True,

              "runtime_auditor_plan_audit_required":
                  True,

              "human_approval_required":
                  True,

              "execution_stage_may_modify_plan":
                  False,

              "execution_stage_may_modify_mutation_plan":
                  False,

              "execution_plan": {
                  "path":
                      str(plan_path),

                  "present":
                      plan_path.exists()
                      and plan_path.is_file(),

                  "parseable":
                      plan_parseable,

                  "schema":
                      plan_schema,

                  "mode":
                      plan_mode,

                  "sha256":
                      fingerprint,
              },

              "database_mutation_plan": {
                  "path":
                      str(mutation_plan_path),

                  "present":
                      mutation_plan_path.exists()
                      and mutation_plan_path.is_file(),

                  "sha256":
                      mutation_fingerprint,
              },

              "approval_matching_contract": {
                  "artifact":
                      "artifacts/approval_artifact_matching.json",

                  "expected_inputs": [
                      "execution_plan.json",
                      "database_mutation_plan.json",
                  ],
              },

              "lifecycle_sequence": [
                  "bot_2_plan",
                  "bot_1_plan_audit",
                  "human_approval",
                  "bot_2_execute",
                  "bot_1_post_audit",
              ],
          }

          Path(
              "artifacts/execution_plan_fingerprint.json"
          ).write_text(
              json.dumps(
                  payload,
                  indent=2,
                  ensure_ascii=False,
              ),
              encoding="utf-8",
          )
          PY
          
      ############################################################
      # Approval Artifact Matching
      #
      # Verifies that:
      #
      #   - execution_plan.json
      #   - database_mutation_plan.json
      #
      # match the artifacts reviewed during:
      #
      #   Bot #1 plan_audit
      #
      # and approved during:
      #
      #   human_approval
      #
      # Execute stage must not execute an unapproved
      # or modified proposal set.
      ############################################################

      - name: Approval Artifact Matching
        if: always()
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          fingerprint_file = Path(
              "artifacts/execution_plan_fingerprint.json"
          )

          approval_file = Path(
              "artifacts/human_execution_approval.json"
          )

          plan_file = Path(
              "artifacts/execution_plan.json"
          )

          mutation_file = Path(
              "artifacts/database_mutation_plan.json"
          )

          approval_present = approval_file.exists()
          fingerprint_present = fingerprint_file.exists()

          approval_matches_plan = False
          approval_matches_mutation_plan = False

          violations = []

          approval = {}
          fingerprint = {}

          if approval_present:
              try:
                  approval = json.loads(
                      approval_file.read_text(
                          encoding="utf-8"
                      )
                  )
              except Exception as exc:
                  violations.append(
                      f"Could not parse approval artifact: {exc}"
                  )

          if fingerprint_present:
              try:
                  fingerprint = json.loads(
                      fingerprint_file.read_text(
                          encoding="utf-8"
                      )
                  )
              except Exception as exc:
                  violations.append(
                      f"Could not parse execution plan fingerprint: {exc}"
                  )

          approved_plan_sha = (
              approval.get(
                  "approved_execution_plan_fingerprint"
              )
          )

          approved_mutation_sha = (
              approval.get(
                  "approved_database_mutation_plan_fingerprint"
              )
          )

          plan_sha = (
              fingerprint.get(
                  "execution_plan",
                  {},
              ).get(
                  "sha256"
              )
          )

          mutation_sha = (
              fingerprint.get(
                  "database_mutation_plan",
                  {},
              ).get(
                  "sha256"
              )
          )

          if (
              approved_plan_sha
              and plan_sha
          ):
              approval_matches_plan = (
                  approved_plan_sha
                  == plan_sha
              )

          if (
              approved_mutation_sha
              and mutation_sha
          ):
              approval_matches_mutation_plan = (
                  approved_mutation_sha
                  == mutation_sha
              )

          if not approval_present:
              violations.append(
                  "human_execution_approval.json is missing."
              )

          if not fingerprint_present:
              violations.append(
                  "execution_plan_fingerprint.json is missing."
              )

          payload = {
              "schema":
                  "rga.approval_artifact_matching.v1.1",

              "approval_artifact_present":
                  approval_present,

              "fingerprint_artifact_present":
                  fingerprint_present,

              "execution_plan_present":
                  plan_file.exists(),

              "database_mutation_plan_present":
                  mutation_file.exists(),

              "approval_matches_execution_plan":
                  approval_matches_plan,

              "approval_matches_database_mutation_plan":
                  approval_matches_mutation_plan,

              "all_required_matches_passed":
                  (
                      approval_matches_plan
                      and
                      approval_matches_mutation_plan
                  ),

              "policy_violations":
                  violations,
          }

          Path(
              "artifacts/approval_artifact_matching.json"
          ).write_text(
              json.dumps(
                  payload,
                  indent=2,
                  ensure_ascii=False,
              ),
              encoding="utf-8",
          ) 
          PY

