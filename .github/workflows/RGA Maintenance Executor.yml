name: RGA Maintenance Executor

on:
  workflow_dispatch:
    inputs:
      executor_mode:
        description: >-
          Bot #2 executor mode.

          plan:
          Generate an implementation plan from Bot #1 pre-audit evidence.

          dry_run_execute:
          Simulate execution and generate execution evidence without
          mutating repository state.

          execute:
          Apply gated execution after Bot #1 plan-audit and human approval.
        required: false
        default: "plan"
        type: choice
        options:
          - plan
          - dry_run_execute
          - execute

      audit_session_id:
        description: >-
          Optional lifecycle correlation id linking:
          Bot #1 pre-audit,
          Bot #2 implementation plan,
          Bot #1 plan-audit,
          human approval,
          Bot #2 execution,
          and Bot #1 post-audit.
        required: false
        default: ""

      pre_audit_report:
        description: >-
          Bot #1 pre-audit report path.

          This is the source material for Bot #2 implementation planning.
          Used when executor_mode=plan.
        required: false
        default: "artifacts/runtime_auditor_report.json"

      execution_plan:
        description: >-
          Bot #2 implementation / execution plan path.

          Used by dry_run_execute and execute stages.
        required: false
        default: "artifacts/execution_plan.json"

      approval_artifact:
        description: >-
          Human approval artifact path.

          Required before execute mode may apply gated execution.
        required: false
        default: "artifacts/human_execution_approval.json"

      execution_approval:
        description: >-
          Optional approval phrase for execute mode.

          Expected value:
          APPROVE_RGA_EXECUTION

          This does not replace the approval artifact; it is an additional
          safety signal for gated execution.
        required: false
        default: ""

jobs:
  maintenance-execution:
    runs-on: ubuntu-latest

    permissions:
      contents: write
      actions: write
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Prepare Artifact Directory
        run: |
          mkdir -p artifacts
          python3 - <<'PY'
          import json
          from pathlib import Path

          payload = {
              "schema": "rga.maintenance_lifecycle_context.v1.0",
              "workflow": "RGA Maintenance Executor",
              "bot": "rga_executor_bot",
              "bot_role": "planner_executor",
              "lifecycle_model": [
                  "bot_1_pre_audit",
                  "bot_2_implementation_plan",
                  "bot_1_plan_audit",
                  "human_approval",
                  "bot_2_execute",
                  "bot_1_post_audit",
              ],
              "authority": {
                  "bot_2_may_plan": True,
                  "bot_2_may_execute": True,
                  "bot_2_may_approve": False,
                  "bot_2_may_self_approve": False,
                  "human_approval_required": True,
              },
              "phase_boundary_policy": {
                  "completed_phases_immutable": True,
                  "canonical_row_modification_allowed": False,
                  "pattern_logic_modification_allowed": False,
                  "tips_generation_modification_allowed": False,
                  "personalization_modification_allowed": False,
                  "localization_modification_allowed": False,
                  "recommendation_logic_modification_allowed": False,
              },
          }

          Path("artifacts/maintenance_lifecycle_context.json").write_text(
              json.dumps(payload, indent=2),
              encoding="utf-8",
          )
          PY
          
      ############################################################
      # Execution Gate
      ############################################################

      - name: Execution Gate
        id: execution_gate
        env:
          EXECUTOR_MODE: ${{ inputs.executor_mode }}
          APPROVAL_ARTIFACT: ${{ inputs.approval_artifact }}
        run: |
          set -euo pipefail

          MODE="${EXECUTOR_MODE:-plan}"
          if [ -z "$MODE" ]; then
            MODE="plan"
          fi

          APPROVAL="${APPROVAL_ARTIFACT:-artifacts/human_execution_approval.json}"
          if [ -z "$APPROVAL" ]; then
            APPROVAL="artifacts/human_execution_approval.json"
          fi

          STATUS="allowed"
          REASON="Mode accepted"

          if [ "$MODE" = "execute" ] && [ ! -f "$APPROVAL" ]; then
            STATUS="blocked"
            REASON="Approval artifact missing"
          fi

          export MODE STATUS REASON

          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          payload = {
              "schema": "rga.execution_gate.v1.0",
              "requested_mode": os.environ.get("MODE", ""),
              "status": os.environ.get("STATUS", ""),
              "reason": os.environ.get("REASON", ""),
          }
          Path("artifacts/execution_gate.json").write_text(
              json.dumps(payload, indent=2),
              encoding="utf-8",
          )
          PY


      ############################################################
      # Human Approval Artifact audit
      ############################################################

      - name: Human Approval Artifact audit
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
     
          p = Path('artifacts/human_execution_approval.json')

          payload = {
              'schema':'rga.approval_audit.v1.0',
              'artifact_present': p.exists()
          }
          Path('artifacts/approval_audit.json').write_text(
              json.dumps(payload, indent=2),
              encoding='utf-8'
          )
          PY
          
      ############################################################
      # Run Runtime Executor
      #
      # Bot #2 lifecycle role:
      #
      #   plan:
      #     Generate implementation plan from Bot #1 pre-audit evidence.
      #
      #   dry_run_execute:
      #     Simulate execution and produce execution evidence without
      #     mutating repository state.
      #
      #   execute:
      #     Apply gated execution only after Bot #1 plan-audit and
      #     human approval.
      #
      # This step intentionally preserves:
      #
      #   runtime_executor_report.json
      #   runtime_executor_report.md
      #   execution_plan.json
      #   runtime_executor_stdout.txt
      #   runtime_executor_stderr.txt
      #   runtime_executor_stderr_summary.json
      #   runtime_executor_exit_code.txt
      #
      # Empty stderr is not treated as a failure. It is summarized as
      # explicit zero-error evidence.
      ############################################################

      - name: Run Runtime Executor
        id: run_runtime_executor
        continue-on-error: true
        shell: bash
        env:
          EXECUTOR_MODE: ${{ inputs.executor_mode }}
          EXECUTION_PLAN_IN: ${{ inputs.execution_plan }}
          PRE_AUDIT_REPORT_IN: ${{ inputs.pre_audit_report }}
        run: |
          set -uo pipefail

          mkdir -p artifacts

          MODE="${EXECUTOR_MODE:-dry_run_execute}"
          EXECUTION_PLAN="${EXECUTION_PLAN_IN:-artifacts/execution_plan.json}"
          PRE_AUDIT_REPORT="${PRE_AUDIT_REPORT_IN:-artifacts/runtime_auditor_report.json}"

          set +e

          python tools/runtime_executor.py \
            --mode "${MODE}" \
            --execution-plan "${EXECUTION_PLAN}" \
            --pre-audit-report "${PRE_AUDIT_REPORT}" \
            --json-out "artifacts/execution_plan.json" \
            --report-json-out "artifacts/runtime_executor_report.json" \
            --md-out "artifacts/runtime_executor_report.md" \
            > "artifacts/runtime_executor_stdout.txt" \
            2> "artifacts/runtime_executor_stderr.txt"

          EXECUTOR_EXIT_CODE="$?"

          set -e

          echo "${EXECUTOR_EXIT_CODE}" > artifacts/runtime_executor_exit_code.txt

          ########################################################
          # Ensure stdout / stderr artifacts exist
          ########################################################

          if [ ! -f artifacts/runtime_executor_stdout.txt ]; then
            touch artifacts/runtime_executor_stdout.txt
          fi

          if [ ! -f artifacts/runtime_executor_stderr.txt ]; then
            touch artifacts/runtime_executor_stderr.txt
          fi

          ########################################################
          # Structured stderr summary
          ########################################################

          STDERR_PRESENT="false"
          STDERR_EMPTY="true"

          STDOUT_PRESENT="false"
          STDOUT_EMPTY="true"

          ERROR_MARKER_COUNT="0"
          WARNING_MARKER_COUNT="0"

          if [ -f artifacts/runtime_executor_stderr.txt ]; then
            STDERR_PRESENT="true"

            if [ -s artifacts/runtime_executor_stderr.txt ]; then
              STDERR_EMPTY="false"
            fi
          fi

          if [ -f artifacts/runtime_executor_stdout.txt ]; then
            STDOUT_PRESENT="true"

            if [ -s artifacts/runtime_executor_stdout.txt ]; then
              STDOUT_EMPTY="false"
            fi
          fi

          ERROR_MARKER_COUNT="$(
            {
              grep -E \
                'Traceback|Error|Exception|ModuleNotFoundError|RuntimeError|ValueError' \
                artifacts/runtime_executor_stderr.txt \
                2>/dev/null \
                || true
            } \
              | wc -l \
              | tr -d ' '
          )"

          WARNING_MARKER_COUNT="$(
            {
              grep -E \
                'warning|Warning|WARN' \
                artifacts/runtime_executor_stderr.txt \
                2>/dev/null \
                || true
            } \
              | wc -l \
              | tr -d ' '
          )"

          EXEC_FAILED="false"
          if [ "${EXECUTOR_EXIT_CODE}" != "0" ]; then
            EXEC_FAILED="true"
          fi

          jq -n \
            --argjson stderr_present ${STDERR_PRESENT} \
            --argjson stderr_empty ${STDERR_EMPTY} \
            --argjson stdout_present ${STDOUT_PRESENT} \
            --argjson stdout_empty ${STDOUT_EMPTY} \
            --argjson exit_code ${EXECUTOR_EXIT_CODE} \
            --argjson failed ${EXEC_FAILED} \
            --argjson err_count ${ERROR_MARKER_COUNT} \
            --argjson warn_count ${WARNING_MARKER_COUNT} \
            '{
              schema: "rga.runtime_executor.stderr_summary.v1.0",
              stderr_present: $stderr_present,
              stderr_empty: $stderr_empty,
              stdout_present: $stdout_present,
              stdout_empty: $stdout_empty,
              executor_exit_code: $exit_code,
              execution_failed: $failed,
              error_marker_count: $err_count,
              warning_marker_count: $warn_count
            }' > artifacts/runtime_executor_stderr_summary.json

          ########################################################
          # Fallback runtime_executor_report.json
          ########################################################

          if [ ! -s artifacts/runtime_executor_report.json ]; then

            jq -n \
              --argjson exit_code ${EXECUTOR_EXIT_CODE} \
              --argjson stdout_present ${STDOUT_PRESENT} \
              --argjson stderr_present ${STDERR_PRESENT} \
              --argjson stdout_empty ${STDOUT_EMPTY} \
              --argjson stderr_empty ${STDERR_EMPTY} \
              '{
                schema: "rga.runtime_executor.report.fallback.v1.0",
                mode: null,
                proposal_only: null,
                dry_run: null,
                execution_authority: false,
                approval_authority: false,
                plan: {},
                dry_run_result: {},
                apply_execution_result: {},
                diagnostics: {
                  fallback_report_generated: true,
                  executor_exit_code: $exit_code,
                  stdout_present: $stdout_present,
                  stderr_present: $stderr_present,
                  stdout_empty: $stdout_empty,
                  stderr_empty: $stderr_empty,
                  policy_result: {
                    policy_passed: false,
                    violations: [
                      "runtime_executor.py did not emit runtime_executor_report.json."
                    ]
                  }
                }
              }' > artifacts/runtime_executor_report.json

          fi

          ########################################################
          # Fallback runtime_executor_report.md
          ########################################################
          if [ ! -s artifacts/runtime_executor_report.md ]; then
            cat > artifacts/runtime_executor_report.md <<'MD'
          # RGA Runtime Executor Report

          ## Fallback Report

          `runtime_executor.py` did not emit a non-empty Markdown report.

          See:

          - `runtime_executor_report.json`
          - `runtime_executor_stdout.txt`
          - `runtime_executor_stderr.txt`
          - `runtime_executor_stderr_summary.json`
          - `runtime_executor_exit_code.txt`
          MD
          fi

          echo "Runtime executor exit code: ${EXECUTOR_EXIT_CODE}"
          echo "Runtime executor evidence artifacts generated."
          
          exit 0
          
      ############################################################
      # Write Database Mutation Contract
      ############################################################

      - name: Write Database Mutation Contract
        if: ${{ always() && inputs.executor_mode == 'plan' }}
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          runtime_baseline = Path(
              "artifacts/runtime_baseline.json"
          )

          payload = {
              "schema": "rga.database_mutation_plan.v1.0",

              "workflow": "RGA Maintenance Executor",

              "bot": "rga_executor_bot",

              "lifecycle_stage": "bot_2_plan",

              "runtime_baseline": str(runtime_baseline),

              "approval": {
                  "required": True,
                  "approved": False,
              },

              "policy": {
                  "validation_required": True,
                  "validated": False,
              },

              "proposed_mutations": []
          }

          Path(
              "artifacts/database_mutation_plan.json"
          ).write_text(
              json.dumps(
                  payload,
                  indent=2,
                  ensure_ascii=False,
              ),
              encoding="utf-8",
          )

          print(
              "[RGA] database_mutation_plan.json generated"
          )
          PY
          
      ############################################################
      # Write Persistence Contract
      ############################################################

      - name: Write Persistence Contract
        if: ${{ always() && inputs.executor_mode == 'plan' }}
        shell: python
 
        run: |
          import json
          from pathlib import Path

          mutation_plan = Path(
              "artifacts/database_mutation_plan.json"
          )

          payload = {
              "schema":
                  "rga.persistence_contract.v1.0",

              "workflow":
                  "RGA Maintenance Executor",

              "bot":
                  "rga_executor_bot",

              "lifecycle_stage":
                  "stage_4_persistence_contract",

              "source_contract":
                  str(mutation_plan),

              "ownership": {
                  "planner": "bot_2",
                  "executor": "persistence_layer",
                  "approver": "human",
                  "policy_validator": "deployment_gate",
              },

              "permissions": {
                  "executor_may_write_db": False,
                  "persistence_layer_owns_db_writes": True,
                  "human_approval_required": True,
                  "deployment_gate_required": True,
              },

              "runtime_requirements": {
                  "runtime_baseline_required": True,
                  "mutation_validation_required": True,
              },

              "status": {
                  "approved": False,
                  "validated": False,
                  "executed": False,
              },
          }

          Path(
              "artifacts/persistence_contract.json"
          ).write_text(
              json.dumps(
                  payload,
                  indent=2,
                  ensure_ascii=False,
              ),
              encoding="utf-8",
          )

          print(
              "[RGA] persistence_contract.json generated"
          )        

      ############################################################
      # Execution Plan Fingerprint
      ############################################################

      - name: Execution Plan Fingerprint
        if: always()
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p artifacts

          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          plan_path = Path(
              "artifacts/execution_plan.json"
          )

          fingerprint = None

          if plan_path.exists() and plan_path.is_file():
              fingerprint = hashlib.sha256(
                  plan_path.read_bytes()
              ).hexdigest()

          payload = {
              "schema":
                  "rga.execution_plan_fingerprint.v1.0",

              "execution_plan_present":
                  plan_path.exists()
                  and plan_path.is_file(),

             "sha256":
                  fingerprint,
          }

          Path(
              "artifacts/execution_plan_fingerprint.json"
          ).write_text(
              json.dumps(
                  payload,
                  indent=2,
                  ensure_ascii=False,
              ),
              encoding="utf-8",
          )
          PY
          
      ############################################################
      # Approval Artifact Matching
      ############################################################

      - name: Approval Artifact Matching
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          match = False

          plan_file = Path(
              "artifacts/execution_plan.json"
          )

          approval_file = Path(
              "artifacts/human_execution_approval.json"
          )

          if (
              plan_file.exists()
              and approval_file.exists()
          ):
              plan = json.loads(
                  plan_file.read_text(
                      encoding="utf-8"
                  )
              )

              approval = json.loads(
                  approval_file.read_text(
                      encoding="utf-8"
                  )
              )

              approved_plan = (
                  approval.get(
                      "approved_execution_plan",
                      {},
                  )
              )

              match = (
                  approved_plan.get("schema")
                  == plan.get("plan", {}).get("schema")
              )

          payload = {
              "schema":
                  "rga.approval_artifact_matching.v1.0",

              "approval_matches_plan":
                  match,
          }

          Path(
              "artifacts/approval_artifact_matching.json"
          ).write_text(
              json.dumps(
                  payload,
                  indent=2,
              ),
              encoding="utf-8",
          )
          PY
          
      ############################################################
      # Execution Scope audit
      ############################################################

      - name: Execution Scope audit
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          payload = {
              "schema": "rga.execution_scope_audit.v1.0",
              "protected_scopes": [
                  "canonical_row",
                  "pattern_logic",
                  "tips_generation",
                  "personalization",
                  "localization",
                  "recommendation_logic",
              ],
              "completed_phases_immutable": True,
          }
          Path("artifacts/execution_scope_audit.json").write_text(
              json.dumps(payload, indent=2),
              encoding="utf-8",
          )
          PY

      ############################################################
      # Execution Policy audit
      ############################################################

      - name: Execution Policy audit
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          payload = {
              "schema": "rga.execution_policy_audit.v1.0",
              "execution_authority": True,
              "approval_authority": False,
              "self_approval": False,
              "human_approval_required": True,
              "plan_audit_required": True,
              "post_audit_required": True,
          }
          Path("artifacts/execution_policy_audit.json").write_text(
              json.dumps(payload, indent=2),
              encoding="utf-8",
          )
          PY
          

      ############################################################
      # Apply Execution Result
      ############################################################

      - name: Apply Execution Result
        if: always()
        run: |
          mkdir -p artifacts

          python - <<'PY'
          import json
          from pathlib import Path

          executor_report_file = Path(
              "artifacts/execution_plan.json"
          )

          result = {}

          if executor_report_file.exists():
              try:
                  executor_report = json.loads(
                      executor_report_file.read_text(
                          encoding="utf-8",
                      )
                  )

                  result = executor_report.get(
                      "apply_execution_result",
                      {},
                  )

              except Exception as exc:
                  result = {
                      "schema":
                          "rga.apply_execution_result.v1.0",

                      "execution_attempted":
                          False,

                      "execution_performed":
                          False,

                      "written_files":
                          [],

                      "policy_violations": [
                          f"Could not parse executor report: {exc}"
                      ],

                      "post_audit_required":
                          True,
                  }

          if not result:
              result = {
                  "schema":
                      "rga.apply_execution_result.v1.0",

                  "execution_attempted":
                      False,

                  "execution_performed":
                      False,

                  "written_files":
                      [],

                  "policy_violations":
                      [],

                  "post_audit_required":
                      True,

                  "note":
                      "No apply_execution_result was emitted by runtime_executor.py."
              }

          Path(
              "artifacts/apply_execution_result.json"
          ).write_text(
              json.dumps(
                  result,
                  indent=2,
                  ensure_ascii=False,
              ),
              encoding="utf-8",
          )
          PY
          
      ############################################################
      # Apply Repository Changes
      ############################################################

      - name: Apply Repository Changes
        if: always()
        env:
          EXECUTOR_MODE: ${{ inputs.executor_mode }}
        run: |
          set +e

          python - <<'PY'
          import json
          import os
          from pathlib import Path
          import subprocess

          mode = os.environ.get("EXECUTOR_MODE", "")

          apply_result_file = Path(
              "artifacts/apply_execution_result.json"
          )

          repository_changes_applied = False
          changed_files = []
          written_files = []
          notes = []
          policy_violations = []

          if apply_result_file.exists():

              try:
                  result = json.loads(
                      apply_result_file.read_text(
                          encoding="utf-8"
                      )
                  )

                  written_files = result.get(
                      "written_files",
                      [],
                  )

                  policy_violations = result.get(
                      "policy_violations",
                      [],
                  )

              except Exception as exc:
                  notes.append(
                      f"Could not parse apply_execution_result.json: {exc}"
                  )

          else:
              notes.append(
                  "apply_execution_result.json not found."
              )

          protected_tokens = [
              "canonical_row",
              "pattern_logic",
              "tips_generation",
              "personalization",
              "localization",
              "recommendation_logic",
              "Phase 1",
              "Phase 2",
              "Phase 3",
              "Phase 4 - Personalization",
              "Phase 4.5 - Localization",
              "Phase 5 - Productionization",
              "Phase 6 - Hardening and Scaling",
              "Phase 7 - Games Recommendation",
          ]

          allowed_roots = [
              "tools/",
              "artifacts/",
              ".github/workflows/",
              "docs/",
          ]

          for item in written_files:
              normalized = str(item).replace("\\", "/")

              if any(
                  token.lower() in normalized.lower()
                  for token in protected_tokens
              ):
                  policy_violations.append(
                      f"Protected scope change rejected: {normalized}"
                  )
                  continue

              if not any(
                  normalized.startswith(prefix)
                  for prefix in allowed_roots
              ):
                  policy_violations.append(
                      f"Change outside allowed roots rejected: {normalized}"
                  )
                  continue

              changed_files.append(
                  normalized
              )

          #
          # Capture actual git working tree changes.
          #

          try:
              proc = subprocess.run(
                  [
                      "git",
                      "status",
                      "--short",
                  ],
                  check=False,
                  capture_output=True,
                  text=True,
              )

              git_status_short = proc.stdout.splitlines()

          except Exception as exc:
              git_status_short = []
              notes.append(
                  f"Could not inspect git status: {exc}"
              )

          repository_changes_applied = bool(
              changed_files
              or git_status_short
          )

          payload = {
              "schema":
                  "rga.repository_changes.v1.1",

              "executor_mode":
                  mode,

              "repository_changes_applied":
                  repository_changes_applied,

              "changed_files_from_executor":
                  changed_files,

              "git_status_short":
                  git_status_short,

              "policy_violations":
                  policy_violations,

              "notes":
                  notes,

              "allowed_scope":
                  allowed_roots,

              "protected_scopes":
                  protected_tokens,

              "completed_phases_immutable":
                  True,

              "governance_note": (
                  "Repository change evidence is derived from runtime_executor "
                  "outputs and git status. This step does not approve changes."
              )
          }

          Path(
              "artifacts/repository_changes.json"
          ).write_text(
              json.dumps(
                  payload,
                  indent=2,
                  ensure_ascii=False,
              ),
              encoding="utf-8",
          )
          PY


      ############################################################
      # Execution Commit Manifest
      ############################################################

      - name: Execution Commit Manifest
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          repository_changes = Path(
              "artifacts/repository_changes.json"
          )

          changed_files = []
          git_status_short = []
          policy_violations = []

          if repository_changes.exists():

              data = json.loads(
                  repository_changes.read_text(
                      encoding="utf-8"
                  )
              )

              changed_files = data.get(
                  "changed_files_from_executor",
                  []
              )

              git_status_short = data.get(
                  "git_status_short",
                  []
              )

              policy_violations = data.get(
                  "policy_violations",
                  []
              )

          commit_required = bool(
              git_status_short
          ) and not policy_violations

          payload = {

              "schema":
                  "rga.execution_commit_manifest.v1.1",

              "commit_required":
                  commit_required,

