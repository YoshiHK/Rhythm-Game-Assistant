name: RGA Lifecycle Runner

on:
  workflow_dispatch:
    inputs:
      lifecycle_stage:
        description: >
          Stage to start or resume.
          One of: pre_audit, plan, plan_audit, human_approval, execute, post_audit.
        required: true
        default: pre_audit
        type: choice
        options:
          - pre_audit
          - plan
          - plan_audit
          - human_approval
          - execute
          - post_audit

      ref:
        description: Git ref, branch, or SHA to dispatch downstream workflows on.
        required: false
        default: main

      audit_session_id:
        description: Optional lifecycle session id. If empty, the runner creates one.
        required: false
        default: ""

      pre_audit_report:
        description: Bot #1 Auditor pre-audit report path.
        required: false
        default: artifacts/runtime_auditor_report.json

      execution_plan:
        description: Bot #2 execution plan path.
        required: false
        default: artifacts/execution_plan.json

      approval_artifact:
        description: Human approval artifact path.
        required: false
        default: artifacts/human_execution_approval.json

      execution_approval:
        description: Approval phrase for execute stage. Expected APPROVE_RGA_EXECUTION.
        required: false
        default: ""

  workflow_run:
    workflows:
      - RGA Runtime Auditor
      - RGA Maintenance Executor
    types:
      - completed

permissions:
  actions: write
  contents: read

jobs:
  lifecycle-runner:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare lifecycle context
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          MANUAL_STAGE: ${{ github.event.inputs.lifecycle_stage }}
          MANUAL_REF: ${{ github.event.inputs.ref }}
          MANUAL_SESSION: ${{ github.event.inputs.audit_session_id }}
          MANUAL_PRE_AUDIT_REPORT: ${{ github.event.inputs.pre_audit_report }}
          MANUAL_EXECUTION_PLAN: ${{ github.event.inputs.execution_plan }}
          MANUAL_APPROVAL_ARTIFACT: ${{ github.event.inputs.approval_artifact }}
          MANUAL_EXECUTION_APPROVAL: ${{ github.event.inputs.execution_approval }}
          TRIGGERING_WORKFLOW: ${{ github.event.workflow_run.name }}
          TRIGGERING_RUN_ID: ${{ github.event.workflow_run.id }}
          TRIGGERING_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          DEFAULT_REF: ${{ github.ref_name }}

        run: |
          set -euo pipefail
          mkdir -p \
            artifacts \
            lifecycle_trigger

          #
          # Lifecycle Stages
          #
          # pre_audit
          # plan
          # plan_audit
          # human_approval
          # execute
          # post_audit
          #

          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            STAGE="$MANUAL_STAGE"
            REF_INPUT="${MANUAL_REF:-main}"
            AUDIT_SESSION_ID="$MANUAL_SESSION"
            PRE_AUDIT_REPORT="${MANUAL_PRE_AUDIT_REPORT:-artifacts/runtime_auditor_report.json}"
            EXECUTION_PLAN="${MANUAL_EXECUTION_PLAN:-artifacts/execution_plan.json}"
            APPROVAL_ARTIFACT="${MANUAL_APPROVAL_ARTIFACT:-artifacts/human_execution_approval.json}"
            EXECUTION_APPROVAL="${MANUAL_EXECUTION_APPROVAL:-}"
            TRIGGER_SOURCE="manual"

          else
            STAGE="auto_detect"
            REF_INPUT="${DEFAULT_REF:-main}"
            AUDIT_SESSION_ID=""
            PRE_AUDIT_REPORT="artifacts/runtime_auditor_report.json"
            EXECUTION_PLAN="artifacts/execution_plan.json"
            APPROVAL_ARTIFACT="artifacts/human_execution_approval.json"
            EXECUTION_APPROVAL=""
            TRIGGER_SOURCE="workflow_run"
          fi

          if [ -z "$AUDIT_SESSION_ID" ]; then
            AUDIT_SESSION_ID="rga-session-$(date -u +%Y%m%dT%H%M%SZ)"
          fi

          export STAGE
          export REF_INPUT
          export AUDIT_SESSION_ID
          export PRE_AUDIT_REPORT
          export EXECUTION_PLAN
          export APPROVAL_ARTIFACT
          export EXECUTION_APPROVAL
          export TRIGGER_SOURCE
          export TRIGGERING_WORKFLOW
          export TRIGGERING_RUN_ID
          export TRIGGERING_CONCLUSION

          #
          # Canonical Lifecycle
          #

          export CANONICAL_LIFECYCLE="pre_audit,plan,plan_audit,human_approval,execute,post_audit"

          {
            echo "STAGE=$STAGE"
            echo "REF_INPUT=$REF_INPUT"
            echo "AUDIT_SESSION_ID=$AUDIT_SESSION_ID"
            echo "PRE_AUDIT_REPORT=$PRE_AUDIT_REPORT"
            echo "EXECUTION_PLAN=$EXECUTION_PLAN"
            echo "APPROVAL_ARTIFACT=$APPROVAL_ARTIFACT"
            echo "EXECUTION_APPROVAL=$EXECUTION_APPROVAL"
            echo "TRIGGER_SOURCE=$TRIGGER_SOURCE"
            echo "TRIGGERING_WORKFLOW=$TRIGGERING_WORKFLOW"
            echo "TRIGGERING_RUN_ID=$TRIGGERING_RUN_ID"
            echo "TRIGGERING_CONCLUSION=$TRIGGERING_CONCLUSION"
            echo "CANONICAL_LIFECYCLE=$CANONICAL_LIFECYCLE"
          } >> "$GITHUB_ENV"

      - name: Download triggering workflow artifacts
        if: ${{ github.event_name == 'workflow_run' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          mkdir -p lifecycle_trigger
          gh run download "$RUN_ID" \
            --dir lifecycle_trigger \
            || true

          find lifecycle_trigger -type f | sort > artifacts/lifecycle_trigger_files.txt || true

      - name: Determine next lifecycle stage
        shell: bash
        run: |
          set -euo pipefail

          NEXT_STAGE=""
          DISPATCH_REQUIRED="true"
          WORKFLOW_FILE=""
          DISPATCH_INPUTS="{}"
          REASON=""

          ##########################################################
          # Workflow Run Lifecycle Resolution
          #
          # Priority:
          #
          #   1. lifecycle_event.json
          #   2. legacy canonical artifact fallback
          #
          # Canonical lifecycle stages:
          #
          #   pre_audit
          #   plan
          #   plan_audit
          #   human_approval
          #   execute
          #   post_audit
          ##########################################################

          if [ "$TRIGGER_SOURCE" = "workflow_run" ]; then

            if [ "$TRIGGERING_CONCLUSION" != "success" ]; then

              STAGE="halted"
              DISPATCH_REQUIRED="false"
              REASON="Triggering workflow did not complete successfully."

            else

              ######################################################
              # Lifecycle Event Contract First
              ######################################################

              EVENT_FILE="$(
                find lifecycle_trigger \
                  -type f \
                  -name 'lifecycle_event.json' \
                  -print \
                  -quit \
                  || true
              )"

              if [ -n "$EVENT_FILE" ]; then

                echo "Lifecycle event found: $EVENT_FILE"

                STAGE="$(
                  python3 -c '
                import json
                import pathlib
                import sys

                try:
                    print(
                        json.loads(
                            pathlib.Path(
                                sys.argv[1]
                            ).read_text(
                                encoding="utf-8",
                                errors="ignore",
                            )
                        ).get(
                            "next_stage",
                            "halted",
                        )
                    )
                except Exception:
                    print("halted")
                ' "$EVENT_FILE"
                )"

                REASON="Lifecycle stage resolved from lifecycle_event.json."

              else

                ####################################################
                # Legacy Artifact Fallback
                #
                # This is retained only for backward compatibility.
                ####################################################

                echo "No lifecycle_event.json found."
                echo "Falling back to legacy artifact detection."

                if find lifecycle_trigger \
                  -type f \
                  -name 'runtime_auditor_report.json' \
                  | grep -q .
                then

                  STAGE="plan"

                elif find lifecycle_trigger \
                  -type f \
                  -name 'runtime_verifier_report.json' \
                  | grep -q .
                then

                  STAGE="plan"
                  PRE_AUDIT_REPORT="artifacts/runtime_verifier_report.json"
                  export PRE_AUDIT_REPORT

                elif find lifecycle_trigger \
                  -type f \
                  -name 'runtime_executor_report.json' \
                  | grep -q .
                then

                  if find lifecycle_trigger \
                    -type f \
                    -name 'execution_plan.json' \
                    | grep -q .
                  then

                    STAGE="plan_audit"

                  elif find lifecycle_trigger \
                    -type f \
                    -name 'apply_execution_result.json' \
                    | grep -q .
                  then

                    STAGE="post_audit"

                  else

                    STAGE="halted"
                    DISPATCH_REQUIRED="false"
                    REASON="Executor artifacts found, but no execution_plan.json or apply_execution_result.json was found."

                  fi

                elif find lifecycle_trigger \
                  -type f \
                  -name 'plan_audit_evidence.json' \
                  | grep -q .
                then

                  STAGE="human_approval"

                elif find lifecycle_trigger \
                  -type f \
                  -name 'post_audit_contract.json' \
                  | grep -q .
                then

                  STAGE="complete"
                  DISPATCH_REQUIRED="false"
                  REASON="Post-audit contract was produced; lifecycle is complete."

                else

                  STAGE="halted"
                  DISPATCH_REQUIRED="false"
                  REASON="No lifecycle_event.json or recognized legacy canonical artifact was found in triggering workflow artifacts."

                fi

              fi

            fi

          fi

          ##########################################################
          # Canonical Lifecycle Routing
          ##########################################################

          case "$STAGE" in

            pre_audit)

              WORKFLOW_FILE="RGA Runtime Auditor.yml"
              NEXT_STAGE="plan"

              DISPATCH_INPUTS="$(
                python3 -c '
                import json
                import os

                payload = {
                    "audit_mode":
                        "pre_audit",

                    "audit_session_id":
                        os.environ["AUDIT_SESSION_ID"],
                }

                print(
                    json.dumps(
                        payload,
                        separators=(",", ":"),
                    )
                )
                '
              )"

              ;;

            plan)

              WORKFLOW_FILE="RGA Maintenance Executor.yml"
              NEXT_STAGE="plan_audit"

              DISPATCH_INPUTS="$(
                python3 -c '
                import json
                import os

                payload = {
                    "executor_mode":
                        "plan",

                    "audit_session_id":
                        os.environ["AUDIT_SESSION_ID"],

                    "pre_audit_report":
                        os.environ.get(
                            "PRE_AUDIT_REPORT",
                            "",
                        ),
                }

                print(
                    json.dumps(
                        payload,
                        separators=(",", ":"),
                    )
                )
                '
              )"

              ;;

            plan_audit)

              WORKFLOW_FILE="RGA Runtime Auditor.yml"
              NEXT_STAGE="human_approval"

              DISPATCH_INPUTS="$(
                python3 -c '
                import json
                import os

                payload = {
                    "audit_mode":
                        "plan_audit",

                    "audit_session_id":
                        os.environ["AUDIT_SESSION_ID"],

                    "execution_plan":
                        os.environ.get(
                            "EXECUTION_PLAN",
                            "",
                        ),
                }

                print(
                    json.dumps(
                        payload,
                        separators=(",", ":"),
                    )
                )
                '
              )"

              ;;

            human_approval)

              NEXT_STAGE="execute"
              DISPATCH_REQUIRED="false"
              REASON="Human approval checkpoint reached. Create or provide human_execution_approval.json before running execute."

              ;;

            execute)

              if [ -z "$EXECUTION_APPROVAL" ]; then
                echo "execution_approval missing" >&2
                exit 1
              fi

              if [ "$EXECUTION_APPROVAL" != "APPROVE_RGA_EXECUTION" ]; then
                echo "invalid execution_approval phrase" >&2
                exit 1
              fi

              WORKFLOW_FILE="RGA Maintenance Executor.yml"
              NEXT_STAGE="post_audit"

              DISPATCH_INPUTS="$(
                python3 -c '
                import json
                import os

                payload = {
                    "executor_mode":
                        "execute",

                    "audit_session_id":
                        os.environ["AUDIT_SESSION_ID"],

                    "execution_plan":
                        os.environ.get(
                            "EXECUTION_PLAN",
                            "",
                        ),

                    "approval_artifact":
                        os.environ.get(
                            "APPROVAL_ARTIFACT",
                            "",
                        ),

                    "execution_approval":
                        os.environ.get(
                            "EXECUTION_APPROVAL",
                            "",
                        ),
                }

                print(
                    json.dumps(
                        payload,
                        separators=(",", ":"),
                    )
                )
                '
              )"

              ;;

            post_audit)

              WORKFLOW_FILE="RGA Runtime Auditor.yml"
              NEXT_STAGE="complete"

              DISPATCH_INPUTS="$(
                python3 -c '
                import json
                import os

                payload = {
                    "audit_mode":
                        "post_audit",

                    "audit_session_id":
                        os.environ["AUDIT_SESSION_ID"],

                    "execution_plan":
                        os.environ.get(
                            "EXECUTION_PLAN",
                            "",
                        ),

                    "pre_audit_report":
                        os.environ.get(
                            "PRE_AUDIT_REPORT",
                            "",
                        ),
                }

                print(
                    json.dumps(
                        payload,
                        separators=(",", ":"),
                    )
                )
                '
              )"

              ;;

            complete)

              DISPATCH_REQUIRED="false"

              if [ -z "$REASON" ]; then
                REASON="Lifecycle complete."
              fi

              ;;

            halted)

              DISPATCH_REQUIRED="false"

              if [ -z "$REASON" ]; then
                REASON="Lifecycle halted."
              fi

              ;;

            *)

              echo "Unsupported resolved stage: $STAGE" >&2
              exit 1

              ;;

          esac

          ##########################################################
          # Export lifecycle routing outcome
          ##########################################################

          {
            echo "RESOLVED_STAGE=$STAGE"
            echo "NEXT_STAGE=$NEXT_STAGE"
            echo "DISPATCH_REQUIRED=$DISPATCH_REQUIRED"
            echo "WORKFLOW_FILE=$WORKFLOW_FILE"
            echo "DISPATCH_INPUTS=$DISPATCH_INPUTS"
            echo "LIFECYCLE_REASON=$REASON"
          } >> "$GITHUB_ENV"

      - name: Write lifecycle state
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import json
          import os

          from pathlib import Path

          from datetime import (
              datetime,
              timezone,
          )

          path = Path(
              "artifacts/lifecycle_state.json"
          )

          canonical_lifecycle = [

              "pre_audit",

              "plan",

              "plan_audit",

              "human_approval",

              "execute",

              "post_audit",
          ]

          current_stage = os.environ.get(
              "RESOLVED_STAGE",
              "",
          )

          next_stage = os.environ.get(
              "NEXT_STAGE",
              "",
          )

          completed_stages = []

          if current_stage in canonical_lifecycle:

              idx = canonical_lifecycle.index(
                  current_stage
              )

              completed_stages = (
                  canonical_lifecycle[: idx + 1]
              )

          payload = {

              "schema":
                  "rga.lifecycle_state.v1.2",

              "generated_at":
                  datetime.now(
                      timezone.utc
                  ).replace(
                      microsecond=0
                  ).isoformat(),

              "audit_session_id":
                  os.environ.get(
                      "AUDIT_SESSION_ID",
                      "",
                  ),

              "trigger_source":
                  os.environ.get(
                      "TRIGGER_SOURCE",
                      "",
                  ),

              "triggering_workflow":
                  os.environ.get(
                      "TRIGGERING_WORKFLOW",
                      "",
                  ),

              "triggering_run_id":
                  os.environ.get(
                      "TRIGGERING_RUN_ID",
                      "",
                  ),

              "triggering_conclusion":
                  os.environ.get(
                      "TRIGGERING_CONCLUSION",
                      "",
                  ),

              "current_stage":
                  current_stage,

              "next_stage":
                  next_stage,

              "completed_stages":
                  completed_stages,

              "dispatch_required":
                  (
                      os.environ.get(
                          "DISPATCH_REQUIRED",
                          "false",
                      )
                      == "true"
                  ),

              "workflow_file":
                  (
                      os.environ.get(
                          "WORKFLOW_FILE"
                      )
                      or None
                  ),

              "dispatch_inputs":
                  json.loads(
                      os.environ.get(
                          "DISPATCH_INPUTS",
                          "{}",
                      )
                  ),

              "reason":
                  os.environ.get(
                      "LIFECYCLE_REASON",
                      "",
                  ),

              "canonical_lifecycle":
                  canonical_lifecycle,

              "lifecycle_progress": {

                  "stage_count":
                      len(
                          canonical_lifecycle
                      ),

                  "completed_count":
                      len(
                          completed_stages
                      ),

                  "progress_percent":
                      round(
                          (
                              len(
                                  completed_stages
                              )
                              / len(
                                  canonical_lifecycle
                              )
                          )
                          * 100,
                          2,
                      ),
              },

              "governance": {

                  "human_approval_required_for_execute":
                      True,

                  "completed_phases_remain_immutable":
                      True,

                  "validation_is_not_verification":
                      True,

                  "bot_1_role":
                      "auditor",

                  "bot_2_role":
                      "planner_executor",

                  "approval_authority":
                      "human",
              },

              "policy": {

                  "runner_does_not_audit":
                      True,

                  "runner_does_not_execute":
                      True,

                  "runner_does_not_approve":
                      True,
              },
          }

          path.write_text(
              json.dumps(
                  payload,
                  indent=2,
                  ensure_ascii=False,
              ),
              encoding="utf-8",
          )
          PY
          
      ############################################################
      # Lifecycle Event Contract
      #
      # Canonical output:
      #
      #   artifacts/lifecycle_event.json
      #
      # Purpose:
      #
      #   - Explicitly declares which lifecycle stage
      #     has completed.
      #
      #   - Defines the next lifecycle stage.
      #
      #   - Eliminates artifact-name guessing.
      #
      #   - Serves as the contract between:
      #
      #       Bot #1 Auditor
      #       Bot #2 Executor
      #       Lifecycle Runner
      #
      ############################################################

      - name: Write Lifecycle Event Contract
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import json
          import os

          from pathlib import Path
          from datetime import (
              datetime,
              timezone,
          )

          current_stage = os.environ.get(
              "RESOLVED_STAGE",
              "",
          )

          next_stage = os.environ.get(
              "NEXT_STAGE",
              "",
          )

          payload = {

              "schema":
                  "rga.lifecycle_event.v1.0",

              "generated_at":
                  datetime.now(
                      timezone.utc
                  ).replace(
                      microsecond=0
                  ).isoformat(),

              "audit_session_id":
                  os.environ.get(
                      "AUDIT_SESSION_ID",
                      "",
                  ),

              "trigger_source":
                  os.environ.get(
                      "TRIGGER_SOURCE",
                      "",
                  ),

              "completed_stage":
                  current_stage,

              "next_stage":
                  next_stage,

              "dispatch_required":
                  (
                      os.environ.get(
                          "DISPATCH_REQUIRED",
                          "false",
                      )
                      == "true"
                  ),

              "workflow_file":
                  (
                      os.environ.get(
                          "WORKFLOW_FILE"
                      )
                      or None
                  ),

              "event_contract": {

                  "completed_stage_declared":
                      True,

                  "next_stage_declared":
                      True,

                  "artifact_guessing_required":
                      False,

                  "runner_must_infer_stage":
                      False,
              },

              "governance": {

                  "bot_1_role":
                      "auditor",

                  "bot_2_role":
                      "planner_executor",

                  "approval_authority":
                      "human",

                  "human_approval_required":
                      True,

                  "completed_phases_remain_immutable":
                      True,
              },
          }

          Path(
              "artifacts/lifecycle_event.json"
          ).write_text(
              json.dumps(
                  payload,
                  indent=2,
                  ensure_ascii=False,
              ),
              encoding="utf-8",
          )
          PY          

      - name: Dispatch next workflow
        if: ${{ env.DISPATCH_REQUIRED == 'true' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          ENCODED_WORKFLOW=$(python3 -c 'import urllib.parse, sys; print(urllib.parse.quote(sys.argv[1], safe=""))' "$WORKFLOW_FILE")

          PAYLOAD=$(python3 -c 'import json, os; print(json.dumps({"ref": os.environ["REF_INPUT"], "inputs": json.loads(os.environ["DISPATCH_INPUTS"])}))')

          API_URL="https://api.github.com/repos/${{ github.repository }}/actions/workflows/${ENCODED_WORKFLOW}/dispatches"

          HTTP_STATUS=$(curl -sS \
            -o /tmp/rga_lifecycle_dispatch_response.json \
            -w "%{http_code}" \
            -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "Content-Type: application/json" \
            "$API_URL" \
            -d "$PAYLOAD" || true)

          if [ "$HTTP_STATUS" != "204" ]; then
            echo "Workflow dispatch failed (HTTP ${HTTP_STATUS})" >&2
            sed -n '1,200p' /tmp/rga_lifecycle_dispatch_response.json >&2 || true
            echo "$PAYLOAD" >&2
            exit 1
          fi

          echo "Dispatched workflow '${WORKFLOW_FILE}' for lifecycle stage '${RESOLVED_STAGE}'."

      - name: Upload lifecycle state
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rga-lifecycle-state
          path: artifacts/lifecycle_state.json
          if-no-files-found: warn

      - name: Lifecycle summary
        if: always()
        shell: bash
        run: |
          {
            echo "## RGA Lifecycle Runner"
            echo ""
            echo "- Session: \`${AUDIT_SESSION_ID:-}\`"
            echo "- Trigger source: \`${TRIGGER_SOURCE:-}\`"
            echo "- Current stage: \`${RESOLVED_STAGE:-}\`"
            echo "- Next stage: \`${NEXT_STAGE:-}\`"
            echo "- Dispatch required: \`${DISPATCH_REQUIRED:-}\`"
            echo "- Workflow file: \`${WORKFLOW_FILE:-none}\`"
            echo ""
            if [ -n "${LIFECYCLE_REASON:-}" ]; then
              echo "### Reason"
              echo ""
              echo "${LIFECYCLE_REASON}"
              echo ""
            fi
          } >> "$GITHUB_STEP_SUMMARY"
