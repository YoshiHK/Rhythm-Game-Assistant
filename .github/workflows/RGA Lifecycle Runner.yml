name: RGA Lifecycle Runner

on:

  ##############################################################
  # Automated Lifecycle Entry Point
  #
  # Governance Model
  #
  #   Lifecycle Runner
  #     → owns chronology
  #
  #   Runtime Auditor (Bot #1)
  #     → performs verification
  #
  #   Maintenance Executor (Bot #2)
  #     → performs planning / execution
  #
  #   Human
  #     → owns approval authority
  #
  ##############################################################
  #
  # Automated Lifecycle Model
  #
  #   PowerShell / GitHub Edit
  #
  #     ↓
  #
  #   Git Commit / Git Push
  #
  #     ↓
  #
  #   Lifecycle Runner
  #
  #     ↓
  #
  #   pre_audit
  #
  #     ↓
  #
  #   plan
  #
  #     ↓
  #
  #   plan_audit
  #
  #     ↓
  #
  #   human_approval
  #
  #     ↓
  #
  #   execute
  #
  #     ↓
  #
  #   post_audit
  #
  #     ↓
  #
  #   governance_gate
  #
  #     ↓
  #
  #   complete
  #
  ##############################################################
  #
  # Important:
  #
  #   This push trigger MUST remain enabled.
  #
  #   It preserves:
  #
  #     - local PowerShell → GitHub push → Lifecycle Runner
  #     - GitHub Web Edit → commit → Lifecycle Runner
  #
  ##############################################################
  #
  # Lifecycle Context Model
  #
  # Lifecycle Runner records three governance-facing fields:
  #
  #   lifecycle_category
  #     → high-level execution category
  #
  #   lifecycle_origin
  #     → where the lifecycle originally began
  #
  #   invocation_mode
  #     → why this specific Runner invocation occurred
  #
  ##############################################################
  #
  # These fields are classification / observability metadata only.
  #
  # They MUST NOT:
  #
  #   - modify lifecycle chronology
  #   - alter stage sequencing
  #   - introduce fallback routing
  #   - bypass governance checks
  #   - change completed phase behavior
  #
  # They MAY:
  #
  #   - improve observability
  #   - improve diagnostics
  #   - explain execution context
  #   - assist lifecycle investigation
  #
  ##############################################################
  #
  # Lifecycle Origin: powershell_auto
  #
  # Entry Path:
  #
  #   Local PowerShell
  #     ↓
  #   Git Commit
  #     ↓
  #   Git Push
  #     ↓
  #   Lifecycle Runner
  #
  # Characteristics:
  #
  #   - local environment available
  #   - runtime baseline commonly present
  #   - full automation path
  #
  ##############################################################
  #
  # Lifecycle Origin: github_edit_auto
  #
  # Entry Path:
  #
  #   GitHub Web Editor
  #     ↓
  #   Commit
  #     ↓
  #   Push Event
  #     ↓
  #   Lifecycle Runner
  #
  # Characteristics:
  #
  #   - no local PowerShell invocation
  #   - repository-only change source
  #   - remains Runner-driven
  #
  ##############################################################
  #
  # Lifecycle Origin: workflow_dispatch_manual
  #
  # Entry Path:
  #
  #   GitHub Actions
  #     ↓
  #   workflow_dispatch
  #     ↓
  #   Lifecycle Runner
  #
  # Characteristics:
  #
  #   - explicit operator initiation
  #   - approval resume
  #   - lifecycle recovery
  #   - manual orchestration
  #
  ##############################################################
  #
  # Invocation Mode: push_automation
  #
  # Trigger Source:
  #
  #   push
  #
  # Meaning:
  #
  #   The Runner was invoked by repository push automation.
  #
  # Notes:
  #
  #   This invocation may originate from either:
  #
  #     - powershell_auto
  #     - github_edit_auto
  #
  #   Exact lifecycle_origin attribution must be explicitly
  #   carried by lifecycle metadata if required.
  #
  #   The Runner must not guess.
  #
  ##############################################################
  #
  # Invocation Mode: workflow_dispatch_manual
  #
  # Trigger Source:
  #
  #   workflow_dispatch
  #
  # Meaning:
  #
  #   The Runner was explicitly started by an operator.
  #
  ##############################################################
  #
  # Invocation Mode: contract_continuation
  #
  # Trigger Source:
  #
  #   workflow_run
  #
  # Produced By:
  #
  #   Runtime Auditor
  #     or
  #   Maintenance Executor
  #
  # Meaning:
  #
  #   The Runner was resumed by a completed bot workflow.
  #
  # Characteristics:
  #
  #   - contract-driven continuation
  #   - consumes lifecycle_event.json
  #   - consumes lifecycle_backhaul.json
  #   - preserves chronology ownership
  #
  ##############################################################

  push:
    branches:
      - main
      - "runtime-baseline/update-*"

  ##############################################################
  # Manual Runner Control
  #
  # This is NOT the normal bot-mode manual workflow.
  #
  # Used only for:
  #
  #   - starting an automated lifecycle session manually
  #   - resuming a lifecycle at human_approval
  #   - resuming execute after human approval artifact exists
  #   - recovery from interrupted lifecycle wiring
  #
  # Manual bot-mode execution should be performed from:
  #
  #   - RGA Runtime Auditor
  #   - RGA Maintenance Executor
  #
  # not from this Lifecycle Runner.
  #
  ##############################################################

workflow_dispatch:
  inputs:

    operator_action:
      description: >-
        What do you want to do?

        start_lifecycle
          Start a new lifecycle.

        resume_after_approval
          Continue an approved lifecycle.

        recover_lifecycle
          Repair lifecycle wiring or session state.

      required: true

      default: start_lifecycle

      type: choice

      options:
        - start_lifecycle
        - resume_after_approval
        - recover_lifecycle

    audit_session_id:
      description: >-
        Lifecycle session to continue.

        Leave empty when starting a new lifecycle.

        Required for:
          resume_after_approval
          recover_lifecycle

      required: false

      default: ""

    execution_approval:
      description: >-
        Required only when resuming execution.

        Enter:

        APPROVE_RGA_EXECUTION

      required: false

      default: ""

    ref:
      description: >-
        Git ref, branch, or SHA.

      required: false

      default: main

  ##############################################################
  # Contract-Driven Automated Lifecycle Continuation
  #
  # Trigger Source:
  #
  #   workflow_run
  #
  # Produced By:
  #
  #   RGA Runtime Auditor
  #   RGA Maintenance Executor
  #
  # Consumed Contracts:
  #
  #   lifecycle_event.json
  #   lifecycle_backhaul.json
  #
  # Automated rule:
  #
  #   Bot workflows publish contracts.
  #
  #   Lifecycle Runner consumes contracts.
  #
  #   Bot workflows MUST NOT dispatch Lifecycle Runner directly.
  #
  ##############################################################

  workflow_run:
    workflows:
      - RGA Runtime Auditor
      - RGA Maintenance Executor
    types:
      - completed
    branches:
      - main
      - "runtime-baseline/update-*"

concurrency:
  group: rga-lifecycle-${{ github.ref }}
  cancel-in-progress: false

permissions:
  actions: write
  contents: read
  checks: read
  pull-requests: read

jobs:

  determine-origin:

    runs-on: ubuntu-latest

    outputs:
      lifecycle_category: ${{ steps.context.outputs.lifecycle_category }}
      lifecycle_origin: ${{ steps.context.outputs.lifecycle_origin }}
      invocation_mode: ${{ steps.context.outputs.invocation_mode }}

    steps:

      - name: Resolve Lifecycle Context
        id: context

        shell: bash

        run: |

          EVENT_NAME="${GITHUB_EVENT_NAME}"

          case "$EVENT_NAME" in

            workflow_run)

              echo "lifecycle_category=Automated" >> "$GITHUB_OUTPUT"

              #
              # Invocation is known:
              #
              #   workflow_run means this Runner invocation was caused
              #   by a completed bot workflow.
              #
              # Lifecycle origin is not inferred here.
              # It should be propagated by lifecycle metadata if needed.
              #

              echo "lifecycle_origin=inherited_from_lifecycle_contract" >> "$GITHUB_OUTPUT"
              echo "invocation_mode=contract_continuation" >> "$GITHUB_OUTPUT"
              ;;

            workflow_dispatch)

              echo "lifecycle_category=Manual" >> "$GITHUB_OUTPUT"
              echo "lifecycle_origin=workflow_dispatch_manual" >> "$GITHUB_OUTPUT"
              echo "invocation_mode=workflow_dispatch_manual" >> "$GITHUB_OUTPUT"
              ;;

            push)

              echo "lifecycle_category=Automated" >> "$GITHUB_OUTPUT"

              #
              # Push-triggered automation.
              #
              # Current governance model recognizes two possible
              # automated lifecycle origins:
              #
              #   powershell_auto
              #   github_edit_auto
              #
              # This Runner section intentionally does not guess
              # between them.
              #
              # Exact attribution should be supplied by explicit
              # lifecycle metadata if required.
              #

              echo "lifecycle_origin=push_automation_unattributed" >> "$GITHUB_OUTPUT"
              echo "invocation_mode=push_automation" >> "$GITHUB_OUTPUT"
              ;;

            *)

              echo "lifecycle_category=Unknown" >> "$GITHUB_OUTPUT"
              echo "lifecycle_origin=unknown" >> "$GITHUB_OUTPUT"
              echo "invocation_mode=unknown" >> "$GITHUB_OUTPUT"
              ;;

          esac

  lifecycle-runner:

    needs:
      - determine-origin

    runs-on: ubuntu-latest

    env:
      LIFECYCLE_CATEGORY: ${{ needs.determine-origin.outputs.lifecycle_category }}
      LIFECYCLE_ORIGIN: ${{ needs.determine-origin.outputs.lifecycle_origin }}
      INVOCATION_MODE: ${{ needs.determine-origin.outputs.invocation_mode }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        
      ########################################################
      # Sanitize Lifecycle Workspace
      #
      # Purpose:
      #
      #   Prevent stale lifecycle_event.json /
      #   lifecycle_backhaul.json from contaminating a new
      #   runtime-baseline/update-* lifecycle session.
      #
      # Keep:
      #
      #   artifacts/runtime_baseline.json
      #
      # Remove only transient lifecycle routing state.
      ########################################################

      - name: Sanitize lifecycle workspace
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p artifacts lifecycle_trigger

          echo "Sanitizing transient lifecycle state..."

          rm -rf lifecycle_trigger/* || true

          rm -f artifacts/upstream_lifecycle_event.json || true
          rm -f artifacts/upstream_lifecycle_backhaul.json || true
          rm -f artifacts/lifecycle_backhaul_resolution.json || true
          rm -f artifacts/lifecycle_dispatch_result.json || true
          rm -f artifacts/lifecycle_trigger_workflow.json || true
          rm -f artifacts/lifecycle_trigger_artifacts.json || true
          rm -f artifacts/lifecycle_trigger_files.txt || true

          echo "Preserving canonical runtime baseline if present:"
          if [ -f artifacts/runtime_baseline.json ]; then
            echo "  artifacts/runtime_baseline.json exists"
          else
            echo "  artifacts/runtime_baseline.json not present in workspace"
          fi

      ########################################################
      # Prepare Lifecycle Context
      ########################################################

      - name: Prepare lifecycle context
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}

          MANUAL_RUNNER_MODE: ${{ github.event.inputs.runner_mode }}
          MANUAL_STAGE: ${{ github.event.inputs.lifecycle_stage }}
          MANUAL_REF: ${{ github.event.inputs.ref }}
          MANUAL_SESSION: ${{ github.event.inputs.audit_session_id }}
          MANUAL_PRE_AUDIT_REPORT: ${{ github.event.inputs.pre_audit_report }}
          MANUAL_EXECUTION_PLAN: ${{ github.event.inputs.execution_plan }}
          MANUAL_APPROVAL_ARTIFACT: ${{ github.event.inputs.approval_artifact }}
          MANUAL_EXECUTION_APPROVAL: ${{ github.event.inputs.execution_approval }}

          TRIGGERING_WORKFLOW: ${{ github.event.workflow_run.name }}
          TRIGGERING_WORKFLOW_ID: ${{ github.event.workflow_run.workflow_id }}
          TRIGGERING_RUN_ID: ${{ github.event.workflow_run.id }}
          TRIGGERING_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          TRIGGERING_HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}

          DEFAULT_REF: ${{ github.ref_name }}

        run: |
          set -euo pipefail

          mkdir -p \
            artifacts \
            lifecycle_trigger

          ######################################################
          # Defaults
          ######################################################

          STAGE="auto_detect"

          REF_INPUT="${DEFAULT_REF:-main}"

          RUNNER_MODE=""

          AUDIT_SESSION_ID=""

          PRE_AUDIT_REPORT="artifacts/runtime_auditor_report.json"

          EXECUTION_PLAN="artifacts/execution_plan.json"

          APPROVAL_ARTIFACT="artifacts/human_execution_approval.json"

          EXECUTION_APPROVAL=""

          TRIGGER_SOURCE="unknown"

          BACKHAUL_OVERRIDE="false"

          ######################################################
          # workflow_dispatch
          #
          # Manual lifecycle operation.
          #
          # Used for:
          #
          #   - manually starting a Runner-owned lifecycle
          #   - human approval resume
          #   - execute resume after approval declaration
          #   - recovery / repair
          #
          # This is NOT used by Bot #1 / Bot #2 to resume Runner.
          ######################################################

          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then

            RUNNER_MODE="${MANUAL_RUNNER_MODE:-automated_lifecycle}"

            STAGE="${MANUAL_STAGE:-pre_audit}"

            REF_INPUT="${MANUAL_REF:-main}"

            AUDIT_SESSION_ID="${MANUAL_SESSION:-}"

            PRE_AUDIT_REPORT="${MANUAL_PRE_AUDIT_REPORT:-artifacts/runtime_auditor_report.json}"

            EXECUTION_PLAN="${MANUAL_EXECUTION_PLAN:-artifacts/execution_plan.json}"

            APPROVAL_ARTIFACT="${MANUAL_APPROVAL_ARTIFACT:-artifacts/human_execution_approval.json}"

            EXECUTION_APPROVAL="${MANUAL_EXECUTION_APPROVAL:-}"

            TRIGGER_SOURCE="workflow_dispatch"

            ####################################################
            # Session handling
            #
            # workflow_dispatch may either:
            #
            #   - start a new lifecycle session
            #   - resume an existing approved lifecycle session
            #
            # If a session is not provided, generate one.
            ####################################################

            if [ -z "$AUDIT_SESSION_ID" ]; then

              AUDIT_SESSION_ID="rga-session-$(date -u +%Y%m%dT%H%M%SZ)"

            fi

            echo "workflow_dispatch detected."
            echo "runner_mode=${RUNNER_MODE}"
            echo "selected_stage=${STAGE}"
            echo "ref_input=${REF_INPUT}"
            echo "audit_session_id=${AUDIT_SESSION_ID}"
            echo "trigger_source=${TRIGGER_SOURCE}"

          ######################################################
          # workflow_run
          #
          # Contract-driven continuation.
          #
          # Expected source:
          #
          #   RGA Runtime Auditor
          #   RGA Maintenance Executor
          #
          # Expected artifacts:
          #
          #   lifecycle_event.json
          #   lifecycle_backhaul.json
          #
          # Important:
          #
          #   This step must NOT create the authoritative
          #   lifecycle session from GitHub run ID.
          #
          #   The authoritative audit_session_id must be read
          #   from the downloaded lifecycle contract by the
          #   Determine Next Lifecycle Stage step.
          #
          #   The value below is diagnostic/provisional only.
          ######################################################

          elif [ "$EVENT_NAME" = "workflow_run" ]; then

            RUNNER_MODE="contract_continuation"

            STAGE="auto_detect"

            REF_INPUT="${TRIGGERING_HEAD_BRANCH:-${DEFAULT_REF:-main}}"

            AUDIT_SESSION_ID="pending_contract_session"

            TRIGGER_SOURCE="workflow_run"

            BACKHAUL_OVERRIDE="false"

            echo "workflow_run detected."
            echo "runner_mode=${RUNNER_MODE}"
            echo "triggering_workflow=${TRIGGERING_WORKFLOW}"
            echo "triggering_run_id=${TRIGGERING_RUN_ID}"
            echo "triggering_conclusion=${TRIGGERING_CONCLUSION}"
            echo "selected_stage=${STAGE}"
            echo "ref_input=${REF_INPUT}"
            echo "audit_session_id=${AUDIT_SESSION_ID}"
            echo "trigger_source=${TRIGGER_SOURCE}"

          ######################################################
          # push
          #
          # Primary automated lifecycle entry point.
          #
          # Push starts a new governed lifecycle at pre_audit.
          ######################################################

          elif [ "$EVENT_NAME" = "push" ]; then

            RUNNER_MODE="automated_lifecycle"

            ######################################################
            # Runtime Baseline Push
            #
            # Bridge entry:
            #
            #   PowerShell
            #     ↓
            #   github_lifecycle_bridge.py
            #     ↓
            #   commit artifacts/runtime_baseline.json
            #     ↓
            #   push runtime-baseline/update-*
            #
            # This push is the lifecycle start signal.
            #
            # Important:
            #
            #   REF_INPUT must stay on the runtime-baseline branch,
            #   not main, so downstream Bot #1 can see the committed
            #   artifacts/runtime_baseline.json.
            #
            # Also important:
            #
            #   This is a NEW lifecycle session.
            #   It must not inherit an old lifecycle_backhaul.json.
            ######################################################

            case "${DEFAULT_REF:-}" in

              runtime-baseline/update-*)

                STAGE="pre_audit"

                REF_INPUT="${DEFAULT_REF}"

                AUDIT_SESSION_ID="rga-session-$(date -u +%Y%m%dT%H%M%SZ)"

                TRIGGER_SOURCE="runtime_baseline_push"

                BACKHAUL_OVERRIDE="true"

                echo "runtime baseline push detected."
                echo "runner_mode=${RUNNER_MODE}"
                echo "branch=${DEFAULT_REF}"
                echo "selected_stage=${STAGE}"
                echo "ref_input=${REF_INPUT}"
                echo "audit_session_id=${AUDIT_SESSION_ID}"
                echo "trigger_source=${TRIGGER_SOURCE}"
                echo "backhaul_override=${BACKHAUL_OVERRIDE}"

                ;;

              *)

                ######################################################
                # Generic Push
                #
                # Normal repository push entry.
                ######################################################

                STAGE="pre_audit"

                REF_INPUT="${DEFAULT_REF:-main}"

                AUDIT_SESSION_ID="rga-session-$(date -u +%Y%m%dT%H%M%SZ)"

                TRIGGER_SOURCE="push"

                BACKHAUL_OVERRIDE="false"

                echo "push detected."
                echo "runner_mode=${RUNNER_MODE}"
                echo "branch=${DEFAULT_REF:-main}"
                echo "selected_stage=${STAGE}"
                echo "ref_input=${REF_INPUT}"
                echo "audit_session_id=${AUDIT_SESSION_ID}"
                echo "trigger_source=${TRIGGER_SOURCE}"
                echo "backhaul_override=${BACKHAUL_OVERRIDE}"

                ;;

            esac

          ######################################################
          # unsupported trigger
          #
          # No fallback lifecycle start.
          ######################################################

          else

            echo "Unsupported trigger detected." >&2
            echo "event_name=${EVENT_NAME}" >&2

            exit 1

          fi

          ######################################################
          # Canonical Lifecycle
          ######################################################

          CANONICAL_LIFECYCLE="pre_audit,plan,plan_audit,human_approval,execute,post_audit,governance_gate,complete"

          ######################################################
          # Diagnostics
          ######################################################

          echo "EVENT_NAME=${EVENT_NAME}"
          echo "RUNNER_MODE=${RUNNER_MODE}"
          echo "TRIGGER_SOURCE=${TRIGGER_SOURCE}"
          echo "STAGE=${STAGE}"
          echo "REF_INPUT=${REF_INPUT}"
          echo "AUDIT_SESSION_ID=${AUDIT_SESSION_ID}"
          echo "BACKHAUL_OVERRIDE=${BACKHAUL_OVERRIDE}"
          echo "CANONICAL_LIFECYCLE=${CANONICAL_LIFECYCLE}"

          ######################################################
          # Export Environment
          ######################################################

          {
            echo "STAGE=$STAGE"
            echo "REF_INPUT=$REF_INPUT"
            echo "RUNNER_MODE=$RUNNER_MODE"
            echo "AUDIT_SESSION_ID=$AUDIT_SESSION_ID"

            echo "PRE_AUDIT_REPORT=$PRE_AUDIT_REPORT"
            echo "EXECUTION_PLAN=$EXECUTION_PLAN"
            echo "APPROVAL_ARTIFACT=$APPROVAL_ARTIFACT"
            echo "EXECUTION_APPROVAL=$EXECUTION_APPROVAL"

            echo "TRIGGER_SOURCE=$TRIGGER_SOURCE"
            echo "BACKHAUL_OVERRIDE=$BACKHAUL_OVERRIDE"

            echo "TRIGGERING_WORKFLOW=$TRIGGERING_WORKFLOW"
            echo "TRIGGERING_WORKFLOW_ID=$TRIGGERING_WORKFLOW_ID"
            echo "TRIGGERING_RUN_ID=$TRIGGERING_RUN_ID"
            echo "TRIGGERING_CONCLUSION=$TRIGGERING_CONCLUSION"

            echo "CANONICAL_LIFECYCLE=$CANONICAL_LIFECYCLE"
          } >> "$GITHUB_ENV"

      ########################################################
      # Download Triggering Workflow Artifacts
      ########################################################

      - name: Download Triggering Workflow Artifacts
        if: ${{ github.event_name == 'workflow_run' }}
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN || github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          WORKFLOW_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          WORKFLOW_NAME: ${{ github.event.workflow_run.name }}
          WORKFLOW_ID: ${{ github.event.workflow_run.workflow_id }}
          WORKFLOW_HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
        run: |
          set -euo pipefail

          ########################################################
          # Clean lifecycle trigger workspace
          #
          # Prevent previous broad downloads or stale files from
          # contaminating current lifecycle routing.
          ########################################################

          rm -rf lifecycle_trigger || true

          mkdir -p \
            artifacts \
            lifecycle_trigger/rga-lifecycle-event \
            lifecycle_trigger/rga-lifecycle-backhaul

          ########################################################
          # Diagnostics
          ########################################################

          echo "Triggering workflow:"
          echo "  Name: ${WORKFLOW_NAME}"
          echo "  Workflow ID: ${WORKFLOW_ID}"
          echo "  Run ID: ${RUN_ID}"
          echo "  Head branch: ${WORKFLOW_HEAD_BRANCH}"
          echo "  Conclusion: ${WORKFLOW_CONCLUSION}"

          ########################################################
          # workflow_run conclusion guard
          ########################################################

          if [ "${WORKFLOW_CONCLUSION}" != "success" ]; then
            echo "::error::Triggering workflow did not complete successfully."
            echo "workflow_name=${WORKFLOW_NAME}"
            echo "run_id=${RUN_ID}"
            echo "conclusion=${WORKFLOW_CONCLUSION}"
            exit 1
          fi

          ########################################################
          # Store triggering workflow metadata
          ########################################################

          jq -n \
            --arg workflow_name "${WORKFLOW_NAME}" \
            --arg workflow_id "${WORKFLOW_ID}" \
            --arg run_id "${RUN_ID}" \
            --arg head_branch "${WORKFLOW_HEAD_BRANCH}" \
            --arg conclusion "${WORKFLOW_CONCLUSION}" \
            '{
              schema: "rga.lifecycle_trigger_workflow.v1.0",
              workflow_name: $workflow_name,
              workflow_id: $workflow_id,
              run_id: $run_id,
              head_branch: $head_branch,
              conclusion: $conclusion
            }' \
            > artifacts/lifecycle_trigger_workflow.json

          ########################################################
          # List artifacts from triggering workflow
          ########################################################

          gh api \
            "repos/${{ github.repository }}/actions/runs/${RUN_ID}/artifacts" \
            > artifacts/lifecycle_trigger_artifacts.json

          ########################################################
          # Download lifecycle artifacts from triggering workflow
          #
          # These artifacts are expected from Bot #1 / Bot #2.
          ########################################################

          gh run download "${RUN_ID}" \
            -R "${{ github.repository }}" \
            -n rga-lifecycle-event \
            -D lifecycle_trigger/rga-lifecycle-event \
            || echo "::warning::rga-lifecycle-event artifact not found."

          gh run download "${RUN_ID}" \
            -R "${{ github.repository }}" \
            -n rga-lifecycle-backhaul \
            -D lifecycle_trigger/rga-lifecycle-backhaul \
            || echo "::warning::rga-lifecycle-backhaul artifact not found."

          ########################################################
          # Index downloaded files
          ########################################################

          find lifecycle_trigger \
            -type f \
            | sort \
            > artifacts/lifecycle_trigger_files.txt \
            || true

          FILE_COUNT="$(
            wc -l < artifacts/lifecycle_trigger_files.txt 2>/dev/null \
            || echo 0
          )"

          echo ""
          echo "Downloaded trigger files: ${FILE_COUNT}"

          if [ -s artifacts/lifecycle_trigger_files.txt ]; then
            cat artifacts/lifecycle_trigger_files.txt
          else
            echo "(none)"
          fi

          ########################################################
          # Resolve expected lifecycle artifacts
          ########################################################

          UPSTREAM_EVENT_FILE="$(
            find lifecycle_trigger/rga-lifecycle-event \
              -type f \
              -name 'lifecycle_event.json' \
              -print \
              -quit \
              || true
          )"

          UPSTREAM_BACKHAUL_FILE="$(
            find lifecycle_trigger/rga-lifecycle-backhaul \
              -type f \
              -name 'lifecycle_backhaul.json' \
              -print \
              -quit \
              || true
          )"

          EVENT_FOUND="false"
          BACKHAUL_FOUND="false"
          VALID_EVENT="false"
          VALID_BACKHAUL="false"

          if [ -n "${UPSTREAM_EVENT_FILE}" ]; then

            EVENT_FOUND="true"

            cp "${UPSTREAM_EVENT_FILE}" \
              artifacts/upstream_lifecycle_event.json

            echo ""
            echo "Lifecycle event found:"
            echo "  ${UPSTREAM_EVENT_FILE}"

            echo ""
            echo "===== CONSUMED EVENT ====="
            cat artifacts/upstream_lifecycle_event.json
            echo "=========================="

          else

            echo "::error::Lifecycle event artifact not found."
            exit 1

          fi

          if [ -n "${UPSTREAM_BACKHAUL_FILE}" ]; then

            BACKHAUL_FOUND="true"

            cp "${UPSTREAM_BACKHAUL_FILE}" \
              artifacts/upstream_lifecycle_backhaul.json

            echo ""
            echo "Lifecycle backhaul found:"
            echo "  ${UPSTREAM_BACKHAUL_FILE}"

            echo ""
            echo "===== CONSUMED BACKHAUL ====="
            cat artifacts/upstream_lifecycle_backhaul.json
            echo "============================="

          else

            echo "::error::Lifecycle backhaul artifact not found."
            exit 1

          fi

          ########################################################
          # Validate lifecycle artifact shape
          #
          # This validates artifact presence and minimum contract
          # shape only. Stage semantics are validated later by
          # Validate Lifecycle Event Contract.
          ########################################################

          if jq -e \
            '.schema
             and .audit_session_id
             and .completed_stage
             and (.dispatch_required != null)' \
            artifacts/upstream_lifecycle_event.json \
            >/dev/null
          then
            VALID_EVENT="true"
          else
            echo "::error::Invalid lifecycle_event.json shape."
            cat artifacts/upstream_lifecycle_event.json
            exit 1
          fi

          if jq -e \
            '.schema
             and .audit_session_id
             and .completed_stage
             and (.dispatch_required != null)' \
            artifacts/upstream_lifecycle_backhaul.json \
            >/dev/null
          then
            VALID_BACKHAUL="true"
          else
            echo "::error::Invalid lifecycle_backhaul.json shape."
            cat artifacts/upstream_lifecycle_backhaul.json
            exit 1
          fi

          ########################################################
          # Extract event/backhaul summary
          ########################################################

          EVENT_SESSION="$(
            jq -r '.audit_session_id // empty' \
              artifacts/upstream_lifecycle_event.json
          )"

          EVENT_COMPLETED_STAGE="$(
            jq -r '.completed_stage // empty' \
              artifacts/upstream_lifecycle_event.json
          )"

          EVENT_NEXT_STAGE="$(
            jq -r '.next_stage // empty' \
              artifacts/upstream_lifecycle_event.json
          )"

          EVENT_STATUS="$(
            jq -r '.lifecycle_status // "running"' \
              artifacts/upstream_lifecycle_event.json
          )"

          EVENT_DISPATCH_REQUIRED="$(
            jq -r '.dispatch_required // false' \
              artifacts/upstream_lifecycle_event.json
          )"

          BACKHAUL_SESSION="$(
            jq -r '.audit_session_id // empty' \
              artifacts/upstream_lifecycle_backhaul.json
          )"

          BACKHAUL_COMPLETED_STAGE="$(
            jq -r '.completed_stage // empty' \
              artifacts/upstream_lifecycle_backhaul.json
          )"

          BACKHAUL_NEXT_STAGE="$(
            jq -r '.next_stage // empty' \
              artifacts/upstream_lifecycle_backhaul.json
          )"

          BACKHAUL_STATUS="$(
            jq -r '.lifecycle_status // "running"' \
              artifacts/upstream_lifecycle_backhaul.json
          )"

          BACKHAUL_DISPATCH_REQUIRED="$(
            jq -r '.dispatch_required // false' \
              artifacts/upstream_lifecycle_backhaul.json
          )"

          ########################################################
          # Authoritative session resolution
          #
          # workflow_run must inherit session from lifecycle
          # contract, not from GitHub workflow_run id.
          ########################################################

          if [ -z "${EVENT_SESSION}" ]; then
            echo "::error::Event contract is missing audit_session_id."
            exit 1
          fi

          if [ -z "${BACKHAUL_SESSION}" ]; then
            echo "::error::Backhaul contract is missing audit_session_id."
            exit 1
          fi

          if [ "${EVENT_SESSION}" != "${BACKHAUL_SESSION}" ]; then
            echo "::error::Lifecycle event/backhaul session mismatch."
            echo "EVENT audit_session_id    = ${EVENT_SESSION}"
            echo "BACKHAUL audit_session_id = ${BACKHAUL_SESSION}"
            exit 1
          fi

          CONTRACT_SESSION_ID="${EVENT_SESSION}"

          ########################################################
          # Event/backhaul consistency check
          ########################################################

          BACKHAUL_CONSISTENT="false"

          if [ "${EVENT_COMPLETED_STAGE}" = "${BACKHAUL_COMPLETED_STAGE}" ] \
             && [ "${EVENT_NEXT_STAGE}" = "${BACKHAUL_NEXT_STAGE}" ] \
             && [ "${EVENT_STATUS}" = "${BACKHAUL_STATUS}" ] \
             && [ "${EVENT_DISPATCH_REQUIRED}" = "${BACKHAUL_DISPATCH_REQUIRED}" ]
          then
            BACKHAUL_CONSISTENT="true"
          fi

          ########################################################
          # Hard consistency gate
          #
          # If event and backhaul both exist, they must agree.
          # Never continue with contradictory lifecycle routing.
          ########################################################

          if [ "${BACKHAUL_CONSISTENT}" != "true" ]; then

            echo "::error::Lifecycle event/backhaul mismatch."
            echo "EVENT audit_session_id       = ${EVENT_SESSION}"
            echo "BACKHAUL audit_session_id    = ${BACKHAUL_SESSION}"
            echo "EVENT completed_stage        = ${EVENT_COMPLETED_STAGE}"
            echo "BACKHAUL completed_stage     = ${BACKHAUL_COMPLETED_STAGE}"
            echo "EVENT next_stage             = ${EVENT_NEXT_STAGE}"
            echo "BACKHAUL next_stage          = ${BACKHAUL_NEXT_STAGE}"
            echo "EVENT lifecycle_status       = ${EVENT_STATUS}"
            echo "BACKHAUL lifecycle_status    = ${BACKHAUL_STATUS}"
            echo "EVENT dispatch_required      = ${EVENT_DISPATCH_REQUIRED}"
            echo "BACKHAUL dispatch_required   = ${BACKHAUL_DISPATCH_REQUIRED}"

            exit 1

          fi

          ########################################################
          # Write backhaul resolution report
          ########################################################

          jq -n \
            --arg workflow_name "${WORKFLOW_NAME}" \
            --arg workflow_id "${WORKFLOW_ID}" \
            --arg run_id "${RUN_ID}" \
            --arg conclusion "${WORKFLOW_CONCLUSION}" \
            --argjson file_count "${FILE_COUNT}" \
            --argjson event_found "${EVENT_FOUND}" \
            --argjson backhaul_found "${BACKHAUL_FOUND}" \
            --argjson valid_event "${VALID_EVENT}" \
            --argjson valid_backhaul "${VALID_BACKHAUL}" \
            --arg upstream_event_file "${UPSTREAM_EVENT_FILE}" \
            --arg upstream_backhaul_file "${UPSTREAM_BACKHAUL_FILE}" \
            --arg event_session "${EVENT_SESSION}" \
            --arg backhaul_session "${BACKHAUL_SESSION}" \
            --arg contract_session "${CONTRACT_SESSION_ID}" \
            --arg event_completed_stage "${EVENT_COMPLETED_STAGE}" \
            --arg event_next_stage "${EVENT_NEXT_STAGE}" \
            --arg event_status "${EVENT_STATUS}" \
            --arg event_dispatch_required "${EVENT_DISPATCH_REQUIRED}" \
            --arg backhaul_completed_stage "${BACKHAUL_COMPLETED_STAGE}" \
            --arg backhaul_next_stage "${BACKHAUL_NEXT_STAGE}" \
            --arg backhaul_status "${BACKHAUL_STATUS}" \
            --arg backhaul_dispatch_required "${BACKHAUL_DISPATCH_REQUIRED}" \
            --arg backhaul_consistent "${BACKHAUL_CONSISTENT}" \
            '{
              schema: "rga.lifecycle_backhaul_resolution.v1.1",

              triggering_workflow: {
                workflow_name: $workflow_name,
                workflow_id: $workflow_id,
                run_id: $run_id,
                conclusion: $conclusion
              },

              artifact_download: {
                downloaded_file_count: $file_count,
                lifecycle_event_found: $event_found,
                lifecycle_backhaul_found: $backhaul_found,
                lifecycle_event_valid: $valid_event,
                lifecycle_backhaul_valid: $valid_backhaul,
                upstream_lifecycle_event_file: (
                  if $upstream_event_file == ""
                  then null
                  else $upstream_event_file
                  end
                ),
                upstream_lifecycle_backhaul_file: (
                  if $upstream_backhaul_file == ""
                  then null
                  else $upstream_backhaul_file
                  end
                )
              },

              authoritative_session: {
                event_audit_session_id: $event_session,
                backhaul_audit_session_id: $backhaul_session,
                resolved_audit_session_id: $contract_session,
                source: "lifecycle_contract"
              },

              lifecycle_event: {
                completed_stage: (
                  if $event_completed_stage == ""
                  then null
                  else $event_completed_stage
                  end
                ),
                next_stage: (
                  if $event_next_stage == ""
                  then null
                  else $event_next_stage
                  end
                ),
                lifecycle_status: (
                  if $event_status == ""
                  then null
                  else $event_status
                  end
                ),
                dispatch_required: (
                  if $event_dispatch_required == ""
                  then null
                  else $event_dispatch_required
                  end
                )
              },

              lifecycle_backhaul: {
                completed_stage: (
                  if $backhaul_completed_stage == ""
                  then null
                  else $backhaul_completed_stage
                  end
                ),
                next_stage: (
                  if $backhaul_next_stage == ""
                  then null
                  else $backhaul_next_stage
                  end
                ),
                lifecycle_status: (
                  if $backhaul_status == ""
                  then null
                  else $backhaul_status
                  end
                ),
                dispatch_required: (
                  if $backhaul_dispatch_required == ""
                  then null
                  else $backhaul_dispatch_required
                  end
                )
              },

              backhaul_consistency: {
                event_and_backhaul_consistent: $backhaul_consistent,
                bot_dispatches_runner_expected: false,
                workflow_run_continuation_expected: true,
                chronology_owner: "lifecycle_runner"
              }
            }' \
            > artifacts/lifecycle_backhaul_resolution.json

          ########################################################
          # Contract trace
          ########################################################

          jq -n \
            --arg run_id "${RUN_ID}" \
            --arg workflow "${WORKFLOW_NAME}" \
            --arg event_file "${UPSTREAM_EVENT_FILE}" \
            --arg backhaul_file "${UPSTREAM_BACKHAUL_FILE}" \
            --arg event_session "${EVENT_SESSION}" \
            --arg backhaul_session "${BACKHAUL_SESSION}" \
            --arg resolved_session "${CONTRACT_SESSION_ID}" \
            --arg event_completed_stage "${EVENT_COMPLETED_STAGE}" \
            --arg backhaul_completed_stage "${BACKHAUL_COMPLETED_STAGE}" \
            --arg event_stage "${EVENT_NEXT_STAGE}" \
            --arg backhaul_stage "${BACKHAUL_NEXT_STAGE}" \
            --arg event_status "${EVENT_STATUS}" \
            --arg backhaul_status "${BACKHAUL_STATUS}" \
            --arg event_dispatch "${EVENT_DISPATCH_REQUIRED}" \
            --arg backhaul_dispatch "${BACKHAUL_DISPATCH_REQUIRED}" \
            --arg consistent "${BACKHAUL_CONSISTENT}" \
            '{
              schema: "rga.contract_trace.v1.1",

              triggering_run_id: $run_id,
              triggering_workflow: $workflow,

              upstream_event_file: $event_file,
              upstream_backhaul_file: $backhaul_file,

              event_audit_session_id: $event_session,
              backhaul_audit_session_id: $backhaul_session,
              resolved_audit_session_id: $resolved_session,

              event_completed_stage: $event_completed_stage,
              backhaul_completed_stage: $backhaul_completed_stage,

              event_next_stage: $event_stage,
              backhaul_next_stage: $backhaul_stage,

              event_status: $event_status,
              backhaul_status: $backhaul_status,

              event_dispatch_required: $event_dispatch,
              backhaul_dispatch_required: $backhaul_dispatch,

              event_and_backhaul_consistent: $consistent
            }' \
            > artifacts/contract_trace.json

          ########################################################
          # Export contract-derived session and diagnostics
          ########################################################

          {
            echo "AUDIT_SESSION_ID=${CONTRACT_SESSION_ID}"
            echo "UPSTREAM_EVENT_COMPLETED_STAGE=${EVENT_COMPLETED_STAGE}"
            echo "UPSTREAM_EVENT_NEXT_STAGE=${EVENT_NEXT_STAGE}"
            echo "UPSTREAM_EVENT_STATUS=${EVENT_STATUS}"
            echo "UPSTREAM_EVENT_DISPATCH_REQUIRED=${EVENT_DISPATCH_REQUIRED}"

            echo "UPSTREAM_BACKHAUL_COMPLETED_STAGE=${BACKHAUL_COMPLETED_STAGE}"
            echo "UPSTREAM_BACKHAUL_NEXT_STAGE=${BACKHAUL_NEXT_STAGE}"
            echo "UPSTREAM_BACKHAUL_STATUS=${BACKHAUL_STATUS}"
            echo "UPSTREAM_BACKHAUL_DISPATCH_REQUIRED=${BACKHAUL_DISPATCH_REQUIRED}"

            echo "BACKHAUL_CONSISTENT=${BACKHAUL_CONSISTENT}"
            echo "VALID_EVENT=${VALID_EVENT}"
            echo "VALID_BACKHAUL=${VALID_BACKHAUL}"
          } >> "$GITHUB_ENV"

          ########################################################
          # Human-readable diagnostics
          ########################################################

          echo ""
          echo "Backhaul resolution:"
          cat artifacts/lifecycle_backhaul_resolution.json

          echo ""
          echo "Contract trace:"
          cat artifacts/contract_trace.json

          echo ""
          echo "Artifact API response preview:"
          sed -n '1,120p' \
            artifacts/lifecycle_trigger_artifacts.json \
            || true
            
      ########################################################
      # Upload Contract Trace
      ########################################################

      - name: Upload Contract Trace
        if: >
          always() &&
          github.event_name == 'workflow_run'
        uses: actions/upload-artifact@v4
        with:
          name: rga-contract-trace
          path: artifacts/contract_trace.json
          if-no-files-found: error      

      ########################################################
      # Determine Next Lifecycle Stage
      ########################################################

      - name: Determine next lifecycle stage
        shell: bash
        run: |
          set -euo pipefail

          NEXT_STAGE=""
          DISPATCH_REQUIRED="true"
          WORKFLOW_FILE=""
          DISPATCH_INPUTS="{}"
          REASON=""

          ########################################################
          # Tooling guard
          ########################################################

          if ! command -v jq >/dev/null 2>&1; then
            echo "jq is required for lifecycle routing." >&2
            exit 1
          fi

          ########################################################
          # Trigger Source Normalization
          #
          # push:
          #   Starts a new lifecycle from pre_audit.
          #
          # workflow_dispatch:
          #   Uses the manually selected STAGE.
          #
          # workflow_run:
          #   Consumes the validated lifecycle contract pair:
          #
          #     artifacts/upstream_lifecycle_event.json
          #     artifacts/upstream_lifecycle_backhaul.json
          #
          #   Event and backhaul must agree before this step.
          ########################################################

          case "${TRIGGER_SOURCE:-}" in

            runtime_baseline_push)

              ####################################################
              # Runtime Baseline Push
              #
              # This is a new lifecycle session created by:
              #
              #   PowerShell
              #     ↓
              #   github_lifecycle_bridge.py
              #     ↓
              #   commit artifacts/runtime_baseline.json
              #     ↓
              #   push runtime-baseline/update-*
              #
              # It must start at pre_audit.
              # It must not inherit old lifecycle contracts.
              ####################################################

              STAGE="pre_audit"

              rm -f artifacts/upstream_lifecycle_backhaul.json || true
              rm -f artifacts/upstream_lifecycle_event.json || true
              rm -f artifacts/contract_trace.json || true

              BACKHAUL_OVERRIDE="true"

              REASON="Lifecycle initiated from runtime baseline push."

              echo "runtime_baseline_push resolved."
              echo "current_stage=${STAGE}"
              echo "backhaul_override=${BACKHAUL_OVERRIDE}"

              ;;

            push)

              ####################################################
              # Generic Push
              #
              # Starts a new governed lifecycle.
              ####################################################

              STAGE="pre_audit"

              BACKHAUL_OVERRIDE="false"

              REASON="Lifecycle initiated from push."

              echo "push resolved."
              echo "current_stage=${STAGE}"

              ;;

            workflow_dispatch)

              ####################################################
              # Manual Workflow Dispatch
              #
              # STAGE must already be resolved in:
              #
              #   Prepare Lifecycle Context
              #
              # using:
              #
              #   github.event.inputs.lifecycle_stage
              #
              # No fallback stage is assigned here.
              ####################################################

              if [ -z "${STAGE:-}" ] || [ "${STAGE:-}" = "auto_detect" ]; then

                echo "workflow_dispatch did not provide a valid lifecycle stage." >&2
                echo "STAGE=${STAGE:-}" >&2

                exit 1

              fi

              case "${RUNNER_MODE:-}" in

                approval_resume)
                  REASON="Human approval resume requested through workflow_dispatch."
                  ;;

                recovery)
                  REASON="Recovery mode selected for lifecycle session repair."
                  ;;

                automated_lifecycle|"")
                  REASON="Manual Runner invocation selected lifecycle stage."
                  ;;

                *)
                  REASON="Manual Runner invocation using runner_mode=${RUNNER_MODE}."
                  ;;

              esac

              echo "workflow_dispatch resolved."
              echo "runner_mode=${RUNNER_MODE:-}"
              echo "current_stage=${STAGE}"

              ;;

            workflow_run)

              ####################################################
              # Workflow Run Lifecycle Resolution
              #
              # Contract-driven continuation.
              #
              # This step must not:
              #
              #   - infer from stale artifacts
              #   - prefer backhaul over event
              #   - generate a lifecycle session from workflow_run id
              #
              # It must consume the resolved upstream contract pair.
              ####################################################

              if [ "${TRIGGERING_CONCLUSION:-}" != "success" ]; then

                STAGE="halted"
                REASON="Triggering workflow did not complete successfully."

              else

                EVENT_FILE="artifacts/upstream_lifecycle_event.json"
                BACKHAUL_FILE="artifacts/upstream_lifecycle_backhaul.json"

                ##################################################
                # Required upstream contract files
                ##################################################

                if [ ! -f "${EVENT_FILE}" ]; then

                  echo "Missing upstream lifecycle event contract." >&2
                  echo "Expected: ${EVENT_FILE}" >&2

                  exit 1

                fi

                if [ ! -f "${BACKHAUL_FILE}" ]; then

                  echo "Missing upstream lifecycle backhaul contract." >&2
                  echo "Expected: ${BACKHAUL_FILE}" >&2

                  exit 1

                fi

                ##################################################
                # Extract event contract
                ##################################################

                EVENT_SESSION="$(
                  jq -r '.audit_session_id // empty' "${EVENT_FILE}"
                )"

                EVENT_COMPLETED_STAGE="$(
                  jq -r '.completed_stage // empty' "${EVENT_FILE}"
                )"

                EVENT_NEXT_STAGE="$(
                  jq -r '.next_stage // empty' "${EVENT_FILE}"
                )"

                EVENT_STATUS="$(
                  jq -r '.lifecycle_status // "running"' "${EVENT_FILE}"
                )"

                EVENT_DISPATCH_REQUIRED="$(
                  jq -r '.dispatch_required // false' "${EVENT_FILE}"
                )"

                ##################################################
                # Extract backhaul contract
                ##################################################

                BACKHAUL_SESSION="$(
                  jq -r '.audit_session_id // empty' "${BACKHAUL_FILE}"
                )"

                BACKHAUL_COMPLETED_STAGE="$(
                  jq -r '.completed_stage // empty' "${BACKHAUL_FILE}"
                )"

                BACKHAUL_NEXT_STAGE="$(
                  jq -r '.next_stage // empty' "${BACKHAUL_FILE}"
                )"

                BACKHAUL_STATUS="$(
                  jq -r '.lifecycle_status // "running"' "${BACKHAUL_FILE}"
                )"

                BACKHAUL_DISPATCH_REQUIRED="$(
                  jq -r '.dispatch_required // false' "${BACKHAUL_FILE}"
                )"

                ##################################################
                # Contract shape and session checks
                ##################################################

                if [ -z "${EVENT_SESSION}" ]; then
                  echo "upstream lifecycle_event.json is missing audit_session_id." >&2
                  exit 1
                fi

                if [ -z "${BACKHAUL_SESSION}" ]; then
                  echo "upstream lifecycle_backhaul.json is missing audit_session_id." >&2
                  exit 1
                fi

                if [ "${EVENT_SESSION}" != "${BACKHAUL_SESSION}" ]; then

                  echo "Lifecycle event/backhaul session mismatch." >&2
                  echo "EVENT audit_session_id    = ${EVENT_SESSION}" >&2
                  echo "BACKHAUL audit_session_id = ${BACKHAUL_SESSION}" >&2

                  exit 1

                fi

                ##################################################
                # Session authority
                #
                # workflow_run inherits the lifecycle session from
                # the validated contract pair.
                ##################################################

                AUDIT_SESSION_ID="${EVENT_SESSION}"

                ##################################################
                # Event/backhaul consistency
                ##################################################

                if [ "${EVENT_COMPLETED_STAGE}" != "${BACKHAUL_COMPLETED_STAGE}" ] \
                   || [ "${EVENT_NEXT_STAGE}" != "${BACKHAUL_NEXT_STAGE}" ] \
                   || [ "${EVENT_STATUS}" != "${BACKHAUL_STATUS}" ] \
                   || [ "${EVENT_DISPATCH_REQUIRED}" != "${BACKHAUL_DISPATCH_REQUIRED}" ]
                then

                  echo "Lifecycle event/backhaul mismatch." >&2
                  echo "EVENT completed_stage      = ${EVENT_COMPLETED_STAGE}" >&2
                  echo "BACKHAUL completed_stage   = ${BACKHAUL_COMPLETED_STAGE}" >&2
                  echo "EVENT next_stage           = ${EVENT_NEXT_STAGE}" >&2
                  echo "BACKHAUL next_stage        = ${BACKHAUL_NEXT_STAGE}" >&2
                  echo "EVENT lifecycle_status     = ${EVENT_STATUS}" >&2
                  echo "BACKHAUL lifecycle_status  = ${BACKHAUL_STATUS}" >&2
                  echo "EVENT dispatch_required    = ${EVENT_DISPATCH_REQUIRED}" >&2
                  echo "BACKHAUL dispatch_required = ${BACKHAUL_DISPATCH_REQUIRED}" >&2

                  exit 1

                fi

                ##################################################
                # Resolve stage from validated contract
                ##################################################

                case "${EVENT_STATUS}" in

                  complete)

                    STAGE="complete"

                    REASON="Lifecycle complete from validated lifecycle contract."

                    ;;

                  halted)

                    STAGE="halted"

                    REASON="Lifecycle halted from validated lifecycle contract."

                    ;;

                  running|"")

                    if [ -n "${EVENT_NEXT_STAGE}" ] && [ "${EVENT_NEXT_STAGE}" != "none" ]; then

                      STAGE="${EVENT_NEXT_STAGE}"

                      REASON="Lifecycle stage resolved from validated lifecycle contract."

                    else

                      echo "Validated lifecycle contract is running but next_stage is empty." >&2
                      echo "completed_stage=${EVENT_COMPLETED_STAGE}" >&2
                      echo "next_stage=${EVENT_NEXT_STAGE}" >&2
                      echo "lifecycle_status=${EVENT_STATUS}" >&2

                      exit 1

                    fi

                    ;;

                  *)

                    echo "Unsupported lifecycle_status in validated lifecycle contract." >&2
                    echo "lifecycle_status=${EVENT_STATUS}" >&2

                    exit 1

                    ;;

                esac

                echo "workflow_run resolved from validated lifecycle contract."
                echo "audit_session_id=${AUDIT_SESSION_ID}"
                echo "completed_stage=${EVENT_COMPLETED_STAGE}"
                echo "next_stage=${EVENT_NEXT_STAGE}"
                echo "resolved_stage=${STAGE}"
                echo "lifecycle_status=${EVENT_STATUS}"
                echo "dispatch_required=${EVENT_DISPATCH_REQUIRED}"

              fi

              ;;

            *)

              echo "Unsupported trigger source for lifecycle routing." >&2
              echo "TRIGGER_SOURCE=${TRIGGER_SOURCE:-}" >&2

              exit 1

              ;;

          esac

          ##########################################################
          # Canonical Lifecycle Routing
          #
          # Stage Resolution decides:
          #
          #   STAGE
          #
          # Canonical Routing decides:
          #
          #   WORKFLOW_FILE
          #   NEXT_STAGE
          #   DISPATCH_REQUIRED
          #   DISPATCH_INPUTS
          #
          ##########################################################

          case "${STAGE}" in

            ######################################################
            # pre_audit
            ######################################################

            pre_audit)

              WORKFLOW_FILE="RGA Runtime Auditor.yml"

              NEXT_STAGE="plan"

              DISPATCH_REQUIRED="true"

              DISPATCH_INPUTS="$(
                jq -c -n \
                  --arg mode "pre_audit" \
                  --arg session "${AUDIT_SESSION_ID}" \
                  '{
                    audit_mode: $mode,
                    audit_session_id: $session
                  }'
              )"

              ;;

            ######################################################
            # plan
            ######################################################

            plan)

              WORKFLOW_FILE="RGA Maintenance Executor.yml"

              NEXT_STAGE="plan_audit"

              DISPATCH_REQUIRED="true"

              DISPATCH_INPUTS="$(
                jq -c -n \
                  --arg mode "plan" \
                  --arg session "${AUDIT_SESSION_ID}" \
                  --arg report "${PRE_AUDIT_REPORT}" \
                  '{
                    executor_mode: $mode,
                    audit_session_id: $session,
                    pre_audit_report: $report
                  }'
              )"

              ;;

            ######################################################
            # plan_audit
            ######################################################

            plan_audit)

              WORKFLOW_FILE="RGA Runtime Auditor.yml"

              NEXT_STAGE="human_approval"

              DISPATCH_REQUIRED="true"

              DISPATCH_INPUTS="$(
                jq -c -n \
                  --arg mode "plan_audit" \
                  --arg session "${AUDIT_SESSION_ID}" \
                  --arg plan "${EXECUTION_PLAN:-artifacts/execution_plan.json}" \
                  '{
                    audit_mode: $mode,
                    audit_session_id: $session,
                    execution_plan: $plan
                  }'
              )"

              ;;

            ######################################################
            # human_approval
            ######################################################

            human_approval)

              WORKFLOW_FILE=""

              NEXT_STAGE="execute"

              DISPATCH_REQUIRED="false"

              DISPATCH_INPUTS="{}"

              REASON="Human approval checkpoint reached. Create or provide human_execution_approval.json before running execute."

              ;;

            ######################################################
            # execute
            ######################################################

            execute)

              if [ -z "${EXECUTION_APPROVAL:-}" ]; then

                STAGE="halted"

                NEXT_STAGE=""

                DISPATCH_REQUIRED="false"

                WORKFLOW_FILE=""

                DISPATCH_INPUTS="{}"

                REASON="execution_approval missing."

              elif [ "${EXECUTION_APPROVAL}" != "APPROVE_RGA_EXECUTION" ]; then

                STAGE="halted"

                NEXT_STAGE=""

                DISPATCH_REQUIRED="false"

                WORKFLOW_FILE=""

                DISPATCH_INPUTS="{}"

                REASON="invalid execution_approval phrase."

              else

                WORKFLOW_FILE="RGA Maintenance Executor.yml"

                NEXT_STAGE="post_audit"

                DISPATCH_REQUIRED="true"

                DISPATCH_INPUTS="$(
                  jq -c -n \
                    --arg mode "execute" \
                    --arg session "${AUDIT_SESSION_ID}" \
                    --arg plan "${EXECUTION_PLAN}" \
                    --arg approval "${APPROVAL_ARTIFACT}" \
                    --arg phrase "${EXECUTION_APPROVAL}" \
                    '{
                      executor_mode: $mode,
                      audit_session_id: $session,
                      execution_plan: $plan,
                      approval_artifact: $approval,
                      execution_approval: $phrase
                    }'
                )"

              fi

              ;;

            ######################################################
            # post_audit
            ######################################################

            post_audit)

              WORKFLOW_FILE="RGA Runtime Auditor.yml"

              NEXT_STAGE="governance_gate"

              DISPATCH_REQUIRED="true"

              DISPATCH_INPUTS="$(
                jq -c -n \
                  --arg mode "post_audit" \
                  --arg session "${AUDIT_SESSION_ID}" \
                  --arg plan "${EXECUTION_PLAN}" \
                  --arg report "${PRE_AUDIT_REPORT}" \
                  '{
                    audit_mode: $mode,
                    audit_session_id: $session,
                    execution_plan: $plan,
                    pre_audit_report: $report
                  }'
              )"

              ;;
              
            ######################################################
            # governance_gate
            ######################################################

            governance_gate)

              WORKFLOW_FILE="deployment-governance-gate.yml"

              NEXT_STAGE="complete"

              DISPATCH_REQUIRED="true"

              DISPATCH_INPUTS="$(
                jq -c -n \
                  --arg session "${AUDIT_SESSION_ID}" \
                  --arg stage "governance_gate" \
                  --arg ref "${REF:-main}" \
                  '{
                    audit_session_id: $session,
                    lifecycle_stage: $stage,
                    ref: $ref
                  }'
              )"

              REASON="Post-audit completed. Dispatching Deployment Governance Gate."

              ;;              

            ######################################################
            # complete
            ######################################################

            complete)

              WORKFLOW_FILE=""

              NEXT_STAGE=""

              DISPATCH_REQUIRED="false"

              DISPATCH_INPUTS="{}"

              REASON="Lifecycle complete."

              ;;

            ######################################################
            # halted
            ######################################################

            halted)

              WORKFLOW_FILE=""

              NEXT_STAGE=""

              DISPATCH_REQUIRED="false"

              DISPATCH_INPUTS="{}"

              if [ -z "${REASON:-}" ]; then
                REASON="Lifecycle halted."
              fi

              ;;

            ######################################################
            # unsupported
            ######################################################

            *)

              echo "Unsupported resolved stage: ${STAGE}" >&2

              exit 1

              ;;

          esac
          
          ##########################################################
          # Export lifecycle routing outcome
          #
          # This is the handoff contract from:
          #
          #   Determine Next Lifecycle Stage
          #
          # to:
          #
          #   Write Lifecycle State
          #   Write Lifecycle Event Contract
          #   Dispatch Next Workflow
          ##########################################################

          if [ -z "${STAGE:-}" ]; then

            echo "STAGE was not resolved." >&2
            echo "TRIGGER_SOURCE=${TRIGGER_SOURCE:-unknown}" >&2
            echo "BACKHAUL_OVERRIDE=${BACKHAUL_OVERRIDE:-false}" >&2

            exit 1

          fi

          if [ -z "${DISPATCH_REQUIRED:-}" ]; then
            DISPATCH_REQUIRED="false"
          fi

          if [ -z "${WORKFLOW_FILE:-}" ]; then
            WORKFLOW_FILE=""
          fi

          if [ -z "${NEXT_STAGE:-}" ]; then
            NEXT_STAGE=""
          fi

          if [ -z "${DISPATCH_INPUTS:-}" ]; then
            DISPATCH_INPUTS="{}"
          fi

          if [ -z "${REASON:-}" ]; then
            REASON="Lifecycle stage resolved."
          fi

          echo "Resolved lifecycle routing:"
          echo "  STAGE=${STAGE}"
          echo "  NEXT_STAGE=${NEXT_STAGE}"
          echo "  DISPATCH_REQUIRED=${DISPATCH_REQUIRED}"
          echo "  WORKFLOW_FILE=${WORKFLOW_FILE}"
          echo "  AUDIT_SESSION_ID=${AUDIT_SESSION_ID}"
          echo "  REASON=${REASON}"

          {
            echo "RESOLVED_STAGE=${STAGE}"
            echo "NEXT_STAGE=${NEXT_STAGE}"
            echo "DISPATCH_REQUIRED=${DISPATCH_REQUIRED}"
            echo "WORKFLOW_FILE=${WORKFLOW_FILE}"
            echo "AUDIT_SESSION_ID=${AUDIT_SESSION_ID}"
            echo "LIFECYCLE_REASON=${REASON}"

            echo "DISPATCH_INPUTS<<EOF_INPUTS"
            echo "${DISPATCH_INPUTS}"
            echo "EOF_INPUTS"
          } >> "$GITHUB_ENV"
          
          ##########################################################
          # Stage Trace Artifact
          #
          # Pure observability.
          # Does not affect lifecycle routing.
          ##########################################################

          jq -n \
            --arg trigger_source "${TRIGGER_SOURCE:-}" \
            --arg stage "${STAGE:-}" \
            --arg resolved_stage "${STAGE:-}" \
            --arg next_stage "${NEXT_STAGE:-}" \
            --arg lifecycle_reason "${REASON:-}" \
            --arg workflow_file "${WORKFLOW_FILE:-}" \
            --arg dispatch_required "${DISPATCH_REQUIRED:-}" \
            --arg backhaul_override "${BACKHAUL_OVERRIDE:-}" \
            --arg audit_session_id "${AUDIT_SESSION_ID:-}" \
            '{
              trigger_source: $trigger_source,
              stage: $stage,
              resolved_stage: $resolved_stage,
              next_stage: (
                if $next_stage == ""
                then null
                else $next_stage
                end
              ),
              lifecycle_reason: $lifecycle_reason,
              workflow_file: (
                if $workflow_file == ""
                then null
                else $workflow_file
                end
              ),
              dispatch_required: $dispatch_required,
              backhaul_override: $backhaul_override,
              audit_session_id: $audit_session_id
            }' \
            > artifacts/stage_trace.json

          echo "Stage trace written:"
          cat artifacts/stage_trace.json     

      ############################################################
      # Upload Stage Trace
      ############################################################

      - name: Upload Stage Trace
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rga-stage-trace
          path: artifacts/stage_trace.json
          if-no-files-found: warn
          retention-days: 30          

      ##########################################################
      # Write Lifecycle State
      ##########################################################

      - name: Write lifecycle state
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p artifacts

          if [ -z "${RESOLVED_STAGE:-}" ]; then

            echo "RESOLVED_STAGE is missing." >&2
            echo "Determine Next Lifecycle Stage did not export RESOLVED_STAGE." >&2

            exit 1

          fi

          COMPLETED_STAGES='[]'
          COMPLETED_COUNT=0
          PROGRESS_PERCENT=0

          ########################################################
          # Lifecycle Status
          ########################################################

          LIFECYCLE_STATUS="running"

          case "${RESOLVED_STAGE:-unknown}" in

            pre_audit)
              COMPLETED_STAGES='["pre_audit"]'
              COMPLETED_COUNT=1
              PROGRESS_PERCENT=12.50
              ;;

            plan)
              COMPLETED_STAGES='["pre_audit","plan"]'
              COMPLETED_COUNT=2
              PROGRESS_PERCENT=25.00
              ;;

            plan_audit)
              COMPLETED_STAGES='["pre_audit","plan","plan_audit"]'
              COMPLETED_COUNT=3
              PROGRESS_PERCENT=37.50
              ;;

            human_approval)
              COMPLETED_STAGES='["pre_audit","plan","plan_audit","human_approval"]'
              COMPLETED_COUNT=4
              PROGRESS_PERCENT=50.00
              ;;

            execute)
              COMPLETED_STAGES='["pre_audit","plan","plan_audit","human_approval","execute"]'
              COMPLETED_COUNT=5
              PROGRESS_PERCENT=62.50
              ;;

            post_audit)
              COMPLETED_STAGES='["pre_audit","plan","plan_audit","human_approval","execute","post_audit"]'
              COMPLETED_COUNT=6
              PROGRESS_PERCENT=75.00
              ;;

            governance_gate)
              COMPLETED_STAGES='["pre_audit","plan","plan_audit","human_approval","execute","post_audit","governance_gate"]'
              COMPLETED_COUNT=7
              PROGRESS_PERCENT=87.50
              ;;

            complete)
              COMPLETED_STAGES='["pre_audit","plan","plan_audit","human_approval","execute","post_audit","governance_gate","complete"]'
              COMPLETED_COUNT=8
              PROGRESS_PERCENT=100.00
              LIFECYCLE_STATUS="complete"
              ;;

            halted)
              LIFECYCLE_STATUS="halted"
              ;;

          esac

          ########################################################
          # No terminal override for post_audit
          #
          # post_audit is not terminal.
          #
          # Canonical lifecycle is:
          #
          #   post_audit
          #     ↓
          #   governance_gate
          #     ↓
          #   complete
          ########################################################

          jq -n \
            --arg session "${AUDIT_SESSION_ID}" \
            --arg trigger_src "${TRIGGER_SOURCE}" \
            --arg trigger_wf "${TRIGGERING_WORKFLOW}" \
            --arg trigger_run "${TRIGGERING_RUN_ID}" \
            --arg trigger_conc "${TRIGGERING_CONCLUSION}" \
            --arg current "${RESOLVED_STAGE:-unknown}" \
            --arg next "${NEXT_STAGE}" \
            --arg status "${LIFECYCLE_STATUS}" \
            --argjson completed "${COMPLETED_STAGES}" \
            --argjson dispatch ${DISPATCH_REQUIRED:-false} \
            --arg wf "${WORKFLOW_FILE}" \
            --arg reason "${LIFECYCLE_REASON}" \
            --argjson count ${COMPLETED_COUNT} \
            --argjson progress ${PROGRESS_PERCENT} \
            '{
              schema: "rga.lifecycle_state.v1.5",

              audit_session_id: $session,

              trigger_source: $trigger_src,

              triggering_workflow: $trigger_wf,

              triggering_run_id: $trigger_run,

              triggering_conclusion: $trigger_conc,

              current_stage: $current,

              next_stage:
                (
                  if $next == ""
                  then null
                  else $next
                  end
                ),

              lifecycle_status:
                $status,

              completed_stages:
                $completed,

              dispatch_required:
                $dispatch,

              workflow_file:
                (
                  if $wf == ""
                  then null
                  else $wf
                  end
                ),

              reason:
                $reason,

              canonical_lifecycle: [
                "pre_audit",
                "plan",
                "plan_audit",
                "human_approval",
                "execute",
                "post_audit",
                "governance_gate",
                "complete"
              ],

              lifecycle_progress: {
                stage_count: 8,
                completed_count: $count,
                progress_percent: $progress
              }
            }' \
            > artifacts/lifecycle_state.json

          echo "Lifecycle state written:"
          cat artifacts/lifecycle_state.json

          ########################################################
          # Export lifecycle status for downstream steps
          ########################################################

          {
            echo "LIFECYCLE_STATUS=${LIFECYCLE_STATUS}"
          } >> "$GITHUB_ENV"        
          
      ############################################################
      # Write Lifecycle Event Contract
      ############################################################

      - name: Write Lifecycle Event Contract
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p artifacts

          EVENT_NEXT_STAGE="${NEXT_STAGE:-}"
          EVENT_DISPATCH_REQUIRED="${DISPATCH_REQUIRED:-false}"

          LIFECYCLE_STATUS="running"

          case "${RESOLVED_STAGE:-unknown}" in

            complete)

              EVENT_NEXT_STAGE=""
              EVENT_DISPATCH_REQUIRED="false"
              LIFECYCLE_STATUS="complete"

              ;;

            halted)

              EVENT_NEXT_STAGE=""
              EVENT_DISPATCH_REQUIRED="false"
              LIFECYCLE_STATUS="halted"

              ;;

            post_audit)

              ####################################################
              # post_audit is not terminal.
              #
              # It must continue to:
              #
              #   governance_gate
              #
              # Completion is declared only after governance_gate.
              ####################################################

              LIFECYCLE_STATUS="running"

              ;;

            governance_gate)

              ####################################################
              # governance_gate is the final governance checkpoint.
              #
              # It may dispatch the Deployment Governance Gate
              # workflow and then hand off to complete.
              ####################################################

              LIFECYCLE_STATUS="running"

              ;;

          esac

          jq -n \
            --arg session "${AUDIT_SESSION_ID}" \
            --arg trigger_src "${TRIGGER_SOURCE}" \
            --arg completed "${RESOLVED_STAGE:-unknown}" \
            --arg next "${EVENT_NEXT_STAGE}" \
            --arg lifecycle_status "${LIFECYCLE_STATUS}" \
            --arg wf "${WORKFLOW_FILE}" \
            --argjson dispatch ${EVENT_DISPATCH_REQUIRED} \
            '
            {
              schema: "rga.lifecycle_event.v1.2",

              audit_session_id: $session,

              trigger_source: $trigger_src,

              completed_stage: $completed,

              next_stage:
                (
                  if $next == ""
                  then null
                  else $next
                  end
                ),

              lifecycle_status:
                $lifecycle_status,

              dispatch_required:
                $dispatch,

              workflow_file:
                (
                  if $wf == ""
                  then null
                  else $wf
                  end
                ),

              event_contract: {
                completed_stage_declared: true,
                next_stage_declared: true,
                artifact_guessing_required: false,
                runner_must_infer_stage: false
              },

              governance: {
                bot_1_role: "auditor",
                bot_2_role: "planner_executor",
                approval_authority: "human",
                human_approval_required: true,
                governance_gate_required: true,
                completed_phases_remain_immutable: true
              }
            }' \
            > artifacts/lifecycle_event.json

          echo "Lifecycle event contract written:"
          cat artifacts/lifecycle_event.json
          
      ############################################################
      # Validate Lifecycle Event Contract
      ############################################################

      - name: Validate Lifecycle Event Contract
        shell: bash
        run: |
          set -euo pipefail

          EVENT_FILE="artifacts/lifecycle_event.json"

          if [ ! -f "$EVENT_FILE" ]; then
            echo "Lifecycle event contract missing." >&2
            exit 1
          fi

          COMPLETED_STAGE="$(jq -r '.completed_stage // empty' "$EVENT_FILE")"
          NEXT_STAGE="$(jq -r '.next_stage // empty' "$EVENT_FILE")"
          LIFECYCLE_STATUS="$(jq -r '.lifecycle_status // "running"' "$EVENT_FILE")"
          DISPATCH_REQUIRED="$(jq -r '.dispatch_required // false' "$EVENT_FILE")"

          VALID="false"

          ########################################################
          # Canonical stage transitions
          ########################################################

          case "${COMPLETED_STAGE}:${NEXT_STAGE}" in

            pre_audit:plan)
              VALID="true"
              ;;

            plan:plan_audit)
              VALID="true"
              ;;

            plan_audit:human_approval)
              VALID="true"
              ;;

            human_approval:execute)
              VALID="true"
              ;;

            execute:post_audit)
              VALID="true"
              ;;
              
            post_audit:governance_gate)
              VALID="true"
              ;;

            governance_gate:complete)
              VALID="true"
              ;;              

          esac

          ########################################################
          # Temporary Compatibility Rules
          #
          # Purpose:
          #
          #   Maintain compatibility with historical lifecycle
          #   contracts during migration to the canonical:
          #
          #     pre_audit
          #       → plan
          #       → plan_audit
          #       → human_approval
          #       → execute
          #       → post_audit
          #       → governance_gate
          #       → complete
          #
          # Important:
          #
          #   These rules intentionally accept certain
          #   non-terminal running states that may originate
          #   from older lifecycle contracts.
          #
          #   They MUST NOT become authoritative lifecycle
          #   routing logic.
          #
          # TODO:
          #
          #   Remove after all lifecycle producers and
          #   consumers are upgraded to the governance_gate
          #   lifecycle model.
          ########################################################

          # Legacy post_audit running state
          #
          # Example:
          #
          #   completed_stage = post_audit
          #   dispatch_required = true
          #   lifecycle_status = running
          #
          # This may appear during transition from older
          # post_audit contracts.

          if [ "$COMPLETED_STAGE" = "post_audit" ] \
             && [ "$DISPATCH_REQUIRED" = "true" ] \
             && [ "$LIFECYCLE_STATUS" = "running" ]
          then
            VALID="true"
          fi

          # Generic non-terminal running state
          #
          # Accepts historical lifecycle contracts that
          # still declare:
          #
          #   next_stage
          #   dispatch_required=true
          #   lifecycle_status=running
          #
          # without requiring the Validator to infer stage
          # ownership.

          if [ -n "$NEXT_STAGE" ] \
             && [ "$NEXT_STAGE" != "none" ] \
             && [ "$DISPATCH_REQUIRED" = "true" ] \
             && [ "$LIFECYCLE_STATUS" = "running" ]
          then
            VALID="true"
          fi

          ########################################################
          # Terminal lifecycle states
          ########################################################

          # 1. General terminal completion (catches stage="complete")
          if [ "$COMPLETED_STAGE" = "complete" ] \
             && { [ -z "$NEXT_STAGE" ] || [ "$NEXT_STAGE" = "none" ]; } \
             && [ "$LIFECYCLE_STATUS" = "complete" ] \
             && [ "$DISPATCH_REQUIRED" = "false" ]
          then
            VALID="true"
          fi

          # 2. Halted lifecycle state
          if [ "$COMPLETED_STAGE" = "halted" ] \
             && { [ -z "$NEXT_STAGE" ] || [ "$NEXT_STAGE" = "none" ]; } \
             && [ "$LIFECYCLE_STATUS" = "halted" ] \
             && [ "$DISPATCH_REQUIRED" = "false" ]
          then
            VALID="true"
          fi


          ########################################################
          # Result
          ########################################################

          if [ "$VALID" != "true" ]; then

            echo "Invalid lifecycle event contract." >&2
            echo "Completed stage: ${COMPLETED_STAGE}" >&2
            echo "Next stage: ${NEXT_STAGE}" >&2
            echo "Lifecycle status: ${LIFECYCLE_STATUS}" >&2
            echo "Dispatch required: ${DISPATCH_REQUIRED}" >&2

            exit 1

          fi

          echo "Lifecycle Event Contract validation passed."

      ############################################################
      # Lifecycle Summary
      ############################################################

      - name: Lifecycle summary
        if: always()
        shell: bash
        run: |
          {
            echo "## RGA Lifecycle Runner"
            echo ""

            ########################################################
            # Lifecycle State
            ########################################################

            echo "### Lifecycle State"
            echo ""

            echo "- Session: \`${AUDIT_SESSION_ID:-}\`"
            echo "- Lifecycle category: \`${LIFECYCLE_CATEGORY:-unknown}\`"
            echo "- Lifecycle origin: \`${LIFECYCLE_ORIGIN:-unknown}\`"
            echo "- Invocation mode: \`${INVOCATION_MODE:-unknown}\`"
            echo "- Trigger source: \`${TRIGGER_SOURCE:-}\`"
            echo "- Current stage: \`${RESOLVED_STAGE:-unknown}\`"

            if [ -n "${RUNNER_MODE:-}" ]; then
              echo "- Runner mode: \`${RUNNER_MODE}\`"
            fi

            if [ -n "${LIFECYCLE_STATUS:-}" ]; then
              echo "- Lifecycle status: \`${LIFECYCLE_STATUS}\`"
            fi

            if [ -n "${NEXT_STAGE:-}" ]; then
              echo "- Next stage: \`${NEXT_STAGE}\`"
            fi

            echo "- Dispatch required: \`${DISPATCH_REQUIRED:-false}\`"

            if [ -n "${WORKFLOW_FILE:-}" ]; then
              echo "- Workflow file: \`${WORKFLOW_FILE}\`"
            else
              echo "- Workflow file: \`(none)\`"
            fi

            echo ""

            ########################################################
            # Governance Context
            ########################################################

            echo "### Governance Context"
            echo ""

            echo "- Chronology owner: \`Lifecycle Runner\`"
            echo "- Verification owner: \`Runtime Auditor (Bot #1)\`"
            echo "- Planning / execution owner: \`Maintenance Executor (Bot #2)\`"
            echo "- Approval authority: \`Human\`"

            echo ""

            ########################################################
            # Expected Lifecycle
            ########################################################

            echo "### Canonical Lifecycle"
            echo ""

            echo "\`pre_audit → plan → plan_audit → human_approval → execute → post_audit → governance_gate → complete\`"

            echo ""

            ########################################################
            # Current Checkpoint Interpretation
            ########################################################

            echo "### Current Checkpoint"

            echo ""

            case "${RESOLVED_STAGE:-}" in

              human_approval)

                echo "- Lifecycle is paused at the required human approval checkpoint."
                echo "- Execute must not run until approval requirements are satisfied."
                ;;

              execute)

                echo "- Lifecycle is currently in execution."
                echo "- Post-audit is expected after execution completion."
                ;;

              post_audit)

                echo "- Post-audit verification is in progress."
                ;;
                
              governance_gate)

                echo "- Governance verification is in progress."
                ;;

              complete)

                echo "- Lifecycle completed successfully."
                ;;                

            esac

            echo ""

            ########################################################
            # Origin Mode Reference
            ########################################################

            echo "### Lifecycle Context Reference"
            echo ""

            echo "| Lifecycle Category | Lifecycle Origin | Invocation Mode | Description |"
            echo "|-------------------|------------------|-----------------|-------------|"
            echo "| Automated | powershell_auto | push_automation | Local PowerShell → Commit → Push → Lifecycle Runner |"
            echo "| Automated | github_edit_auto | push_automation | GitHub Web Edit → Commit → Push → Lifecycle Runner |"
            echo "| Automated | inherited_from_lifecycle_contract | contract_continuation | workflow_run continuation from Runtime Auditor or Maintenance Executor |"
            echo "| Manual | workflow_dispatch_manual | workflow_dispatch_manual | Manual workflow_dispatch initiated by operator |"

            echo ""

            ########################################################
            # Reason
            ########################################################

            if [ -n "${LIFECYCLE_REASON:-}" ]; then
              echo "### Reason"
              echo ""
              echo "${LIFECYCLE_REASON}"
              echo ""
            fi

          } >> "$GITHUB_STEP_SUMMARY"

      ############################################################
      # Dispatch Next Workflow
      #
      # Runner-side contract:
      #
      #   - Dispatches the next executable Bot workflow.
      #
      #   - Lifecycle Runner owns chronology.
      #
      #   - Bot #1 and Bot #2 must not dispatch the Runner.
      #
      #   - Bot #1 and Bot #2 only publish:
      #
      #       artifacts/lifecycle_event.json
      #       artifacts/lifecycle_backhaul.json
      #
      #   - Lifecycle continuation is expected through:
      #
      #       workflow_run
      #
      # Token policy:
      #
      #   - Pre-human_approval phases use PAT_TOKEN.
      #
      #   - Post-human_approval phases use github.token.
      #
      #   - Do not use secrets.GITHUB_TOKEN.
      #     Use github.token for the built-in token.
      #
      #   - Do not print token values.
      ############################################################

      - name: Dispatch next workflow
        if: ${{ success() }}
        shell: bash
        env:
          PAT_TOKEN: ${{ secrets.PAT_TOKEN }}
          RGA_ACCESS: ${{ secrets.RGA_Access }}
          GITHUB_TOKEN_FALLBACK: ${{ github.token }}
          GH_OWNER_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          mkdir -p artifacts

          ########################################################
          # Terminal lifecycle statuses
          ########################################################

          case "${LIFECYCLE_STATUS:-running}" in

            complete)

              echo "Lifecycle complete."
              echo "Current stage: ${RESOLVED_STAGE:-unknown}"
              echo "Lifecycle status: complete"
              echo "Dispatch required: false"

              jq -n \
                --arg current "${RESOLVED_STAGE:-unknown}" \
                --arg status "complete" \
                --arg reason "${LIFECYCLE_REASON:-Lifecycle complete.}" \
                '{
                  schema: "rga.lifecycle_dispatch_result.v1.1",
                  dispatch_performed: false,
                  dispatch_created: false,
                  current_stage: $current,
                  next_stage: null,
                  lifecycle_status: $status,
                  reason: $reason,
                  terminal: true,
                  chronology_owner: "lifecycle_runner",
                  workflow_run_continuation_expected: false
                }' \
                > artifacts/lifecycle_dispatch_result.json

              exit 0
              ;;

            halted)

              echo "Lifecycle halted."
              echo "Current stage: ${RESOLVED_STAGE:-unknown}"
              echo "Lifecycle status: halted"
              echo "Dispatch required: false"

              if [ -n "${LIFECYCLE_REASON:-}" ]; then
                echo "Reason: ${LIFECYCLE_REASON}"
              fi

              jq -n \
                --arg current "${RESOLVED_STAGE:-unknown}" \
                --arg status "halted" \
                --arg reason "${LIFECYCLE_REASON:-Lifecycle halted.}" \
                '{
                  schema: "rga.lifecycle_dispatch_result.v1.1",
                  dispatch_performed: false,
                  dispatch_created: false,
                  current_stage: $current,
                  next_stage: null,
                  lifecycle_status: $status,
                  reason: $reason,
                  terminal: true,
                  chronology_owner: "lifecycle_runner",
                  workflow_run_continuation_expected: false
                }' \
                > artifacts/lifecycle_dispatch_result.json

              exit 0
              ;;

          esac

          ########################################################
          # Dispatch gate
          ########################################################

          if [ "${DISPATCH_REQUIRED:-false}" != "true" ]; then

            echo "Dispatch not required."
            echo "Current stage: ${RESOLVED_STAGE:-unknown}"
            echo "Lifecycle status: ${LIFECYCLE_STATUS:-running}"

            if [ -n "${NEXT_STAGE:-}" ]; then
              echo "Next stage: ${NEXT_STAGE}"
            else
              echo "Next stage: (none)"
            fi

            echo "Dispatch required: false"

            if [ -n "${LIFECYCLE_REASON:-}" ]; then
              echo "Reason: ${LIFECYCLE_REASON}"
            fi

            jq -n \
              --arg current "${RESOLVED_STAGE:-unknown}" \
              --arg next "${NEXT_STAGE:-}" \
              --arg status "${LIFECYCLE_STATUS:-running}" \
              --arg reason "${LIFECYCLE_REASON:-Dispatch not required.}" \
              '{
                schema: "rga.lifecycle_dispatch_result.v1.1",
                dispatch_performed: false,
                dispatch_created: false,
                current_stage: $current,
                next_stage: (
                  if $next == ""
                  then null
                  else $next
                  end
                ),
                lifecycle_status: $status,
                reason: $reason,
                terminal: false,
                chronology_owner: "lifecycle_runner",
                workflow_run_continuation_expected: false
              }' \
              > artifacts/lifecycle_dispatch_result.json

            exit 0

          fi

          ########################################################
          # Required values
          ########################################################

          if [ -z "${WORKFLOW_FILE:-}" ]; then
            echo "WORKFLOW_FILE is empty but dispatch was required." >&2
            exit 1
          fi
          
          ########################################################
          # Runner self-dispatch guard
          #
          # Bot workflows may be dispatched by the Runner.
          # The Runner must not dispatch itself.
          ########################################################

          case "${WORKFLOW_FILE}" in
            "RGA Lifecycle Runner.yml"|"RGA Lifecycle Runner")
              echo "Lifecycle Runner attempted to dispatch itself." >&2
              echo "WORKFLOW_FILE=${WORKFLOW_FILE}" >&2
              echo "RESOLVED_STAGE=${RESOLVED_STAGE:-unknown}" >&2
              echo "NEXT_STAGE=${NEXT_STAGE:-}" >&2
              exit 1
              ;;
          esac          

          if [ -z "${DISPATCH_INPUTS:-}" ]; then
            echo "DISPATCH_INPUTS is empty but dispatch was required." >&2
            exit 1
          fi

          if [ "${DISPATCH_INPUTS:-}" = "{}" ]; then
            echo "DISPATCH_INPUTS cannot be empty JSON when dispatch is required." >&2
            exit 1
          fi

          if [ -z "${REF_INPUT:-}" ]; then
            echo "REF_INPUT is empty but dispatch was required." >&2
            exit 1
          fi
          
          if [ "${DISPATCH_REQUIRED:-false}" = "true" ] && [ -z "${NEXT_STAGE:-}" ]; then
            echo "NEXT_STAGE is empty while dispatch is required." >&2
            echo "RESOLVED_STAGE=${RESOLVED_STAGE:-unknown}" >&2
            echo "WORKFLOW_FILE=${WORKFLOW_FILE:-}" >&2
            exit 1
          fi          

          ########################################################
          # Tooling guard
          ########################################################

          if ! command -v jq >/dev/null 2>&1; then
            echo "jq is required for lifecycle dispatch." >&2
            exit 1
          fi

          ########################################################
          # Token selection policy
          #
          # Pre-human_approval:
          #   pre_audit / plan / plan_audit / human_approval
          #   → PAT_TOKEN or RGA_Access fallback
          #
          # Post-human_approval:
          #   execute / post_audit / complete / deployment-side
          #   → github.token
          ########################################################
          
          echo "Dispatch routing diagnostics:"
          echo "  RESOLVED_STAGE=${RESOLVED_STAGE:-unknown}"
          echo "  NEXT_STAGE=${NEXT_STAGE:-}"
          echo "  WORKFLOW_FILE=${WORKFLOW_FILE:-}"
          echo "  REF_INPUT=${REF_INPUT:-}"
          echo "  DISPATCH_REQUIRED=${DISPATCH_REQUIRED:-false}"          

          TOKEN_STAGE="${NEXT_STAGE:-${RESOLVED_STAGE:-unknown}}"

          PRE_HUMAN_APPROVAL="false"

          case "${TOKEN_STAGE}" in
            pre_audit|plan|plan_audit|human_approval)
              PRE_HUMAN_APPROVAL="true"
              ;;
          esac

          if [ "${PRE_HUMAN_APPROVAL}" = "true" ]; then

            if [ -n "${PAT_TOKEN:-}" ]; then
              DISPATCH_TOKEN="${PAT_TOKEN}"
              DISPATCH_TOKEN_SOURCE="secrets.PAT_TOKEN"

            elif [ -n "${RGA_ACCESS:-}" ]; then
              DISPATCH_TOKEN="${RGA_ACCESS}"
              DISPATCH_TOKEN_SOURCE="secrets.RGA_Access"

            else
              DISPATCH_TOKEN=""
              DISPATCH_TOKEN_SOURCE="missing pre-human approval PAT"
            fi

          else

            DISPATCH_TOKEN="${GITHUB_TOKEN_FALLBACK:-}"
            DISPATCH_TOKEN_SOURCE="github.token"

          fi

          if [ -z "${DISPATCH_TOKEN}" ]; then

            echo "Dispatch token is missing." >&2
            echo "Token stage: ${TOKEN_STAGE}" >&2
            echo "Expected token source: ${DISPATCH_TOKEN_SOURCE}" >&2

            jq -n \
              --arg current "${RESOLVED_STAGE:-unknown}" \
              --arg next "${NEXT_STAGE:-}" \
              --arg status "${LIFECYCLE_STATUS:-running}" \
              --arg workflow "${WORKFLOW_FILE}" \
              --arg ref "${REF_INPUT}" \
              --arg token_stage "${TOKEN_STAGE}" \
              --arg token_source "${DISPATCH_TOKEN_SOURCE}" \
              '{
                schema: "rga.lifecycle_dispatch_result.v1.1",
                dispatch_performed: false,
                dispatch_created: false,
                current_stage: $current,
                next_stage: (
                  if $next == ""
                  then null
                  else $next
                  end
                ),
                lifecycle_status: $status,
                target_workflow: $workflow,
                ref: $ref,
                reason: "dispatch token missing",
                token_stage: $token_stage,
                token_source: $token_source,
                chronology_owner: "lifecycle_runner",
                workflow_run_continuation_expected: true,
                downstream_contract_expected: "artifacts/lifecycle_event.json",
                downstream_backhaul_expected: "artifacts/lifecycle_backhaul.json",
                downstream_resume_model: "workflow_run_contract_backhaul"
              }' \
              > artifacts/lifecycle_dispatch_result.json

            exit 1

          fi

          echo "Dispatch token source: ${DISPATCH_TOKEN_SOURCE}"
          echo "Dispatch token stage: ${TOKEN_STAGE}"
          echo "Dispatch token length: ${#DISPATCH_TOKEN}"

          ########################################################
          # Validate dispatch inputs
          ########################################################

          echo "${DISPATCH_INPUTS}" | jq empty

          ########################################################
          # Encode workflow filename
          ########################################################

          ENCODED_WORKFLOW="$(
            printf '%s' "${WORKFLOW_FILE}" |
              jq -sRr @uri
          )"

          ########################################################
          # Build workflow_dispatch payload
          ########################################################

          DISPATCH_PAYLOAD="/tmp/rga_lifecycle_dispatch_payload.json"
          DISPATCH_RESPONSE="/tmp/rga_lifecycle_dispatch_response.json"
          DISPATCH_STATUS="/tmp/rga_lifecycle_dispatch_status.txt"

          jq -n \
            --arg ref "${REF_INPUT}" \
            --argjson inputs "${DISPATCH_INPUTS}" \
            '{
              ref: $ref,
              inputs: $inputs
            }' \
            > "${DISPATCH_PAYLOAD}"

          API_URL="https://api.github.com/repos/${GH_OWNER_REPO}/actions/workflows/${ENCODED_WORKFLOW}/dispatches"

          ########################################################
          # Dispatch diagnostics
          ########################################################

          echo "Dispatching workflow: ${WORKFLOW_FILE}"
          echo "Encoded workflow: ${ENCODED_WORKFLOW}"
          echo "Current stage: ${RESOLVED_STAGE:-unknown}"
          echo "Lifecycle status: ${LIFECYCLE_STATUS:-running}"

          if [ -n "${NEXT_STAGE:-}" ]; then
            echo "Next stage: ${NEXT_STAGE}"
          else
            echo "Next stage: (none)"
          fi

          echo "Ref: ${REF_INPUT}"
          echo "Chronology owner: Lifecycle Runner"
          echo "Downstream continuation model: workflow_run"
          echo "Expected contract artifact: artifacts/lifecycle_event.json"
          echo "Expected backhaul artifact: artifacts/lifecycle_backhaul.json"

          echo "Dispatch payload:"
          cat "${DISPATCH_PAYLOAD}"

          if [ ! -s "${DISPATCH_PAYLOAD}" ]; then
            echo "Dispatch payload file was not created or is empty." >&2
            exit 1
          fi

          ########################################################
          # GitHub workflow_dispatch
          #
          # Keep curl execution outside command substitution.
          # This avoids shell parsing ambiguity around multiline
          # command substitution and continuation characters.
          ########################################################

          set +e

          curl -sS \
            -o "${DISPATCH_RESPONSE}" \
            -w "%{http_code}" \
            -X POST \
            -H "Authorization: Bearer ${DISPATCH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "Content-Type: application/json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "${API_URL}" \
            -d @"${DISPATCH_PAYLOAD}" \
            > "${DISPATCH_STATUS}"

          CURL_EXIT_CODE="$?"

          set -e

          HTTP_STATUS="$(
            cat "${DISPATCH_STATUS}" 2>/dev/null || echo "000"
          )"

          if [ "${CURL_EXIT_CODE}" != "0" ]; then
            echo "curl failed before GitHub API status could be trusted." >&2
            echo "curl_exit_code=${CURL_EXIT_CODE}" >&2
            echo "http_status=${HTTP_STATUS}" >&2

            if [ -f "${DISPATCH_RESPONSE}" ]; then
              echo "API response:" >&2
              sed -n '1,200p' "${DISPATCH_RESPONSE}" >&2 || true
            fi

            exit 1
          fi
          
          ########################################################
          # Downstream continuation expectations
          #
          # Bot workflows are expected to publish lifecycle
          # contracts and resume the Runner through workflow_run.
          #
          # Governance Gate is a terminal governance stage and
          # should not be treated as a Bot contract producer unless
          # explicitly designed that way.
          ########################################################

          DOWNSTREAM_CONTRACT_EXPECTED="artifacts/lifecycle_event.json"
          DOWNSTREAM_BACKHAUL_EXPECTED="artifacts/lifecycle_backhaul.json"
          DOWNSTREAM_RESUME_MODEL="workflow_run_contract_backhaul"
          WORKFLOW_RUN_CONTINUATION_EXPECTED="true"

          case "${NEXT_STAGE:-}" in

            governance_gate)

              DOWNSTREAM_CONTRACT_EXPECTED=""
              DOWNSTREAM_BACKHAUL_EXPECTED=""
              DOWNSTREAM_RESUME_MODEL="governance_terminal_stage"
              WORKFLOW_RUN_CONTINUATION_EXPECTED="false"
              ;;

          esac          

          ########################################################
          # Dispatch failure
          ########################################################

          if [ "${HTTP_STATUS}" != "204" ]; then

            echo "Workflow dispatch failed (HTTP ${HTTP_STATUS})" >&2

            if [ "${HTTP_STATUS}" = "401" ]; then
              echo "::error::workflow_dispatch unauthorized. Check token source ${DISPATCH_TOKEN_SOURCE}." >&2
            fi

            if [ "${HTTP_STATUS}" = "403" ]; then
              echo "::error::workflow_dispatch forbidden. Check Actions permission / token scope." >&2
            fi

            if [ "${HTTP_STATUS}" = "404" ]; then
              echo "::error::workflow file or repository not found for token." >&2
            fi

            if [ "${HTTP_STATUS}" = "422" ]; then
              echo "::error::workflow_dispatch is not available or workflow file name is incorrect." >&2
            fi

            echo "API response:" >&2

            sed -n '1,200p' \
              "${DISPATCH_RESPONSE}" \
              >&2 \
              || true

            jq -n \
              --arg current "${RESOLVED_STAGE:-unknown}" \
              --arg next "${NEXT_STAGE:-}" \
              --arg status "${LIFECYCLE_STATUS:-running}" \
              --arg workflow "${WORKFLOW_FILE}" \
              --arg ref "${REF_INPUT}" \
              --arg http_status "${HTTP_STATUS}" \
              --arg token_stage "${TOKEN_STAGE}" \
              --arg token_source "${DISPATCH_TOKEN_SOURCE}" \
              --arg downstream_contract "${DOWNSTREAM_CONTRACT_EXPECTED:-}" \
              --arg downstream_backhaul "${DOWNSTREAM_BACKHAUL_EXPECTED:-}" \
              --arg downstream_resume_model "${DOWNSTREAM_RESUME_MODEL:-workflow_run_contract_backhaul}" \
              --argjson workflow_run_expected "${WORKFLOW_RUN_CONTINUATION_EXPECTED:-true}" \
              '{
                schema: "rga.lifecycle_dispatch_result.v1.2",

                dispatch_performed: false,
                dispatch_created: false,

                current_stage: $current,

                next_stage:
                  (
                    if $next == ""
                    then null
                    else $next
                    end
                  ),

                lifecycle_status: $status,

                target_workflow: $workflow,

                ref: $ref,

                http_status: $http_status,

                token_stage: $token_stage,

                token_source: $token_source,

                reason: "workflow_dispatch failed",

                chronology_owner: "lifecycle_runner",

                workflow_run_continuation_expected: $workflow_run_expected,

                downstream_contract_expected:
                  (
                    if $downstream_contract == ""
                    then null
                    else $downstream_contract
                    end
                  ),

                downstream_backhaul_expected:
                  (
                    if $downstream_backhaul == ""
                    then null
                    else $downstream_backhaul
                    end
                  ),

                downstream_resume_model: $downstream_resume_model,

                bot_must_not_dispatch_runner: true
              }' \
              > artifacts/lifecycle_dispatch_result.json

            exit 1

          fi

          ########################################################
          # Dispatch success
          ########################################################

          jq -n \
            --arg current "${RESOLVED_STAGE:-unknown}" \
            --arg next "${NEXT_STAGE:-}" \
            --arg status "${LIFECYCLE_STATUS:-running}" \
            --arg workflow "${WORKFLOW_FILE}" \
            --arg ref "${REF_INPUT}" \
            --arg token_stage "${TOKEN_STAGE}" \
            --arg token_source "${DISPATCH_TOKEN_SOURCE}" \
            --arg downstream_contract "${DOWNSTREAM_CONTRACT_EXPECTED:-}" \
            --arg downstream_backhaul "${DOWNSTREAM_BACKHAUL_EXPECTED:-}" \
            --arg downstream_resume_model "${DOWNSTREAM_RESUME_MODEL:-workflow_run_contract_backhaul}" \
            --argjson workflow_run_expected "${WORKFLOW_RUN_CONTINUATION_EXPECTED:-true}" \
            '{
              schema: "rga.lifecycle_dispatch_result.v1.2",

              dispatch_performed: true,
              dispatch_created: true,

              current_stage: $current,

              next_stage:
                (
                  if $next == ""
                  then null
                  else $next
                  end
                ),

              lifecycle_status: $status,

              target_workflow: $workflow,

              ref: $ref,

              token_stage: $token_stage,

              token_source: $token_source,

              chronology_owner: "lifecycle_runner",

              workflow_run_continuation_expected: $workflow_run_expected,

              downstream_contract_expected:
                (
                  if $downstream_contract == ""
                  then null
                  else $downstream_contract
                  end
                ),

              downstream_backhaul_expected:
                (
                  if $downstream_backhaul == ""
                  then null
                  else $downstream_backhaul
                  end
                ),

              downstream_resume_model: $downstream_resume_model,

              bot_must_not_dispatch_runner: true
            }' \
            > artifacts/lifecycle_dispatch_result.json

          echo "Dispatched workflow '${WORKFLOW_FILE}' successfully."
          echo "Lifecycle dispatch result written:"
          cat artifacts/lifecycle_dispatch_result.json

      ############################################################
      # Upload Lifecycle Event
      ############################################################

      - name: Upload Lifecycle Event
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rga-lifecycle-event
          path: artifacts/lifecycle_event.json
          if-no-files-found: warn
          retention-days: 30
          
      ############################################################
      # Upload Lifecycle State
      ############################################################

      - name: Upload Lifecycle State
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rga-lifecycle-state
          path: artifacts/lifecycle_state.json
          if-no-files-found: warn
          retention-days: 30

