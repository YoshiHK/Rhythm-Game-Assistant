name: "RGA Lifecycle Runner"

description: >
  Session-aware RGA maintenance and operations lifecycle runner.

  This composite action does not audit, plan, execute, approve, or mutate
  repository state directly. It orchestrates lifecycle stages by dispatching
  the existing Bot #1 Runtime Auditor and Bot #2 Maintenance Executor
  workflows through GitHub workflow_dispatch.

  Canonical lifecycle:

    pre_audit
      -> Bot #1 Runtime Auditor

    implementation_plan
      -> Bot #2 Maintenance Executor
         executor_mode=plan

    plan_audit
      -> Bot #1 Runtime Auditor
         audit_mode=plan_audit

    human_approval
      -> Human approval artifact checkpoint
         no workflow dispatch

    execute
      -> Bot #2 Maintenance Executor
         executor_mode=execute

    post_audit
      -> Bot #1 Runtime Auditor
         audit_mode=post_audit

inputs:
  lifecycle_stage:
    description: >
      Lifecycle stage to orchestrate.
      One of: pre_audit, implementation_plan, plan_audit,
      human_approval, execute, post_audit.
    required: true
    default: "pre_audit"

  ref:
    description: Git ref, branch, or SHA to run on.
    required: false
    default: "main"

  github_token:
    description: >
      GitHub token used to call workflow_dispatch.
      The caller workflow needs actions: write permission.
    required: true

  audit_session_id:
    description: >
      Optional correlation id connecting the maintenance lifecycle artifacts.
      If empty, this runner generates a deterministic timestamp-based session id.
    required: false
    default: ""

  session_state_path:
    description: Path to write lifecycle session state JSON.
    required: false
    default: "artifacts/lifecycle_state.json"

  auditor_workflow_file:
    description: Runtime Auditor workflow filename.
    required: false
    default: "RGA Runtime Auditor.yml"

  executor_workflow_file:
    description: Maintenance Executor workflow filename.
    required: false
    default: "RGA Maintenance Executor.yml"

  pre_audit_report:
    description: Bot #1 pre-audit report artifact path.
    required: false
    default: "artifacts/runtime_auditor_report.json"

  execution_plan:
    description: Bot #2 execution plan artifact path.
    required: false
    default: "artifacts/execution_plan.json"

  approval_artifact:
    description: Human approval artifact path.
    required: false
    default: "artifacts/human_execution_approval.json"

  execution_approval:
    description: >
      Approval phrase for execute stage.
      Expected value: APPROVE_RGA_EXECUTION
    required: false
    default: ""

runs:
  using: composite

  steps:
    - name: Dispatch lifecycle stage
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.github_token }}
        REPO: ${{ github.repository }}
        STAGE: ${{ inputs.lifecycle_stage }}
        REF_INPUT: ${{ inputs.ref }}
        AUDIT_SESSION_ID_INPUT: ${{ inputs.audit_session_id }}
        SESSION_STATE_PATH: ${{ inputs.session_state_path }}
        AUDITOR_WORKFLOW_FILE: ${{ inputs.auditor_workflow_file }}
        EXECUTOR_WORKFLOW_FILE: ${{ inputs.executor_workflow_file }}
        PRE_AUDIT_REPORT: ${{ inputs.pre_audit_report }}
        EXECUTION_PLAN: ${{ inputs.execution_plan }}
        APPROVAL_ARTIFACT: ${{ inputs.approval_artifact }}
        EXECUTION_APPROVAL: ${{ inputs.execution_approval }}
      run: |
        set -euo pipefail

        mkdir -p artifacts

        if [ -z "$AUDIT_SESSION_ID_INPUT" ]; then
          AUDIT_SESSION_ID="rga-session-$(date -u +%Y%m%dT%H%M%SZ)"
        else
          AUDIT_SESSION_ID="$AUDIT_SESSION_ID_INPUT"
        fi

        case "$STAGE" in
          pre_audit|implementation_plan|plan_audit|human_approval|execute|post_audit)
            ;;
          *)
            echo "Unsupported lifecycle_stage: $STAGE" >&2
            echo "Expected one of:" >&2
            echo "  pre_audit" >&2
            echo "  implementation_plan" >&2
            echo "  plan_audit" >&2
            echo "  human_approval" >&2
            echo "  execute" >&2
            echo "  post_audit" >&2
            exit 1
            ;;
        esac

        if [ "$STAGE" = "execute" ]; then
          if [ -z "$EXECUTION_APPROVAL" ]; then
            echo "execution_approval missing" >&2
            exit 1
          fi

          if [ "$EXECUTION_APPROVAL" != "APPROVE_RGA_EXECUTION" ]; then
            echo "invalid execution_approval phrase" >&2
            exit 1
          fi
        fi

        WORKFLOW_FILE=""
        DISPATCH_INPUTS="{}"
        NEXT_STAGE=""
        DISPATCH_REQUIRED="true"

        case "$STAGE" in
          pre_audit)
            WORKFLOW_FILE="$AUDITOR_WORKFLOW_FILE"
            NEXT_STAGE="implementation_plan"
            DISPATCH_INPUTS=$(python3 -c 'import json, os; print(json.dumps({"audit_mode":"pre_audit","audit_session_id":os.environ["AUDIT_SESSION_ID"]}))')
            ;;

          implementation_plan)
            WORKFLOW_FILE="$EXECUTOR_WORKFLOW_FILE"
            NEXT_STAGE="plan_audit"
            DISPATCH_INPUTS=$(python3 -c 'import json, os; print(json.dumps({"executor_mode":"plan","audit_session_id":os.environ["AUDIT_SESSION_ID"],"pre_audit_report":os.environ.get("PRE_AUDIT_REPORT","")}))')
            ;;

          plan_audit)
            WORKFLOW_FILE="$AUDITOR_WORKFLOW_FILE"
            NEXT_STAGE="human_approval"
            DISPATCH_INPUTS=$(python3 -c 'import json, os; print(json.dumps({"audit_mode":"plan_audit","audit_session_id":os.environ["AUDIT_SESSION_ID"],"execution_plan":os.environ.get("EXECUTION_PLAN","")}))')
            ;;

          human_approval)
            WORKFLOW_FILE=""
            NEXT_STAGE="execute"
            DISPATCH_REQUIRED="false"
            ;;

          execute)
            WORKFLOW_FILE="$EXECUTOR_WORKFLOW_FILE"
            NEXT_STAGE="post_audit"
            DISPATCH_INPUTS=$(python3 -c 'import json, os; print(json.dumps({"executor_mode":"execute","audit_session_id":os.environ["AUDIT_SESSION_ID"],"execution_plan":os.environ.get("EXECUTION_PLAN", ""),"approval_artifact":os.environ.get("APPROVAL_ARTIFACT", ""),"execution_approval":os.environ.get("EXECUTION_APPROVAL", "")}))')
            ;;

          post_audit)
            WORKFLOW_FILE="$AUDITOR_WORKFLOW_FILE"
            NEXT_STAGE="complete"
            DISPATCH_INPUTS=$(python3 -c 'import json, os; print(json.dumps({"audit_mode":"post_audit","audit_session_id":os.environ["AUDIT_SESSION_ID"],"execution_plan":os.environ.get("EXECUTION_PLAN", ""),"pre_audit_report":os.environ.get("PRE_AUDIT_REPORT", "")}))')
            ;;
        esac

        export AUDIT_SESSION_ID
        export NEXT_STAGE
        export DISPATCH_REQUIRED
        export DISPATCH_INPUTS
        export WORKFLOW_FILE

        python3 -c 'import json, os, datetime; from pathlib import Path; path=Path(os.environ["SESSION_STATE_PATH"]); path.parent.mkdir(parents=True, exist_ok=True); payload={"schema":"rga.lifecycle_state.v1.0","generated_at":datetime.datetime.now(datetime.timezone.utc).replace(microsecond=0).isoformat(),"audit_session_id":os.environ["AUDIT_SESSION_ID"],"current_stage":os.environ["STAGE"],"next_stage":os.environ["NEXT_STAGE"],"dispatch_required":os.environ["DISPATCH_REQUIRED"]=="true","workflow_file":os.environ.get("WORKFLOW_FILE") or None,"dispatch_inputs":json.loads(os.environ.get("DISPATCH_INPUTS","{}")),"canonical_lifecycle":["pre_audit","implementation_plan","plan_audit","human_approval","execute","post_audit"],"policy":{"runner_does_not_audit":True,"runner_does_not_execute":True,"runner_does_not_approve":True,"human_approval_required_for_execute":True,"completed_phases_remain_immutable":True}}; path.write_text(json.dumps(payload, indent=2, ensure_ascii=False), encoding="utf-8")'

        if [ "$DISPATCH_REQUIRED" != "true" ]; then
          echo "Lifecycle stage '${STAGE}' records a human approval checkpoint only."
          echo "No workflow dispatch was performed."
          echo "Session state written to ${SESSION_STATE_PATH}."
          exit 0
        fi

        ENCODED_WORKFLOW=$(python3 -c 'import urllib.parse, sys; print(urllib.parse.quote(sys.argv[1], safe=""))' "$WORKFLOW_FILE")

        PAYLOAD=$(python3 -c 'import json, os; print(json.dumps({"ref": os.environ["REF_INPUT"], "inputs": json.loads(os.environ["DISPATCH_INPUTS"])}))')

        API_URL="https://api.github.com/repos/${REPO}/actions/workflows/${ENCODED_WORKFLOW}/dispatches"

        echo "RGA Lifecycle Runner"
        echo "Session: ${AUDIT_SESSION_ID}"
        echo "Current stage: ${STAGE}"
        echo "Next stage: ${NEXT_STAGE}"
        echo "Dispatch workflow: ${WORKFLOW_FILE}"
        echo "Ref: ${REF_INPUT}"

        HTTP_STATUS=$(curl -sS \
          -o /tmp/rga_lifecycle_dispatch_response.json \
          -w "%{http_code}" \
          -X POST \
          -H "Authorization: Bearer ${GITHUB_TOKEN}" \
          -H "Accept: application/vnd.github+json" \
          -H "Content-Type: application/json" \
          "$API_URL" \
          -d "$PAYLOAD" || true)

        if [ "$HTTP_STATUS" != "204" ]; then
          echo "Workflow dispatch failed (HTTP ${HTTP_STATUS})" >&2
          echo "API response:" >&2
          sed -n '1,200p' /tmp/rga_lifecycle_dispatch_response.json >&2 || true
          echo "Payload sent:" >&2
          echo "$PAYLOAD" >&2
          exit 1
        fi

        echo "Dispatched workflow '${WORKFLOW_FILE}' for stage '${STAGE}' (ref: ${REF_INPUT})."
        echo "Session state written to ${SESSION_STATE_PATH}."
