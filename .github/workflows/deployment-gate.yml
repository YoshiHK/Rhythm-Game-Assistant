name: Deployment Gate

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:

jobs:
  deployment-gate-lite:
    runs-on: windows-latest

    steps:
      # --------------------------------------------------
      # Checkout
      # --------------------------------------------------
      - name: Checkout
        uses: actions/checkout@v4

      # --------------------------------------------------
      # Setup Python
      # --------------------------------------------------
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # --------------------------------------------------
      # Create venv
      # --------------------------------------------------
      - name: Create venv
        shell: pwsh
        run: |
          python -m venv .venv
          .\.venv\Scripts\python.exe -m pip install --upgrade pip

      # --------------------------------------------------
      # Install requirements
      # --------------------------------------------------
      - name: Install requirements
        shell: pwsh
        run: |
          .\.venv\Scripts\python.exe -m pip install pyyaml

          if (Test-Path .\requirements.txt) {
            .\.venv\Scripts\python.exe `
              -m pip install `
              -r .\requirements.txt
          }

      # --------------------------------------------------
      # Prepare CI-local workspace
      # --------------------------------------------------
      - name: Prepare CI data root
        shell: pwsh
        run: |
          New-Item `
            -ItemType Directory `
            -Force `
            -Path .\ci_data | Out-Null

          New-Item `
            -ItemType Directory `
            -Force `
            -Path ".\ci_data\Chart File" | Out-Null

      # --------------------------------------------------
      # Run setup chain
      # --------------------------------------------------
      - name: Run setup chain
        shell: pwsh
        run: |
          Set-ExecutionPolicy `
            -Scope Process `
            -ExecutionPolicy Bypass

          .\setup.ps1 `
            -RepoRoot "." `
            -DataRoot ".\ci_data" `
            -OfflineValidationMode `
            -RunStageProbes `
            -RunOrchestrator `
            -EnableCaseExpectOverride `
            -RequireInterpretationOutput `
            -SkipNonFeedbackCases `
            -StrictValidation

      # --------------------------------------------------
      # Resolve offline validation report
      # --------------------------------------------------
      - name: Resolve offline validation report
        id: offline
        shell: pwsh
        run: |
          $report = Get-ChildItem `
            ".\ci_data\Tips Output Meta\offline_validation" `
            -Recurse `
            -Filter "offline_validation_report.json" |
            Sort-Object LastWriteTime |
            Select-Object -Last 1

          if (-not $report) {
            throw "offline_validation_report.json not found"
          }

          "report_path=$($report.FullName)" `
            >> $env:GITHUB_OUTPUT

      # --------------------------------------------------
      # Resolve runtime index (optional)
      # --------------------------------------------------
      - name: Resolve runtime index
        id: runtime
        shell: pwsh
        run: |
          $idx = Get-ChildItem `
            ".\ci_data" `
            -Recurse `
            -Filter "runtime_index.json" |
            Sort-Object LastWriteTime |
            Select-Object -Last 1

          if ($idx) {
            "runtime_index_path=$($idx.FullName)" `
              >> $env:GITHUB_OUTPUT
          }

      # --------------------------------------------------
      # Run Deployment Gate Lite
      #
      # Scope:
      #   repo_smoke
      #   phase5_summary
      #   offline_validation
      #   governed_policy
      #
      # NOT INCLUDED:
      #   Stage 1-8 governance contracts
      # --------------------------------------------------
      - name: Run deployment gate lite
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $OfflineValidationReport =
            "${{ steps.offline.outputs.report_path }}"

          $RuntimeIndexPath =
            "${{ steps.runtime.outputs.runtime_index_path }}"

          $args = @(
            ".\deployment_gate.py",

            "--offline-validation-report",
            $OfflineValidationReport,

            "--output",
            ".\deployment_gate_report.json"
          )

          # --------------------------------------------------
          # Governed Policy
          # --------------------------------------------------

          if (Test-Path ".\config\policy.yml") {

            $args += "--policy-config"
            $args += ".\config\policy.yml"

          }
          elseif (Test-Path ".\config\policy.yaml") {

            $args += "--policy-config"
            $args += ".\config\policy.yaml"

          }

          # --------------------------------------------------
          # Optional Runtime Index
          # --------------------------------------------------

          if (
            -not [string]::
              $RuntimeIndexPath
            )
            {

            if (Test-Path $RuntimeIndexPath) {

              $args += "--runtime-index"
              $args += $RuntimeIndexPath
              $args += "--require-runtime-index"

            }
            else {

              Write-Host (
                "[DEPLOYMENT-GATE-LITE][WARN] " +
                "runtime_index.json path declared " +
                "but file not found: " +
                $RuntimeIndexPath
              )

            }
          }

          # --------------------------------------------------
          # Diagnostics
          # --------------------------------------------------

          Write-Host ""
          Write-Host "[DEPLOYMENT-GATE-LITE] Arguments"
          Write-Host "----------------------------------------"

          $args | ForEach-Object {
            Write-Host "  $_"
          }

          Write-Host "----------------------------------------"

          & .\.venv\Scripts\python.exe @args

      # --------------------------------------------------
      # Upload report
      # --------------------------------------------------
      - name: Upload deployment gate report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deployment-gate-report
          path: |
            deployment_gate_report.json
          if-no-files-found: warn
