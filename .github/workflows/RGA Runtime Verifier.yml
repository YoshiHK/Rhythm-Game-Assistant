              "revalidate_derived_failures_after_root_resolution": true,
              "dependency_failures_are_not_governance_failures": true,
              "impact_scope_is_advisory_only": true
            }
          }
          JSON

      ############################################################
      # Run Verifier
      ############################################################

      - name: Run RGA Runtime Verifier
        id: run_verifier
        continue-on-error: true
        run: |
          set +e

          python tools/runtime_verifier.py \
            --repo-root . \
            --mcp-config .vscode/mcp.json \
            --json-out artifacts/runtime_verifier_report.json \
            --md-out artifacts/runtime_verifier_report.md \
            > artifacts/runtime_verifier_stdout.txt \
            2> artifacts/runtime_verifier_stderr.txt

          verifier_exit_code=$?

          echo "${verifier_exit_code}" \
            > artifacts/runtime_verifier_exit_code.txt

          echo "verifier_exit_code=${verifier_exit_code}" \
            >> "$GITHUB_OUTPUT"

          echo "RGA Runtime Verifier exited with code: ${verifier_exit_code}"

          exit 0

      ############################################################
      # Artifact Bundle Manifest
      ############################################################

      - name: Artifact Bundle Manifest
        if: always()
        run: |
          {
            echo "RGA Runtime Verifier Artifact Bundle"
            echo ""

            echo "Generated at:"
            date -u +"%Y-%m-%dT%H:%M:%SZ"

            echo ""
            echo "Verifier Exit Code:"

            cat artifacts/runtime_verifier_exit_code.txt || true

            echo ""
            echo "Artifact Count:"

            find artifacts -type f | wc -l

            echo ""
            echo "Files:"

            find artifacts -type f | sort
          } > artifacts/artifact_bundle_manifest.txt

      ############################################################
      # Create Downloadable Zip Bundle
      ############################################################

      - name: Create Downloadable Zip Bundle
        if: always()
        run: |
          cd artifacts

          zip -r ../runtime-verifier-report.zip . || true

          cd ..

          if [ -f runtime-verifier-report.zip ]; then
            cp runtime-verifier-report.zip \
              artifacts/runtime-verifier-report.zip
          fi

      ############################################################
      # Runtime Verifier Job Summary
      ############################################################

      - name: Runtime Verifier Job Summary
        if: always()
        run: |
          {
            echo "## RGA Runtime Verifier"
            echo ""

            echo "- JSON Report: \`artifacts/runtime_verifier_report.json\`"
            echo "- Markdown Report: \`artifacts/runtime_verifier_report.md\`"
            echo "- Evidence Bundle: \`artifacts/\`"
            echo "- Downloadable Zip: \`runtime-verifier-report.zip\`"

            echo ""

            if [ -f artifacts/runtime_verifier_exit_code.txt ]; then
              echo "- Verifier Exit Code: \`$(cat artifacts/runtime_verifier_exit_code.txt)\`"
              echo ""
            fi

            if [ -f artifacts/runtime_verifier_report.md ]; then
              echo "### Markdown Report Preview"
              echo ""

              head -n 120 \
                artifacts/runtime_verifier_report.md

              echo ""
            fi

            if [ -f artifacts/runtime_verifier_stderr.txt ]; then
              echo "### stderr Preview"
              echo ""
              echo '```text'

              head -n 80 \
                artifacts/runtime_verifier_stderr.txt

              echo '```'
              echo ""
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      ############################################################
      # Upload Artifact Folder
      ############################################################

      - name: Upload Runtime Verifier Artifact Folder
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: runtime-verifier-artifacts
          path: artifacts/
          if-no-files-found: warn

      ############################################################
      # Upload Downloadable Zip Bundle
      ############################################################

      - name: Upload Runtime Verifier Zip
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: runtime-verifier-report-zip
          path: runtime-verifier-report.zip
          if-no-files-found: warn
