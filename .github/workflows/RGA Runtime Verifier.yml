            engine \
            > artifacts/layer_boundary_hints.txt || true

          ########################################################
          # Tier 2
          # Suspicion-level evidence
          #
          # Import-style references crossing layers.
          # Requires review but is not automatically
          # governance blocking.
          ########################################################

          grep -RInE \
            '^[[:space:]]*import .*writer|^[[:space:]]*from .*writer' \
            engine \
            > artifacts/layer_boundary_writer_imports.txt || true

          grep -RInE \
            '^[[:space:]]*import .*persistence|^[[:space:]]*from .*persistence' \
            engine \
            > artifacts/layer_boundary_persistence_imports.txt || true

          grep -RInE \
            '^[[:space:]]*import .*orchestrator|^[[:space:]]*from .*orchestrator' \
            engine \
            > artifacts/layer_boundary_orchestrator_imports.txt || true

          cat \
            artifacts/layer_boundary_writer_imports.txt \
            artifacts/layer_boundary_persistence_imports.txt \
            artifacts/layer_boundary_orchestrator_imports.txt \
            > artifacts/layer_boundary_suspicions.txt || true

          ########################################################
          # Tier 3
          # Evidence-level signals
          #
          # Executable side effects.
          # Candidate governance blockers.
          ########################################################

          grep -RIn \
            -e ".commit(" \
            -e ".execute(" \
            -e ".executemany(" \
            engine \
            > artifacts/layer_boundary_db_operations.txt || true

          grep -RIn \
            -e "INSERT INTO" \
            -e "UPDATE " \
            -e "DELETE FROM" \
            -e "CREATE TABLE" \
            -e "DROP TABLE" \
            -e "ALTER TABLE" \
            engine \
            > artifacts/layer_boundary_sql_statements.txt || true

          grep -RIn \
            -e ".persist(" \
            -e ".save(" \
            -e ".write(" \
            engine \
            > artifacts/layer_boundary_write_operations.txt || true

          cat \
            artifacts/layer_boundary_db_operations.txt \
            artifacts/layer_boundary_sql_statements.txt \
            artifacts/layer_boundary_write_operations.txt \
            > artifacts/layer_boundary_evidence.txt || true

          ########################################################
          # Risk summary
          ########################################################

          python - <<'PY'
          import json
          from pathlib import Path

          def count_lines(path_text):
              path = Path(path_text)

              if not path.exists():
                  return 0

              return sum(
                  1
                  for line in path.read_text(
                      encoding="utf-8",
                      errors="ignore",
                  ).splitlines()
                  if line.strip()
              )

          hint_count = count_lines(
              "artifacts/layer_boundary_hints.txt"
          )

          suspicion_count = count_lines(
              "artifacts/layer_boundary_suspicions.txt"
          )

          evidence_count = count_lines(
              "artifacts/layer_boundary_evidence.txt"
          )

          highest_confidence = (
              "evidence"
              if evidence_count > 0
              else (
                  "suspicion"
                  if suspicion_count > 0
                  else (
                      "hint"
                      if hint_count > 0
                      else "none"
                  )
              )
          )

          payload = {
              "schema":
                  "rga.layer_boundary_risk.v1.1",

              "hint_count":
                  hint_count,

              "suspicion_count":
                  suspicion_count,

              "evidence_count":
                  evidence_count,

              "highest_confidence":
                  highest_confidence,

              "confidence_summary": {
                  "hint":
                      hint_count,

                  "suspicion":
                      suspicion_count,

                  "evidence":
                      evidence_count,
              },

              "confidence_model": [
                  "hint",
                  "suspicion",
                  "evidence",
              ],

              "governance_blocking_confidence": [
                  "evidence",
              ],

              "repository_driven":
                  True,

              "evidence_origin":
                  "repository_discovery",

              "governance_interpretation": {
                  "ready":
                      "no evidence-level violations",

                  "review_needed":
                      "suspicion-level signals detected",

                  "blocked":
                      "evidence-level violations detected",
              },

              "policy": {
                  "hints_block_governance":
                      False,

                  "suspicions_block_governance":
                      False,

                  "evidence_blocks_governance":
                      True,
              },
          }

          with open(
              "artifacts/layer_boundary_risk.json",
              "w",
              encoding="utf-8",
          ) as f:
              json.dump(
                  payload,
                  f,
                  indent=2,
                  ensure_ascii=False,
              )
          PY

          ########################################################
          # Human-readable summary
          ########################################################

          {
            echo "Layer Boundary Evidence Summary"
            echo ""

            echo "Confidence Model"
            echo "----------------"
            echo "hint"
            echo "suspicion"
            echo "evidence"
            echo ""

            echo "Governance Interpretation"
