name: RGA Runtime Verifier

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  runtime-verification:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      security-events: read
      actions: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      ############################################################
      # Artifact Directory
      ############################################################

      - name: Prepare Artifact Directory
        run: |
          mkdir -p artifacts

      ############################################################
      # Evidence Taxonomy
      ############################################################

      - name: Evidence Taxonomy
        run: |
          cat > artifacts/evidence_taxonomy.json <<'JSON'
          {
            "schema": "rga.evidence.taxonomy.v1.0",
            "mode": "read_only",
            "bot_role": {
              "checker": true,
              "validator": true,
              "verifier": true,
              "auditor": true,
              "advisor": true,

              "maintainer_support": true,
              
              "governor": false,
              "maintainer": false
            },
            "classification": {
              "repository_reality": {
                "description": "Files, folders, package roots, and discovered repository surfaces.",
                "governance_blocking": true
              },
              "dependency_reality": {
                "description": "Python/package dependency availability and import prerequisites.",
                "governance_blocking": false,
                "affects": [
                  "runtime_verdict",
                  "flow_verification"
                ]
              },
              "import_reality": {
                "description": "Whether Python modules import successfully in the current runtime context.",
                "governance_blocking": false,
                "affects": [
                  "runtime_verdict"
                ]
              },
              "runtime_reality": {
                "description": "Runtime availability and operational surface evidence.",
                "governance_blocking": false
              },
              "artifact_backbone": {
                "description": "file_scan_inventory.db -> chart_assets.db -> chart_patterns.db backbone.",
                "governance_blocking": true
              },
              "deletion_governance": {
                "description": "Deletion readiness and source asset retention gates.",
                "governance_blocking": true
              },
              "layer_boundary": {
                "description": "Layer responsibility separation evidence.",
                "confidence_model": [
                  "hint",
                  "suspicion",
                  "evidence"
                ],
                "governance_blocking_confidence": [
                  "evidence"
                ]
              },
              "root_failure": {
                "description": "Independently actionable governance blocker.",
                "render_before": [
                  "derived_failure"
                ]
              },
              "derived_failure": {
                "description": "Downstream consequence of an upstream root contract failure.",
                "revalidate_after_root_resolution": true
              }
            },
            "governance_principles": {
              "completed_phases": "immutable",
              "verifier_mode": "read_only",
              "dependency_failures_are_not_governance_failures": true,
              "root_failures_should_be_resolved_first": true,
              "derived_failures_should_be_revalidated_after_root_resolution": true,
              "false_positive_isolation": true,
              "runtime_limited_is_not_governance_blocked": true,
              "root_failures_take_priority": true,
              "impact_scope_is_advisory_only": true,
              "lineage_does_not_imply_remediation": true
              "maintenance_mode": "advisor_only"
            }
          }
          JSON

      ############################################################
      # Repository Discovery Evidence
      ############################################################

      - name: Repository Discovery Evidence
        run: |
          pwd \
            > artifacts/repository_root.txt

          find . -type f \
            | sort \
            > artifacts/repository_inventory.txt

          find . -type d \
            | sort \
            > artifacts/repository_directories.txt

          git status --short \
            > artifacts/git_status_short.txt || true

          git rev-parse HEAD \
            > artifacts/git_head.txt || true

          git branch --show-current \
            > artifacts/git_branch.txt || true

          {
            echo "Repository Discovery Evidence"
            echo ""

            echo "Repository root:"
            cat artifacts/repository_root.txt || true

            echo ""
            echo "Git HEAD:"
            cat artifacts/git_head.txt || true

            echo ""
            echo "Git branch:"
            cat artifacts/git_branch.txt || true

            echo ""
            echo "Inventory files:"
            echo "- repository_inventory.txt"
            echo "- repository_directories.txt"
            echo "- git_status_short.txt"
          } > artifacts/repository_discovery_summary.txt

          python - <<'PY'
          import json
          from pathlib import Path

          def count(path_text):
              p = Path(path_text)

              if not p.exists():
                  return 0

              return len(
                  [
                      line
                      for line in p.read_text(
                          encoding="utf-8",
                          errors="ignore",
                      ).splitlines()
                      if line.strip()
                  ]
              )

          payload = {
              "schema":
                  "rga.repository_discovery_evidence.v1.1",

              "repository_file_count":
                  count(
                      "artifacts/repository_inventory.txt"
                  ),

              "repository_directory_count":
                  count(
                      "artifacts/repository_directories.txt"
                  ),

              "repository_driven":
                  True,

              "evidence_role":
                  "repository_reality",

              "verification_note":
                  (
                      "Repository discovery establishes "
                      "repository reality only. Runtime "
                      "readiness must be verified separately."
                  ),
          }

          with open(
              "artifacts/repository_discovery_summary.json",
              "w",
              encoding="utf-8",
          ) as f:
              json.dump(
                  payload,
                  f,
                  indent=2,
                  ensure_ascii=False,
              )
          PY
          
      ############################################################
      # Runtime Discovery Evidence
      ############################################################

      - name: Runtime Discovery Evidence
        run: |
          find . -type f -name "main.py" \
            | sort > artifacts/main_candidates.txt || true

          find . -type f -name "recommend.py" \
            | sort > artifacts/recommend_candidates.txt || true

          find . -type f -name "app.py" \
            | sort > artifacts/app_candidates.txt || true

          find . -type f -name "runtime_meta.py" \
            | sort > artifacts/runtime_meta_candidates.txt || true

          find . -type f -name "mcp_server.py" \
            | sort > artifacts/mcp_server_candidates.txt || true

          find . -type f -name "runtime_verifier.py" \
            | sort > artifacts/runtime_verifier_candidates.txt || true

          find . -type f \
            \( \
              -name "recommend.py" -o \
              -name "recommendation*.py" -o \
              -name "*recommender*.py" \
            \) \
            | sort > artifacts/recommendation_entrypoints.txt || true

          find . -type f \
            \( \
              -iname "*reader*.py" -o \
              -iname "*readers*.py" \
            \) \
            | sort > artifacts/reader_entrypoints.txt || true

          find . -type f \
            \( \
              -iname "*validator*.py" -o \
              -iname "*validators*.py" \
            \) \
            | sort > artifacts/validator_entrypoints.txt || true

          find . -type f \
            \( \
              -iname "*bridge*.py" -o \
              -iname "*bridges*.py" \
            \) \
            | sort > artifacts/bridge_entrypoints.txt || true

          find . -type f \
            \( \
              -name "*orchestrator*.py" -o \
              -name "*workflow*.py" -o \
              -name "*runtime*.py" \
            \) \
            | sort > artifacts/orchestration_entrypoints.txt || true

          find . -type d \
            | grep "rhythm" \
            > artifacts/rhythm_directories.txt || true

          {
            echo "Runtime Discovery Evidence"
            echo ""
            echo "main.py candidates:"
            cat artifacts/main_candidates.txt || true
            echo ""
            echo "recommend.py candidates:"
            cat artifacts/recommend_candidates.txt || true
            echo ""
            echo "app.py candidates:"
            cat artifacts/app_candidates.txt || true
            echo ""
            echo "runtime_meta.py candidates:"
            cat artifacts/runtime_meta_candidates.txt || true
            echo ""
            echo "mcp_server.py candidates:"
            cat artifacts/mcp_server_candidates.txt || true
          } > artifacts/runtime_discovery_summary.txt

          python - <<'PY'
          import json
          from pathlib import Path

          payload = {
              "schema":
                  "rga.runtime_discovery_evidence.v1.1",

              "repository_driven":
                  True,

              "runtime_surfaces": {
                  "main":
                      "main_candidates.txt",

                  "recommend":
                      "recommend_candidates.txt",

                  "runtime_meta":
                      "runtime_meta_candidates.txt",

                  "mcp":
                      "mcp_server_candidates.txt",
              },

              "discovery_strategy":
                  "repository_driven",

              "verification_note":
                  (
                      "Runtime discovery identifies candidate "
                      "runtime surfaces but does not imply "
                      "runtime readiness."
                  ),
          }

          with open(
              "artifacts/runtime_discovery_summary.json",
              "w",
              encoding="utf-8",
          ) as f:
              json.dump(
                  payload,
                  f,
                  indent=2,
                  ensure_ascii=False,
              )
          PY

      ############################################################
      # Package Reality Evidence
      ############################################################

      - name: Package Reality Evidence
        run: |
          find . -type d -name "rhythm_ingestion" \
            | sort > artifacts/rhythm_ingestion_package_dirs.txt || true

          find . -type d -name "rhythm ingestion" \
            | sort > artifacts/rhythm_invalid_alias_dirs.txt || true

          find . -type f -name "__init__.py" \
            | sort > artifacts/python_init_files.txt || true

          {
            echo "Package Reality Evidence"
            echo ""

            echo "Canonical package dirs:"
            cat artifacts/rhythm_ingestion_package_dirs.txt || true

            echo ""
            echo "Invalid alias dirs:"
            cat artifacts/rhythm_invalid_alias_dirs.txt || true

            echo ""
            echo "__init__.py files:"
            wc -l artifacts/python_init_files.txt || true
          } > artifacts/package_reality_summary.txt

          python - <<'PY'
          import json

          payload = {
              "schema":
                  "rga.package_reality_evidence.v1.1",

              "canonical_package":
                  "rhythm_ingestion",

              "repository_driven":
                  True,

              "package_reality":
                  "independent",

              "verification_note":
                  (
                      "Package reality should be evaluated "
                      "before import reality."
                  ),
          }

          with open(
              "artifacts/package_reality_summary.json",
              "w",
              encoding="utf-8",
          ) as f:
              json.dump(
                  payload,
                  f,
                  indent=2,
                  ensure_ascii=False,
              )
          PY
          
      ############################################################
      # Dependency Reality Evidence
      ############################################################

      - name: Dependency Reality Evidence
        run: |
          python --version \
            > artifacts/python_version.txt

          python -m pip --version \
            > artifacts/pip_version.txt

          python -m pip freeze \
            > artifacts/pip_freeze.txt

          python - <<'PY'
          import importlib
          import json
          import sys

          required_modules = [
              "sqlite3",
          ]

          optional_modules = [
              "fastapi",
              "uvicorn",
              "pydantic",
          ]

          api_runtime_modules = [
              "fastapi",
              "pydantic",
          ]

          def probe(module_name):
              try:
                  module = importlib.import_module(module_name)

                  return {
                      "status": "pass",
                      "file": getattr(
                          module,
                          "__file__",
                          None,
                      ),
                  }

              except Exception as exc:
                  return {
                      "status": "fail",
                      "error": str(exc),
                  }

          payload = {
              "schema":
                  "rga.runtime_dependency_probe.v1.1",

              "python_executable":
                  sys.executable,

              "python_version":
                  sys.version,

              "required_modules": {
                  name: probe(name)
                  for name in required_modules
              },

              "optional_modules": {
                  name: probe(name)
                  for name in optional_modules
              },

              "api_runtime_modules": {
                  name: probe(name)
                  for name in api_runtime_modules
              },

              "classification": {
                  "required_missing":
                      "runtime_limited",

                  "api_runtime_missing":
                      "capability_reduction",

                  "optional_missing":
                      "warning_only",
              },

              "governance_effect": {
                  "required_missing":
                      "runtime_limited",

                  "optional_missing":
                      "warning_only",
              },

              "governance_note": (
                  "Dependency failures influence runtime "
                  "readiness but should not automatically "
                  "be treated as governance failures."
              ),
          }

          with open(
              "artifacts/runtime_dependency_probe.json",
              "w",
              encoding="utf-8",
          ) as f:
              json.dump(
                  payload,
                  f,
                  indent=2,
                  ensure_ascii=False,
              )
          PY

      ############################################################
      # Import Reality Evidence
      ############################################################

      - name: Import Reality Evidence
        run: |
          python - <<'PY'
          import importlib
          import json
          import sys

          modules = [
              "rhythm_ingestion",
              "rhythm_ingestion.api",
              "rhythm_ingestion.api.recommend",
              "rhythm_ingestion.runtime_meta",
          ]

          results = {}

          for module_name in modules:
              try:
                  module = importlib.import_module(
                      module_name
                  )

                  results[module_name] = {
                      "status": "pass",
                      "file": getattr(
                          module,
                          "__file__",
                          None,
                      ),
                  }

              except Exception as exc:
                  results[module_name] = {
                      "status": "fail",
                      "error": str(exc),
                  }

          payload = {
              "schema":
                  "rga.import_reality_probe.v1.1",

              "python_executable":
                  sys.executable,

              "modules":
                  results,

              "repository_driven":
                  True,

              "verification_note": (
                  "Import failures should be interpreted "
                  "against dependency reality before being "
                  "treated as package-layout defects."
              ),
          }

          with open(
              "artifacts/import_reality_probe.json",
              "w",
              encoding="utf-8",
          ) as f:
              json.dump(
                  payload,
                  f,
                  indent=2,
                  ensure_ascii=False,
              )
          PY

      ############################################################
      # Artifact Database Discovery
      ############################################################

      - name: Artifact Database Discovery
        run: |
          find . -type f -name "file_scan_inventory.db" \
            | sort > artifacts/file_scan_inventory_db.txt || true

          find . -type f -name "chart_assets.db" \
            | sort > artifacts/chart_assets_db.txt || true

          find . -type f -name "chart_patterns.db" \
            | sort > artifacts/chart_patterns_db.txt || true

          {
            echo "Artifact Database Discovery"
            echo ""
            echo "Relationship chain:"
            echo "file_scan_inventory.db -> chart_assets.db -> chart_patterns.db"
            echo ""
            echo "file_scan_inventory.db candidates:"
            cat artifacts/file_scan_inventory_db.txt || true
            echo ""
            echo "chart_assets.db candidates:"
            cat artifacts/chart_assets_db.txt || true
            echo ""
            echo "chart_patterns.db candidates:"
            cat artifacts/chart_patterns_db.txt || true
          } > artifacts/artifact_database_discovery_summary.txt

      ############################################################
      # Artifact Database Schema Evidence
      ############################################################

      - name: Artifact Database Schema Evidence
        run: |
          python - <<'PY'
          import json
          import sqlite3
          from pathlib import Path

          db_names = [
              "file_scan_inventory.db",
              "chart_assets.db",
              "chart_patterns.db",
          ]

          report = {}

          for db_name in db_names:
              paths = sorted(Path(".").rglob(db_name))
              report[db_name] = []

              for path in paths:
                  item = {
                      "path": str(path),
                      "exists": path.exists(),
                      "read_mode": "sqlite_readonly",
                      "modification": "prohibited",
                      "readable": False,
                      "tables": [],
                      "table_columns": {},
                      "table_row_counts": {},
                  }

                  try:
                      uri = f"file:{path.resolve().as_posix()}?mode=ro"
                      with sqlite3.connect(uri, uri=True) as conn:
                          cur = conn.cursor()
                          tables = [
                              row[0]
                              for row in cur.execute(
                                  "SELECT name FROM sqlite_master WHERE type='table' ORDER BY name"
                              ).fetchall()
                          ]

                          item["readable"] = True
                          item["tables"] = tables

                          for table in tables:
                              quoted = '"' + table.replace('"', '""') + '"'

                              columns = [
                                  row[1]
                                  for row in cur.execute(f"PRAGMA table_info({quoted})").fetchall()
                              ]

                              item["table_columns"][table] = columns

                              try:
                                  count = cur.execute(f"SELECT COUNT(*) FROM {quoted}").fetchone()[0]
                                  item["table_row_counts"][table] = count
                              except Exception as exc:
                                  item["table_row_counts"][table] = {"error": str(exc)}

                  except Exception as exc:
                      item["error"] = str(exc)

                  report[db_name].append(item)

          payload = {
              "schema": "rga.artifact_database_schema_probe.v1.0",
              "read_mode": "sqlite_readonly",
              "modification": "prohibited",
              "databases": report,
          }

          with open("artifacts/artifact_database_schema_probe.json", "w", encoding="utf-8") as f:
              json.dump(payload, f, indent=2, ensure_ascii=False)
          PY

      ############################################################
      # Artifact Inventory Evidence
      ############################################################

      - name: Artifact Inventory Evidence
        run: |
          find . -type f \
            > artifacts/repository_files.txt

          find . -type f \
            \( \
              -name "*.aff" -o \
              -name "*.sus" -o \
              -name "*.html" -o \
              -name "*.mht" \
            \) \
            | sort > artifacts/type_a_candidates_without_json.txt || true

          find . -type f \
            -name "*.json" \
            | sort > artifacts/json_inventory.txt || true

          find . -type f \
            \( \
              -name "*.mp4" -o \
              -name "*.mov" -o \
              -name "*.mkv" -o \
              -name "*.webm" -o \
              -name "*.url" -o \
              -name "*.webloc" \
            \) \
            | sort > artifacts/type_b_candidates.txt || true

          {
            echo "Artifact Inventory Evidence"
            echo ""

            echo "Repository files:"
            wc -l artifacts/repository_files.txt || true

            echo ""
            echo "Type A candidates excluding JSON:"
            wc -l artifacts/type_a_candidates_without_json.txt || true

            echo ""
            echo "JSON inventory:"
            wc -l artifacts/json_inventory.txt || true

            echo ""
            echo "Type B candidates:"
            wc -l artifacts/type_b_candidates.txt || true
          } > artifacts/artifact_inventory_summary.txt

          python - <<'PY'
          import json
          from pathlib import Path

          def count(path):
              p = Path(path)

              if not p.exists():
                  return 0

              return len(
                  [
                      line
                      for line in p.read_text(
                          encoding="utf-8",
                          errors="ignore",
                      ).splitlines()
                      if line.strip()
                  ]
              )

          repository_count = count(
              "artifacts/repository_files.txt"
          )

          payload = {
              "schema":
                  "rga.asset_inventory_summary.v1.1",

              "repository_files":
                  repository_count,

              "type_A_candidates":
                  count(
                      "artifacts/type_a_candidates_without_json.txt"
                  ),

              "json_inventory":
                  count(
                      "artifacts/json_inventory.txt"
                  ),

              "type_B_candidates":
                  count(
                      "artifacts/type_b_candidates.txt"
                  ),

              "evidence_state":
                  (
                      "evidence_available"
                      if repository_count > 0
                      else "insufficient_evidence"
                  ),

              "verification_note":
                  (
                      "Inventory evidence establishes repository "
                      "coverage inputs only. It does not imply "
                      "asset coverage verification."
                  ),
          }

          with open(
              "artifacts/asset_inventory_summary.json",
              "w",
              encoding="utf-8",
          ) as f:
              json.dump(
                  payload,
                  f,
                  indent=2,
                  ensure_ascii=False,
              )
          PY


      ############################################################
      # Asset Classification Evidence
      ############################################################

      - name: Asset Classification Evidence
        run: |
          grep "/translations/" \
            artifacts/json_inventory.txt \
            > artifacts/localization_json.txt || true

          grep "/schemas/" \
            artifacts/json_inventory.txt \
            > artifacts/schema_json.txt || true

          grep "/fixtures/" \
            artifacts/json_inventory.txt \
            > artifacts/fixture_json.txt || true

          grep "/registry/" \
            artifacts/json_inventory.txt \
            > artifacts/registry_json.txt || true

          grep "/artifacts/" \
            artifacts/json_inventory.txt \
            > artifacts/generated_artifact_json.txt || true

          grep "/.github/\|/.vscode/\|/tools/" \
            artifacts/json_inventory.txt \
            > artifacts/tooling_json.txt || true

          python - <<'PY'
          import json
          from pathlib import Path

          categories = {
              "localization":
                  Path(
                      "artifacts/localization_json.txt"
                  ),

              "schema":
                  Path(
                      "artifacts/schema_json.txt"
                  ),

              "fixture":
                  Path(
                      "artifacts/fixture_json.txt"
                  ),

              "registry":
                  Path(
                      "artifacts/registry_json.txt"
                  ),

              "generated_artifact":
                  Path(
                      "artifacts/generated_artifact_json.txt"
                  ),

              "tooling":
                  Path(
                      "artifacts/tooling_json.txt"
                  ),
          }

          payload = {
              "schema":
                  "rga.asset_classification_evidence.v1.1",

              "categories":
                  {},
          }

          for name, path in categories.items():

              if path.exists():
                  lines = [
                      line.strip()
                      for line in path.read_text(
                          encoding="utf-8",
                          errors="ignore",
                      ).splitlines()
                      if line.strip()
                  ]
              else:
                  lines = []

              payload["categories"][name] = {
                  "count":
                      len(lines),

                  "examples":
                      lines[:10],

                  "coverage_role":
                      "excluded",
              }

          payload["classification_note"] = (
              "Localization, schema, fixture, registry, "
              "generated artifacts and tooling evidence "
              "are excluded from asset coverage accounting."
          )

          with open(
              "artifacts/asset_classification_summary.json",
              "w",
              encoding="utf-8",
          ) as f:
              json.dump(
                  payload,
                  f,
                  indent=2,
                  ensure_ascii=False,
              )
          PY


      ############################################################
      # Asset Scope Evidence
      ############################################################

      - name: Asset Scope Evidence
        run: |
          find . -type f \
            \( \
              -path "*/chart_assets/*" -o \
              -path "*/charts/*" -o \
              -path "*/assets/*" -o \
              -path "*/ingestion_assets/*" \
            \) \
            | sort > artifacts/scoped_asset_candidates.txt || true

          find . -type f \
            \( \
              -path "*/.github/*" -o \
              -path "*/.vscode/*" -o \
              -path "*/docs/*" -o \
              -path "*/tools/*" -o \
              -path "*/artifacts/*" -o \
              -path "*/Phase 4 - Personalization/*" -o \
              -path "*/Phase 4.5 - Localization/*" -o \
              -path "*/Phase 5 - Productionization/*" -o \
              -path "*/Phase 6 - Hardening and Scaling/*" -o \
              -path "*/Phase 7 - Games Recommendation/*" \
            \) \
            | sort > artifacts/excluded_scope_candidates.txt || true

          {
            echo "Asset Scope Evidence"
            echo ""
            echo "Scoped asset candidates:"
            wc -l artifacts/scoped_asset_candidates.txt || true

            echo ""
            echo "Excluded scope candidates:"
            wc -l artifacts/excluded_scope_candidates.txt || true
          } > artifacts/asset_scope_summary.txt

          python - <<'PY'
          import json
          from pathlib import Path

          def count(path):
              p = Path(path)

              if not p.exists():
                  return 0

              return len(
                  [
                      line
                      for line in p.read_text(
                          encoding="utf-8",
                          errors="ignore",
                      ).splitlines()
                      if line.strip()
                  ]
              )

          payload = {
              "schema":
                  "rga.asset_scope_summary.v1.1",

              "scoped_candidate_count":
                  count(
                      "artifacts/scoped_asset_candidates.txt"
                  ),

              "excluded_candidate_count":
                  count(
                      "artifacts/excluded_scope_candidates.txt"
                  ),

              "repository_driven":
                  True,

              "impact_note":
                  (
                      "Asset scope influences repository "
                      "coverage accounting but does not "
                      "modify repository state."
                  ),
          }

          with open(
              "artifacts/asset_scope_summary.json",
              "w",
              encoding="utf-8",
          ) as f:
              json.dump(
                  payload,
                  f,
                  indent=2,
                  ensure_ascii=False,
              )
