            | sort \
            > artifacts/python_inventory.txt

          ########################################################
          # Layer directory inventory
          ########################################################

          find . -type d \
            \( \
              -iname "*model*" -o \
              -iname "*normalizer*" -o \
              -iname "*converter*" -o \
              -iname "*classifier*" -o \
              -iname "*validator*" -o \
