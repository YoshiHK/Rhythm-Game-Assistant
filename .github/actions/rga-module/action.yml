name: "RGA Workflows Module"

description: >
  Dispatches the RGA maintenance-and-operation lifecycle workflows using
  GitHub workflow_dispatch.

  This module does not run auditor or executor logic directly.
  It routes lifecycle stages to Bot #1 or Bot #2.

  Lifecycle:

    pre_audit
      -> Bot #1 Runtime Auditor

    implementation_plan
      -> Bot #2 Maintenance Executor
         executor_mode=plan

    plan_audit
      -> Bot #1 Runtime Auditor
         audit_mode=plan_audit

    execute
      -> Bot #2 Maintenance Executor
         executor_mode=execute

    post_audit
      -> Bot #1 Runtime Auditor
         audit_mode=post_audit

inputs:
  lifecycle_stage:
    description: >
      Lifecycle stage.

      One of:

      pre_audit
      implementation_plan
      plan_audit
      execute
      post_audit
    required: true
    default: "pre_audit"

  ref:
    description: Git ref, branch, or SHA to run on.
    required: false
    default: "main"

  github_token:
    description: >
      GitHub token used to call workflow_dispatch.
    required: true

  audit_session_id:
    description: >
      Correlation id connecting lifecycle audit artifacts.
    required: false
    default: ""

  pre_audit_report:
    description: >
      Bot #1 pre-audit report artifact path.
    required: false
    default: "artifacts/runtime_auditor_report.json"

  execution_plan:
    description: >
      Bot #2 execution plan artifact path.
    required: false
    default: "artifacts/execution_plan.json"

  approval_artifact:
    description: >
      Human approval artifact path.
    required: false
    default: "artifacts/human_execution_approval.json"

  execution_approval:
    description: >
      Approval phrase for execute stage.

      Expected value:

      APPROVE_RGA_EXECUTION
    required: false
    default: ""

runs:
  using: composite

  steps:
    - name: Validate lifecycle stage
      shell: bash
      run: |
        set -euo pipefail

        case "${{ inputs.lifecycle_stage }}" in
          pre_audit|implementation_plan|plan_audit|execute|post_audit)
            ;;
          *)
            echo "Unsupported lifecycle_stage: ${{ inputs.lifecycle_stage }}" >&2
            echo "Expected one of:" >&2
            echo "  pre_audit" >&2
            echo "  implementation_plan" >&2
            echo "  plan_audit" >&2
            echo "  execute" >&2
            echo "  post_audit" >&2
            exit 1
            ;;
        esac

    - name: Build payload and dispatch workflow
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.github_token }}
        REPO: ${{ github.repository }}

        STAGE: ${{ inputs.lifecycle_stage }}
        REF_INPUT: ${{ inputs.ref }}

        AUDIT_SESSION_ID: ${{ inputs.audit_session_id }}

        PRE_AUDIT_REPORT: ${{ inputs.pre_audit_report }}
        EXECUTION_PLAN: ${{ inputs.execution_plan }}

        APPROVAL_ARTIFACT: ${{ inputs.approval_artifact }}
        EXECUTION_APPROVAL: ${{ inputs.execution_approval }}

      run: |
        set -euo pipefail

        #
        # Execute-stage approval validation
        #
        if [ "$STAGE" = "execute" ]; then
          if [ -z "$EXECUTION_APPROVAL" ]; then
            echo "execution_approval missing" >&2
            exit 1
          fi

          if [ "$EXECUTION_APPROVAL" != "APPROVE_RGA_EXECUTION" ]; then
            echo "invalid execution_approval phrase" >&2
            exit 1
          fi
        fi

        #
        # Choose workflow file and inputs per lifecycle stage
        #
        case "$STAGE" in

          pre_audit)

            WORKFLOW_FILE="RGA Runtime Auditor.yml"

            # Runtime Auditor pre-audit

            python - <<PY > /tmp/payload.json
import json, os

p = {
  "ref": os.environ.get("REF_INPUT", "main"),
  "inputs": {
    "audit_mode": "pre_audit",
    "audit_session_id": os.environ.get(
        "AUDIT_SESSION_ID",
        "",
    ),
  },
}

print(json.dumps(p))
PY
            ;;

          implementation_plan)

            WORKFLOW_FILE="RGA Maintenance Executor.yml"

            # Bot #2 implementation planning
            # Uses Bot #1 pre-audit report

            python - <<PY > /tmp/payload.json
import json, os

p = {
  "ref": os.environ.get("REF_INPUT", "main"),
  "inputs": {
    "executor_mode": "plan",
    "audit_session_id": os.environ.get(
        "AUDIT_SESSION_ID",
        "",
    ),
    "pre_audit_report": os.environ.get(
        "PRE_AUDIT_REPORT",
        "",
    ),
  },
}

print(json.dumps(p))
PY
            ;;

          plan_audit)

            WORKFLOW_FILE="RGA Runtime Auditor.yml"

            # Runtime Auditor plan-audit

            python - <<PY > /tmp/payload.json
import json, os

p = {
  "ref": os.environ.get("REF_INPUT", "main"),
  "inputs": {
    "audit_mode": "plan_audit",
    "audit_session_id": os.environ.get(
        "AUDIT_SESSION_ID",
        "",
    ),
    "execution_plan": os.environ.get(
        "EXECUTION_PLAN",
        "",
    ),
  },
}

print(json.dumps(p))
PY
            ;;

          execute)

            WORKFLOW_FILE="RGA Maintenance Executor.yml"

            # Bot #2 execute
            # Human approval remains mandatory

            python - <<PY > /tmp/payload.json
import json, os

p = {
  "ref": os.environ.get("REF_INPUT", "main"),
  "inputs": {
    "executor_mode": "execute",
    "audit_session_id": os.environ.get(
        "AUDIT_SESSION_ID",
        "",
    ),
    "execution_plan": os.environ.get(
        "EXECUTION_PLAN",
        "",
    ),
    "approval_artifact": os.environ.get(
        "APPROVAL_ARTIFACT",
        "",
    ),
    "execution_approval": os.environ.get(
        "EXECUTION_APPROVAL",
        "",
    ),
  },
}

print(json.dumps(p))
PY
            ;;

          post_audit)

            WORKFLOW_FILE="RGA Runtime Auditor.yml"

            # Runtime Auditor post-audit

            python - <<PY > /tmp/payload.json
import json, os

p = {
  "ref": os.environ.get("REF_INPUT", "main"),
  "inputs": {
    "audit_mode": "post_audit",
    "audit_session_id": os.environ.get(
        "AUDIT_SESSION_ID",
        "",
    ),
    "execution_plan": os.environ.get(
        "EXECUTION_PLAN",
        "",
    ),
    "pre_audit_report": os.environ.get(
        "PRE_AUDIT_REPORT",
        "",
    ),
  },
}

print(json.dumps(p))
PY
            ;;

          *)

            echo "Unsupported stage: $STAGE" >&2
            exit 1
            ;;

        esac

        #
        # URL-encode workflow file
        #
        enc_workflow=$(python - <<PY
import sys, urllib.parse
print(
    urllib.parse.quote(
        sys.argv[1],
        safe=""
    )
)
PY
"$WORKFLOW_FILE"
)

        api_url="https://api.github.com/repos/${REPO}/actions/workflows/${enc_workflow}/dispatches"

        http_status=$(curl -sS \
          -o /tmp/dispatch_resp \
          -w "%{http_code}" \
          -X POST \
          -H "Authorization: Bearer ${GITHUB_TOKEN}" \
          -H "Accept: application/vnd.github+json" \
          "$api_url" \
          -d @/tmp/payload.json || true)

        if [ "$http_status" != "204" ]; then
          echo "Workflow dispatch failed (HTTP $http_status)" >&2
          echo "API response:" >&2
          sed -n '1,200p' /tmp/dispatch_resp >&2 || true
          echo "Payload sent:" >&2
          sed -n '1,200p' /tmp/payload.json >&2 || true
          exit 1
        fi

        echo "Dispatched workflow '${WORKFLOW_FILE}' for stage '${STAGE}' (ref: ${REF_INPUT})"
