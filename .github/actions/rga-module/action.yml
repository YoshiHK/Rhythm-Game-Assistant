name: RGA Workflows Module
description: >
  Dispatches the RGA Maintenance Executor or RGA Runtime Verifier workflows
  in this repository using the workflow_dispatch API. This composite action
  triggers the existing workflow file (by filename) in this repository and
  does not run the workflow logic itself.
inputs:
  module:
    description: Which module to dispatch. One of: maintenance-executor, runtime-verifier
    required: true
    default: maintenance-executor
  ref:
    description: Git ref (branch or sha) to run the workflow on.
    required: false
    default: main
  github_token:
    description: Token used to call the Actions API (use ${{ secrets.GITHUB_TOKEN }}).
    required: true
  # Common / Maintenance Executor inputs
  executor_mode:
    description: Executor mode for the maintenance workflow (plan|dry_run_execute|execute)
    required: false
    default: dry_run_execute
  execution_plan:
    description: Execution plan path (for maintenance)
    required: false
    default: artifacts/execution_plan.json
  approval_artifact:
    description: Human approval artifact path (for maintenance)
    required: false
    default: artifacts/human_execution_approval.json
  # Runtime Verifier inputs
  audit_mode:
    description: Bot #1 audit mode (pre_audit|plan_audit|post_audit)
    required: false
    default: pre_audit
  execution_approval:
    description: Required phrase for execute mode: APPROVE_RGA_EXECUTION
    required: false
    default: ""
  pre_audit_report:
    description: Optional Bot #1 pre-audit report JSON path
    required: false
    default: ""
runs:
  using: composite
  steps:
    - name: Validate module input
      shell: bash
      run: |
        if [ "${{ inputs.module }}" != "maintenance-executor" ] && [ "${{ inputs.module }}" != "runtime-verifier" ]; then
          echo "Unsupported module: ${{ inputs.module }}" >&2
          exit 1
        fi

    - name: Export inputs as environment variables
      shell: bash
      run: |
        # Export action inputs to environment variables used by the dispatch logic
        export MODULE="${{ inputs.module }}"
        export REF_INPUT="${{ inputs.ref }}"
        export EXECUTOR_MODE="${{ inputs.executor_mode }}"
        export EXECUTION_PLAN="${{ inputs.execution_plan }}"
        export APPROVAL_ARTIFACT="${{ inputs.approval_artifact }}"
        export AUDIT_MODE="${{ inputs.audit_mode }}"
        export EXECUTION_APPROVAL="${{ inputs.execution_approval }}"
        export PRE_AUDIT_REPORT="${{ inputs.pre_audit_report }}"

    - name: Build payload and dispatch workflow
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.github_token }}
        REPO: ${{ github.repository }}
      run: |
        set -euo pipefail

        MODULE="${MODULE}"
        REF="${REF_INPUT}"

        if [ "$MODULE" = "maintenance-executor" ]; then
          WORKFLOW_FILE="RGA Maintenance Executor.yml"
          PY_INPUTS=$(python - <<'PY'
import os, json
inputs = {
  "executor_mode": {"value": os.environ.get("EXECUTOR_MODE", "dry_run_execute")},
  "execution_plan": {"value": os.environ.get("EXECUTION_PLAN", "artifacts/execution_plan.json")},
  "approval_artifact": {"value": os.environ.get("APPROVAL_ARTIFACT", "artifacts/human_execution_approval.json")}
}
print(json.dumps(inputs))
PY
)
        else
          WORKFLOW_FILE="RGA Runtime Verifier.yml"
          PY_INPUTS=$(python - <<'PY'
import os, json
inputs = {
  "audit_mode": {"value": os.environ.get("AUDIT_MODE", "pre_audit")},
  "executor_mode": {"value": os.environ.get("EXECUTOR_MODE", "dry_run_execute")},
  "execution_approval": {"value": os.environ.get("EXECUTION_APPROVAL", "")},
  "execution_plan": {"value": os.environ.get("EXECUTION_PLAN", "")},
  "pre_audit_report": {"value": os.environ.get("PRE_AUDIT_REPORT", "")}
}
print(json.dumps(inputs))
PY
)
        fi

        # URL-encode the workflow filename for the API path
        ENCODED=$(python - <<PY
import urllib.parse,sys
print(urllib.parse.quote(sys.argv[1], safe=''))
PY
"$WORKFLOW_FILE")

        API_URL="https://api.github.com/repos/${REPO}/actions/workflows/${ENCODED}/dispatches"

        # Build final payload safely using python to avoid shell quoting issues
        PAYLOAD=$(python - <<PY
import json,sys
inputs = json.loads('''$PY_INPUTS''')
payload = {"ref": "$REF", "inputs": inputs}
print(json.dumps(payload))
PY
)

        echo "Dispatching workflow '${WORKFLOW_FILE}' on ref '${REF}'..."
        HTTP_RESPONSE=$(curl -s -w "\n%{http_code}" -X POST \
          -H "Accept: application/vnd.github+json" \
          -H "Authorization: Bearer ${GITHUB_TOKEN}" \
          -H "Content-Type: application/json" \
          --data "$PAYLOAD" \
          "$API_URL")

        BODY=$(echo "$HTTP_RESPONSE" | sed '$d')
        CODE=$(echo "$HTTP_RESPONSE" | tail -n1)

        echo "HTTP status: $CODE"
        if [ "$CODE" -ge 400 ]; then
          echo "Failed to dispatch workflow. Response body:" >&2
          echo "$BODY" >&2
          exit 1
        fi

        echo "Workflow dispatched successfully."