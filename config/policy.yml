# config/policy.yml

# Allowed pipeline phases and local-first data boundaries
allowed_artifact_phases:
  - "phase_1_extraction"
  - "phase_2_features"
  - "offline_local_storage" # Explicitly safe for offline local DBs & assets

allowed_database_paths:
  - "local_storage/db/*.db"
  - "local_storage/charts/**"
  - ".local_cache/**/*.db"

rules:
  allow_untracked_local_storage: true
  strict_phase_matching: false # Disables erroring out on local-only unphased DBs

# Deployment Gate Validation Overrides
# Softens requirements for runtime-auditor runs where full smoke/offline summaries are absent
validation_rules:
  require_repo_smoke_summary: false
  require_offline_validation_report: false
  require_feedback_case_determinism: false
